<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shanghai Bund · Day &amp; Night — SVG Infinity Loop</title>
<!--
  Scene: Shanghai skyline from the Bund (Huangpu River), recreated as a pure-SVG
  day/night animation loop. Elements: Oriental Pearl Tower, SWFC ("bottle opener"),
  Jin Mao Tower, Shanghai Tower (twisting), Lujiazui glass towers, Shanghai Intl.
  Convention Center with green dome + mosaic sphere, arched riverfront hall,
  embankment trees, moored sightseeing boat & red barge, moving blue cargo barge.
  Cycle: one master clock (--dur = 48s) drives sky crossfades, sun/moon arcs
  (same keyframes, moon phase-shifted -50%), stars, city/water dimming,
  window lights, sphere glows, reflections and ripples. Infinity loop.
-->
<style>
  :root { --dur: 48s; }
  html, body { margin: 0; height: 100%; background: #0b0e14; }
  body { display: flex; align-items: center; justify-content: center; }
  figure.stage { margin: 0; text-align: center; }
  svg.scene { width: min(92vmin, 860px); height: auto; display: block; margin: 0 auto;
              border-radius: 10px; box-shadow: 0 12px 48px rgba(0,0,0,.55); }
  figcaption { color: #8b93a3; font: 13px/1.6 system-ui, sans-serif; padding-top: 10px; }

  /* ---------- master clock keyframes (0% = midnight) ---------- */
  @keyframes oNight { 0%,13%{opacity:1} 27%,71%{opacity:0} 86%,100%{opacity:1} }
  @keyframes oDawn  { 0%,9%{opacity:0} 21%{opacity:.95} 34%,100%{opacity:0} }
  @keyframes oDay   { 0%,14%{opacity:0} 30%,64%{opacity:1} 80%,100%{opacity:0} }
  @keyframes oDusk  { 0%,59%{opacity:0} 76%{opacity:.95} 89%,100%{opacity:0} }
  @keyframes oGlow  { 0%,9%{opacity:0} 21%{opacity:.9} 34%,59%{opacity:0} 76%{opacity:.95} 89%,100%{opacity:0} }
  @keyframes oStars { 0%,12%{opacity:1} 24%,70%{opacity:0} 84%,100%{opacity:1} }
  @keyframes oCloud { 0%,12%{opacity:.14} 30%,64%{opacity:.85} 80%,100%{opacity:.14} }
  @keyframes oLit   { 0%,13%{opacity:1} 25%,67%{opacity:0} 80%,100%{opacity:1} }
  @keyframes dimCity  { 0%,14%{filter:brightness(.3) saturate(.6)} 28%,66%{filter:brightness(1)} 82%,100%{filter:brightness(.3) saturate(.6)} }
  @keyframes dimWater { 0%,14%{filter:brightness(.32) saturate(.7)} 28%,66%{filter:brightness(1)} 82%,100%{filter:brightness(.32) saturate(.7)} }

  /* sun & moon: rotate around a pivot below the horizon; moon = same kf, -50% phase */
  @keyframes arcMove {
    0%,15%   { transform: rotate(-58deg); opacity: 0; }
    21%      { opacity: .95; }
    50%      { transform: rotate(0deg); }
    79%      { opacity: .95; }
    85%,100% { transform: rotate(58deg); opacity: 0; }
  }
  .sunArc, .moonArc { transform-box: view-box; transform-origin: 380px 640px;
                      animation: arcMove var(--dur) linear infinite; }
  .moonArc { animation-delay: calc(var(--dur) * -0.5); }

  .sky-night { animation: oNight var(--dur) linear infinite; }
  .sky-dawn  { animation: oDawn  var(--dur) linear infinite; }
  .sky-day   { animation: oDay   var(--dur) linear infinite; }
  .sky-dusk  { animation: oDusk  var(--dur) linear infinite; }
  .glow      { animation: oGlow  var(--dur) linear infinite; }
  #stars     { animation: oStars var(--dur) linear infinite; }
  .cloud     { animation: oCloud var(--dur) linear infinite; }
  .city      { animation: dimCity  var(--dur) linear infinite; }
  .waterwrap { animation: dimWater var(--dur) linear infinite; }
  .lit       { animation: oLit   var(--dur) linear infinite; }

  /* clouds drift */
  @keyframes driftA { from{transform:translateX(-170px)} to{transform:translateX(930px)} }
  .c1 { animation: driftA 120s linear infinite; }
  .c2 { animation: driftA 165s linear infinite; animation-delay: -60s; }
  .c3 { animation: driftA 140s linear infinite; animation-delay: -110s; }

  /* star twinkle */
  @keyframes twk { 0%,100%{opacity:1} 50%{opacity:.25} }
  .tw { animation-name: twk; animation-iteration-count: infinite; }
  .t1 { animation-duration: 2.6s; } .t2 { animation-duration: 3.7s; animation-delay:-1.2s; }
  .t3 { animation-duration: 4.5s; animation-delay:-2.4s; }

  /* water ripples sway */
  @keyframes wavA { from{transform:translateX(0)} to{transform:translateX(-14px)} }
  @keyframes wavB { from{transform:translateX(-10px)} to{transform:translateX(6px)} }
  .waveA { animation: wavA 7s ease-in-out infinite alternate; }
  .waveB { animation: wavB 9.5s ease-in-out infinite alternate; }

  /* cargo barge crossing the river + bobbing */
  @keyframes bargeMove { from{transform:translateX(860px)} to{transform:translateX(-320px)} }
  .bargeRun { animation: bargeMove 90s linear infinite; }
  @keyframes bob { from{transform:translateY(0)} to{transform:translateY(2px)} }
  .bob  { animation: bob 3.4s ease-in-out infinite alternate; }
  .bob2 { animation: bob 2.8s ease-in-out infinite alternate; animation-delay:-1s; }

  /* aviation beacons */
  @keyframes blink { 0%,55%{opacity:1} 60%,100%{opacity:.05} }
  .beacon  { animation: blink 1.4s steps(1) infinite; }
  .beacon2 { animation: blink 1.7s steps(1) infinite; animation-delay:-.8s; }

  /* night glow pulse on pearl spheres */
  @keyframes pulse { 0%,100%{opacity:.9} 50%{opacity:.6} }
  .pulse { animation: pulse 5s ease-in-out infinite; }
</style>
</head>

<script>
// generate stars and water ripples (decorative repetition only; animation is pure CSS/SVG)
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var stars = document.getElementById('stars');
  for (var i = 0; i < 85; i++) {
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', (Math.random() * 760).toFixed(1));
    c.setAttribute('cy', (8 + Math.random() * 420).toFixed(1));
    c.setAttribute('r', (0.5 + Math.random() * 1.2).toFixed(2));
    c.setAttribute('fill', '#fff');
    c.setAttribute('class', 'tw t' + (i % 3 + 1));
    stars.appendChild(c);
  }
  var rip = document.getElementById('ripples');
  for (var g = 0; g < 2; g++) {
    var grp = document.createElementNS(NS, 'g');
    grp.setAttribute('class', g ? 'waveB' : 'waveA');
    for (var y = 622; y < 756; y += 9) {
      var x = Math.random() * 30;
      while (x < 780) {
        var w = 8 + Math.random() * 34;
        var p = document.createElementNS(NS, 'path');
        p.setAttribute('d', 'M' + x.toFixed(1) + ' ' + y + ' h' + w.toFixed(1));
        p.setAttribute('stroke', Math.random() < 0.5 ? 'rgba(255,255,255,.16)' : 'rgba(8,30,60,.22)');
        p.setAttribute('stroke-width', (1 + Math.random() * 1.4).toFixed(1));
        p.setAttribute('stroke-linecap', 'round');
        grp.appendChild(p);
        x += w + 14 + Math.random() * 40;
      }
    }
    rip.appendChild(grp);
  }
})();
</script>
