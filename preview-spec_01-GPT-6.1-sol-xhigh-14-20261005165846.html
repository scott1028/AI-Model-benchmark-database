    html, body { width: 100%; height: 100%; margin: 0; background: #08172b; }

    .stars, .moon, .city-lights, .night-reflections { animation: lights 32s linear infinite; }

    .day-reflections { animation: day-reflections 32s linear infinite; }
    .moon { transform-origin: 582px 107px; }
    .star-twinkle { animation: twinkle 3.8s ease-in-out infinite alternate; }
    .water-glint { animation: glint 3.2s ease-in-out infinite alternate; }

    @keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }
    @keyframes glint { from { opacity: .45; } to { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) {

<script>
  const svg = document.querySelector('svg');

  const random = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  const add = (parent, name, attributes) => {
    const element = document.createElementNS(svgNamespace, name);
    for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
    parent.appendChild(element);
    return element;

    const x = 179 + index * 18;
    add(arcade, 'path', { d: `M${x} 561V518 Q${x + 6} 505 ${x + 12} 518V561Z`, fill: '#38586a', stroke: '#f2e6bf', 'stroke-width': 2.1 });
    add(arcade, 'path', { d: `M${x + 2} 522 Q${x + 6} 514 ${x + 10} 522 M${x + 6} 518V559 M${x + 1} 541H${x + 11}`, fill: 'none', stroke: '#b3bdac', 'stroke-width': 1.1 });
    add(arcade, 'path', { d: `M${x - 2} 505V566 M${x + 15} 505V566`, stroke: '#a39a79', 'stroke-width': 1.1 });
  }

  const trees = svg.querySelector('#trees');
  for (let index = 0; index < 81; index++) {
    const x = 3 + index * 9 + random() * 5;
    const y = 581 + random() * 8;
    const radius = 6 + random() * 7;
    add(trees, 'circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: radius.toFixed(1), fill: ['#273e33', '#40523a', '#5a6240', '#775848'][Math.floor(random() * 4)], opacity: (.73 + random() * .25).toFixed(2) });
  }

  const windows = svg.querySelector('#litWindows');
  for (const building of [
    { x: 22, y: 367, columns: 5, rows: 19, dx: 9, dy: 10 },
    { x: 425, y: 299, columns: 7, rows: 25, dx: 7, dy: 8 },
    { x: 490, y: 277, columns: 6, rows: 31, dx: 8, dy: 7 },
    { x: 552, y: 285, columns: 5, rows: 16, dx: 7, dy: 7 },
    { x: 641, y: 56, columns: 7, rows: 55, dx: 9, dy: 8 },
    { x: 573, y: 450, columns: 9, rows: 8, dx: 7, dy: 9 },
    { x: 660, y: 476, columns: 10, rows: 6, dx: 8, dy: 8 }
  ]) {
    const windowGroup = building.x === 641 ? add(windows, 'g', { 'clip-path': 'url(#shanghaiTower)' }) : windows;
    for (let row = 0; row < building.rows; row++) {
      for (let column = 0; column < building.columns; column++) {
        if (random() > .36) continue;
        const x = building.x + column * building.dx;
        const y = building.y + row * building.dy;
        add(windowGroup, 'rect', { x, y, width: building.dx > 8 ? 2.4 : 2, height: 3.1, rx: .25, fill: random() > .25 ? '#ffd388' : '#d9edf2', opacity: (.45 + random() * .5).toFixed(2) });
      }
    }
  }
  for (let column = 0; column < 12; column++) {
    if (random() > .15) add(windows, 'path', { d: `M${180 + column * 18} 522v38`, stroke: '#ffc06d', 'stroke-width': 2.2, opacity: '.9' });
  }

  const dayRipples = svg.querySelector('#dayRipples');
  const nightRipples = svg.querySelector('#nightRipples');
  for (let index = 0; index < 490; index++) {
    const y = 620 + random() * 124;
    const x = random() * 745;
    const length = 4 + random() * (y < 657 ? 25 : 38);
    const isGold = (x > 75 && x < 155) || (x > 450 && x < 520) || (x > 640 && x < 730);
    add(dayRipples, 'path', { d: `M${x.toFixed(1)} ${y.toFixed(1)}q${(length / 2).toFixed(1)} ${(-1.3 + random() * 2.6).toFixed(1)} ${length.toFixed(1)} 0`, fill: 'none', stroke: isGold && random() > .48 ? '#ddbd91' : random() > .44 ? '#a4c2b9' : '#153d69', 'stroke-width': (.35 + random() * 1.15).toFixed(2), opacity: (.16 + random() * .5).toFixed(2) });
  }
  for (let index = 0; index < 150; index++) {
    const y = 619 + random() * 121;
    const x = random() * 745;
    const length = 3 + random() * 21;
    add(nightRipples, 'path', { d: `M${x.toFixed(1)} ${y.toFixed(1)}h${length.toFixed(1)}`, stroke: random() > .36 ? '#efad67' : '#8dd6dc', 'stroke-width': (.7 + random() * 1.4).toFixed(1), opacity: (.12 + random() * .5).toFixed(2), class: index % 8 === 0 ? 'water-glint' : '' });
  }
</script>
</body>
</html>
