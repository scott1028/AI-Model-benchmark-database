<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shanghai Pudong — Day &amp; Night Loop (SVG)</title>
<style>
  :root { --c: 24s; }
  html, body { margin: 0; height: 100%; background: #0b0e14; }
  body { display: flex; align-items: center; justify-content: center; }
  svg { width: min(96vw, 96vh); height: auto; display: block; box-shadow: 0 8px 40px rgba(0,0,0,.55); border-radius: 10px; }

  /* ---------- master day/night cycle (all --c) ---------- */
  .skyTop    { animation: skyTop var(--c) linear infinite; }
  .skyMid    { animation: skyMid var(--c) linear infinite; }
  .skyLow    { animation: skyLow var(--c) linear infinite; }
  .rivTop    { animation: rivTop var(--c) linear infinite; }
  .rivBot    { animation: rivBot var(--c) linear infinite; }

  @keyframes skyTop { 0%,34%{stop-color:#2f86d4} 42%{stop-color:#3d6bab} 46%{stop-color:#37497f} 52%,78%{stop-color:#070d26} 88%{stop-color:#1e3c74} 96%,100%{stop-color:#2f86d4} }
  @keyframes skyMid { 0%,34%{stop-color:#7cb8ea} 42%{stop-color:#d99a6b} 46%{stop-color:#8a5b6e} 52%,78%{stop-color:#0c1430} 88%{stop-color:#5f6fa5} 96%,100%{stop-color:#7cb8ea} }
  @keyframes skyLow { 0%,34%{stop-color:#d8ecf7} 42%{stop-color:#ffc37e} 46%{stop-color:#c96a54} 52%,78%{stop-color:#1b2547} 88%{stop-color:#f0a878} 96%,100%{stop-color:#d8ecf7} }
  @keyframes rivTop { 0%,34%{stop-color:#6f9cc0} 42%{stop-color:#c08a5e} 46%{stop-color:#5b4a5e} 52%,78%{stop-color:#131d38} 88%{stop-color:#7a7fa5} 96%,100%{stop-color:#6f9cc0} }
  @keyframes rivBot { 0%,34%{stop-color:#2e5c88} 42%{stop-color:#7a5b48} 46%{stop-color:#33314a} 52%,78%{stop-color:#050912} 88%{stop-color:#3f4a6e} 96%,100%{stop-color:#2e5c88} }

  /* lights-on gate: windows, glows, lamps, stars */
  .n2   { animation: n2 var(--c) linear infinite; }
  @keyframes n2 { 0%,38%{opacity:0} 50%,78%{opacity:1} 90%,100%{opacity:0} }
  .starsGate { animation: starsGate var(--c) linear infinite; }
  @keyframes starsGate { 0%,40%{opacity:0} 52%,76%{opacity:1} 86%,100%{opacity:0} }
  .cityGlow { animation: cityGlow var(--c) linear infinite; }
  @keyframes cityGlow { 0%,36%{opacity:0} 50%,78%{opacity:.55} 90%,100%{opacity:0} }
  .sunsetGlow { animation: sunsetGlow var(--c) linear infinite; }
  @keyframes sunsetGlow { 0%,34%{opacity:0} 43%,45%{opacity:.85} 52%,100%{opacity:0} }

  /* building material day→night fills */
  .glassCool { animation: fGlassC var(--c) linear infinite; }
  @keyframes fGlassC { 0%,36%{fill:#7fa3c6} 48%,80%{fill:#101a2e} 94%,100%{fill:#7fa3c6} }
  .glassDay  { animation: fGlassD var(--c) linear infinite; }
  @keyframes fGlassD { 0%,36%{fill:#9fb6cf} 48%,80%{fill:#141e33} 94%,100%{fill:#9fb6cf} }
  .glassPale { animation: fGlassP var(--c) linear infinite; }
  @keyframes fGlassP { 0%,36%{fill:#c3d2de} 48%,80%{fill:#1a2537} 94%,100%{fill:#c3d2de} }
  .concrete  { animation: fConc var(--c) linear infinite; }
  @keyframes fConc { 0%,36%{fill:#d8cdbf} 48%,80%{fill:#2a2f3a} 94%,100%{fill:#d8cdbf} }
  .beige     { animation: fBeige var(--c) linear infinite; }
  @keyframes fBeige { 0%,36%{fill:#cbb89a} 48%,80%{fill:#2e2b24} 94%,100%{fill:#cbb89a} }
  .whiteBlk  { animation: fWhite var(--c) linear infinite; }
  @keyframes fWhite { 0%,36%{fill:#e6e9ea} 48%,80%{fill:#1d2532} 94%,100%{fill:#e6e9ea} }
  .greenGl   { animation: fGreen var(--c) linear infinite; }
  @keyframes fGreen { 0%,36%{fill:#57a05e} 48%,80%{fill:#0e2417} 94%,100%{fill:#57a05e} }
  .cream     { animation: fCream var(--c) linear infinite; }
  @keyframes fCream { 0%,36%{fill:#ece4d0} 48%,80%{fill:#39352a} 94%,100%{fill:#ece4d0} }
  .pearlCol  { animation: fPearlC var(--c) linear infinite; }
  @keyframes fPearlC { 0%,36%{fill:#d89a80} 48%,80%{fill:#41272f} 94%,100%{fill:#d89a80} }
  .pearlBall { animation: fPearlB var(--c) linear infinite; }
  @keyframes fPearlB { 0%,36%{fill:#c9506e} 48%,80%{fill:#ff5f8f} 94%,100%{fill:#c9506e} }
  .goldTrim  { animation: fGold var(--c) linear infinite; }
  @keyframes fGold { 0%,36%{fill:#cfa24b} 48%,80%{fill:#ffc86a} 94%,100%{fill:#cfa24b} }
  .ringOval  { animation: fRing var(--c) linear infinite; }
  @keyframes fRing { 0%,36%{stroke:#9fb6cf} 48%,80%{stroke:#ffd98a} 94%,100%{stroke:#9fb6cf} }
  .archGlass { animation: fArch var(--c) linear infinite; }
  @keyframes fArch { 0%,36%{fill:#3a4a5c} 48%,80%{fill:#d89a4f} 94%,100%{fill:#3a4a5c} }
  .bankWalk  { animation: fBank var(--c) linear infinite; }
  @keyframes fBank { 0%,36%{fill:#d5d9d6} 48%,80%{fill:#232a30} 94%,100%{fill:#d5d9d6} }
  .treeG     { animation: fTreeG var(--c) linear infinite; }
  @keyframes fTreeG { 0%,36%{fill:#4a7c3f} 48%,80%{fill:#12241a} 94%,100%{fill:#4a7c3f} }
  .treeR     { animation: fTreeR var(--c) linear infinite; }
  @keyframes fTreeR { 0%,36%{fill:#b4432e} 48%,80%{fill:#2e1512} 94%,100%{fill:#b4432e} }

  /* sun / moon */
  #sunDisk { animation: sunFill var(--c) linear infinite; }
  @keyframes sunFill { 0%,36%{fill:#fff3a8} 43%{fill:#ffb057} 47%{fill:#ff8a3d} 96%,100%{fill:#ffd98c} }
  #sunG { animation: sunMove var(--c) linear infinite; }
  @keyframes sunMove {
    0%   { transform:translate(60px,585px); opacity:1 }
    6%   { transform:translate(120px,380px) }
    12%  { transform:translate(190px,240px) }
    18%  { transform:translate(270px,150px) }
    24%  { transform:translate(360px,118px) }
    30%  { transform:translate(450px,150px) }
    36%  { transform:translate(530px,230px) }
    42%  { transform:translate(600px,380px); opacity:1 }
    46%  { transform:translate(660px,585px); opacity:0 }
    50%,94% { transform:translate(700px,760px); opacity:0 }
    98%  { transform:translate(60px,760px); opacity:0 }
    100% { transform:translate(60px,585px); opacity:1 }
  }
  #moonG { animation: moonMove var(--c) linear infinite; }
  @keyframes moonMove {
    0%,46% { transform:translate(650px,540px); opacity:0 }
    52%  { transform:translate(630px,330px); opacity:1 }
    60%  { transform:translate(570px,190px) }
    70%  { transform:translate(440px,130px) }
    80%  { transform:translate(300px,160px) }
    88%  { transform:translate(180px,280px); opacity:1 }
    94%,100% { transform:translate(80px,520px); opacity:0 }
  }

  /* clouds */
  .cloud   { animation: fCloud var(--c) linear infinite; }
  @keyframes fCloud { 0%,36%{fill:#ffffff} 43%{fill:#ffc08e} 50%,78%{fill:#222c4a} 88%{fill:#e89a72} 96%,100%{fill:#ffffff} }
  .drift1 { animation: drift1 34s ease-in-out infinite alternate; }
  .drift2 { animation: drift2 46s ease-in-out infinite alternate; }
  .drift3 { animation: drift3 40s ease-in-out infinite alternate; }
  @keyframes drift1 { from{transform:translateX(-30px)} to{transform:translateX(46px)} }
  @keyframes drift2 { from{transform:translateX(28px)}  to{transform:translateX(-38px)} }
  @keyframes drift3 { from{transform:translateX(-18px)} to{transform:translateX(52px)} }

  /* stars twinkle */
  .star { animation: tw 3.2s ease-in-out infinite; animation-delay: var(--d,0s); }
  @keyframes tw { 0%,100%{opacity:.9} 50%{opacity:.25} }

  /* windows lit at night, some flicker */
  .win.flick { animation: fl 4.6s ease-in-out infinite; animation-delay: var(--d,0s); }
  @keyframes fl { 0%,100%{fill-opacity:1} 47%{fill-opacity:.25} }

  /* water shimmer + night reflections */
  .shim { animation: shimA var(--sd,5s) ease-in-out infinite; animation-delay: var(--d,0s); }
  @keyframes shimA { 0%,100%{opacity:.18; transform:translateX(0)} 50%{opacity:.5; transform:translateX(var(--tx,10px))} }
  .ndash { animation: fl2 var(--sd,3.4s) ease-in-out infinite; animation-delay: var(--d,0s); }
  @keyframes fl2 { 0%,100%{opacity:.85} 50%{opacity:.3} }
  .refl  { animation: reflA 6s ease-in-out infinite alternate; }
  @keyframes reflA { from{transform:translateY(0)} to{transform:translateY(4px)} }

  /* boats */
  #barge   { animation: sail 64s linear infinite; }
  @keyframes sail { from{transform:translateX(-190px)} to{transform:translateX(880px)} }
  #bargeBob{ animation: bob 5.2s ease-in-out infinite alternate; }
  @keyframes bob { from{transform:translateY(-1.5px)} to{transform:translateY(2px)} }
  #boatL   { animation: swayL 30s ease-in-out infinite alternate; }
  @keyframes swayL { from{transform:translateX(-14px)} to{transform:translateX(16px)} }

  /* pearl tower night halo pulse */
  .haloPulse { animation: halo 5.5s ease-in-out infinite alternate; }
  @keyframes halo { from{opacity:.7} to{opacity:1} }
</style>
</head>
<body>
<svg viewBox="0 0 720 810" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shanghai Pudong skyline day and night animation">
<title>Shanghai Lujiazui — infinite day &amp; night</title>
<defs>
  <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   class="skyTop" stop-color="#2f86d4"/>
    <stop offset=".62" class="skyMid" stop-color="#7cb8ea"/>
    <stop offset="1"   class="skyLow" stop-color="#d8ecf7"/>
  </linearGradient>
  <linearGradient id="gRiver" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"  class="rivTop" stop-color="#6f9cc0"/>
    <stop offset="1"  class="rivBot" stop-color="#2e5c88"/>
  </linearGradient>
  <radialGradient id="gSun">
    <stop offset="0" stop-color="#fff7cf" stop-opacity=".9"/>
    <stop offset="1" stop-color="#ffd98c" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="gMoon">
    <stop offset="0" stop-color="#f2eeda" stop-opacity=".75"/>
    <stop offset="1" stop-color="#f2eeda" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gCityGlow" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#ffb45e" stop-opacity=".8"/>
    <stop offset="1" stop-color="#ffb45e" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="gSunset" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#ff8a3d" stop-opacity=".95"/>
    <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="gSphere" cx=".38" cy=".35" r=".9">
    <stop offset="0" stop-color="#f28fa8"/>
    <stop offset=".55" stop-color="#c9506e"/>
    <stop offset="1" stop-color="#8e2f4c"/>
  </radialGradient>
  <linearGradient id="gDomeBlue" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9fd0e8"/>
    <stop offset=".5" stop-color="#3f7fae"/>
    <stop offset="1" stop-color="#204a72"/>
  </linearGradient>
  <linearGradient id="gDomeRainbow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#d85a3a"/>
    <stop offset=".22" stop-color="#e0b04a"/>
    <stop offset=".45" stop-color="#57a05e"/>
    <stop offset=".7"  stop-color="#3f86c6"/>
    <stop offset="1"   stop-color="#8a5ab0"/>
  </linearGradient>
  <linearGradient id="gReflPink" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e86a8a" stop-opacity=".75"/>
    <stop offset="1" stop-color="#e86a8a" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="gReflBlue" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7fa3c6" stop-opacity=".5"/>
    <stop offset="1" stop-color="#7fa3c6" stop-opacity="0"/>
  </linearGradient>
  <filter id="blurBig"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="blurSm"><feGaussianBlur stdDeviation="2.4"/></filter>

  <!-- building silhouettes (reused for draw + window clip) -->
  <path id="pST" d="M594 578 C598 430 606 250 611 96 L614 66 L631 62 L634 92 C640 250 648 430 652 578 Z"/>
  <path id="pSWFC" fill-rule="evenodd" d="M481 578 L486 300 C488 250 491 224 494 210 L522 207 C525 226 528 258 531 305 L533 578 Z M494 218 L519 216 L515 248 L498 250 Z"/>
  <path id="pJM" d="M430 578 L430 470 L436 470 L436 396 L441 396 L441 342 L446 342 L446 306 L450 306 L452 284 L455.5 276 L459 284 L461 306 L466 306 L466 342 L471 342 L471 396 L476 396 L476 470 L482 470 L482 578 Z"/>
  <path id="pCT" d="M394 578 L394 312 L418 300 L446 306 L446 578 Z"/>
  <path id="pWS" d="M532 578 L532 300 L568 288 L568 578 Z"/>
  <path id="pMN" d="M224 578 L224 372 Q245 356 266 372 L266 578 Z"/>
  <clipPath id="clipWins">
    <rect x="46" y="384" width="36" height="196"/>
    <rect x="132" y="400" width="30" height="180"/>
    <use href="#pCT"/>
    <use href="#pJM"/>
    <use href="#pSWFC"/>
    <use href="#pWS"/>
    <use href="#pST"/>
    <use href="#pMN"/>
    <rect x="676" y="400" width="44" height="178"/>
    <rect x="552" y="470" width="76" height="108"/>
  </clipPath>
  <clipPath id="clipST"><use href="#pST"/></clipPath>
</defs>

<!-- sky -->
<rect x="0" y="0" width="720" height="660" fill="url(#gSky)"/>

<!-- stars -->
<g class="starsGate" fill="#ffffff" id="stars"></g>

<!-- sunset horizon glow -->
<rect class="sunsetGlow" x="0" y="380" width="720" height="280" fill="url(#gSunset)"/>
<!-- night city light-pollution band -->
<rect class="cityGlow" x="0" y="400" width="720" height="260" fill="url(#gCityGlow)"/>

<!-- sun (arc above sky, below horizon at night) -->
<g id="sunG">
  <circle r="34" fill="url(#gSun)"/>
  <circle id="sunDisk" r="17" fill="#fff3a8"/>
</g>

<!-- moon -->
<g id="moonG">
  <circle r="34" fill="url(#gMoon)"/>
  <circle r="15" fill="#f4f0dc"/>
  <circle cx="-5" cy="-4" r="3" fill="#ddd8c0"/>
  <circle cx="4" cy="3" r="2.2" fill="#ddd8c0"/>
  <circle cx="6" cy="-6" r="1.5" fill="#ddd8c0"/>
</g>

<!-- clouds -->
<g class="drift1" opacity=".92"><g class="cloud">
  <ellipse cx="180" cy="120" rx="52" ry="13"/><ellipse cx="215" cy="110" rx="34" ry="11"/><ellipse cx="148" cy="110" rx="26" ry="9"/>
</g></g>
<g class="drift2" opacity=".85"><g class="cloud">

</g></g>
<g class="drift3" opacity=".8"><g class="cloud">
  <ellipse cx="330" cy="200" rx="60" ry="12"/><ellipse cx="370" cy="190" rx="30" ry="9"/><ellipse cx="290" cy="192" rx="24" ry="8"/>
</g></g>

<!-- far left edge buildings -->
<rect class="glassPale" x="-6" y="395" width="36" height="220"/>

<!-- mid-left slabs -->
<rect class="whiteBlk" x="46" y="384" width="36" height="196"/>
<rect class="glassDay" x="132" y="400" width="30" height="180"/>

<!-- Oriental Pearl Tower -->

    <circle cx="105" cy="138" r="46"/><circle cx="105" cy="452" r="56"/>
</g></g>
  <!-- antenna + top balls -->

  </g>
  <!-- column + disc details -->
  <rect class="pearlCol" x="97" y="170" width="16" height="245"/>
  <g class="pearlCol">

    <ellipse cx="105" cy="276" rx="13" ry="4.5"/><ellipse cx="105" cy="310" rx="13" ry="4.5"/>
    <ellipse cx="105" cy="344" rx="13" ry="4.5"/><ellipse cx="105" cy="378" rx="13" ry="4.5"/>
  </g>
  <!-- lower big sphere -->
  <circle class="pearlBall" cx="105" cy="452" r="44" fill="url(#gSphere)"/>
  <g stroke="#8e2f4c" stroke-width="1.2" fill="none" opacity=".5">

  </g>
  <!-- pods + legs -->
  <circle class="pearlBall" cx="72" cy="494" r="8"/><circle class="pearlBall" cx="138" cy="494" r="8"/>
  <g class="pearlCol">
    <path d="M96 480 L52 612 L60 612 L101 488 Z"/>
    <path d="M114 480 L158 612 L150 612 L109 488 Z"/>

<script>
(function () {
  var svg = document.querySelector('svg');
  var NS = 'http://www.w3.org/2000/svg';
  function el(name, attrs, parent) {
    var n = document.createElementNS(NS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  // stars
  var stars = document.getElementById('stars');
  for (var i = 0; i < 70; i++) {
    var s = el('circle', { cx: (Math.random()*720).toFixed(1), cy: (Math.random()*380).toFixed(1), r: (0.6+Math.random()*1.1).toFixed(2) }, stars);
    s.setAttribute('class', 'star');
    s.style.setProperty('--d', (Math.random()*3).toFixed(2)+'s');
  }
  // lit windows inside building clip
  var wins = document.getElementById('wins');
  var regions = [
    { x:46, y:384, w:36, h:196 }, { x:132, y:400, w:30, h:180 },
    { x:394, y:302, w:52, h:274 }, { x:430, y:280, w:52, h:296 },
    { x:481, y:206, w:52, h:370 }, { x:532, y:290, w:36, h:286 },
    { x:594, y:64,  w:58, h:512 }, { x:224, y:360, w:42, h:216 },
    { x:676, y:400, w:44, h:176 }, { x:552, y:470, w:76, h:108 }
  ];
  regions.forEach(function (r) {
    for (var y = r.y + 4; y < r.y + r.h - 3; y += 9) {
      for (var x = r.x + 3; x < r.x + r.w - 4; x += 6.5) {
        if (Math.random() < 0.32) continue;
        var w = el('rect', { x: x.toFixed(1), y: y, width: 2.6, height: 3.4 }, wins);
        w.setAttribute('fill-opacity', (0.5+Math.random()*0.5).toFixed(2));
        if (Math.random() < 0.12) {
          w.setAttribute('class', 'win flick');
          w.style.setProperty('--d', (Math.random()*4).toFixed(2)+'s');
        }
      }
    }
  });
  // water shimmer streaks
  var shim = document.getElementById('shim');
  for (var j = 0; j < 46; j++) {
    var r2 = el('rect', {
      x: (Math.random()*700).toFixed(1), y: (662+Math.random()*140).toFixed(1),
      width: (8+Math.random()*30).toFixed(1), height: 1.6, rx: 0.8
    }, shim);
    r2.setAttribute('class', 'shim');
    r2.style.setProperty('--d', (Math.random()*5).toFixed(2)+'s');
    r2.style.setProperty('--sd', (3.4+Math.random()*4).toFixed(2)+'s');
    r2.style.setProperty('--tx', ((Math.random()*20)-10).toFixed(0)+'px');
  }
  // night city-light dashes on water
  var nd = document.getElementById('ndash');
  for (var k = 0; k < 60; k++) {
    var d = el('rect', {
      x: (Math.random()*710).toFixed(1), y: (660+Math.random()*120).toFixed(1),
      width: (4+Math.random()*14).toFixed(1), height: 1.8, rx: 0.9
    }, nd);
    d.setAttribute('class', 'ndash');
    d.style.setProperty('--d', (Math.random()*3).toFixed(2)+'s');
    d.style.setProperty('--sd', (2.6+Math.random()*3).toFixed(2)+'s');
  }
  // trees along the bank
  var trees = document.getElementById('trees');
  var spots = [40,66,92,118,150,178,205,232,258,286,312,340,366,392,418,446,472,500,528,556,584,612,640];
  spots.forEach(function (x, idx) {
    var red = (idx % 3 === 1) || x > 470 && x < 600;
    var g = el('g', {}, trees);
    g.setAttribute('class', red ? 'treeR' : 'treeG');
    var r = 8 + ((idx * 7) % 5);
    el('ellipse', { cx: x, cy: 612 - r*0.55, rx: r, ry: r*0.9 }, g);
    el('rect', { x: x-1.4, y: 610-r*0.3, width: 2.8, height: r*0.7 }, g);
  });
})();
</script>
