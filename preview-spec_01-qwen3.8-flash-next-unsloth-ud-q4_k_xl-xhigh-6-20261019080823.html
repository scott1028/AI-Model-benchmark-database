<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>preview spec_01 — Shanghai Lujiazui day/night loop</title>
<style>
  :root { --cy: 60s; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 30%, #16202c 0%, #0a0e14 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: "Segoe UI", "Noto Sans TC", sans-serif;
  }
  main.stage { width: min(92vmin, 760px); }
  svg.scene {
    display: block;
    width: 100%;
    border-radius: 10px;
    box-shadow: 0 18px 60px rgba(0,0,0,.65);
  }
  figcaption { color: #93a5b8; font-size: 12px; margin-top: 10px; text-align: center; }
  figcaption b { color: #c8d6e4; }

  /* ============ day/night master keyframes (all share --cy) ============ */
  #skyDawn  { animation: dawnK  var(--cy) linear infinite; }
  #skyDusk  { animation: duskK  var(--cy) linear infinite; }
  #skyNight { animation: nightK var(--cy) linear infinite; }
  #sunG     { animation: sunK   var(--cy) linear infinite; }
  #moonG    { animation: moonK  var(--cy) linear infinite; }
  #stars    { animation: starsK var(--cy) linear infinite; }
  #gradeWarm{ animation: wgK    var(--cy) linear infinite; }
  #gradeNight { animation: ngK  var(--cy) linear infinite; }
  .nl       { animation: nlK    var(--cy) linear infinite; }
  .birdFlock{ animation: flyK  42s linear infinite, bdK var(--cy) linear infinite; }

  @keyframes dawnK {
    0% { opacity: 1; } 7% { opacity: 0; }
    93% { opacity: 0; } 96% { opacity: .45; } 100% { opacity: 1; }
  }
  @keyframes duskK {
    0% { opacity: 1; } 3% { opacity: 0; }
    54% { opacity: 0; } 63% { opacity: 1; } 73% { opacity: 0; } 100% { opacity: 0; }
  }
  @keyframes nightK {
    0%, 60% { opacity: 0; } 74% { opacity: 1; }
    92% { opacity: 1; } 100% { opacity: 0; }
  }
  @keyframes sunK {
    0%, 1.5% { opacity: 0; } 5% { opacity: 1; }
    58% { opacity: 1; } 63% { opacity: 0; } 100% { opacity: 0; }
  }
  @keyframes moonK {
    0% { opacity: 1; } 7% { opacity: 1; } 11% { opacity: 0; }
    62% { opacity: 0; } 70% { opacity: 1; } 100% { opacity: 1; }
  }
  @keyframes starsK {
    0% { opacity: .55; } 7% { opacity: 0; }
    56% { opacity: 0; } 73% { opacity: 1; } 94% { opacity: 1; } 100% { opacity: .55; }
  }
  @keyframes wgK {
    0% { opacity: .16; } 8% { opacity: 0; }
    52% { opacity: 0; } 62% { opacity: .5; } 66% { opacity: .32; } 74% { opacity: 0; }
    96% { opacity: 0; } 100% { opacity: .14; }
  }
  @keyframes ngK {
    0% { opacity: .32; } 9% { opacity: 0; }
    58% { opacity: 0; } 74% { opacity: .62; } 92% { opacity: .62; } 100% { opacity: .28; }
  }
  /* night lights master: fade in at dusk, out after dawn */
  @keyframes nlK {
    0% { opacity: .5; } 4% { opacity: 0; }
    56% { opacity: 0; } 68% { opacity: 1; } 95% { opacity: 1; } 100% { opacity: .5; }
  }
  /* aviation obstruction blink (inside .nl wrapper) */
  .blink  { animation: blinkK 2s   linear infinite; }
  .blink2 { animation: blinkK 2.6s linear .8s infinite; }
  @keyframes blinkK {
    0%, 44% { opacity: 0; } 50%, 94% { opacity: 1; } 100% { opacity: 0; }
  }
  /* twinkling stars */
  .tw  { animation: twK 1.9s ease-in-out infinite alternate; }
  .tw2 { animation: twK 2.7s ease-in-out .6s infinite alternate; }
  .tw3 { animation: twK 3.4s ease-in-out 1.1s infinite alternate; }
  @keyframes twK { from { opacity: .25; } to { opacity: 1; } }
  /* clouds slow drift */
  .cl1 { animation: driftK 46s ease-in-out infinite alternate; }
  .cl2 { animation: driftK 62s ease-in-out 4s infinite alternate-reverse; }
  .cl3 { animation: driftK 54s ease-in-out 8s infinite alternate; }
  @keyframes driftK { from { transform: translateX(-16px); } to { transform: translateX(18px); } }
  /* water surface: shimmer lines + slow swell */
  .wl  { animation: wlK 3.2s ease-in-out infinite alternate; }
  .wl2 { animation: wlK 4.6s ease-in-out .9s infinite alternate-reverse; }
  .wl3 { animation: wlK 3.9s ease-in-out 1.6s infinite alternate; }
  @keyframes wlK { from { transform: translateX(-6px); } to { transform: translateX(8px); } }
  .wv  { animation: wvK 7s ease-in-out infinite alternate; }
  .wv2 { animation: wvK 9s ease-in-out 2s infinite alternate-reverse; }
  @keyframes wvK { from { transform: translateY(-2px); } to { transform: translateY(3px); } }
  /* reflections breathe */
  .ref { animation: refK 3.6s ease-in-out infinite alternate; transform-origin: center top; }
  .ref2 { animation: refK 4.8s ease-in-out 1s infinite alternate-reverse; transform-origin: center top; }
  @keyframes refK { from { opacity: .38; transform: scaleY(1); } to { opacity: .62; transform: scaleY(1.06); } }
  /* sun glitter on water (day only) */
  #glitter { animation: glitK var(--cy) linear infinite; }
  @keyframes glitK {
    0%, 4% { opacity: 0; } 12% { opacity: .5; } 52% { opacity: .5; }
    60% { opacity: 0; } 100% { opacity: 0; }
  }
  #moonPath { animation: mpK var(--cy) linear infinite; }
  @keyframes mpK {
    0% { opacity: .5; } 9% { opacity: 0; } 60% { opacity: 0; }
    74% { opacity: .55; } 95% { opacity: .55; } 100% { opacity: .5; }
  }
  /* barge crossing + gentle bob */
  #bargeSail { animation: sailK 150s linear infinite; }
  @keyframes sailK { from { transform: translateX(0); } to { transform: translateX(-1010px); } }
  #bobA { animation: bobK 4.4s ease-in-out infinite alternate; }
  #bobB { animation: bobK 3.7s ease-in-out .8s infinite alternate-reverse; }
  @keyframes bobK { from { transform: translateY(-1.4px); } to { transform: translateY(1.4px); } }
  /* birds */
  @keyframes flyK { from { transform: translate(-90px, 26px); } to { transform: translate(680px, -34px); } }
  @keyframes bdK {
    0%, 9% { opacity: 0; } 16% { opacity: .8; } 54% { opacity: .8; } 64% { opacity: 0; } 100% { opacity: 0; }
  }
  /* dome glass slow sheen */
  .sheen { animation: sheenK var(--cy) linear infinite; }
  @keyframes sheenK {
    0%, 6% { opacity: 0; } 20% { opacity: .45; } 50% { opacity: .45; } 60% { opacity: 0; } 100% { opacity: 0; }
  }
</style>
</head>
<body>
<main class="stage">
<svg class="scene" viewBox="0 0 745 742" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Shanghai Lujiazui skyline day and night animation">
  <defs>

    </linearGradient>

      <stop offset="0" stop-color="#d5e7ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#d5e7ff" stop-opacity="0"/>

    <linearGradient id="gBlueT" x1="0" y1="0" x2="1" y2="0">

      <stop offset="1" stop-color="#0b2547"/>
    </linearGradient>
    <linearGradient id="gBeige" x1="0" y1="0" x2="1" y2="0">

    </linearGradient>
    <linearGradient id="gJinS" x1="0" y1="0" x2="1" y2="0">

    </linearGradient>
    <linearGradient id="gBlock" x1="0" y1="0" x2="1" y2="0">

      <stop offset="1" stop-color="#0e2740"/>

      <stop offset="0" stop-color="#79cfc0"/>
      <stop offset="1" stop-color="#1f8a86"/>
    </linearGradient>
    <!-- ======== window patterns ======== -->
    <pattern id="pCurt" width="4" height="9" patternUnits="userSpaceOnUse">

      <line x1="0" y1="0" x2="0" y2="9" stroke="#ffffff" stroke-opacity=".16" stroke-width="1"/>

      <rect x="14" y="8" width="1.8" height="2.2" fill="#e8f2ff"/>

    <path id="moonArc" d="M52,502 Q373,86 696,502"/>

  <!-- ================= BACKGROUND SKYLINE ================= -->

    <!-- twin green-crown turrets -->

      <rect x="293" y="446" width="11" height="36" fill="#e4dcc8"/>

    </g>
    <!-- slim spire tower -->
    <rect x="338" y="412" width="22" height="88" fill="url(#gTeal)"/>
    <rect x="338" y="412" width="22" height="88" fill="url(#pBandH)"/>
    <rect x="342" y="398" width="14" height="16" fill="#e8ecec"/>
