<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview spec 01 — Tuscany Day/Night — SVG infinite loop</title>
<style>
  :root { --cycle: 60s; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0b0e15; overflow: hidden; }
  body { display: grid; place-items: center; }
  svg.stage { width: 100vw; height: 100vh; display: block; }
  .caption {
    position: fixed; left: 14px; bottom: 10px; z-index: 2;
    font: 11px/1.5 ui-monospace, monospace; color: #8a93a6; opacity: .75;
    pointer-events: none; user-select: none;
  }

  /* ============ master day/night timeline (60s loop) ============
     phases: 0-14% golden day | 14-24% noon | 24-34% sunset
             34-40% dusk | 40-64% night | 64-72% dawn | 72-100% sunrise->golden */
  .m { animation-duration: var(--cycle); animation-iteration-count: infinite; animation-timing-function: linear; }

  #sky-day     { animation-name: skyDay; }
  #sky-sunset  { animation-name: skySunset; }
  #sky-twilight{ animation-name: skyTwilight; }
  #sky-night   { animation-name: skyNight; }
  #stars       { animation-name: starsFade; }
  #sun         { animation-name: sunTrack; }
  #moon        { animation-name: moonTrack; }
  #land-dark   { animation-name: landDark; }
  #land-warm   { animation-name: landWarm; }
  #lights      { animation-name: lightsFade; }
  #fireflies   { animation-name: lightsFade; }
  #lamps       { animation-name: lightsFade; }
  #birds       { animation-name: birdsFade; }
  #sun-glint   { animation-name: landWarm; }
  #balloon     { animation-name: balloonDark; }
  #clouds      { animation-name: cloudsLight; }
  #moon-glint  { animation-name: lightsFade; }

  @keyframes skyDay {
    0%, 22%   { opacity: 1; }
    36%, 66%  { opacity: 0; }
    74%       { opacity: .92; }
    80%, 100% { opacity: 1; }
  }
  @keyframes skySunset {
    0%, 16%   { opacity: 0; }
    30%, 34%  { opacity: 1; }
    42%, 60%  { opacity: 0; }
    68%       { opacity: 1; }
    78%, 100% { opacity: 0; }
  }
  @keyframes skyTwilight {
    0%, 30%   { opacity: 0; }
    37%       { opacity: 1; }
    44%, 60%  { opacity: 0; }
    65%       { opacity: 1; }
    72%, 100% { opacity: 0; }
  }
  @keyframes skyNight {
    0%, 36%   { opacity: 0; }
    44%, 64%  { opacity: 1; }
    70%, 100% { opacity: 0; }
  }
  @keyframes starsFade {
    0%, 34%   { opacity: 0; }
    42%, 66%  { opacity: 1; }
    74%, 100% { opacity: 0; }
  }
  @keyframes sunTrack {
    0%        { transform: translate(258px, 98px); opacity: 1; }
    24%       { transform: translate(352px, 62px); opacity: 1; }
    34%       { transform: translate(462px, 252px); opacity: 1; }
    40%, 64%  { transform: translate(512px, 335px); opacity: 0; }
    70%       { transform: translate(160px, 300px); opacity: 0; }
    72%       { transform: translate(190px, 225px); opacity: 1; }
    82%       { transform: translate(232px, 128px); opacity: 1; }
    100%      { transform: translate(258px, 98px); opacity: 1; }
  }
  @keyframes moonTrack {
    0%, 36%   { transform: translate(180px, 320px); opacity: 0; }
    40%       { transform: translate(300px, 258px); opacity: 0; }
    44%       { transform: translate(390px, 150px); opacity: 1; }
    54%       { transform: translate(760px, 80px);  opacity: 1; }
    62%       { transform: translate(1075px, 108px); opacity: 1; }
    66%, 100% { transform: translate(1215px, 210px); opacity: 0; }
  }
  @keyframes landDark {
    0%, 22%   { opacity: 0; }
    30%       { opacity: .14; }
    36%       { opacity: .30; }
    44%, 62%  { opacity: .48; }
    68%       { opacity: .26; }
    74%       { opacity: .08; }
    80%, 100% { opacity: 0; }
  }
  @keyframes landWarm {
    0%, 14%   { opacity: 0; }
    28%       { opacity: .28; }
    34%       { opacity: .22; }
    42%, 60%  { opacity: 0; }
    67%       { opacity: .24; }
    76%, 100% { opacity: 0; }
  }
  @keyframes lightsFade {
    0%, 28%   { opacity: 0; }
    40%, 64%  { opacity: 1; }
    74%, 100% { opacity: 0; }
  }
  @keyframes birdsFade {
    0%, 26%   { opacity: 1; }
    34%, 68%  { opacity: 0; }
    76%, 100% { opacity: 1; }
  }
  @keyframes balloonDark {
    0%, 24%   { filter: brightness(1); }
    30%       { filter: brightness(.95) saturate(1.15); }
    42%, 62%  { filter: brightness(.42) saturate(.7); }
    70%       { filter: brightness(.8); }
    78%, 100% { filter: brightness(1); }
  }
  @keyframes cloudsLight {
    0%, 20%   { filter: brightness(1.02); }
    30%       { filter: brightness(1.06) saturate(1.35); }
    44%, 62%  { filter: brightness(.32) saturate(.5); }
    68%       { filter: brightness(.9); }
    76%, 100% { filter: brightness(1.02); }
  }

  /* ---- local loops (independent of master cycle) ---- */
  #sun-halo   { animation: haloPulse 6s ease-in-out infinite alternate; }
  #sun-rays   { animation: raysSpin 140s linear infinite; transform-origin: 0 0; }
  .cloudA     { animation: driftA 90s ease-in-out infinite alternate; }
  .cloudB     { animation: driftB 120s ease-in-out infinite alternate; }
  .tw         { animation: twinkle 2.6s ease-in-out infinite alternate; }
  .shoot      { animation: shoot 11s linear infinite; opacity: 0; }
  .glint      { animation: glint 4.2s ease-in-out infinite alternate; }
  .flick      { animation: flicker 3.1s ease-in-out infinite alternate; }
  #balloon-bob{ animation: bob 7s ease-in-out infinite alternate; }
  #birds-fly  { animation: flyBy 240s linear infinite; }
  .bird       { animation: flap .7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  .ff         { animation: ffBlink 2.2s ease-in-out infinite alternate; }

  @keyframes haloPulse { from { transform: scale(1); } to { transform: scale(1.07); } }
  @keyframes raysSpin  { to { transform: rotate(360deg); } }
  @keyframes driftA    { to { transform: translateX(46px); } }
  @keyframes driftB    { to { transform: translateX(-52px); } }
  @keyframes twinkle   { from { opacity: 1; } to { opacity: .2; } }
  @keyframes shoot {
    0%   { transform: translate(0, 0); opacity: 0; }
    3%   { opacity: 1; }
    10%  { transform: translate(230px, 96px); opacity: 0; }
    100% { transform: translate(230px, 96px); opacity: 0; }
  }
  @keyframes glint   { from { opacity: .28; } to { opacity: .75; } }
  @keyframes flicker { from { opacity: 1; } to { opacity: .68; } }
  @keyframes bob     { to { transform: translateY(10px); } }
  @keyframes flyBy   { from { transform: translateX(-60px); } to { transform: translateX(70px); } }
  @keyframes flap    { to { transform: scaleY(.55); } }
  @keyframes ffBlink { from { opacity: .15; } to { opacity: 1; } }
</style>
</head>
<body>
