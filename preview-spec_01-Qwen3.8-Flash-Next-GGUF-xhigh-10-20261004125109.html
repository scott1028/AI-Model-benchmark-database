<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shanghai Lujiazui — Day &amp; Night SVG Loop</title>
<style>
  :root { --T: 24s; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0c0e12;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .stage {
    width: min(92vmin, 760px);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 18px 60px rgba(0,0,0,.65), 0 0 0 1px #2a2e36;
  }
  svg { display: block; width: 100%; height: auto; }
  .caption { color: #6b7482; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }

  /* ============ sky gradient stops (day -> sunset -> night -> dawn) ============ */
  .sky-top   { animation: skyTop var(--T) linear infinite; }
  .sky-mid   { animation: skyMid var(--T) linear infinite; }
  .sky-bot   { animation: skyBot var(--T) linear infinite; }
  @keyframes skyTop {
    0%, 32%  { stop-color: #2e7ed2; }
    44%      { stop-color: #5a5fa0; }
    56%, 84% { stop-color: #060c26; }
    93%      { stop-color: #2b4d8f; }
    100%     { stop-color: #2e7ed2; }
  }
  @keyframes skyMid {
    0%, 32%  { stop-color: #6fb0e4; }
    42%      { stop-color: #d98a5f; }
    48%      { stop-color: #7a5b8e; }
    56%, 84% { stop-color: #0d1738; }
    92%      { stop-color: #9c6a86; }
    100%     { stop-color: #6fb0e4; }
  }
  @keyframes skyBot {
    0%, 32%  { stop-color: #cfe7f6; }
    42%      { stop-color: #ffb066; }
    50%      { stop-color: #b06a80; }
    58%, 82% { stop-color: #1a2a52; }
    90%      { stop-color: #e8946c; }
    100%     { stop-color: #cfe7f6; }
  }

  /* ============ water gradient stops ============ */
  .wat-top { animation: watTop var(--T) linear infinite; }
  .wat-bot { animation: watBot var(--T) linear infinite; }
  @keyframes watTop {
    0%, 32%  { stop-color: #2f74ab; }
    44%      { stop-color: #6d5a80; }
    56%, 84% { stop-color: #081a30; }
    92%      { stop-color: #3c5e84; }
    100%     { stop-color: #2f74ab; }
  }
  @keyframes watBot {
    0%, 32%  { stop-color: #14486f; }
    44%      { stop-color: #2c3358; }
    56%, 84% { stop-color: #040d1c; }
    92%      { stop-color: #173a5c; }
    100%     { stop-color: #14486f; }
  }

  /* ============ night state groups ============ */
  .n { opacity: 0; animation: nightOn var(--T) linear infinite; }
  @keyframes nightOn {
    0%, 43%  { opacity: 0; }
    51%, 86% { opacity: 1; }
    94%, 100%{ opacity: 0; }
  }
  .d { animation: dayOn var(--T) linear infinite; }
  @keyframes dayOn {
    0%, 37%  { opacity: 1; }
    49%, 88% { opacity: 0; }
    96%, 100%{ opacity: 1; }
  }

  /* darken all daytime geometry at night (windows/lights live OUTSIDE this group) */
  .shade { animation: shade var(--T) linear infinite; }
  @keyframes shade {
    0%, 41%  { filter: brightness(1) saturate(1); }
    53%, 85% { filter: brightness(.30) saturate(.62); }
    95%, 100%{ filter: brightness(1) saturate(1); }
  }

  /* warm sunset / dawn tint over whole scene */
  .tint { mix-blend-mode: soft-light; opacity: 0; animation: tint var(--T) linear infinite; }
  @keyframes tint {
    0%, 36%  { opacity: 0; }
    45%      { opacity: .75; }
    56%      { opacity: 0; }
    82%      { opacity: 0; }
    91%      { opacity: .6; }
    100%     { opacity: 0; }
  }

  /* beacons blink all the time, more visible at night */
  .blink { animation: blink 1.5s steps(2, jump-none) infinite; }
  @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: .15; } }

  /* star twinkle (nested inside a .n group so both multiply) */
  .tw { animation: tw 2.8s ease-in-out infinite alternate; }
  @keyframes tw { from { opacity: .3; } to { opacity: 1; } }

  /* pearl sphere breathing glow (nested inside .n) */
  .pulse { animation: pulse 2.4s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: .55; } to { opacity: 1; } }

  /* water motion */
  .ripp  { animation: rip 7s ease-in-out infinite alternate; }
  @keyframes rip { from { transform: translateX(-6px); } to { transform: translateX(6px); } }
  .shim  { animation: shim 3.4s ease-in-out infinite alternate; }
  @keyframes shim { from { opacity: .25; } to { opacity: .8; } }

  /* boats */
  .bob   { animation: bob 3.1s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(2px); } }
  .bob2  { animation: bob 4.3s ease-in-out infinite alternate-reverse; }
  .drift { animation: drift 52s linear infinite alternate; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-38px); } }

  /* clouds */
  .cl1 { animation: cl 90s linear infinite; }
  .cl2 { animation: cl 120s linear infinite; animation-delay: -60s; }
  @keyframes cl { from { transform: translateX(-140px); } to { transform: translateX(860px); } }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 720 860" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Shanghai Lujiazui skyline day and night animated loop">
  <defs>
    <!-- sky -->
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
      <stop class="sky-top" offset="0"   stop-color="#2e7ed2"/>
      <stop class="sky-mid" offset=".62" stop-color="#6fb0e4"/>
      <stop class="sky-bot" offset="1"   stop-color="#cfe7f6"/>
    </linearGradient>
    <!-- water -->
    <linearGradient id="gWat" x1="0" y1="0" x2="0" y2="1">
      <stop class="wat-top" offset="0" stop-color="#2f74ab"/>
      <stop class="wat-bot" offset="1" stop-color="#14486f"/>
    </linearGradient>
    <!-- sun / moon glows -->
    <radialGradient id="gSun">
      <stop offset="0"  stop-color="#fff6cf" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#ffe9a0" stop-opacity=".38"/>
      <stop offset="1"  stop-color="#ffe9a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gMoon">
      <stop offset="0"  stop-color="#eef4ff" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#c8d8ff" stop-opacity=".3"/>
      <stop offset="1"  stop-color="#c8d8ff" stop-opacity="0"/>
    </radialGradient>
    <!-- glass domes -->
    <radialGradient id="gDome" cx=".42" cy=".28" r=".95">
      <stop offset="0"   stop-color="#d6f4f2"/>
      <stop offset=".35" stop-color="#7fc6d8"/>
      <stop offset=".75" stop-color="#2f8fb4"/>
      <stop offset="1"   stop-color="#155e85"/>
    </radialGradient>
    <radialGradient id="gDomeGlow" cx=".45" cy=".35" r=".9">
      <stop offset="0"   stop-color="#aef4ff" stop-opacity=".9"/>
      <stop offset=".6"  stop-color="#2fb8d8" stop-opacity=".45"/>
      <stop offset="1"   stop-color="#0f5f88" stop-opacity=".15"/>
    </radialGradient>
    <!-- pearl sphere glow -->
    <radialGradient id="gPearl" cx=".4" cy=".35" r=".9">
      <stop offset="0"  stop-color="#ffd2dc" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#ff6f8e" stop-opacity=".55"/>
      <stop offset="1"  stop-color="#c22a55" stop-opacity=".2"/>
    </radialGradient>
    <!-- tower body gradients -->
    <linearGradient id="gSWFC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f6f8e"/>
      <stop offset=".55" stop-color="#7d9cb8"/>
      <stop offset="1" stop-color="#b9cfe0"/>
    </linearGradient>
    <linearGradient id="gCiti" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d739c"/>
      <stop offset=".6" stop-color="#7fa0bf"/>
      <stop offset="1" stop-color="#a8c2d6"/>
    </linearGradient>
    <linearGradient id="gGreenT" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f8f7e"/>
      <stop offset=".6" stop-color="#6fb09c"/>
      <stop offset="1" stop-color="#9cccb4"/>
    </linearGradient>
    <linearGradient id="gST" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fa9bd"/>
      <stop offset=".35" stop-color="#c4d8e6"/>
      <stop offset=".7" stop-color="#e8f1f7"/>
      <stop offset="1" stop-color="#a9c0d2"/>
    </linearGradient>
    <linearGradient id="gSilver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fb2c2"/>
      <stop offset=".55" stop-color="#d4dee7"/>
      <stop offset="1" stop-color="#eef3f7"/>
    </linearGradient>
    <!-- horizon haze -->
    <linearGradient id="gHaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".38"/>
    </linearGradient>
    <!-- sunset tint -->
    <linearGradient id="gTint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"  stop-color="#ff9a4a"/>
      <stop offset=".7" stop-color="#ff7a50"/>
      <stop offset="1"  stop-color="#ffd28a"/>
    </linearGradient>
    <!-- moon glitter column -->
    <linearGradient id="gGlit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfeaff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#dfeaff" stop-opacity="0"/>
    </linearGradient>
    <!-- vignette -->
    <radialGradient id="gVig" cx=".5" cy=".48" r=".78">
      <stop offset=".72" stop-color="#000" stop-opacity="0"/>
      <stop offset="1"   stop-color="#000" stop-opacity=".34"/>
    </radialGradient>

    <!-- lit-window patterns (night) -->
    <pattern id="win" width="9" height="12" patternUnits="userSpaceOnUse">
      <rect x="1.6" y="2" width="3" height="5" fill="#ffd98a"/>
    </pattern>
    <pattern id="win2" width="12" height="14" patternUnits="userSpaceOnUse">
      <rect x="2"   y="2.5" width="3.4" height="6" fill="#ffe09a"/>
      <rect x="7.5" y="8"   width="3.4" height="6" fill="#ffcf7a" opacity=".6"/>
    </pattern>
    <pattern id="winV" width="7" height="17" patternUnits="userSpaceOnUse">
      <rect x="2" y="1.5" width="1.8" height="10" fill="#ffe6ad"/>
    </pattern>
    <pattern id="archLit" width="23.5" height="90" patternUnits="userSpaceOnUse" x="178" y="574">
      <path d="M4,86 L4,26 A7.75,7.75 0 0 1 19.5,26 L19.5,86 Z" fill="#ffd894"/>
    </pattern>

    <!-- day window patterns -->
    <pattern id="winDayW" width="12" height="11" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="6" height="5.5" fill="#7d8b96"/>
    </pattern>
    <pattern id="winDayG" width="10" height="13" patternUnits="userSpaceOnUse">
      <rect x="1.5" y="2" width="5" height="7" fill="#2c5f58" opacity=".55"/>
    </pattern>
    <pattern id="winDayL" width="8" height="10" patternUnits="userSpaceOnUse">
      <rect x="1.5" y="2" width="4" height="5" fill="#6d7a86" opacity=".5"/>
    </pattern>
    <pattern id="archDay" width="23.5" height="90" patternUnits="userSpaceOnUse" x="178" y="574">
      <path d="M4,86 L4,26 A7.75,7.75 0 0 1 19.5,26 L19.5,86 Z" fill="#6b5a44"/>
    </pattern>

    <!-- silhouettes reused for night light overlays -->
    <path id="pSWFC" fill-rule="evenodd"
      d="M466,700 L470,430 Q474,300 481,228 L525,228 Q531,320 534,470 L537,700 Z
         M490,241 L516,241 L511,269 L495,269 Z"/>
    <path id="pJinMao"
      d="M475,700 L475,585 L478,585 L480,530 L483,530 L485,480 L487.5,480 L489,435 L491,435
         L492,395 L493.5,395 L493.5,360 L500.5,360 L500.5,395 L502,395 L503,435 L505,435
         L506.5,480 L509,480 L511,530 L514,530 L516,585 L519,585 L519,700 Z"/>
    <polygon id="pSilver" points="518,342 560,318 580,318 582,700 518,700"/>
    <polygon id="pGreenT" points="405,342 447,318 462,318 462,700 405,700"/>
    <polygon id="pCiti"   points="212,428 268,392 268,700 212,700"/>
    <path id="pST" d="M612,700 C613,500 620,300 634,62 L656,62 C668,300 677,500 680,700 Z"/>
    <path id="pDomeL" d="M88,612 A62,62 0 0 1 212,612 L212,664 L88,664 Z"/>
    <path id="pDomeR" d="M378,618 A54,54 0 0 1 486,618 L486,666 L378,666 Z"/>

    <clipPath id="clipDomeL"><use xlink:href="#pDomeL"/></clipPath>
    <clipPath id="clipDomeR"><use xlink:href="#pDomeR"/></clipPath>

    <filter id="blurS" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- ================= SKY ================= -->
  <rect x="0" y="0" width="720" height="700" fill="url(#gSky)"/>

  <!-- ================= STARS (night) ================= -->
  <g class="n">
    <g fill="#ffffff">
      <circle class="tw" cx="42"  cy="58"  r="1.3" style="animation-delay:-.4s"/>
      <circle class="tw" cx="96"  cy="120" r="1"   style="animation-delay:-1.9s"/>
      <circle class="tw" cx="150" cy="40"  r="1.5" style="animation-delay:-1.1s"/>
      <circle class="tw" cx="205" cy="96"  r="1"   style="animation-delay:-2.3s"/>
      <circle class="tw" cx="252" cy="34"  r="1.2" style="animation-delay:-.8s"/>
      <circle class="tw" cx="300" cy="150" r="1"   style="animation-delay:-1.5s"/>
      <circle class="tw" cx="336" cy="70"  r="1.4" style="animation-delay:-2.6s"/>
      <circle class="tw" cx="388" cy="120" r="1"   style="animation-delay:-.2s"/>
      <circle class="tw" cx="430" cy="44"  r="1.3" style="animation-delay:-1.7s"/>
      <circle class="tw" cx="470" cy="168" r="1"   style="animation-delay:-2.1s"/>
      <circle class="tw" cx="512" cy="90"  r="1.4" style="animation-delay:-.6s"/>
      <circle class="tw" cx="560" cy="38"  r="1"   style="animation-delay:-1.3s"/>
      <circle class="tw" cx="596" cy="140" r="1.2" style="animation-delay:-2.4s"/>
      <circle class="tw" cx="640" cy="70"  r="1"   style="animation-delay:-.9s"/>
      <circle class="tw" cx="688" cy="120" r="1.3" style="animation-delay:-1.8s"/>
      <circle class="tw" cx="70"  cy="210" r="1"   style="animation-delay:-2.7s"/>
      <circle class="tw" cx="190" cy="250" r="1.1" style="animation-delay:-.5s"/>
      <circle class="tw" cx="286" cy="230" r="1"   style="animation-delay:-1.4s"/>
      <circle class="tw" cx="370" cy="270" r="1.2" style="animation-delay:-2s"/>
      <circle class="tw" cx="452" cy="240" r="1"   style="animation-delay:-.7s"/>
      <circle class="tw" cx="546" cy="210" r="1.3" style="animation-delay:-2.2s"/>
      <circle class="tw" cx="620" cy="260" r="1"   style="animation-delay:-1s"/>
      <circle class="tw" cx="676" cy="220" r="1.1" style="animation-delay:-1.6s"/>
      <circle class="tw" cx="120" cy="330" r="1"   style="animation-delay:-2.5s"/>
      <circle class="tw" cx="330" cy="340" r="1"   style="animation-delay:-.3s"/>
      <circle class="tw" cx="580" cy="330" r="1"   style="animation-delay:-1.2s"/>
    </g>
  </g>

  <!-- ================= SUN + MOON (rotate behind skyline) ================= -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      from="-90 360 940" to="270 360 940" dur="24s" repeatCount="indefinite"/>
    <!-- sun : overhead at 25% of cycle -->
    <g>
      <circle cx="360" cy="160" r="64" fill="url(#gSun)"/>
      <circle cx="360" cy="160" r="24" fill="#fff6d2"/>
    </g>
    <!-- moon : opposite side -->
    <g>
      <circle cx="360" cy="1720" r="52" fill="url(#gMoon)"/>
      <circle cx="360" cy="1720" r="16" fill="#edf2ff"/>
      <circle cx="354" cy="1714" r="3.2" fill="#d4ddf0" opacity=".8"/>
      <circle cx="366" cy="1726" r="2.4" fill="#d4ddf0" opacity=".7"/>
      <circle cx="359" cy="1728" r="1.6" fill="#d4ddf0" opacity=".6"/>
    </g>
  </g>

  <!-- ================= CLOUDS (day only) ================= -->
  <g class="d" fill="#ffffff">
    <g class="cl1" opacity=".85">
      <ellipse cx="120" cy="130" rx="52" ry="13"/>
      <ellipse cx="152" cy="120" rx="34" ry="11"/>
      <ellipse cx="92"  cy="122" rx="26" ry="9"/>
    </g>
    <g class="cl2" opacity=".7">
      <ellipse cx="480" cy="90" rx="60" ry="12"/>
      <ellipse cx="516" cy="80" rx="34" ry="10"/>
    </g>
  </g>

  <!-- ================= CITY (daytime geometry, darkened at night) ================= -->
  <g class="shade">

    <!-- far-left blocks -->
    <rect x="-2" y="432" width="28" height="268" fill="#cfd4d8"/>
    <rect x="-2" y="432" width="28" height="268" fill="url(#winDayL)"/>
    <rect x="26" y="470" width="30" height="230" fill="#e3e6e9"/>
    <rect x="26" y="470" width="30" height="230" fill="url(#winDayL)"/>
    <rect x="54" y="452" width="26" height="248" fill="#b9c2ca"/>
    <rect x="54" y="452" width="26" height="248" fill="url(#winDayL)"/>

    <!-- beige block behind pearl legs -->
    <rect x="146" y="470" width="44" height="230" fill="#ddd9cf"/>
    <rect x="150" y="478" width="6"  height="210" fill="#b98d6e" opacity=".7"/>
    <rect x="166" y="478" width="6"  height="210" fill="#b98d6e" opacity=".7"/>
    <rect x="182" y="478" width="6"  height="210" fill="#b98d6e" opacity=".7"/>
    <rect x="188" y="430" width="22" height="250" fill="#eceef0"/>
    <rect x="188" y="430" width="22" height="250" fill="url(#winDayL)"/>

    <!-- Citi tower (slanted blue glass) -->

    <g stroke="#e6f1fa" stroke-width="1" opacity=".45">
      <line x1="222" y1="424" x2="222" y2="660"/>
      <line x1="234" y1="417" x2="234" y2="660"/>
      <line x1="246" y1="410" x2="246" y2="660"/>
      <line x1="258" y1="403" x2="258" y2="660"/>
    </g>
    <polygon points="212,428 268,392 268,400 212,436" fill="#dcebf6" opacity=".7"/>

    <!-- twin small towers + mast -->
    <rect x="292" y="522" width="24" height="178" fill="#d9cfc0"/>
    <polygon points="292,522 304,504 316,522" fill="#a89a86"/>
    <rect x="322" y="528" width="24" height="172" fill="#cfc6b8"/>

    <!-- Jin Mao tower + spire -->

    <line x1="497" y1="360" x2="497" y2="298" stroke="#aab2ba" stroke-width="2.6"/>
    <g stroke="#98a2ab" stroke-width="1" opacity=".7">
      <line x1="475" y1="585" x2="519" y2="585"/>

      <line x1="489" y1="435" x2="505" y2="435"/>
    </g>

    <!-- silver slab tower right of Jin Mao -->
    <use xlink:href="#pSilver" fill="url(#gSilver)"/>
    <polygon points="518,342 560,318 580,318 580,326 518,350" fill="#ffffff" opacity=".55"/>
    <g stroke="#8fa2b2" stroke-width="1" opacity=".4">
      <line x1="530" y1="336" x2="530" y2="700"/>
      <line x1="546" y1="326" x2="546" y2="700"/>
      <line x1="562" y1="320" x2="562" y2="700"/>
    </g>

    <!-- brown chalice-crown tower -->
    <rect x="466" y="472" width="46" height="228" fill="#a97f5f"/>
    <rect x="466" y="472" width="46" height="228" fill="url(#winDayL)"/>
    <polygon points="474,472 467,452 511,452 504,472" fill="#b98d6a"/>
    <rect x="465" y="446" width="48" height="6" rx="2" fill="#8a6349"/>
    <line x1="489" y1="446" x2="489" y2="434" stroke="#8a6349" stroke-width="2"/>

    <!-- white grid office building -->
    <rect x="546" y="500" width="102" height="200" fill="#eef1f3"/>
    <rect x="546" y="500" width="102" height="200" fill="url(#winDayW)"/>
    <rect x="546" y="500" width="102" height="7" fill="#d4dade"/>

    <!-- emerald towers right -->
    <polygon points="640,412 700,392 700,700 640,700" fill="url(#gGreenT)"/>
    <polygon points="640,412 700,392 700,700 640,700" fill="url(#winDayG)"/>
    <rect x="698" y="430" width="24" height="270" fill="#1f7d5c"/>

    <!-- Shanghai Tower -->
    <use xlink:href="#pST" fill="url(#gST)"/>
