<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lujiazui Day &amp; Night</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#05080f; font-family:system-ui,"Segoe UI",sans-serif; overflow:hidden;
  }
  .stage { position:relative; width:min(100vw,100vh*1.0169); aspect-ratio:1200/1180;
            box-shadow:0 20px 70px rgba(0,0,0,.6); border-radius:6px; overflow:hidden; background:#05080f; }
  svg { display:block; width:100%; height:100%; }
  .cap { position:absolute; left:12px; bottom:10px; font-size:12px; letter-spacing:.04em;
          color:rgba(255,255,255,.55); font-variant-numeric:tabular-nums; pointer-events:none;
          text-shadow:0 1px 3px rgba(0,0,0,.7); }

  /* --- day/night master timing (all share 24s) --- */
  .nightSky  { animation: nightFade 24s ease-in-out infinite; opacity:0; }
  .stars     { animation: nightFade 24s ease-in-out infinite; opacity:0; }
  .litWin    { animation: nightFade 24s ease-in-out infinite; opacity:0; }
  .waterNight{ animation: nightFade 24s ease-in-out infinite; opacity:0; }
  .reflect   { animation: nightFade 24s ease-in-out infinite; opacity:0; }
  .pearlGlow { animation: nightFade 24s ease-in-out infinite; opacity:0; }
  .sunGlitter{ animation: dayOnly 24s ease-in-out infinite; }
  .sunset    { animation: sunsetFade 24s ease-in-out infinite; opacity:0; }
  .veil      { animation: veilFade 24s ease-in-out infinite; opacity:0; }
  .wheel     { animation: spin 24s linear infinite; transform-box: view-box; }

  @keyframes nightFade {
    0%{opacity:0} 20%{opacity:0} 31%{opacity:1} 69%{opacity:1} 80%{opacity:0} 100%{opacity:0}
  }
  @keyframes veilFade {
    0%{opacity:0} 20%{opacity:0} 31%{opacity:.6} 69%{opacity:.6} 80%{opacity:0} 100%{opacity:0}
  }
  @keyframes dayOnly {
    0%{opacity:.55} 22%{opacity:.3} 31%{opacity:0} 69%{opacity:0} 80%{opacity:.3} 100%{opacity:.55}
  }
  @keyframes sunsetFade {
    0%{opacity:0} 15%{opacity:0} 25%{opacity:.9} 34%{opacity:0}
    66%{opacity:0} 75%{opacity:.9} 85%{opacity:0} 100%{opacity:0}
  }
  @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  @keyframes twinkle { 0%,100%{opacity:.2} 50%{opacity:1} }
  @keyframes drift { 0%,100%{transform:translateX(0)} 50%{transform:translateX(26px)} }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-3px) rotate(.5deg)} }
  @keyframes beacon { 0%,46%{opacity:1} 50%,96%{opacity:.15} 100%{opacity:1} }
  .boat { animation: bob 4.5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  .beacon  { animation: beacon 2.2s steps(1) infinite; }
  .beacon2 { animation: beacon 1.6s steps(1) infinite; }
  @media (prefers-reduced-motion: reduce) {
    .wheel,.boat,.stars circle,.ripples line { animation:none; }
  }
</style>
</head>
