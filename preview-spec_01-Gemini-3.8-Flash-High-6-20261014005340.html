<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上海陸家嘴天際線日夜動畫 - Shanghai Skyline Day/Night Cycle</title>
  <style>
    :root {
      --bg-dark: #0a0e17;
      --panel-bg: rgba(16, 24, 39, 0.78);
      --panel-border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --cycle-duration: 32s;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    svg#skyline-stage {
      width: 100%;
      height: 100%;
      max-width: 100vh;
      max-height: 100vw;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.8));
    }

    /* =======================================================
       HUD & CONTROLS
    ======================================================= */
    .hud-header {
      position: absolute;
      top: 16px;
      left: 20px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      padding: 8px 16px;
      border-radius: 9999px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      pointer-events: auto;
      transition: all 0.3s ease;
    }

    .hud-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulse-dot 2s infinite ease-in-out;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .time-badge {
      font-family: monospace;
      font-size: 13px;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .hud-dock {
      position: absolute;
      bottom: 24px;
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      padding: 12px 20px;
      border-radius: 20px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
      width: min(92vw, 680px);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }

    .hud-dock.minimized {
      transform: translateY(calc(100% + 40px));
      opacity: 0;
      pointer-events: none;
    }

    .hud-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    .btn.active {
      background: var(--accent);
      color: #04101d;
      border-color: var(--accent);
      font-weight: 600;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      padding: 0;
      justify-content: center;
      border-radius: 50%;
    }

    .slider-container {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .timeline-slider {
      flex: 1;
      -webkit-appearance: none;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .timeline-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      cursor: pointer;
      border: 2px solid #ffffff;
      transition: transform 0.15s ease;
    }

    .timeline-slider::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }

    .dock-toggle-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 55;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      color: var(--text);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }

    .dock-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: var(--accent);
    }

    /* =======================================================
       KEYFRAME ANIMATIONS FOR THE INFINITE DAY/NIGHT CYCLE
    ======================================================= */
    /* 
       0% - 30%   Daytime (陽光明媚、蔚藍晴天)
       30% - 46%  Sunset (夕陽火燒雲、紫金晚霞、街燈漸開)
       46% - 74%  Night (深夜璀璨燈光秀、東方明珠與中心大廈霓虹奔馳)
       74% - 90%  Sunrise / Dawn (晨曦朝霞、微藍淡金、夜燈隱退)
       90% - 100% Day (重返日間)
    */

    /* 天空漸層動態 */
    .anim-sky-top {
      animation: skyTopCycle var(--cycle-duration) linear infinite;
    }
    .anim-sky-bottom {
      animation: skyBottomCycle var(--cycle-duration) linear infinite;
    }

    @keyframes skyTopCycle {
      0%, 28%   { stop-color: #1b6cc8; } /* Day deep azure */
      36%       { stop-color: #7b2959; } /* Sunset purple */
      44%       { stop-color: #2c1236; } /* Dusk deep magenta */
      50%, 70%  { stop-color: #030611; } /* Night midnight navy */
      78%       { stop-color: #1a2245; } /* Dawn indigo */
      86%       { stop-color: #2a5a9c; } /* Morning sky blue */
      94%, 100% { stop-color: #1b6cc8; } /* Day */
    }

    @keyframes skyBottomCycle {
      0%, 28%   { stop-color: #5bb3f8; } /* Day pale cyan */
      36%       { stop-color: #e56038; } /* Sunset fiery orange */
      44%       { stop-color: #d94b59; } /* Dusk rose */
      50%, 70%  { stop-color: #0a1329; } /* Night deep blue */
      78%       { stop-color: #e67d60; } /* Dawn coral peach */
      86%       { stop-color: #8acafb; } /* Morning cyan */
      94%, 100% { stop-color: #5bb3f8; } /* Day */
    }

    /* 太陽軌道與日照 */
    .anim-sun-group {
      animation: sunPathCycle var(--cycle-duration) linear infinite;
      transform-origin: 500px 900px;
    }
    @keyframes sunPathCycle {
      0%   { transform: rotate(-45deg); opacity: 1; }
      25%  { transform: rotate(0deg); opacity: 1; }
      40%  { transform: rotate(48deg); opacity: 0.9; }
      46%  { transform: rotate(62deg); opacity: 0; }
      80%  { transform: rotate(-70deg); opacity: 0; }
      88%  { transform: rotate(-55deg); opacity: 0.8; }
      100% { transform: rotate(-45deg); opacity: 1; }
    }

    /* 月亮軌道與月華 */
    .anim-moon-group {
      animation: moonPathCycle var(--cycle-duration) linear infinite;
      transform-origin: 500px 900px;
    }
    @keyframes moonPathCycle {
      0%, 38%  { transform: rotate(90deg); opacity: 0; }
      46%      { transform: rotate(45deg); opacity: 0.6; }
      55%      { transform: rotate(0deg); opacity: 1; }
      68%      { transform: rotate(-35deg); opacity: 1; }
      76%      { transform: rotate(-60deg); opacity: 0.2; }
      82%, 100%{ transform: rotate(-90deg); opacity: 0; }
    }

    /* 星空繁星閃爍 */
    .anim-stars {
      animation: starsCycle var(--cycle-duration) linear infinite;
    }
    @keyframes starsCycle {
      0%, 42%   { opacity: 0; }
      48%       { opacity: 0.6; }
      54%, 70%  { opacity: 1; }
      76%       { opacity: 0.3; }
      82%, 100% { opacity: 0; }
    }

    /* 城市夜間霓虹外觀 (整體透明度由夜間接管) */
    .anim-night-lights {
      animation: nightLightsCycle var(--cycle-duration) linear infinite;
    }
    @keyframes nightLightsCycle {
      0%, 36%   { opacity: 0; }
      42%       { opacity: 0.45; }
      48%, 72%  { opacity: 1; }
      78%       { opacity: 0.35; }
      84%, 100% { opacity: 0; }
    }

    /* 建築日間高光與陽光陰影 */
    .anim-day-facade {
      animation: dayFacadeCycle var(--cycle-duration) linear infinite;
    }
    @keyframes dayFacadeCycle {
      0%, 30%   { opacity: 1; }
      38%       { opacity: 0.7; filter: drop-shadow(0 0 10px rgba(255, 140, 50, 0.4)); }
      46%, 72%  { opacity: 0.2; filter: brightness(0.28) contrast(1.1); }
      78%       { opacity: 0.6; filter: drop-shadow(0 0 8px rgba(255, 180, 100, 0.3)); }
      86%, 100% { opacity: 1; filter: none; }
    }

    /* 東方明珠球體霓虹呼吸與色彩律動 */
    .anim-pearl-led {
      animation: pearlLedPulse 4s ease-in-out infinite alternate;
    }
    @keyframes pearlLedPulse {
      0%   { filter: drop-shadow(0 0 8px #ff1493) drop-shadow(0 0 16px #ff007f); }
      50%  { filter: drop-shadow(0 0 10px #00ffff) drop-shadow(0 0 20px #00bfff); }
      100% { filter: drop-shadow(0 0 12px #9d4edd) drop-shadow(0 0 24px #7b2cbf); }
    }

    /* 上海中心大廈外殼螺旋光帶流動 (Chasing LED bands) */
    .anim-shanghai-spiral {
      stroke-dasharray: 20 80;
      animation: spiralFlow 3s linear infinite;
    }
    @keyframes spiralFlow {
      0%   { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -200; }
    }

    /* 國際會議中心大球地圖旋轉與光芒 */
    .anim-globe-led {
      animation: globeRotateHue 8s linear infinite;
    }
    @keyframes globeRotateHue {
      0%   { filter: hue-rotate(0deg) drop-shadow(0 0 10px rgba(0, 255, 170, 0.8)); }
      50%  { filter: hue-rotate(180deg) drop-shadow(0 0 12px rgba(0, 170, 255, 0.9)); }
      100% { filter: hue-rotate(360deg) drop-shadow(0 0 10px rgba(0, 255, 170, 0.8)); }
    }

    /* 黃浦江江水色彩循環 */
    .anim-river-water {
      animation: riverWaterCycle var(--cycle-duration) linear infinite;
    }
    @keyframes riverWaterCycle {
      0%, 28%   { stop-color: #2b619e; } /* Day rich blue */
      38%       { stop-color: #5c3552; } /* Sunset amber/purple */
      48%, 72%  { stop-color: #071021; } /* Night dark reflective water */
      80%       { stop-color: #2d3c5f; } /* Dawn deep turquoise */
      92%, 100% { stop-color: #2b619e; } /* Day */
    }

    /* 江面水波晃動微動態 */
    .anim-wave-shimmer {
      animation: waveShimmer 3.5s ease-in-out infinite alternate;
    }
    @keyframes waveShimmer {
      0%   { transform: translateY(0px) scaleY(1); opacity: 0.85; }
      100% { transform: translateY(2px) scaleY(1.03); opacity: 1; }
    }

    /* 江面霓虹倒影搖曳 */
    .anim-reflection-glow {
      animation: reflectionCycle var(--cycle-duration) linear infinite;
    }
    @keyframes reflectionCycle {
      0%, 34%   { opacity: 0.25; filter: blur(3px); }
      40%       { opacity: 0.6; filter: blur(4px) drop-shadow(0 0 15px rgba(255, 120, 50, 0.6)); }
      48%, 72%  { opacity: 0.92; filter: blur(3px) drop-shadow(0 0 25px rgba(255, 50, 150, 0.8)); }
      80%       { opacity: 0.4; filter: blur(4px); }
      88%, 100% { opacity: 0.25; filter: blur(3px); }
    }

    /* 船舶航行與微波 */
    .anim-ship-cruise {
      animation: shipCruiseMotion 28s linear infinite;
    }
    @keyframes shipCruiseMotion {
      0%   { transform: translate(-30px, 0); }
      50%  { transform: translate(45px, 2px); }
      100% { transform: translate(-30px, 0); }
    }

    .anim-barge-drift {
      animation: bargeDriftMotion 36s ease-in-out infinite alternate;
    }
    @keyframes bargeDriftMotion {
      0%   { transform: translate(20px, 0); }
      100% { transform: translate(-40px, 1.5px); }
    }

    /* 浮標上下起伏與警示燈閃爍 */
    .anim-buoy-bob {
      animation: buoyBob 2.8s ease-in-out infinite alternate;
      transform-origin: 955px 815px;
    }
    @keyframes buoyBob {
      0%   { transform: translateY(-2px) rotate(-3deg); }
      100% { transform: translateY(2px) rotate(3deg); }
    }

    .anim-beacon-flash {
      animation: beaconFlash 1.2s steps(2, start) infinite;
    }
    @keyframes beaconFlash {
      0%, 65% { opacity: 1; filter: drop-shadow(0 0 6px #ff0000); }
      66%, 100% { opacity: 0.15; filter: none; }
    }

    /* 塔頂航空障礙紅燈閃爍 */
    .anim-antenna-beacon {
      animation: antennaFlash 1.6s ease-in-out infinite;
    }
    @keyframes antennaFlash {
      0%, 100% { opacity: 0.3; }
      50%      { opacity: 1; filter: drop-shadow(0 0 8px #ff2222); }
    }
  </style>
</head>
<body>

  <!-- 頂部資訊標籤 -->
  <div class="hud-header">
    <div class="live-dot"></div>
    <div class="hud-title">SHANGHAI PU DONG SKYLINE</div>
    <div class="time-badge" id="clock-display">12:00 PM</div>
    <div style="font-size:12px; color:var(--text-muted); border-left:1px solid rgba(255,255,255,0.15); padding-left:8px;">
      無限循環 SVG 動畫
    </div>
  </div>

  <!-- 主舞台 SVG 畫布 (1000 x 1000，完美還原 spec_01.png 比例) -->
  <div class="stage-container">
    <svg id="skyline-stage" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 1. 動態天空漸層 -->
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" class="anim-sky-top" stop-color="#1b6cc8" />
          <stop offset="65%" stop-color="#3d8fe0" />
          <stop offset="100%" class="anim-sky-bottom" stop-color="#5bb3f8" />
        </linearGradient>

        <!-- 2. 黃浦江水體動態漸層 -->
        <linearGradient id="riverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" class="anim-river-water" stop-color="#1f4b7a" />
          <stop offset="35%" stop-color="#163960" />
          <stop offset="100%" stop-color="#0b1e38" />
        </linearGradient>

        <!-- 3. 東方明珠球體紅寶石立體漸層 -->
        <radialGradient id="pearlSphereGrad" cx="38%" cy="32%" r="65%">
          <stop offset="0%" stop-color="#ff9ab1" />
          <stop offset="25%" stop-color="#e63964" />
          <stop offset="70%" stop-color="#9a1b3c" />
          <stop offset="100%" stop-color="#4a081a" />
        </radialGradient>

        <!-- 4. 東方明珠球體夜間光雕漸層 -->
        <radialGradient id="pearlNightGlow" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#ff4df0" />
          <stop offset="50%" stop-color="#d9048e" />
          <stop offset="90%" stop-color="#7a0050" />
          <stop offset="100%" stop-color="#240018" />
        </radialGradient>

        <!-- 5. 上海中心大廈螺旋外幕牆漸層 -->
        <linearGradient id="shanghaiTowerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#b0c8dc" />
          <stop offset="30%" stop-color="#ddebf7" />
          <stop offset="65%" stop-color="#8baecc" />
          <stop offset="100%" stop-color="#466885" />
        </linearGradient>

        <!-- 6. SWFC 環球金融中心金屬深藍漸層 -->
        <linearGradient id="swfcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#6a91b8" />
          <stop offset="45%" stop-color="#9fc2e6" />
          <stop offset="80%" stop-color="#476b92" />
          <stop offset="100%" stop-color="#263e59" />
        </linearGradient>

        <!-- 7. 金茂大廈古銅金色寶塔漸層 -->
        <linearGradient id="jinmaoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#b59469" />
          <stop offset="35%" stop-color="#e8cf9f" />
          <stop offset="70%" stop-color="#96774e" />
          <stop offset="100%" stop-color="#5a4224" />
        </linearGradient>

        <!-- 8. 國際會議中心玻璃球體世界地圖漸層 -->
        <radialGradient id="globeGrad" cx="40%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#a4f3e6" />
          <stop offset="35%" stop-color="#38bdf8" />
          <stop offset="75%" stop-color="#0284c7" />
          <stop offset="100%" stop-color="#082f49" />
        </radialGradient>

        <!-- 9. 太陽發光濾鏡 -->
        <filter id="sunGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="16" result="blur1" />
          <feGaussianBlur stdDeviation="35" result="blur2" />
          <feMerge>
            <feMergeNode in="blur2" />
            <feMergeNode in="blur1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- 10. 霓虹外發光濾鏡 -->
        <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="4" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- 11. 水面倒影柔和模糊濾鏡 -->
        <filter id="waterBlur" x="0%" y="0%" width="100%" height="100%">
          <feGaussianBlur stdDeviation="3 0.8" />
        </filter>
      </defs>

      <!-- =======================================================
           LAYER 1: 天空與天體背景 (Sky, Sun, Moon, Stars)
      ======================================================= -->
      <rect id="sky-canvas" width="1000" height="805" fill="url(#skyGrad)" />

      <!-- 繁星群 (夜間顯現) -->
      <g id="starfield" class="anim-stars" fill="#ffffff">
        <circle cx="80" cy="90" r="1.4" opacity="0.9" />
        <circle cx="140" cy="50" r="1" opacity="0.7" />
        <circle cx="210" cy="110" r="1.8" opacity="0.95" />
        <circle cx="270" cy="70" r="1.2" opacity="0.8" />
        <circle cx="340" cy="40" r="1.5" opacity="0.9" />
        <circle cx="410" cy="120" r="1" opacity="0.6" />
        <circle cx="480" cy="80" r="1.7" opacity="0.95" />
        <circle cx="530" cy="50" r="1.3" opacity="0.85" />
        <circle cx="590" cy="110" r="1.2" opacity="0.7" />
        <circle cx="650" cy="75" r="1.9" opacity="0.9" />
        <circle cx="720" cy="45" r="1.1" opacity="0.8" />
        <circle cx="780" cy="130" r="1.6" opacity="0.85" />
        <circle cx="830" cy="90" r="1.3" opacity="0.75" />
        <circle cx="890" cy="60" r="1.8" opacity="0.9" />
        <circle cx="950" cy="110" r="1.2" opacity="0.8" />
        <circle cx="60" cy="160" r="1" opacity="0.7" />
        <circle cx="180" cy="180" r="1.5" opacity="0.85" />
        <circle cx="320" cy="190" r="1.1" opacity="0.6" />
        <circle cx="460" cy="170" r="1.4" opacity="0.8" />
        <circle cx="600" cy="200" r="1" opacity="0.75" />
        <circle cx="750" cy="170" r="1.6" opacity="0.9" />
      </g>

      <!-- 太陽與耀光 (日間運作) -->
      <g class="anim-sun-group">
        <g transform="translate(500, 160)">
          <circle cx="0" cy="0" r="42" fill="#fff9db" filter="url(#sunGlow)" />
          <circle cx="0" cy="0" r="28" fill="#ffffff" />
          <!-- 太陽光芒 -->
          <line x1="-55" y1="0" x2="55" y2="0" stroke="#fff1b8" stroke-width="2.5" opacity="0.6" />
          <line x1="0" y1="-55" x2="0" y2="55" stroke="#fff1b8" stroke-width="2.5" opacity="0.6" />
          <line x1="-38" y1="-38" x2="38" y2="38" stroke="#fff1b8" stroke-width="2" opacity="0.5" />
          <line x1="-38" y1="38" x2="38" y2="-38" stroke="#fff1b8" stroke-width="2" opacity="0.5" />
        </g>

  <!-- =======================================================
       互動控制邏輯 (JavaScript Controller)
  ======================================================= -->
  <script>
    (function() {
      // 核心變數
      let isPlaying = true;
      let durationSec = 32; // 一天完整循環秒數
      let currentTimePercent = 37.5; // 當前進度 (0~100%)
      let lastTimestamp = performance.now();
      let playbackRate = 1.0;

      // DOM 元素
      const clockDisplay = document.getElementById('clock-display');
      const timeSlider = document.getElementById('time-slider');
      const btnPlayPause = document.getElementById('btn-play-pause');
      const playIcon = document.getElementById('play-icon');
      const btnSpeed = document.getElementById('btn-speed');
      const hudDock = document.getElementById('hud-dock');
      const btnToggleDock = document.getElementById('btn-toggle-dock');
      const btnToggleLights = document.getElementById('btn-toggle-lights');
      const btnToggleReflections = document.getElementById('btn-toggle-reflections');
      const quickTimeBtns = document.querySelectorAll('button[data-time]');

      // SVG 動畫圖層
      const nightLights = document.querySelectorAll('.anim-night-lights');
      const reflections = document.getElementById('water-reflections');

      // 更新時鐘文字 (將 0~100% 映射為 00:00 ~ 23:59)
      function updateClock(percent) {
        const totalMinutes = Math.floor((percent / 100) * 1440);
        const hours = Math.floor(totalMinutes / 60) % 24;
        const minutes = totalMinutes % 60;
        const ampm = hours >= 12 ? 'PM' : 'AM';
        const formattedHours = hours % 12 === 0 ? 12 : hours % 12;
        const formattedMinutes = minutes < 10 ? '0' + minutes : minutes;
        
        let phaseLabel = '日間';
        if (percent >= 30 && percent < 46) phaseLabel = '黃昏';
        else if (percent >= 46 && percent < 74) phaseLabel = '深夜';
        else if (percent >= 74 && percent < 90) phaseLabel = '黎明';

        clockDisplay.textContent = `${formattedHours}:${formattedMinutes} ${ampm} (${phaseLabel})`;
      }

      // 同步 SVG 動畫進度
      // 透過設置 negative animation-delay，精準控制所有 CSS keyframe 動畫之時間點
      function syncAnimationTime(percent) {
        const elapsedSec = (percent / 100) * durationSec;
        const animatedElements = document.querySelectorAll(
          '.anim-sky-top, .anim-sky-bottom, .anim-sun-group, .anim-moon-group, ' +
          '.anim-stars, .anim-night-lights, .anim-day-facade, .anim-river-water, ' +
          '.anim-reflection-glow'
        );

        animatedElements.forEach(el => {
          el.style.animationDelay = `-${elapsedSec}s`;
          if (!isPlaying) {
            el.style.animationPlayState = 'paused';
          } else {
            el.style.animationPlayState = 'running';
          }
        });
      }

      // 主動畫迴圈
      function animLoop(now) {
        const delta = (now - lastTimestamp) / 1000;
        lastTimestamp = now;

        if (isPlaying) {
          const increment = (delta / durationSec) * 100 * playbackRate;
          currentTimePercent = (currentTimePercent + increment) % 100;
          timeSlider.value = currentTimePercent;
          updateClock(currentTimePercent);
          syncAnimationTime(currentTimePercent);
        }

        requestAnimationFrame(animLoop);
      }

      // 滑桿事件 (手動拖曳時間)
      timeSlider.addEventListener('input', (e) => {
        currentTimePercent = parseFloat(e.target.value);
        updateClock(currentTimePercent);
        syncAnimationTime(currentTimePercent);
      });

      // 播放 / 暫停切換
      function togglePlayPause() {
        isPlaying = !isPlaying;
        playIcon.textContent = isPlaying ? '⏸' : '▶';
        btnPlayPause.classList.toggle('active', isPlaying);
        syncAnimationTime(currentTimePercent);
      }
      btnPlayPause.addEventListener('click', togglePlayPause);

      // 速度切換 (1x -> 2x -> 4x -> 0.5x)
      const speeds = [1.0, 2.0, 4.0, 0.5];
      let speedIdx = 0;
      btnSpeed.addEventListener('click', () => {
        speedIdx = (speedIdx + 1) % speeds.length;
        playbackRate = speeds[speedIdx];
        btnSpeed.textContent = `${playbackRate}x`;
      });

      // 快速時段按鈕
      quickTimeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const targetTime = parseFloat(btn.getAttribute('data-time'));
          currentTimePercent = targetTime;
          timeSlider.value = targetTime;
          updateClock(targetTime);
          syncAnimationTime(targetTime);
        });
      });

      // 特效開關
      let lightsEnabled = true;
      btnToggleLights.addEventListener('click', () => {
        lightsEnabled = !lightsEnabled;
        btnToggleLights.classList.toggle('active', lightsEnabled);
        nightLights.forEach(el => {
          el.style.display = lightsEnabled ? '' : 'none';
        });
      });

      let reflectionsEnabled = true;
      btnToggleReflections.addEventListener('click', () => {
        reflectionsEnabled = !reflectionsEnabled;
        btnToggleReflections.classList.toggle('active', reflectionsEnabled);
        if (reflections) {
          reflections.style.display = reflectionsEnabled ? '' : 'none';
        }
      });

      // 收合 HUD Dock
      btnToggleDock.addEventListener('click', () => {
        hudDock.classList.toggle('minimized');
      });

      // 鍵盤快捷鍵 (Space: 暫停/播放, ArrowLeft/Right: 微調時間)
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          togglePlayPause();
        } else if (e.code === 'ArrowRight') {
          currentTimePercent = (currentTimePercent + 2) % 100;
          timeSlider.value = currentTimePercent;
          updateClock(currentTimePercent);
          syncAnimationTime(currentTimePercent);
        } else if (e.code === 'ArrowLeft') {
          currentTimePercent = (currentTimePercent - 2 + 100) % 100;
          timeSlider.value = currentTimePercent;
          updateClock(currentTimePercent);
          syncAnimationTime(currentTimePercent);
        }
      });

      // 初始化啟動
      updateClock(currentTimePercent);
      syncAnimationTime(currentTimePercent);
      requestAnimationFrame(animLoop);
    })();
  </script>
</body>
</html>
