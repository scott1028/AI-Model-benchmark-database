<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="spec_01 — 上海外灘望陸家嘴天際線,SVG 手繪日夜無限循環動畫">
<title>preview spec_01 — 上海外灘 · 陸家嘴日夜循環</title>
<!--
  spec        : .spec/spec_01.md (reference image: .spec/spec_01.png)
  scene       : Shanghai Bund → Lujiazui skyline (Oriental Pearl, Aurora, Convention Center domes,
                SWFC "bottle opener", Jin Mao, Shanghai Tower), Huangpu river, barge, buoy.
  rebuilt from: the reference image only (no existing implementation code referenced).
  model       : glm-5.3-flash
  time cost   : ~5 minutes
  created at  : 2026-11-07 12:56 (UTC+8, approx)
  animation   : pure CSS keyframes, infinite loop, one full day = var(--cycle) = 36s
-->
<style>
  :root { --cycle: 36s; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(120% 120% at 50% 0%, #131b2e 0%, #0b0f1a 60%, #070a12 100%);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }

  .stage {
    position: relative;
    width: min(94vw, calc(92vh * 1000 / 990));
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .06);
  }

  svg.scene { display: block; width: 100%; height: auto; }

  /* ---------- day / night cycle (all keyed to --cycle, infinite) ---------- */

  /* --lead: negative animation-delay, lets ?t=SECONDS deep-link into any phase */
  .sun   { animation: sunPos var(--cycle) linear var(--lead, 0s) infinite; }
  .moon  { animation: moonPos var(--cycle) linear var(--lead, 0s) infinite, moonVis var(--cycle) linear var(--lead, 0s) infinite; }
  .gladeSun  { animation: gladeSunX var(--cycle) linear var(--lead, 0s) infinite, gladeSunOp var(--cycle) linear var(--lead, 0s) infinite; }
  .gladeMoon { animation: gladeMoonX var(--cycle) linear var(--lead, 0s) infinite, gladeMoonOp var(--cycle) linear var(--lead, 0s) infinite; }

  .dusk    { animation: duskOp var(--cycle) linear var(--lead, 0s) infinite; }
  .night   { animation: nightOp var(--cycle) linear var(--lead, 0s) infinite; }
  .starsG  { animation: starsOp var(--cycle) linear var(--lead, 0s) infinite; }
  .duskW   { animation: duskWaterOp var(--cycle) linear var(--lead, 0s) infinite; }

  .city  { animation: cityCycle var(--cycle) linear var(--lead, 0s) infinite; }
  .water { animation: waterCycle var(--cycle) linear var(--lead, 0s) infinite; }
  .lights{ animation: lightsOp var(--cycle) linear var(--lead, 0s) infinite; }

  @keyframes sunPos {
    0%   { transform: translate(60px, 810px); }
    5%   { transform: translate(148px, 597px); }
    10%  { transform: translate(236px, 404px); }
    15%  { transform: translate(324px, 252px); }
    20%  { transform: translate(412px, 154px); }
    25%  { transform: translate(500px, 120px); }
    30%  { transform: translate(588px, 154px); }
    35%  { transform: translate(676px, 252px); }
    40%  { transform: translate(764px, 404px); }
    45%  { transform: translate(852px, 597px); }
    50%  { transform: translate(940px, 810px); }
    54%, 100% { transform: translate(940px, 975px); }
  }
  @keyframes moonPos {
    0%, 49% { transform: translate(940px, 975px); }
    50%  { transform: translate(60px, 810px); }
    55%  { transform: translate(148px, 597px); }
    60%  { transform: translate(236px, 404px); }
    65%  { transform: translate(324px, 252px); }
    70%  { transform: translate(412px, 154px); }
    75%  { transform: translate(500px, 120px); }
    80%  { transform: translate(588px, 154px); }
    85%  { transform: translate(676px, 252px); }
    90%  { transform: translate(764px, 404px); }
    95%  { transform: translate(852px, 597px); }
    100% { transform: translate(940px, 810px); }
  }
  @keyframes moonVis {
    0%, 49% { opacity: 0; }
    51%, 98% { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes gladeSunX {
    0%  { transform: translateX(60px); }
    5%  { transform: translateX(148px); }
    10% { transform: translateX(236px); }
    15% { transform: translateX(324px); }
    20% { transform: translateX(412px); }
    25% { transform: translateX(500px); }
    30% { transform: translateX(588px); }
    35% { transform: translateX(676px); }
    40% { transform: translateX(764px); }
    45% { transform: translateX(852px); }
    50%, 100% { transform: translateX(940px); }
  }
  @keyframes gladeMoonX {
    0%, 49% { transform: translateX(940px); }
    50%  { transform: translateX(60px); }
    55%  { transform: translateX(148px); }
    60%  { transform: translateX(236px); }
    65%  { transform: translateX(324px); }
    70%  { transform: translateX(412px); }
    75%  { transform: translateX(500px); }
    80%  { transform: translateX(588px); }
    85%  { transform: translateX(676px); }
    90%  { transform: translateX(764px); }
    95%  { transform: translateX(852px); }
    100% { transform: translateX(940px); }
  }
  @keyframes gladeSunOp {
    0% { opacity: .5; } 8% { opacity: .25; } 40% { opacity: .3; }
    47% { opacity: .5; } 51%, 98% { opacity: 0; } 100% { opacity: .5; }
  }
  @keyframes gladeMoonOp {
    0%, 49% { opacity: 0; } 56% { opacity: .3; } 62%, 92% { opacity: .45; }
    99% { opacity: .1; } 100% { opacity: 0; }
  }
  @keyframes duskOp {
    0% { opacity: .8; } 7% { opacity: .2; } 11%, 42% { opacity: 0; }
    47% { opacity: .55; } 50% { opacity: .9; } 55% { opacity: .4; }
    60% { opacity: .08; } 64%, 90% { opacity: 0; } 95% { opacity: .4; } 100% { opacity: .8; }
  }
  @keyframes nightOp {
    0% { opacity: .15; } 9%, 44% { opacity: 0; } 52% { opacity: .7; }
    60%, 92% { opacity: 1; } 97% { opacity: .35; } 100% { opacity: .15; }
  }
  @keyframes starsOp {
    0% { opacity: 0; } 46% { opacity: 0; } 54% { opacity: .9; }
    58%, 92% { opacity: 1; } 98% { opacity: .15; } 100% { opacity: 0; }
  }
  @keyframes duskWaterOp {
    0% { opacity: .22; } 7% { opacity: .06; } 11%, 42% { opacity: 0; }
    48% { opacity: .2; } 51% { opacity: .26; } 56% { opacity: .1; }
    60%, 90% { opacity: 0; } 95% { opacity: .12; } 100% { opacity: .22; }
  }
  @keyframes cityCycle {
    0%  { filter: brightness(.72) saturate(.9); }
    10%, 42% { filter: brightness(1) saturate(1); }
    50% { filter: brightness(.62) saturate(.85); }
    58%, 90% { filter: brightness(.3) saturate(.55); }
    96% { filter: brightness(.55) saturate(.75); }
    100% { filter: brightness(.72) saturate(.9); }
  }
  @keyframes waterCycle {
    0%  { filter: brightness(.6); }
    10%, 40% { filter: brightness(1); }
    52% { filter: brightness(.5); }
    60%, 90% { filter: brightness(.34); }
    96% { filter: brightness(.5); }
    100% { filter: brightness(.6); }
  }
  @keyframes lightsOp {
    0% { opacity: .55; } 8%, 45% { opacity: 0; } 55% { opacity: .9; }
    60%, 92% { opacity: 1; } 97% { opacity: .55; } 100% { opacity: .55; }
  }

  /* ---------- ambient micro-animations (fixed duration, also infinite) ---------- */

  .star {
    animation: twinkle var(--d, 3s) ease-in-out infinite alternate;
    animation-delay: var(--dl, 0s);
  }
  @keyframes twinkle { from { opacity: .15; } to { opacity: 1; } }

  .ripple { animation: drift var(--wd, 40s) linear infinite; }
  @keyframes drift { to { transform: translateX(-120px); } }  /* one full wave period = seamless */

  .bob  { transform-box: fill-box; transform-origin: 50% 100%; animation: bob 5.2s ease-in-out infinite; }
  .bobS { transform-box: fill-box; transform-origin: 50% 100%; animation: bobS 4.1s ease-in-out infinite; }
  @keyframes bob  { 0%, 100% { transform: translateY(0) rotate(-.5deg); }  50% { transform: translateY(3px) rotate(.6deg); } }
  @keyframes bobS { 0%, 100% { transform: translateY(1px) rotate(.4deg); } 50% { transform: translateY(-2px) rotate(-.5deg); } }

  .beacon { animation: blink 2.4s ease-in-out infinite; }
  @keyframes blink { 0%, 100% { opacity: .12; } 50% { opacity: 1; } }

  .paused * { animation-play-state: paused !important; }

  /* ---------- HUD ---------- */

  .hud {
    position: absolute;
    left: 12px; right: 12px; bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    color: #eaf2fa;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .6);
    pointer-events: none;
  }
  .hud .title { font-size: 13px; letter-spacing: .04em; }
  .hud .title small { display: block; font-size: 10.5px; opacity: .75; font-weight: 400; }
  .ctrl {
    display: flex; gap: 6px; pointer-events: auto;
    background: rgba(10, 16, 28, .55);
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 999px;
    padding: 5px 8px;
    backdrop-filter: blur(6px);
  }
  .ctrl button {
    all: unset;
    cursor: pointer;
    color: #dfe9f5;
    font: 600 11.5px/1 system-ui, sans-serif;
    padding: 5px 10px;
    border-radius: 999px;
    transition: background .15s, color .15s;
  }
  .ctrl button:hover { background: rgba(255, 255, 255, .14); }
  .ctrl button.on { background: #eaf2fa; color: #12203a; }
</style>

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var scene = document.getElementById('scene');

  /* ?t=SECONDS — jump straight to that moment of the day (e.g. ?t=9 noon, ?t=27 midnight) */
  var t = parseFloat(new URLSearchParams(location.search).get('t'));
  if (!isNaN(t)) { document.documentElement.style.setProperty('--lead', (-t) + 's'); }

  /* deterministic PRNG so every load looks identical */
  var seed = 20261107;
  function rnd() {
    seed = (seed * 1103515245 + 12345) % 2147483648;
    return seed / 2147483648;
  }
  function el(name, attrs, parent) {
    var n = document.createElementNS(NS, name);
    for (var k in attrs) { n.setAttribute(k, attrs[k]); }
    parent.appendChild(n);
    return n;
  }

  /* ---- stars ---- */
  var stars = document.getElementById('stars');
  for (var i = 0; i < 110; i++) {
    var r = .5 + rnd() * 1.4;
    var c = el('circle', {
      cx: (rnd() * 1000).toFixed(1),
      cy: (rnd() * 640).toFixed(1),
      r: r.toFixed(2),
      fill: rnd() < .12 ? '#cfe0ff' : '#ffffff',
      'class': 'star'
    }, stars);
    c.style.setProperty('--d', (2.2 + rnd() * 4).toFixed(2) + 's');
    c.style.setProperty('--dl', (-rnd() * 6).toFixed(2) + 's');
  }

  /* ---- far hazy skyline ---- */
  var far = document.getElementById('farSky');
  for (var x = -10; x < 1010;) {
    var w = 16 + rnd() * 30;
    var h = 40 + rnd() * 115;
    el('rect', { x: x.toFixed(1), y: (802 - h).toFixed(1), width: w.toFixed(1),
                 height: h.toFixed(1), fill: '#b3c3cf' }, far);
    if (rnd() < .18) {
      el('rect', { x: (x + w / 2).toFixed(1), y: (802 - h - 16).toFixed(1),
                   width: 1.4, height: 16, fill: '#b3c3cf' }, far);
    }
    x += w * (.75 + rnd() * .5);
  }

  /* ---- tree line: green with an autumn-red strip (as in the photo) ---- */
  var trees = document.getElementById('trees');
  var greens = ['#3a7d4f', '#2f6b44', '#4f9163', '#35734a'];
  var reds   = ['#c65b3a', '#d97a4a', '#b34a33', '#e09a5a', '#c2502e'];
  function treeColor(x) {
    var pool = (x > 620 && x < 940) ? (rnd() < .8 ? reds : greens)
                                    : (rnd() < .88 ? greens : reds);
    return pool[Math.floor(rnd() * pool.length)];
  }
  for (var tx = 4; tx < 1000; tx += 11 + rnd() * 9) {
    el('circle', { cx: tx.toFixed(1), cy: (790 + rnd() * 6).toFixed(1),
                   r: (11 + rnd() * 7).toFixed(1), fill: treeColor(tx) }, trees);
  }
  for (var tx2 = 8; tx2 < 1000; tx2 += 12 + rnd() * 12) {
    el('circle', { cx: tx2.toFixed(1), cy: (804 + rnd() * 4).toFixed(1),
                   r: (9 + rnd() * 6).toFixed(1), fill: treeColor(tx2) }, trees);
  }

  /* ---- night windows (grid generator: x, y, w, h, cols, rows, color, density) ---- */
  var winSrc = document.getElementById('win-src');
  function grid(x0, y0, w, h, cols, rows, color, density) {
    var stepX = w / cols, stepY = h / rows;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        if (rnd() > density) { continue; }
        el('rect', {
          x: (x0 + c * stepX + stepX * .22).toFixed(1),
          y: (y0 + r * stepY + stepY * .25).toFixed(1),
          width: (stepX * .52).toFixed(1),
          height: (stepY * .45).toFixed(1),
          fill: color
        }, winSrc);
      }
    }
  }
  grid(2,   470, 62, 300, 3, 16, '#ffd27a', .3);    // left block
  grid(190, 566, 52, 220, 3, 12, '#ffd27a', .32);   // red-sign building
  grid(268, 512, 110, 276, 6, 14, '#cfe4ff', .3);   // Aurora (cool white-blue)
  grid(640, 452, 118, 330, 8, 12, '#ffd27a', .16);  // SWFC body
  grid(702, 506, 64, 280, 5, 10, '#ffd27a', .2);    // Jin Mao body
  grid(768, 516, 42, 270, 3, 10, '#cfe4ff', .2);    // curved-top tower
  grid(816, 620, 38, 170, 3, 7, '#ffd27a', .25);    // green slab
  grid(866, 210, 62, 560, 4, 20, '#cfe4ff', .12);   // Shanghai Tower
  grid(948, 578, 46, 212, 3, 9, '#ffd27a', .3);     // right green tower
  grid(736, 740, 200, 52, 14, 2, '#ffd27a', .4);    // long white building
  /* Convention Center: warm light inside each arch + door */
  for (var a = 0; a < 10; a++) {
    el('rect', { x: 377 + a * 24, y: 740, width: 14, height: 44,
                 fill: '#ffd27a', opacity: .85 }, winSrc);
  }
  el('rect', { x: 486, y: 766, width: 20, height: 26, fill: '#ffd27a', opacity: .8 }, winSrc);
  /* Oriental Pearl large sphere window band */
  for (var p = 0; p < 6; p++) {
    el('rect', { x: 104 + p * 16, y: 455, width: 9, height: 9,
                 fill: '#ffd27a', opacity: .9 }, winSrc);
  }

  /* ---- water ripples (period 60px, drift -120px = seamless loop) ---- */
  var ripples = document.getElementById('ripples');
  function ripple(y, amp, op, color, wd) {
    var d = 'M-140,' + y;
    for (var px = -140; px < 1140; px += 60) {
      d += ' q 30,' + (-amp) + ' 60,0';
    }
    var path = el('path', {
      d: d, fill: 'none', stroke: color, 'stroke-width': 1.6,
      'stroke-opacity': op, 'class': 'ripple'
    }, ripples);
    path.style.setProperty('--wd', wd.toFixed(1) + 's');
  }
  ripple(852, 3, .16, '#ffffff', 44);
  ripple(872, 4, .12, '#ffffff', 58);
  ripple(894, 3, .14, '#0a2a4a', 38);
  ripple(918, 5, .12, '#ffffff', 66);
  ripple(942, 4, .12, '#0a2a4a', 50);
  ripple(964, 5, .1,  '#ffffff', 74);

  /* sparkles on water */
  var sparks = document.getElementById('sparks');
  for (var s = 0; s < 16; s++) {
    var sc = el('circle', {
      cx: (rnd() * 1000).toFixed(1),
      cy: (845 + rnd() * 130).toFixed(1),
      r: (.8 + rnd() * .9).toFixed(2),
      fill: '#eaf6ff', 'class': 'star'
    }, sparks);
    sc.style.setProperty('--d', (1.8 + rnd() * 3).toFixed(2) + 's');
    sc.style.setProperty('--dl', (-rnd() * 5).toFixed(2) + 's');
  }

  /* ---- HUD: play / pause + speed ---- */
  var btnPlay = document.getElementById('btnPlay');
  btnPlay.addEventListener('click', function () {
    var paused = scene.classList.toggle('paused');
    btnPlay.textContent = paused ? '▶' : '⏸';
  });
  var speeds = document.querySelectorAll('.ctrl button[data-speed]');
  speeds.forEach(function (b) {
    b.addEventListener('click', function () {
      document.documentElement.style.setProperty('--cycle', b.dataset.speed + 's');
      speeds.forEach(function (o) { o.classList.remove('on'); });
      b.classList.add('on');
    });
  });
})();
</script>
</body>
</html>
