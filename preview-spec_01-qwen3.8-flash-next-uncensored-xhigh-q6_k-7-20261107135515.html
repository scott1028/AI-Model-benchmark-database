<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>spec_01 — Shanghai Lujiazui · Day/Night SVG Loop</title>
<!--
  preview: spec_01 — day/night animated SVG stage
  Scene: Shanghai Lujiazui skyline from the Huangpu river
  (Oriental Pearl Tower, twin glass domes, Jin Mao, SWFC "bottle-opener", Shanghai Tower)
  Animation: infinite day/night cycle (~60s) — sunrise, day, sunset, stars, moon,
  city lights, lit-sphere glow, water reflections, moving barge.
-->
<style>
  :root { --cycle: 60s; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(circle at 50% 40%, #1c2333 0%, #0b0e16 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; font-family: system-ui, sans-serif;
  }
  .stage {
    width: min(92vmin, 860px); aspect-ratio: 1 / 1;
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 18px 60px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.07);
  }
  svg { display: block; width: 100%; height: 100%; }
  .cap { color: #7d8698; font-size: 12px; letter-spacing: .4px; }

  /* ---------- cycle master keyframes (all share --cycle, so they stay in sync) ---------- */
  .a-day   { animation: day   var(--cycle) linear infinite; }
  .a-dawn  { animation: dawn  var(--cycle) linear infinite; }
  .a-dusk  { animation: dusk  var(--cycle) linear infinite; }
  .a-night { animation: night var(--cycle) linear infinite; }
  .a-stars { animation: stars var(--cycle) linear infinite; }
  .a-veil  { animation: veil  var(--cycle) linear infinite; }
  .a-lights{ animation: lights var(--cycle) linear infinite; }
  .a-birds { animation: birds var(--cycle) linear infinite; }
  .a-glowl { animation: glowl var(--cycle) linear infinite; }
  .a-glows { animation: glows var(--cycle) linear infinite; }
  .a-glowm { animation: glowm var(--cycle) linear infinite; }

  @keyframes day   { 0%,5%{opacity:0} 20%{opacity:1} 54%{opacity:1} 64%{opacity:0} 100%{opacity:0} }
  @keyframes dawn  { 0%{opacity:.75} 9%{opacity:1} 14%{opacity:1} 22%{opacity:0} 95%{opacity:0} 100%{opacity:.75} }
  @keyframes dusk  { 0%{opacity:0} 55%{opacity:0} 64%{opacity:1} 68%{opacity:1} 75%{opacity:0} 100%{opacity:0} }
  @keyframes night { 0%{opacity:1} 4%{opacity:1} 14%{opacity:0} 71%{opacity:0} 80%{opacity:1} 100%{opacity:1} }
  @keyframes stars { 0%{opacity:1} 5%{opacity:1} 13%{opacity:0} 73%{opacity:0} 81%{opacity:1} 100%{opacity:1} }
  @keyframes veil  { 0%{opacity:.62} 5%{opacity:.62} 15%{opacity:0} 55%{opacity:0} 65%{opacity:.15} 72%{opacity:.38} 80%{opacity:.62} 100%{opacity:.62} }
  @keyframes lights{ 0%{opacity:1} 8%{opacity:1} 17%{opacity:0} 57%{opacity:0} 66%{opacity:.45} 74%{opacity:1} 100%{opacity:1} }
  @keyframes birds { 0%{opacity:0} 20%{opacity:0} 24%{opacity:1} 52%{opacity:1} 58%{opacity:0} 100%{opacity:0} }
  /* sun glint on water: sunrise (left) and sunset (right) */
  @keyframes glowl { 0%{opacity:.5} 8%{opacity:1} 15%{opacity:.9} 22%{opacity:0} 96%{opacity:0} 100%{opacity:.5} }
  @keyframes glows { 0%{opacity:0} 55%{opacity:0} 60%{opacity:1} 66%{opacity:1} 72%{opacity:0} 100%{opacity:0} }
  /* moon glint: moon is up ~63%..18% */
  @keyframes glowm { 0%{opacity:.9} 14%{opacity:.9} 21%{opacity:0} 68%{opacity:0} 80%{opacity:1} 100%{opacity:.9} }

  /* ---------- sun / moon travel explicit arcs; parked below the waterline when not visible ---------- */
  #sun-orbit  { animation: sunpath  var(--cycle) linear infinite; }
  #moon-orbit { animation: moonpath var(--cycle) linear infinite; }
  #sun  { animation: sunvis  var(--cycle) linear infinite; }
  #moon { animation: moonvis var(--cycle) linear infinite; }
  @keyframes sunpath {
    0%,10%{transform:translate(70px,640px)}   15.6%{transform:translate(128px,464px)}
    21.2%{transform:translate(186px,326px)}   26.8%{transform:translate(244px,231px)}
    32.4%{transform:translate(302px,169px)}   38%{transform:translate(360px,150px)}
    43.6%{transform:translate(418px,169px)}   49.2%{transform:translate(476px,231px)}
    54.8%{transform:translate(534px,326px)}   60.4%{transform:translate(592px,464px)}
    66%,100%{transform:translate(650px,640px)}
  }
  @keyframes sunvis { 0%{opacity:0} 7%{opacity:0} 11%{opacity:1} 63%{opacity:1} 67%{opacity:0} 100%{opacity:0} }
  @keyframes moonpath {
    0%{transform:translate(490px,240px)}   5%{transform:translate(560px,380px)}
    11%{transform:translate(615px,530px)}  16%,19%{transform:translate(640px,660px)}
    22%,60%{transform:translate(120px,760px)}
    65%{transform:translate(140px,640px)}  72%{transform:translate(205px,390px)}
    80%{transform:translate(285px,215px)}  90%{transform:translate(380px,135px)}
    97%{transform:translate(445px,175px)}  100%{transform:translate(490px,240px)}
  }
  @keyframes moonvis { 0%{opacity:1} 15%{opacity:1} 19%{opacity:0} 60%{opacity:0} 65%{opacity:1} 100%{opacity:1} }
  #sun-core { animation: suncolor var(--cycle) linear infinite; }
  @keyframes suncolor {
    10%{fill:#ff8a3d} 18%{fill:#ffdf6e} 26%{fill:#fff7d4} 50%{fill:#fff7d4}
    58%{fill:#ffcf5e} 66%{fill:#ff6e33} 100%{fill:#ff8a3d}
  }

  /* ---------- small continuous animations (independent of the cycle) ---------- */
  .twk { animation: twk 2.6s ease-in-out infinite alternate; }
  .twk.d1 { animation-delay: .7s; } .twk.d2 { animation-delay: 1.3s; } .twk.d3 { animation-delay: 2s; }
  @keyframes twk { from{opacity:.45} to{opacity:1} }

  .rip { animation: rip 7s ease-in-out infinite alternate; }
  .rip.r2 { animation-duration: 9s; } .rip.r3 { animation-duration: 5.5s; }
  @keyframes rip { from{transform:translateX(-8px)} to{transform:translateX(8px)} }

  .cloud { animation: drift linear infinite, cloudfade var(--cycle) linear infinite; }
  .cloud.c1 { animation-duration: 170s, var(--cycle); }
  .cloud.c2 { animation-duration: 230s, var(--cycle); animation-delay: -60s, 0s; }
  .cloud.c3 { animation-duration: 290s, var(--cycle); animation-delay: -140s, 0s; }
  @keyframes drift { from{transform:translateX(-170px)} to{transform:translateX(860px)} }
  @keyframes cloudfade { 0%{opacity:.5} 15%{opacity:.85} 55%{opacity:.85} 70%{opacity:.5} 82%{opacity:.3} 100%{opacity:.5} }

  .birds-fly { animation: fly 80s linear infinite; }
  @keyframes fly { from{transform:translate(-80px,0)} to{transform:translate(780px,-40px)} }

  .barge { animation: sailby 140s linear infinite; animation-delay: -30s; }  /* in view at page load */
  @keyframes sailby { from{transform:translateX(260px)} to{transform:translateX(-760px)} }
  .bob  { animation: bob 4.2s ease-in-out infinite alternate; }
  .bob2 { animation: bob 3.4s ease-in-out infinite alternate-reverse; }
  @keyframes bob { from{transform:translateY(-1.4px)} to{transform:translateY(1.4px)} }

  .beacon { animation: beacon 1.8s step-end infinite; }
  @keyframes beacon { 0%,49%{opacity:1} 50%,100%{opacity:.08} }

  .flow { stroke-dasharray: 4 10; animation: dash 3s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -56; } }

  .wob { animation: wob 3.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center top; }
  @keyframes wob { from{transform:scaleX(.8)} to{transform:scaleX(1.25)} }

  .grain { mix-blend-mode: overlay; }
  .night-veil { mix-blend-mode: multiply; }
</style>
</head>
