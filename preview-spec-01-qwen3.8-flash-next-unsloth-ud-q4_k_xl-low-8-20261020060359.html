<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>preview-01 · Shanghai Lujiazui · Day/Night SVG Loop</title>
<style>
  :root { --cycle: 24s; }
  html, body { margin:0; height:100%; background:#000; display:grid; place-items:center; overflow:hidden; }
  svg { width:min(100vmin,1000px); height:auto; display:block; box-shadow:0 0 60px rgba(0,0,0,.7); }

  /* ============ day/night master timeline (24s loop) ============
     0%  deep night · 9% end night · 16% dawn · 24%-56% day ·
     64% dusk · 73% night begins · 100% deep night (seamless)   */

  .sk1,.sk2,.sk3,.sk4,.sk5,.wt1,.wt2,.wt3,.wt4,
  .sun,.sun-halo,.moon,#stars,.cloud,.tint,#nightLayer,.cityglow {
    animation-duration: var(--cycle);
    animation-iteration-count: infinite;
    animation-timing-function: linear;
  }
  .sk1 { animation-name: sk1; } .sk2 { animation-name: sk2; }
  .sk3 { animation-name: sk3; } .sk4 { animation-name: sk4; }
  .sk5 { animation-name: sk5; }
  .wt1 { animation-name: wt1; } .wt2 { animation-name: wt2; }
  .wt3 { animation-name: wt3; } .wt4 { animation-name: wt4; }

  @keyframes sk1 { 0%,9%{stop-color:#0b1533} 16%{stop-color:#152650} 24%,56%{stop-color:#1d5ac2} 64%{stop-color:#20266a} 73%,100%{stop-color:#0b1533} }
  @keyframes sk2 { 0%,9%{stop-color:#101d44} 16%{stop-color:#3e417e} 24%,56%{stop-color:#2f6fd2} 64%{stop-color:#66407e} 73%,100%{stop-color:#101d44} }
  @keyframes sk3 { 0%,9%{stop-color:#16295a} 16%{stop-color:#8f5b83} 24%,56%{stop-color:#5c93dd} 64%{stop-color:#cc5d62} 73%,100%{stop-color:#16295a} }
  @keyframes sk4 { 0%,9%{stop-color:#1e3c6e} 16%{stop-color:#db8169} 24%,56%{stop-color:#92bde9} 64%{stop-color:#f28c4f} 73%,100%{stop-color:#1e3c6e} }
  @keyframes sk5 { 0%,9%{stop-color:#2c5078} 16%{stop-color:#f7bc8b} 24%,56%{stop-color:#c9dff4} 64%{stop-color:#ffc87b} 73%,100%{stop-color:#2c5078} }

  @keyframes wt1 { 0%,9%{stop-color:#123055} 16%{stop-color:#7a5a66} 24%,56%{stop-color:#5aa0dc} 64%{stop-color:#c97e5e} 73%,100%{stop-color:#123055} }
  @keyframes wt2 { 0%,9%{stop-color:#0f2748} 16%{stop-color:#6a4f60} 24%,56%{stop-color:#4a8ecf} 64%{stop-color:#b06a58} 73%,100%{stop-color:#0f2748} }
  @keyframes wt3 { 0%,9%{stop-color:#0c1e3a} 16%{stop-color:#50404f} 24%,56%{stop-color:#3c7cbb} 64%{stop-color:#8a5450} 73%,100%{stop-color:#0c1e3a} }
  @keyframes wt4 { 0%,9%{stop-color:#081527} 16%{stop-color:#33293e} 24%,56%{stop-color:#2f6cb0} 64%{stop-color:#603a48} 73%,100%{stop-color:#081527} }

  /* sun arc: rises right, peaks center, sets left */
  .sun { animation-name: sunMove; }
  @keyframes sunMove {
    0%,8% { transform: translate(880px,610px); opacity:0; }
    11%   { opacity:1; }
    20%   { transform: translate(770px,330px); }
    30%   { transform: translate(640px,150px); }
    40%   { transform: translate(520px,100px); }
    50%   { transform: translate(400px,160px); }
    58%   { transform: translate(280px,330px); }
    64%   { opacity:1; }
    67%,100% { transform: translate(140px,610px); opacity:0; }
  }
  .sun-halo { animation-name: sunHalo; }
  @keyframes sunHalo {
    0%,8%  { opacity:0; fill:#ff8a40; }
    11%    { opacity:.9; fill:#ff8a40; }
    20%    { fill:#ffb060; }
    26%,52%{ opacity:.45; fill:#ffd880; }
    58%    { fill:#ff9a50; }
    62%    { opacity:.95; fill:#ff7a3a; }
    67%,100% { opacity:0; fill:#ff7a3a; }
  }

  /* moon: setting in pre-dawn, new moon rises after dusk, seamless at 100%=0% */
  .moon { animation-name: moonMove; }
  @keyframes moonMove {
    0%  { transform: translate(430px,110px); opacity:1; }
    6%  { transform: translate(300px,340px); opacity:1; }
    11% { transform: translate(160px,600px); opacity:0; }
    67% { transform: translate(900px,620px); opacity:0; }
    76% { transform: translate(810px,380px); opacity:1; }
    86% { transform: translate(600px,130px); opacity:1; }
    94% { transform: translate(510px,105px); opacity:1; }
    100%{ transform: translate(430px,110px); opacity:1; }
  }

  #stars { animation-name: starsFade; }
  @keyframes starsFade { 0%,9%{opacity:1} 17%{opacity:0} 60%{opacity:0} 71%{opacity:1} 100%{opacity:1} }
  .star { animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:.25} 50%{opacity:1} }

  .cloud { animation-name: cloudFade; }
  @keyframes cloudFade { 0%,9%{opacity:.12} 16%{opacity:.5} 24%,56%{opacity:.95} 64%{opacity:.6} 73%,100%{opacity:.12} }
  .drift1 { animation: cloudFade var(--cycle) linear infinite, drift 140s linear infinite; }
  .drift2 { animation: cloudFade var(--cycle) linear infinite, drift 105s linear infinite; }
  .drift3 { animation: cloudFade var(--cycle) linear infinite, drift 175s linear infinite; }
  @keyframes drift { 0%{transform:translateX(-260px)} 100%{transform:translateX(1150px)} }

  .tint { mix-blend-mode: multiply; animation-name: tintFill, tintOp; }
  @keyframes tintFill { 0%,9%{fill:#0f1c44} 16%{fill:#ff9a66} 24%,56%{fill:#ff8a5c} 64%{fill:#ff7040} 73%,100%{fill:#0f1c44} }
  @keyframes tintOp  { 0%{opacity:.30} 9%{opacity:.28} 16%{opacity:.20} 24%,56%{opacity:0} 64%{opacity:.24} 73%,100%{opacity:.30} }

  #nightLayer { animation-name: lightsFade; }
  .night-only { animation: lightsFade var(--cycle) linear infinite; }
  @keyframes lightsFade { 0%,9%{opacity:1} 15%{opacity:0} 60%{opacity:0} 68%{opacity:1} 100%{opacity:1} }

  .cityglow { animation-name: cityglowFade; }
  @keyframes cityglowFade { 0%,9%{opacity:.6} 15%{opacity:0} 60%{opacity:0} 67%{opacity:.6} 100%{opacity:.6} }

  .beacon { animation: blink 1.2s steps(2,start) infinite; }
  .winLit { animation: twinkleWin 4s ease-in-out infinite; }
  @keyframes twinkleWin { 0%,100%{opacity:.95} 50%{opacity:.5} }
  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:.12} }

  .shim { animation: shim 4.5s ease-in-out infinite alternate; }
  @keyframes shim { 0%{opacity:.10; transform:translateX(-8px)} 100%{opacity:.30; transform:translateX(8px)} }
  .shimSlow { animation: shim 9s ease-in-out infinite alternate; }

  .sail { animation: sail 85s linear infinite; }
  @keyframes sail { 0%{transform:translateX(0)} 100%{transform:translateX(-360px)} }
  .bob { animation: bob 3.4s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(2.5px)} }
</style>
</head>

      <g clip-path="url(#clipDomeR)" stroke="#d8f0e8" stroke-width=".9" fill="none" opacity=".6">

    <!-- low white building right -->

    <!-- night light layer (fades in at dusk) -->
    <g id="nightLayer">
      <g id="winLitG"></g>
      <circle cx="158" cy="142" r="58" fill="url(#gSphereGlow)"/>
      <circle cx="158" cy="444" r="55" fill="url(#gSphereGlow)"/>

    </g>
    <circle class="beacon" cx="158" cy="6" r="3" fill="#ff4040"/>
    <circle class="beacon" cx="927" cy="30" r="2.5" fill="#ff5050" style="animation-delay:.5s"/>
    <circle class="beacon" cx="672" cy="288" r="2" fill="#ff5050" style="animation-delay:.8s"/>

    <!-- promenade + trees + lamps -->
    <g id="shore">
      <rect x="0" y="596" width="1000" height="11" fill="#cfc6b4"/>
      <rect x="0" y="604" width="1000" height="3" fill="#8a8272"/>

      <g id="lampsG" stroke="#5a5a52" stroke-width="2">
        <path d="M120,596 v-22" fill="none"/><circle cx="120" cy="572" r="3" fill="#e8e0c8" stroke="none"/>
        <path d="M330,596 v-22" fill="none"/><circle cx="330" cy="572" r="3" fill="#e8e0c8" stroke="none"/>
        <path d="M520,596 v-22" fill="none"/><circle cx="520" cy="572" r="3" fill="#e8e0c8" stroke="none"/>
        <path d="M700,596 v-22" fill="none"/><circle cx="700" cy="572" r="3" fill="#e8e0c8" stroke="none"/>

    <!-- boats -->
    <g class="bob">
      <g id="yacht">
        <path d="M2,594 L120,594 L106,612 L16,612 Z" fill="#f2f2ee"/>

        <rect x="38" y="585" width="9" height="6" fill="#2a3a4a"/><rect x="51" y="585" width="9" height="6" fill="#2a3a4a"/>
        <rect x="64" y="585" width="9" height="6" fill="#2a3a4a"/>

    <g class="sail">
      <g id="barge">
        <path d="M757,600 L946,600 L932,616 L770,616 Z" fill="#26425e"/>

        <rect x="898" y="582" width="36" height="18" fill="#2a6ab0"/>
        <rect x="898" y="578" width="36" height="5" fill="#c03028"/>
        <rect x="902" y="586" width="7" height="7" fill="#d8e8f2"/><rect x="913" y="586" width="7" height="7" fill="#d8e8f2"/>

        <circle class="night-only" cx="932" cy="570" r="2" fill="#ffffff"/>

  <!-- reflection of the whole scene, rippling -->
  <use href="#cityScene" transform="scale(1,-1) translate(0,-1210)" mask="url(#reflMask)" filter="url(#ripple)" opacity=".3"/>

  <!-- water surface details -->
  <rect class="shimSlow" x="128" y="605" width="60" height="95" fill="url(#gPinkRefl)"/>
  <g id="shimmerG" fill="#eaf4fc"></g>

  <!-- night city light dome -->
  <ellipse class="cityglow" cx="500" cy="608" rx="470" ry="58" fill="url(#gCityGlow)"/>

  <!-- global day/night tint -->
  <rect class="tint" x="0" y="0" width="1000" height="750" fill="#0f1c44" opacity=".3"/>

  <!-- sun -->
  <g class="sun">
    <circle class="sun-halo" cx="0" cy="0" r="72" fill="#ffd880"/>
    <circle cx="0" cy="0" r="24" fill="#fff6cf"/>
    <circle cx="0" cy="0" r="24" fill="#ffffff" opacity=".5"/>
  </g>

  <!-- moon -->
  <g class="moon">
    <circle cx="0" cy="0" r="52" fill="url(#gMoonHalo)"/>
    <circle cx="0" cy="0" r="17" fill="#e9edf3"/>
    <circle cx="-5" cy="-4" r="3.5" fill="#c9d1dc"/>
    <circle cx="4" cy="4" r="4.5" fill="#cdd5df"/>
    <circle cx="7" cy="-6" r="2" fill="#c9d1dc"/>
  </g>

  <script><![CDATA[
    const NS = 'http://www.w3.org/2000/svg';
    const rnd = (a,b) => a + Math.random()*(b-a);

    // facade grids matching the drawn buildings
    const grids = [
      { x: 4,   y: 360, w: 50,  h: 238, cols: 5, rows: 16 },             // left slab
      { x: 186, y: 368, w: 68,  h: 230, cols: 6, rows: 14 },             // cream mid-rise
      { x: 306, y: 352, w: 44,  h: 248, cols: 4, rows: 18 },             // mirror tower
      { x: 566, y: 288, w: 50,  h: 310, cols: 4, rows: 20 },             // blue glass slab
      { x: 664, y: 222, w: 64,  h: 380, cols: 5, rows: 24 },             // SWFC
      { x: 632, y: 426, w: 80,  h: 172, cols: 6, rows: 12 },             // Jin Mao base
      { x: 748, y: 280, w: 60,  h: 318, cols: 5, rows: 21 },             // CITIC slab
      { x: 852, y: 60,  w: 100, h: 540, cols: 6, rows: 30, clip: 'url(#clipSH)' }, // Shanghai Tower
      { x: 912, y: 364, w: 84,  h: 234, cols: 6, rows: 15 },             // green glass
      { x: 790, y: 438, w: 102, h: 160, cols: 7, rows: 11 },             // white slab
      { x: 656, y: 418, w: 34,  h: 180, cols: 3, rows: 14 },             // brown pavilion
    ];
    const winG = document.getElementById('winLitG');
    const dayG = document.createElementNS(NS,'g');
    dayG.setAttribute('fill','#0e2b4d'); dayG.setAttribute('opacity','.20');
    document.getElementById('nightLayer').before(dayG);

    grids.forEach(g => {
      const cw = g.w/g.cols, ch = g.h/g.rows;
      let dayGrid = dayG, litGrid = winG;
      if (g.clip) {
        dayGrid = document.createElementNS(NS,'g');
        dayGrid.setAttribute('clip-path',g.clip); dayG.appendChild(dayGrid);
        litGrid = document.createElementNS(NS,'g');
        litGrid.setAttribute('clip-path',g.clip); winG.appendChild(litGrid);
      }
      for (let r=0; r<g.rows; r++) for (let c=0; c<g.cols; c++) {
        const wx = (g.x + c*cw + cw*0.24).toFixed(1);
        const wy = (g.y + r*ch + ch*0.25).toFixed(1);
        const ww = (cw*0.52).toFixed(1), wh = (ch*0.45).toFixed(1);
        const day = document.createElementNS(NS,'rect');
        day.setAttribute('x',wx); day.setAttribute('y',wy);
        day.setAttribute('width',ww); day.setAttribute('height',wh);
        dayGrid.appendChild(day);
        if (Math.random() < 0.34) continue; // some windows stay dark at night
        const w = document.createElementNS(NS,'rect');
        w.setAttribute('x',wx); w.setAttribute('y',wy);
        w.setAttribute('width',ww); w.setAttribute('height',wh);
        w.setAttribute('class','winLit');
        w.setAttribute('fill', Math.random()<0.78 ? '#ffd98c' : '#cfe6ff');
        w.style.animationDelay = rnd(0,4).toFixed(2)+'s';
        litGrid.appendChild(w);
      }
    });

    // colonnade arched windows
    const arches = document.getElementById('arches');
    for (let x=262; x<540; x+=23.6){
      const a = document.createElementNS(NS,'path');
      a.setAttribute('d', `M${x},602 v-44 a10.8,10.8 0 0 1 21.6,0 v44 Z`);
      a.setAttribute('fill','url(#gArch)'); a.setAttribute('opacity','.9');
      arches.appendChild(a);
      const g = document.createElementNS(NS,'g');
      g.setAttribute('class','winLit');
      g.style.animationDelay = rnd(0,4).toFixed(2)+'s';
      const l = document.createElementNS(NS,'path');
      l.setAttribute('d', `M${x+4},600 v-40 a6.8,6.8 0 0 1 13.6,0 v40 Z`);
      l.setAttribute('fill','#e8b870'); l.setAttribute('opacity','.8');
      g.appendChild(l);
      winG.appendChild(g);
    }


    // Pearl Tower sphere + column accent lights
    function ring(cx,cy,r,fill){
      const g = document.createElementNS(NS,'g');
      const n = Math.round(r*1.1);
      for (let i=0;i<n;i++){
        const a = (i/n)*Math.PI*2;
        const d = document.createElementNS(NS,'circle');
        d.setAttribute('cx',(cx+Math.cos(a)*r).toFixed(1));
        d.setAttribute('cy',(cy+Math.sin(a)*r).toFixed(1));
        d.setAttribute('r', 1.4); d.setAttribute('fill',fill); d.setAttribute('class','winLit');
        d.style.animationDelay = rnd(0,4).toFixed(2)+'s';
        g.appendChild(d);
      }
      return g;
    }
    winG.appendChild(ring(158,142,44,'#ff6a9e'));
    winG.appendChild(ring(158,444,42,'#ff6a9e'));
    [[158,212],[158,256],[158,300],[158,56]].forEach(p=>winG.appendChild(ring(p[0],p[1],10,'#ffb0c8')));

    // stars
    const stars = document.getElementById('stars');
    for (let i=0;i<170;i++){
      const s = document.createElementNS(NS,'circle');
      const r = Math.random()<0.12 ? rnd(1.6,2.4) : rnd(0.4,1.2);
      s.setAttribute('cx', rnd(0,1000).toFixed(1));
      s.setAttribute('cy', rnd(0,380).toFixed(1));
      s.setAttribute('r', r.toFixed(2));
      s.setAttribute('fill','#ffffff');
      s.setAttribute('class','star');
      s.style.animationDelay = rnd(0,3).toFixed(2)+'s';
      s.style.animationDuration = rnd(2,5).toFixed(2)+'s';
      if (r>1.6) s.setAttribute('filter','url(#soft)');
      stars.appendChild(s);
    }

    // shore trees (green + autumn red)
    const trees = document.getElementById('treesG');
    function cluster(cx, base, s, fill){
      for (let k=0;k<3;k++){
        const t = document.createElementNS(NS,'circle');
        t.setAttribute('cx', cx + rnd(-5,5)); t.setAttribute('cy', base - rnd(2,9)*s);
        t.setAttribute('r', rnd(5,9)*s); t.setAttribute('fill', fill);
        trees.appendChild(t);
      }
    }
    for (let x=280; x<505; x+=26) cluster(x, 597, rnd(.8,1.2), Math.random()<.4?'#8a4a2c':'#3f7a3a');
    for (let x=700; x<858; x+=22) cluster(x, 597, rnd(.8,1.2), Math.random()<.6?'#a8402c':'#6a7a34');

    // street-lamp night glows
    const lampG = document.getElementById('lampGlow');
    [120,330,520,700,900].forEach(x=>{
      const c = document.createElementNS(NS,'circle');
      c.setAttribute('cx',x); c.setAttribute('cy',572); c.setAttribute('r',9);
      c.setAttribute('fill','url(#gLampGlow)'); lampG.appendChild(c);
    });

    // water shimmer bands
    const shim = document.getElementById('shimmerG');
    for (let i=0;i<46;i++){
      const b = document.createElementNS(NS,'rect');
      const w = rnd(24,120);
      b.setAttribute('x', rnd(-10,1010-w).toFixed(1));
      b.setAttribute('y', rnd(608,742).toFixed(1));
      b.setAttribute('width', w.toFixed(1)); b.setAttribute('height', rnd(1,2.4).toFixed(1));
      b.setAttribute('rx',1); b.setAttribute('class','shim');
      b.style.animationDelay = rnd(0,4.5).toFixed(2)+'s';
      b.style.animationDuration = rnd(3,6).toFixed(2)+'s';
      shim.appendChild(b);
    }
  ]]></script>
</svg>
