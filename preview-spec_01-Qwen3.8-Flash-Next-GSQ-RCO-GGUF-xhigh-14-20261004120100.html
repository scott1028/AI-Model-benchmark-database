<head>

<title>spec_01 · 上海陸家嘴 日夜循環 SVG — Qwen3.8-Flash-Next-GSQ-RCO-GGUF</title>
<style>
  :root { --T: 48s; } /* master day-night cycle */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0b0e14;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Segoe UI", system-ui, sans-serif; gap: 10px; padding: 12px;
  }
  .stage {
    width: min(94vw, calc(100vh - 86px)); aspect-ratio: 745 / 742;
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 18px 60px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.07);
  }
  svg { width: 100%; height: 100%; display: block; }
  .bar { color: #8fa3bd; font-size: 12.5px; letter-spacing: .4px; display: flex; gap: 16px; align-items: center; }
  .bar b { color: #d7e3f2; font-weight: 600; }
  .loopdot { width: 8px; height: 8px; border-radius: 50%; background: #4da3ff; animation: loopPulse var(--T) linear infinite; }
  @keyframes loopPulse { 0%,100% { opacity:.25 } 12% { opacity:1 } 46% { opacity:1 } 58% { opacity:.25 } }

  /* ---------- master phase gates (all share var(--T), start at dawn) ---------- */
  .skyDay   { animation: skyDay   var(--T) linear infinite both; }
  .skyDawn  { animation: skyDawn  var(--T) linear infinite both; }
  .skyDusk  { animation: skyDusk  var(--T) linear infinite both; }
  #scene    { animation: cityDim  var(--T) linear infinite both; }
  .nightLights { animation: nightGate var(--T) linear infinite both; }
  .starsG   { animation: starGate var(--T) linear infinite both; }
  #sun      { animation: sunMove  var(--T) ease-in-out infinite both,
                          sunFade var(--T) linear infinite both; }
  #moon     { animation: moonMove var(--T) ease-in-out infinite both,
                          moonFade var(--T) linear infinite both; }
  .glitterSun { animation: glitSun var(--T) ease-in-out infinite both; }
  .glitterMoon{ animation: glitMoon var(--T) ease-in-out infinite both; }
  .warmDawn { animation: skyDawn var(--T) linear infinite both; }
  .warmDusk { animation: skyDusk var(--T) linear infinite both; }
  .birds    { animation: birdGate var(--T) linear infinite both; }
  .clouds   { animation: cloudGate var(--T) linear infinite both; }

  @keyframes skyDay  { 0% {opacity:0} 15% {opacity:1} 42% {opacity:1} 55% {opacity:0} 100% {opacity:0} }
  @keyframes skyDawn { 0% {opacity:.95} 16% {opacity:0} 90% {opacity:0} 100% {opacity:.95} }
  @keyframes skyDusk { 0% {opacity:0} 42% {opacity:0} 50% {opacity:.92} 61% {opacity:0} 100% {opacity:0} }
  @keyframes cityDim {
    0% {filter:brightness(.78) saturate(.9)} 12% {filter:brightness(1) saturate(1)}
    42% {filter:brightness(1) saturate(1.05)} 50% {filter:brightness(.88) saturate(1.15)}
    60% {filter:brightness(.42) saturate(.72)} 90% {filter:brightness(.42) saturate(.72)}
    100% {filter:brightness(.78) saturate(.9)}
  }
  @keyframes nightGate { 0% {opacity:.5} 13% {opacity:0} 46% {opacity:0} 58% {opacity:1} 92% {opacity:1} 100% {opacity:.5} }
  @keyframes starGate  { 0% {opacity:.55} 9% {opacity:0} 52% {opacity:0} 62% {opacity:1} 91% {opacity:1} 100% {opacity:.55} }
  @keyframes sunFade   { 0% {opacity:0} 4% {opacity:1} 44% {opacity:1} 51% {opacity:0} 100% {opacity:0} }
  @keyframes moonFade  { 0% {opacity:.75} 7% {opacity:0} 52% {opacity:0} 60% {opacity:1} 94% {opacity:1} 100% {opacity:.75} }
  @keyframes birdGate  { 0% {opacity:0} 13% {opacity:1} 40% {opacity:1} 48% {opacity:0} 100% {opacity:0} }
  @keyframes cloudGate { 0% {opacity:.5} 12% {opacity:.12} 42% {opacity:.12} 50% {opacity:.55} 62% {opacity:.75} 90% {opacity:.75} 100% {opacity:.5} }
  /* sun arc: dawn-left -> noon-top -> dusk-right */
  @keyframes sunMove {
    0%   {transform:translate(30px,690px)}
    6%   {transform:translate(85px,600px)}
    14%  {transform:translate(170px,380px)}
    25%  {transform:translate(310px,185px)}
    36%  {transform:translate(470px,215px)}
    45%  {transform:translate(600px,420px)}
    51%  {transform:translate(680px,660px)}
    100% {transform:translate(680px,660px)}
  }
  /* moon arc: rises right -> sets left */
  @keyframes moonMove {
    0%   {transform:translate(70px,560px)}
    7%   {transform:translate(30px,480px)}
    52%  {transform:translate(690px,660px)}
    62%  {transform:translate(600px,330px)}
    74%  {transform:translate(430px,150px)}
    86%  {transform:translate(240px,270px)}
    96%  {transform:translate(100px,560px)}
    100% {transform:translate(70px,560px)}
  }
  @keyframes glitSun {
    0%,4%   {opacity:0; transform:translateX(30px)}
    6%  {opacity:.55; transform:translateX(85px)}
    14% {opacity:.3;  transform:translateX(170px)}
    25% {opacity:.18; transform:translateX(310px)}
    36% {opacity:.25; transform:translateX(470px)}
    45% {opacity:.55; transform:translateX(600px)}
    51%,100% {opacity:0; transform:translateX(680px)}
  }
  @keyframes glitMoon {
    0%   {opacity:.4; transform:translateX(70px)}
    7%,52% {opacity:0}
    62% {opacity:.35; transform:translateX(600px)}
    74% {opacity:.28; transform:translateX(430px)}
    86% {opacity:.35; transform:translateX(240px)}
    96%,100% {opacity:.4; transform:translateX(100px)}
  }

  /* ---------- local micro-animations (independent of master) ---------- */
  .twinkle { animation: twk 3s ease-in-out infinite alternate; }
  @keyframes twk { from {opacity:.25} to {opacity:1} }
  .flicker { animation: flk 4.5s steps(1,end) infinite; }
  @keyframes flk { 0%,86% {opacity:1} 87%,93% {opacity:.35} 94%,100% {opacity:1} }
  .bobA { animation: bob 3.4s ease-in-out infinite alternate; }
  .bobB { animation: bob 2.6s ease-in-out infinite alternate-reverse; }
  @keyframes bob { from {transform:translateY(0)} to {transform:translateY(-2.2px)} }
  .bargeMove { animation: barge 64s linear infinite; }
  @keyframes barge { from {transform:translateX(150px)} to {transform:translateX(-830px)} }
  .birdFly { animation: birdfly 21s linear infinite; }
  @keyframes birdfly { from {transform:translate(-70px,10px)} to {transform:translate(820px,-46px)} }
  .cloudDrift { animation: cdrift 150s linear infinite; }
  @keyframes cdrift { from {transform:translateX(-90px)} to {transform:translateX(830px)} }
  .shimmer { animation: shim 2.8s ease-in-out infinite alternate; }
  @keyframes shim { from {opacity:.06} to {opacity:.34} }
  .sway { animation: sway 5s ease-in-out infinite alternate; }
  @keyframes sway { from {transform:translateX(-2.5px)} to {transform:translateX(2.5px)} }
  .beacon { animation: bcn 1.6s steps(1,end) infinite; }
  @keyframes bcn { 0%,55% {opacity:1} 56%,100% {opacity:.1} }
  .pearlPulse { animation: ppl 4s ease-in-out infinite alternate; }
  @keyframes ppl { from {opacity:.55} to {opacity:.95} }
</style>
</head>

      <rect x="71" y="146" width="72" height="30" fill="#9a978c" opacity=".9"/>

    <circle cx="97" cy="128" r="13" fill="#ffffff" opacity=".14"/>
    <!-- shaft -->
    <rect x="86" y="174" width="42" height="372" fill="url(#pearlShaft)"/>
    <g id="shaftModules"></g>
    <!-- lower sphere -->
    <circle cx="107" cy="585" r="46" fill="url(#pearlSphere)"/>
    <g clip-path="url(#clipLowSphere)">
      <rect x="61" y="539" width="92" height="50" fill="#a85950" opacity=".55"/>
      <g id="lowTri"></g>
      <rect x="61" y="589" width="92" height="42" fill="#9a978c" opacity=".9"/>

    </g>
    <circle cx="93" cy="570" r="16" fill="#ffffff" opacity=".13"/>
    <!-- legs -->
    <path d="M84,626 L58,698 L70,698 L92,634 Z" fill="#bfae90"/>
    <path d="M130,626 L156,698 L144,698 L122,634 Z" fill="#a8977a"/>
    <rect x="95" y="630" width="24" height="68" fill="url(#pearlShaft)"/>
    <line x1="70" y1="652" x2="128" y2="690" stroke="#a8977a" stroke-width="4"/>
    <line x1="128" y1="652" x2="70" y2="690" stroke="#bfae90" stroke-width="4"/>
    <circle cx="62" cy="668" r="7" fill="#cbbd9f"/>
  </g>

  <!-- embankment + trees -->
  <rect x="0" y="690" width="745" height="10" fill="#d6d3c8"/>

  <rect x="0" y="700" width="745" height="42" fill="url(#waterG)"/>

    <g id="reflections"></g>
    <rect class="glitterSun" x="-40" y="700" width="80" height="42" fill="url(#glitterG)" opacity=".4"/>

  <g class="bobA"><g transform="translate(0,0)">

    <rect x="26" y="668" width="40" height="10" fill="#dfe2de"/>
    <g id="shipWindows"></g>
  </g></g>
  <g class="bargeMove"><g class="bobB">
    <polygon points="590,708 686,708 680,719 594,719" fill="#2a2d33"/>
    <rect x="598" y="698" width="16" height="10" fill="#2f6db0"/>
    <rect x="616" y="698" width="16" height="10" fill="#2f6db0"/>
    <rect x="634" y="700" width="20" height="8" fill="#b04430"/>
    <rect x="656" y="700" width="16" height="8" fill="#c9a24f"/>
    <rect x="586" y="712" width="4" height="4" fill="#dfe3e0"/>
  </g></g>
  <g class="bobB"><circle cx="712" cy="706" r="5" fill="#c0392b"/><line x1="712" y1="701" x2="712" y2="694" stroke="#8e2b20" stroke-width="1.6"/></g>

  <!-- ============ NIGHT LIGHTS (gated) ============ -->
  <g class="nightLights">
    <g id="windows"></g>
    <circle class="pearlPulse" cx="107" cy="140" r="52" fill="url(#pearlGlow)"/>
    <circle class="pearlPulse" cx="107" cy="585" r="62" fill="url(#pearlGlow)" style="animation-delay:-1.6s"/>
    <circle class="beacon" cx="107" cy="4" r="3" fill="#ff5d5d"/>
    <rect x="86" y="174" width="42" height="372" fill="#ffd9a0" opacity=".1"/>
  </g>

  <!-- golden-hour warm wash -->
  <rect class="warmDawn" x="0" y="380" width="745" height="362" fill="url(#warmBand)" style="mix-blend-mode:overlay"/>
  <rect class="warmDusk" x="0" y="380" width="745" height="362" fill="url(#warmBand)" style="mix-blend-mode:overlay"/>
</g>

  <b>陸家嘴天際線 · 日夜循環</b>

  <span>preview-spec_01 · Qwen3.8-Flash-Next-GSQ-RCO-GGUF</span>
</div>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  /* ---- stars ---- */
  const stars = document.getElementById('stars');
  for (let i = 0; i < 130; i++) {
    const s = el('circle', { cx: rnd(5, 740), cy: rnd(8, 430), r: rnd(.6, 1.7), fill: '#e9f2ff' });
    s.classList.add('twinkle');
    s.style.animationDuration = rnd(1.8, 4.4) + 's';
    s.style.animationDelay = rnd(0, 4) + 's';
    stars.appendChild(s);
  }

  /* ---- tower window grids (night lights) ---- */
  const win = document.getElementById('windows');
  const WARM = ['#ffd98a', '#ffce74', '#ffe6b0', '#cfe3ff', '#ffb96b'];
  function grid(x0, y0, x1, y1, cw, ch, prob) {
    for (let x = x0; x < x1 - cw; x += cw + 3)
      for (let y = y0; y < y1 - ch; y += ch + 4)
        if (Math.random() < prob) {
          const r = el('rect', { x, y, width: cw, height: ch, fill: pick(WARM), rx: .5 });
          r.setAttribute('opacity', rnd(.55, 1).toFixed(2));
          if (Math.random() < .12) r.classList.add('flicker');
          win.appendChild(r);
        }
  }
  grid(19, 356, 70, 688, 4, 6, .5);      // left slab
  grid(148, 380, 222, 688, 5, 6, .45);   // beige tower
  grid(229, 340, 265, 688, 4, 6, .5);    // thin glass
  grid(272, 478, 366, 688, 5, 5, .5);    // oval tower
  grid(455, 288, 480, 688, 4, 4, .5);    // striped
  grid(487, 258, 546, 552, 5, 5, .42);   // SWFC body
  grid(516, 300, 566, 688, 4, 5, .5);    // Jin Mao
  grid(550, 276, 590, 688, 4, 5, .4);    // faceted
  grid(582, 414, 668, 688, 6, 5, .55);   // white slab
  grid(671, 440, 710, 688, 5, 5, .5);    // white block
  grid(705, 366, 744, 688, 4, 5, .55);   // green tower
  grid(626, 60, 698, 552, 4, 5, .32);    // Shanghai Tower (sparse, curved face approx)
  grid(500, 456, 541, 566, 4, 5, .5);    // brick castle
  /* arcade arch glow */
  for (let x = 270; x < 498; x += 21) {
    win.appendChild(el('rect', { x: x + 2, y: 592, width: 13, height: 66, fill: '#ffd98a', opacity: .8, rx: 4 }));
  }
  /* ship windows */
  const sw = document.getElementById('shipWindows');
  for (let x = 18; x < 78; x += 7) sw.appendChild(el('circle', { cx: x, cy: 684, r: 1.3, fill: '#3a4a5a' }));

  /* ---- striped tower bands ---- */
  const st = document.getElementById('stripes');
  for (let y = 288; y < 690; y += 11) st.appendChild(el('rect', { x: 452, y, width: 28, height: 3.4, fill: '#7fd3e8', opacity: .5 }));

  /* ---- faceted tower diagonals ---- */
  const fl = document.getElementById('facetLines');
  for (let i = -4; i < 12; i++) fl.appendChild(el('line', { x1: 547, y1: 266 + i * 40, x2: 591, y2: 266 + i * 40 + 44 }));

  /* ---- Shanghai Tower spiral bands ---- */
  const sb = document.getElementById('shtBands');
  for (let i = 0; i < 13; i++) {
    const y = 70 + i * 38, l = 631 + i * .55, r = 686 + i * .55;
    sb.appendChild(el('path', { d: `M${l},${y} Q660,${y - 9} ${r},${y}` }));
  }

  /* ---- oval tower mullions + fin fan ---- */
  const om = document.getElementById('ovalMullions');
  for (let x = 276; x < 368; x += 9) om.appendChild(el('line', { x1: x, y1: 452, x2: x, y2: 698 }));
  const ff = document.getElementById('finFins');
  for (let i = 1; i <= 7; i++) {
    const t = i / 8;
    ff.appendChild(el('line', { x1: 368, y1: 452 + (662 - 452) * t, x2: 368 + (430 - 368) * t, y2: 662 }));
  }

  /* ---- blue sphere ribs (meridians + parallels) ---- */
  const br = document.getElementById('blueRibs');
  for (let i = 1; i <= 5; i++) {
    const rx = 56 * Math.cos(i * .28);
    br.appendChild(el('ellipse', { cx: 205, cy: 648, rx: Math.abs(rx), ry: 56 }));
  }
  for (let dy = -40; dy <= 40; dy += 16) {
    const half = Math.sqrt(Math.max(0, 56 * 56 - dy * dy));
    br.appendChild(el('line', { x1: 205 - half, y1: 648 + dy, x2: 205 + half, y2: 648 + dy }));
  }

  /* ---- colorful dome patches + ribs ---- */
  const dp = document.getElementById('domePatches');
  const COLS = ['#c98f3f', '#b05a3a', '#7aa84f', '#3f7fb5', '#d8b25e', '#5f96c8', '#8a5f9e'];
  for (let i = 0; i < 30; i++) {
    const a = rnd(0, Math.PI * 2), d = rnd(0, 60);
    dp.appendChild(el('rect', { x: 455 + d * Math.cos(a) - 9, y: 617 + d * Math.sin(a) - 8,
      width: rnd(10, 20), height: rnd(9, 16), fill: pick(COLS), opacity: rnd(.35, .7).toFixed(2), rx: 2 }));
  }
  const dr = document.getElementById('domeRibs');
  for (let i = 1; i <= 5; i++) {
    const rx = 65 * Math.cos(i * .28);
    dr.appendChild(el('ellipse', { cx: 455, cy: 617, rx: Math.abs(rx), ry: 65 }));
  }
  for (let dy = -50; dy <= 50; dy += 17) {
    const half = Math.sqrt(Math.max(0, 65 * 65 - dy * dy));
    dr.appendChild(el('line', { x1: 455 - half, y1: 617 + dy, x2: 455 + half, y2: 617 + dy }));
  }

  /* ---- arcade arches + urns ---- */
  const ar = document.getElementById('arches');
  for (let x = 270; x < 498; x += 21) {
    ar.appendChild(el('path', { d: `M${x},658 L${x},576 A7,7 0 0 1 ${x + 14},576 L${x + 14},658 Z`,
      fill: '#24425e', stroke: '#efe6d2', 'stroke-width': 1.6 }));
    ar.appendChild(el('line', { x1: x, y1: 612, x2: x + 14, y2: 612, stroke: '#efe6d2', 'stroke-width': .8 }));
  }
  const au = document.getElementById('arcadeUrns');
  [270, 320, 370, 420, 470].forEach(x => {
    au.appendChild(el('rect', { x: x - 2.5, y: 536, width: 5, height: 8, rx: 1 }));
  });

  /* ---- pearl sphere triangle lattices + dot bands ---- */
  function triLattice(gid, cx, cy, r, top) {
    const g = document.getElementById(gid);
    for (let y = top; y < cy + r; y += 9)
      for (let x = cx - r; x < cx + r; x += 10) {
        const up = ((x + y) / 10 | 0) % 2 === 0;
        g.appendChild(el('path', {
          d: up ? `M${x},${y + 8} L${x + 5},${y} L${x + 10},${y + 8} Z` : `M${x},${y} L${x + 10},${y} L${x + 5},${y + 8} Z`,
          fill: up ? '#7c3a36' : '#d99a86', opacity: .5 }));
      }
  }
  triLattice('upTri', 107, 140, 36, 104);
  triLattice('lowTri', 107, 585, 46, 539);
  function dots(gid, cx, cy, r, y0) {
    const g = document.getElementById(gid);
    for (let y = y0; y < cy + r - 4; y += 10)
      for (let x = cx - r; x < cx + r; x += 9)
        if ((x * 7 + y * 13) % 5 < 2) g.appendChild(el('circle', { cx: x, cy: y, r: 1.6, fill: '#6f6d64', opacity: .8 }));
  }
  dots('upDots', 107, 140, 36, 150);
  dots('lowDots', 107, 585, 46, 592);

  /* ---- pearl shaft modules (pink coronet rings) ---- */
  const sm = document.getElementById('shaftModules');
  [258, 303, 348, 393].forEach(y => {
    sm.appendChild(el('rect', { x: 88, y: y - 5, width: 38, height: 5, fill: '#b7a88c' }));
    sm.appendChild(el('ellipse', { cx: 107, cy: y + 2, rx: 21, ry: 4.4, fill: '#b06a63' }));
    sm.appendChild(el('ellipse', { cx: 107, cy: y + 8, rx: 18, ry: 4, fill: '#9a5a54' }));
  });

  /* ---- embankment lamps + trees ---- */
  const lp = document.getElementById('lamps');
  for (let x = 30; x < 740; x += 62) {
    lp.appendChild(el('line', { x1: x, y1: 690, x2: x, y2: 676, stroke: '#8f8c82', 'stroke-width': 1.6 }));
    lp.appendChild(el('circle', { cx: x, cy: 674, r: 2.2, fill: '#b9b6ab' }));
    const nl = el('circle', { cx: x, cy: 674, r: 5.5, fill: '#ffdf9a' });
    nl.classList.add('nightLights'); lp.appendChild(nl);
  }
  const tr = document.getElementById('trees');
  const tree = (x, y, rx, ry, c) => tr.appendChild(el('ellipse', { cx: x, cy: y, rx, ry, fill: c }));
  for (let x = 282; x <= 378; x += 12) tree(x + rnd(-3, 3), rnd(676, 684), rnd(8, 12), rnd(9, 13), pick(['#3f7a3a', '#4c8540', '#356b33']));
  for (let x = 432; x <= 548; x += 12) tree(x + rnd(-3, 3), rnd(674, 683), rnd(8, 12), rnd(9, 13), pick(['#b5462f', '#c96a3a', '#a03d2c']));
  tree(240, 682, 9, 10, '#3f7a3a'); tree(254, 684, 7, 8, '#4c8540');

  /* ---- water shimmer + reflections ---- */
  const sh = document.getElementById('shimmer');
  for (let i = 0; i < 46; i++) {
    const r = el('rect', { x: rnd(0, 730), y: rnd(701, 739), width: rnd(8, 34), height: 1.4, rx: .7, fill: '#cfe2f5' });
    r.classList.add('shimmer');
    r.style.animationDuration = rnd(1.6, 4) + 's';
    r.style.animationDelay = rnd(0, 3) + 's';
    sh.appendChild(r);
  }
  const rf = document.getElementById('reflections');
  function reflect(x, w, color, op, h) {
    const g = el('g', {}); g.classList.add('sway');
    g.style.animationDelay = rnd(0, 3) + 's';
    g.appendChild(el('rect', { x: x - w / 2, y: 701, width: w, height: h || 40, fill: color, opacity: op, filter: 'url(#soft6)' }));
    rf.appendChild(g);
  }
  reflect(107, 30, '#e08a7a', .35);   // pearl upper+lower sphere pink streak
  reflect(205, 44, '#5f93c4', .3);    // blue sphere
  reflect(455, 50, '#d8b25e', .28);   // colorful dome
  reflect(540, 34, '#aebfc9', .22);   // jin mao
  reflect(660, 40, '#c3d2dd', .22);   // shanghai tower
  const nrf = el('g', {}); nrf.classList.add('nightLights');
  [[150, '#ffd98a'], [318, '#ffd98a'], [455, '#ffdf9a'], [620, '#ffe6b0'], [712, '#ffce74']].forEach(([x, c]) => {
    const g = el('g', {}); g.classList.add('sway'); g.style.animationDelay = rnd(0, 3) + 's';
    g.appendChild(el('rect', { x: x - 16, y: 701, width: 32, height: 40, fill: c, opacity: .3, filter: 'url(#soft6)' }));
    nrf.appendChild(g);
  });
  rf.appendChild(nrf);
})();
</script>
