<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>preview-spec_01 · Shanghai Lujiazui Day/Night · glm-5.3-flash</title>
<style>
  html, body { margin: 0; height: 100%; background: #060a14; display: grid; place-items: center; overflow: hidden; }
  svg { width: min(100vmin, 760px); height: min(100vmin, 760px); border-radius: 10px;
        box-shadow: 0 12px 48px rgba(0,0,0,.55); }

  /* ===== master cycle: 60s, 0% = noon ===== */
  .skyDay    { animation: skyDay 60s linear infinite; }
  .skySunset { animation: skySunset 60s linear infinite; }
  .skyNight  { animation: skyNight 60s linear infinite; }
  .skyDawn   { animation: skyDawn 60s linear infinite; }
  @keyframes skyDay    { 0%{opacity:1} 36%{opacity:1} 48%{opacity:0} 88%{opacity:0} 96%{opacity:.55} 100%{opacity:1} }
  @keyframes skySunset { 0%{opacity:0} 34%{opacity:0} 44%{opacity:.95} 50%{opacity:.55} 56%{opacity:0} 86%{opacity:0} 92%{opacity:.5} 97%{opacity:.15} 100%{opacity:0} }
  @keyframes skyNight  { 0%{opacity:0} 40%{opacity:0} 52%{opacity:1} 84%{opacity:1} 94%{opacity:0} 100%{opacity:0} }
  @keyframes skyDawn   { 0%{opacity:0} 84%{opacity:0} 93%{opacity:.85} 98%{opacity:.1} 100%{opacity:0} }

  /* ===== celestial bodies ===== */
  .sun  { animation: sunPath 60s linear infinite; }
  .moon { animation: moonPath 60s linear infinite; }
  @keyframes sunPath {
    0%   { transform: translate(375px, 110px); }
    10%  { transform: translate(585px, 150px); }
    22%  { transform: translate(682px, 290px); }
    34%  { transform: translate(712px, 455px); }
    44%  { transform: translate(668px, 590px); }
    50%  { transform: translate(560px, 690px); }
    86%  { transform: translate(150px, 690px); }
    94%  { transform: translate(190px, 560px); }
    100% { transform: translate(375px, 110px); }
  }
  @keyframes moonPath {
    0%   { transform: translate(150px, 690px); }
    36%  { transform: translate(150px, 690px); }
    44%  { transform: translate(190px, 560px); }
    50%  { transform: translate(375px, 110px); }
    60%  { transform: translate(585px, 150px); }
    72%  { transform: translate(682px, 290px); }
    84%  { transform: translate(712px, 455px); }
    94%  { transform: translate(668px, 590px); }
    100% { transform: translate(150px, 690px); }
  }

  /* ===== stars ===== */
  .stars  { animation: starsFade 60s linear infinite; }
  .star   { animation: twinkle 2.8s ease-in-out infinite; }
  .s2 { animation-delay: -.7s }  .s3 { animation-delay: -1.4s }  .s4 { animation-delay: -2.1s }
  @keyframes starsFade { 0%{opacity:0} 42%{opacity:0} 54%{opacity:1} 82%{opacity:1} 92%{opacity:0} 100%{opacity:0} }
  @keyframes twinkle   { 0%,100%{opacity:1} 50%{opacity:.15} }

  /* ===== city lights at night ===== */
  .lit        { animation: litFade 60s linear infinite; }
  .nightShade { animation: shadeFade 60s linear infinite; }
  .haze       { animation: hazeFade 60s linear infinite; }
  @keyframes litFade  { 0%{opacity:0} 40%{opacity:0} 54%{opacity:1} 84%{opacity:1} 94%{opacity:0} 100%{opacity:0} }
  @keyframes shadeFade{ 0%{opacity:0} 40%{opacity:0} 54%{opacity:.32} 84%{opacity:.32} 94%{opacity:0} 100%{opacity:0} }
  @keyframes hazeFade { 0%{opacity:.14} 36%{opacity:.14} 50%{opacity:0} 88%{opacity:0} 100%{opacity:.14} }

  /* ===== water tint ===== */
  .waterNight   { animation: waterNight 60s linear infinite; }
  .waterSunset  { animation: waterSunset 60s linear infinite; }
  @keyframes waterNight  { 0%{opacity:0} 42%{opacity:0} 54%{opacity:.6} 84%{opacity:.6} 94%{opacity:0} 100%{opacity:0} }
  @keyframes waterSunset { 0%{opacity:0} 36%{opacity:0} 46%{opacity:.3} 54%{opacity:0} 88%{opacity:0} 94%{opacity:.25} 99%{opacity:0} 100%{opacity:0} }

  /* ===== clouds ===== */
  .cloud { fill: #ffffff; animation: cloudTint 60s linear infinite; }
  @keyframes cloudTint {
    0%{fill:#ffffff} 36%{fill:#ffffff} 45%{fill:#ffc9a1} 54%{fill:#26314f}
    84%{fill:#26314f} 93%{fill:#b7a6c9} 100%{fill:#ffffff}
  }
  .c1 { animation: drift 90s  linear infinite; animation-delay: -20s; }
  .c2 { animation: drift 70s  linear infinite; animation-delay: -45s; }
  .c3 { animation: drift 110s linear infinite; animation-delay: -8s;  }
  .c4 { animation: drift 60s  linear infinite; animation-delay: -30s; }
  @keyframes drift { from { transform: translateX(-260px); } to { transform: translateX(1020px); } }

  /* ===== waves ===== */
  .wA { animation: waveA 12s linear infinite; }
  .wB { animation: waveA 9s  linear infinite reverse; }
  .wC { animation: waveA 16s linear infinite; }
  @keyframes waveA { to { stroke-dashoffset: -128; } }

  /* ===== boats ===== */
  .boat  { animation: boatCross 95s linear infinite; }
  .ferry { animation: ferryCross 140s linear infinite; animation-delay: -55s; }
  @keyframes boatCross  { from { transform: translateX(870px); } to { transform: translateX(-190px); } }
  @keyframes ferryCross { from { transform: translateX(-140px); } to { transform: translateX(890px); } }
  .bob { animation: bob 3.2s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(-1.6px); } to { transform: translateY(1.6px); } }

  .beacon { animation: blink 2.4s ease-in-out infinite; }
  @keyframes blink { 0%,45% { opacity: 1; } 60%,100% { opacity: .12; } }

  .birds { animation: birdsCross 55s linear infinite; animation-delay: -18s; }
  @keyframes birdsCross { from { transform: translate(-80px, 0); } to { transform: translate(860px, -26px); } }
  .flap { animation: flap 1.1s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.45); } }

  @media (prefers-reduced-motion: reduce) {
    svg * { animation-duration: 240s !important; }
  }
</style>
