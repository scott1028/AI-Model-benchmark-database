name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Generate index.html
        run: |
          {
            echo '<!doctype html>'
            echo '<html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>AI Model Benchmark Previews</title></head><body>'
            echo '<h1>AI Model Benchmark Previews</h1><ul>'
            for f in *.html; do
              [ "$f" = index.html ] && continue
              title=$(grep -o -m1 '<title>[^<]*</title>' "$f" | sed -E 's#</?title>##g' || true)
              echo "<li><a href=\"$f\">$f</a>${title:+ — $title}</li>"
            done
            echo '</ul></body></html>'
          } > index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
