name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Generate index.html
        run: |
          {
            cat <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>AI Model Benchmark Previews</title>
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css">
          <style>
            td:not(:last-child) { white-space: nowrap; }
            td.num { text-align: right; }
          </style></head><body>
          <main class="container">
          <h1>AI Model Benchmark Previews</h1>
          <div class="overflow-auto"><table class="striped">
          <thead><tr><th>Created</th><th>Spec</th><th>Model</th><th>Minutes</th><th>Title</th></tr></thead>
          <tbody>
          HTML
            # Newest first by trailing YYYYMMDDHHMMSS in file name
            for f in *.html; do
              [ "$f" = index.html ] && continue
              [[ $f =~ ([0-9]{14})\.html$ ]] && ts=${BASH_REMATCH[1]} || ts=0
              echo "$ts $f"
            done | sort -r | while read -r ts f; do
              title=$(grep -o -m1 '<title>[^<]*</title>' "$f" | sed -E 's#</?title>##g' || true)
              # preview-${spec}-${model}-${minutes}-${YYYYMMDDHHMMSS}.html
              if [[ $f =~ ^preview-(spec[-_][0-9]+)-(.+)-([0-9]+)-[0-9]{14}\.html$ ]]; then
                spec=${BASH_REMATCH[1]} model=${BASH_REMATCH[2]} minutes=${BASH_REMATCH[3]}
                created="${ts:0:4}-${ts:4:2}-${ts:6:2} ${ts:8:2}:${ts:10:2}"
              else
                spec= model=$f minutes= created=
              fi
              echo "<tr><td>$created</td><td>$spec</td><td><a href=\"$f\">$model</a></td><td class=\"num\">$minutes</td><td>$title</td></tr>"
            done
            echo '</tbody></table></div></main></body></html>'
          } > index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
