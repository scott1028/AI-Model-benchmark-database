<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shanghai Lujiazui — Day &amp; Night · spec_01</title>
<style>
  html,body{margin:0;height:100%;background:#0a0f1a;display:grid;place-items:center;overflow:hidden}
  svg.stage{width:min(100vw,calc(100vh*840/920));height:auto;display:block}

  /* master cycle: all phase layers share 30s so they stay in sync */
  .m{animation-duration:30s;animation-timing-function:linear;animation-iteration-count:infinite}

  /* phase opacity tracks (0% = sunrise, 30% = noon, 52% = sunset, 70-90% = night) */
  .dusk {animation-name:kDusk}
  .night{animation-name:kNight}
  .tint {animation-name:kTint}
  .lights{animation-name:kLights}
  .glowl{animation-name:kGlow}
  .nonly{animation-name:kNightOnly}
  .waterNight{animation-name:kWaterNight}
  .moonpath{animation-name:kMoonPath}
  .cloudsFade{animation-name:kClouds}
  .dayBirds{animation-name:kBirds}

  @keyframes kDusk{
    0%{opacity:.85} 10%{opacity:0} 42%{opacity:.12}
    52%{opacity:1} 60%{opacity:.55} 66%{opacity:0} 94%{opacity:0} 100%{opacity:.85}
  }
  @keyframes kNight{
    0%{opacity:0} 50%{opacity:0} 62%{opacity:.92} 70%{opacity:1}
    90%{opacity:1} 97%{opacity:.4} 100%{opacity:0}
  }
  @keyframes kTint{
    0%{opacity:.18} 6%{opacity:0} 48%{opacity:0} 54%{opacity:.28}
    63%{opacity:.8} 88%{opacity:.8} 96%{opacity:.42} 100%{opacity:.18}
  }
  @keyframes kLights{
    0%{opacity:.35} 5%{opacity:0} 52%{opacity:0} 58%{opacity:.5}
    64%{opacity:1} 90%{opacity:1} 100%{opacity:.35}
  }
  @keyframes kGlow{
    0%{opacity:.25} 6%{opacity:0} 54%{opacity:0} 60%{opacity:.9}
    70%{opacity:1} 82%{opacity:.7} 90%{opacity:.95} 97%{opacity:.3} 100%{opacity:.25}
  }
  @keyframes kNightOnly{
    0%{opacity:.6} 6%{opacity:0} 52%{opacity:0} 58%{opacity:1} 100%{opacity:.6}
  }
  @keyframes kWaterNight{
    0%{opacity:.25} 6%{opacity:0} 50%{opacity:0} 57%{opacity:.5}
    64%{opacity:.92} 88%{opacity:.92} 96%{opacity:.4} 100%{opacity:.25}
  }
  @keyframes kMoonPath{
    0%{opacity:0} 57%{opacity:0} 63%{opacity:.55} 88%{opacity:.45} 96%{opacity:0} 100%{opacity:0}
  }
  @keyframes kClouds{
    0%{opacity:.7} 12%{opacity:.8} 45%{opacity:.8} 60%{opacity:.22} 88%{opacity:.22} 100%{opacity:.7}
  }
  @keyframes kBirds{
    0%{opacity:0} 8%{opacity:1} 48%{opacity:1} 55%{opacity:0} 100%{opacity:0}
  }

  /* sun arcs left horizon -> zenith -> right horizon */
  .sun{transform:translate(40px,480px);animation-name:kSun}
  @keyframes kSun{
    0%{transform:translate(40px,480px);opacity:.95}
    3%{transform:translate(70px,420px)} 9%{transform:translate(150px,300px)}
    19%{transform:translate(280px,150px)} 30%{transform:translate(400px,90px)}
    41%{transform:translate(530px,130px)} 49%{transform:translate(640px,260px)}
    53%{transform:translate(700px,420px)} 56%{transform:translate(735px,520px);opacity:.95}
    57%{opacity:0} 94%{opacity:0;transform:translate(20px,520px)}
    97%{opacity:.9;transform:translate(30px,500px)} 100%{transform:translate(40px,480px);opacity:.95}
  }
  .sun-core{fill:#ffb43c;animation:kSunFill 30s linear infinite}
  @keyframes kSunFill{
    0%{fill:#ff6a28} 10%{fill:#ffcf72} 28%{fill:#fff3d0}
    40%{fill:#ffdf8e} 50%{fill:#ff7c30} 56%{fill:#ff5018} 100%{fill:#ff6a28}
  }
  .sun-glow{fill:#ff9c46;animation:kSunGlow 30s linear infinite}
  @keyframes kSunGlow{
    0%{fill:#ff7c32;opacity:.55} 10%{fill:#ffcf84;opacity:.28} 28%{fill:#fff0c8;opacity:.2}
    40%{fill:#ffcf84;opacity:.3} 50%{fill:#ff8038;opacity:.6} 56%{fill:#ff5c1e;opacity:.65} 100%{fill:#ff7c32;opacity:.55}
  }

  .moon{transform:translate(0px,560px);animation-name:kMoon}
  @keyframes kMoon{
    0%{transform:translate(0px,560px);opacity:0}
    56%{transform:translate(120px,430px);opacity:0}
    59%{transform:translate(150px,360px);opacity:.95}
    68%{transform:translate(300px,140px)} 78%{transform:translate(430px,92px)}
    88%{transform:translate(560px,160px)}
    95%{transform:translate(700px,330px);opacity:.9}
    98%{transform:translate(740px,460px);opacity:0}
    100%{transform:translate(0px,560px);opacity:0}
  }

  .tw{animation:twinkle 3s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:1}50%{opacity:.15}}

  .drift1{animation:drift 75s linear infinite}
  .drift2{animation:drift 105s linear infinite;animation-delay:-40s}
  .drift3{animation:drift 60s linear infinite;animation-delay:-18s}
  @keyframes drift{0%{transform:translateX(-160px)}100%{transform:translateX(960px)}}

  .fly{animation:flyX 46s linear infinite}
  @keyframes flyX{0%{transform:translateX(-140px)}100%{transform:translateX(960px)}}

  .waves{animation:waveDrift 7s ease-in-out infinite}
  @keyframes waveDrift{0%{transform:translateX(0)}50%{transform:translateX(-13px)}100%{transform:translateX(0)}}

  .shimmer{animation:twinkle 4.6s ease-in-out infinite}

  .blink{animation:blink 1.9s steps(1,end) infinite}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.08}}

  .barge{animation:bargeSway 5.5s ease-in-out infinite}
  @keyframes bargeSway{0%{transform:translate(0,0)}50%{transform:translate(-9px,-2px)}100%{transform:translate(0,0)}}
  .ferry{animation:ferrySway 4.4s ease-in-out infinite}
  @keyframes ferrySway{0%{transform:translate(0,0)}50%{transform:translate(4px,-2px)}100%{transform:translate(0,0)}}
</style>
</head>
