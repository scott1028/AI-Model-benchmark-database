<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shanghai Lujiazui - Day and Night SVG Loop</title>
<style>
  html, body { margin: 0; padding: 0; background: #060a14; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center; }
  svg.stage { display: block; width: min(96vw, 720px); height: auto; max-height: 96vh;
    box-shadow: 0 8px 40px rgba(0,0,0,.6); border-radius: 6px; }
  .cap { color: #6b7a93; font: 12px/1.6 system-ui, sans-serif; margin: 10px 0 18px; letter-spacing: .05em; }

  /* ------- master 60s day/night cycle (all key values at 0% == 100%) ------- */
  .cyc  { animation-duration: 60s; animation-timing-function: linear; animation-iteration-count: infinite; }
  .skyDay  { animation-name: kSkyDay; }
  .glow    { animation-name: kGlow; }
  .stars   { animation-name: kStars; }
  .warm    { animation-name: kWarm; mix-blend-mode: multiply; }
  .warmScr { animation-name: kWarm; }
  .nightT  { animation-name: kNight; }
  .lights  { animation-name: kLights; }
  .sunO    { animation-name: kSunO; }
  .redSun  { animation-name: kRedSun; }
  .moonO   { animation-name: kMoonO; }
  .glit    { animation-name: kGlit; }
  .birdO   { animation-name: kBirdO; }

  @keyframes kSkyDay {
    0%   { opacity: .75; }  8%  { opacity: 1; }  42% { opacity: 1; }  54% { opacity: 0; }
    92%  { opacity: 0; }   98% { opacity: .55; } 100%{ opacity: .75; }
  }
  @keyframes kGlow {
    0%   { opacity: .6; }   7%  { opacity: 0; }  42% { opacity: 0; }  50% { opacity: 1; }
    55%  { opacity: 1; }   62% { opacity: 0; }  90% { opacity: 0; }  97% { opacity: 1; }
    100% { opacity: .6; }
  }
  @keyframes kStars {
    0%   { opacity: .3; }   6%  { opacity: 0; }  56% { opacity: 0; }  66% { opacity: 1; }
    92%  { opacity: 1; }   97% { opacity: .35; } 100%{ opacity: .3; }
  }
  @keyframes kWarm {
    0%   { opacity: .35; }  7%  { opacity: 0; }  40% { opacity: 0; }  50% { opacity: .5; }
    55%  { opacity: .45; } 61% { opacity: 0; }  91% { opacity: 0; }  97% { opacity: .4; }
    100% { opacity: .35; }
  }
  @keyframes kNight {
    0%   { opacity: .28; }  7%  { opacity: 0; }  48% { opacity: 0; }  60% { opacity: .5; }
    66%  { opacity: .6; }  92% { opacity: .6; }  97% { opacity: .3; } 100%{ opacity: .28; }
  }
  @keyframes kLights {
    0%   { opacity: .25; }  8%  { opacity: 0; }  46% { opacity: 0; }  54% { opacity: .35; }
    62%  { opacity: 1; }   92% { opacity: 1; }  97% { opacity: .3; } 100%{ opacity: .25; }
  }
  @keyframes kSunO {
    0%   { opacity: 1; }   48% { opacity: 1; }  54% { opacity: 0; }  96% { opacity: 0; }
    100% { opacity: 1; }
  }
  @keyframes kRedSun {
    0%   { opacity: 1; }   10% { opacity: 0; }  44% { opacity: 0; }  52% { opacity: 1; }
    56%  { opacity: 0; }   94% { opacity: 0; }  98% { opacity: 1; } 100%{ opacity: 1; }
  }
  @keyframes kMoonO {
    0%   { opacity: 0; }   56% { opacity: 0; }  62% { opacity: 1; }  90% { opacity: 1; }
    96%  { opacity: 0; }  100% { opacity: 0; }
  }
  @keyframes kGlit {
    0%   { opacity: 0; }   58% { opacity: 0; }  66% { opacity: 1; }  90% { opacity: 1; }
    95%  { opacity: 0; }  100% { opacity: 0; }
  }
  @keyframes kBirdO {
    0%   { opacity: 1; }   44% { opacity: 1; }  50% { opacity: 0; }  97% { opacity: 0; }
    100% { opacity: 1; }
  }

  /* clouds drift and change colour with the cycle */
  .cloud { animation: kCloudFill 60s linear infinite; }
  @keyframes kCloudFill {
    0%   { fill: #e8eef5; }  8%  { fill: #ffffff; }  42% { fill: #ffffff; }
    50%  { fill: #f5b87e; } 56%  { fill: #c98ba0; }  64% { fill: #33436b; }
    90%  { fill: #33436b; } 96%  { fill: #c98ba0; } 100%{ fill: #e8eef5; }
  }
  .drift { animation-name: kDrift; animation-timing-function: linear; animation-iteration-count: infinite; }
  @keyframes kDrift { from { transform: translateX(-320px); } to { transform: translateX(900px); } }

  /* water ripples */
  .rip { stroke: #dbe9f5; stroke-width: 1.6; fill: none; opacity: .4;
    animation: kRip 4s linear infinite; }
  .rip.b { stroke-width: 2.4; opacity: .55; }
  @keyframes kRip { to { stroke-dashoffset: -60; } }

  /* beacons blink */
  .beacon { animation: kBeacon 1.8s steps(1) infinite; }
  @keyframes kBeacon { 0% { opacity: 1; } 50% { opacity: .12; } }

  /* star twinkle sub-groups */
  .tw1 { animation: kTw 2.2s ease-in-out infinite alternate; }
  .tw2 { animation: kTw 3.1s ease-in-out infinite alternate; }
  .tw3 { animation: kTw 4.3s ease-in-out infinite alternate; }
  @keyframes kTw { from { opacity: 1; } to { opacity: .25; } }

  /* boats */
  .barge   { animation: kBarge 95s linear infinite; }
  @keyframes kBarge { from { transform: translateX(830px); } to { transform: translateX(-300px); } }
  .ferry   { animation: kFerry 150s linear infinite; }
  @keyframes kFerry { from { transform: translateX(-220px); } to { transform: translateX(840px); } }
  .bob  { animation: kBob 3.2s ease-in-out infinite alternate; }
  .bob2 { animation: kBob 2.6s ease-in-out infinite alternate; }
  @keyframes kBob { from { transform: translateY(-1.5px) rotate(-.5deg); } to { transform: translateY(1.5px) rotate(.5deg); } }

  /* birds */
  .fly1 { animation: kFly1 24s linear infinite; }
  .fly2 { animation: kFly1 30s linear infinite; animation-delay: -12s; }
  @keyframes kFly1 {
    0%   { transform: translate(-80px, 0px); }
    25%  { transform: translate(140px, -26px); }
    50%  { transform: translate(360px, 6px); }
    75%  { transform: translate(580px, -18px); }
    100% { transform: translate(820px, 10px); }
  }
  .flap { animation: kFlap .9s ease-in-out infinite alternate; transform-origin: center; }
  @keyframes kFlap { from { transform: scaleY(1); } to { transform: scaleY(.35); } }
</style>
</head>
<body>
<svg class="stage" viewBox="0 0 720 960" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Shanghai Lujiazui skyline day and night animation">
  <defs>
    <linearGradient id="gSkyNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04081e"/><stop offset=".55" stop-color="#0e1c40"/>
      <stop offset="1" stop-color="#1c2e58"/>
    </linearGradient>
    <linearGradient id="gSkySunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a6e"/><stop offset=".45" stop-color="#a4547a"/>
      <stop offset=".78" stop-color="#ef8f56"/><stop offset="1" stop-color="#ffc98a"/>
    </linearGradient>
    <linearGradient id="gSkyDay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f6fd0"/><stop offset=".45" stop-color="#5fa2df"/>
      <stop offset=".85" stop-color="#bcdcf2"/><stop offset="1" stop-color="#e4f1f9"/>
    </linearGradient>
    <linearGradient id="gWarmSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a50" stop-opacity=".1"/><stop offset="1" stop-color="#ff6a3a"/>
    </linearGradient>
    <radialGradient id="gSun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fffbe8"/><stop offset=".45" stop-color="#ffe27a"/>
      <stop offset=".8" stop-color="#ffbb55" stop-opacity=".55"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gSunRed" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff8a4a"/><stop offset=".55" stop-color="#ff5e3a" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ff4a2a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gMoon" cx=".38" cy=".35" r=".8">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#e6ecf6"/>
      <stop offset="1" stop-color="#b9c6dd"/>
    </radialGradient>
    <radialGradient id="gMoonHalo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#cfe0ff" stop-opacity=".55"/><stop offset="1" stop-color="#cfe0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gWaterDay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4879ad"/><stop offset=".5" stop-color="#33639c"/>
      <stop offset="1" stop-color="#22508a"/>
    </linearGradient>
    <linearGradient id="gWaterNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1c38"/><stop offset="1" stop-color="#081228"/>
    </linearGradient>
    <radialGradient id="gPearlS" cx=".4" cy=".35" r=".9">
      <stop offset="0" stop-color="#f3b7c4"/><stop offset=".6" stop-color="#d97b95"/>
      <stop offset="1" stop-color="#a94a6b"/>
    </radialGradient>
    <radialGradient id="gPearlGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff7fa8" stop-opacity=".9"/><stop offset="1" stop-color="#ff7fa8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gDome" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#dff4ee"/><stop offset=".5" stop-color="#7fb6c2"/>
      <stop offset="1" stop-color="#3e7d94"/>
    </linearGradient>
    <radialGradient id="gDomeLit" cx=".5" cy=".75" r=".8">
      <stop offset="0" stop-color="#4fe3c8" stop-opacity=".8"/><stop offset="1" stop-color="#4fe3c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gTowerBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d87ad"/><stop offset=".5" stop-color="#8fb4d4"/>
      <stop offset="1" stop-color="#4a6f96"/>
    </linearGradient>
    <linearGradient id="gSTower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ea4c8"/><stop offset=".45" stop-color="#cfe0ee"/>
      <stop offset="1" stop-color="#6a8fb5"/>
    </linearGradient>
    <linearGradient id="gJin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6a48"/><stop offset=".5" stop-color="#c39a68"/>
      <stop offset="1" stop-color="#7a5c40"/>
    </linearGradient>
    <linearGradient id="gMTower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f9cc4"/><stop offset=".55" stop-color="#a9cbe4"/>
      <stop offset="1" stop-color="#5580a8"/>
    </linearGradient>
    <linearGradient id="gWarmWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a4a"/><stop offset="1" stop-color="#c85a3a"/>
    </linearGradient>
    <linearGradient id="gGlit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity=".8"/><stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gVig" cx=".5" cy=".46" r=".75">
      <stop offset=".65" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".28"/>
    </radialGradient>
    <filter id="fBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="fGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <pattern id="pWinLit" width="14" height="11" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="3.4" height="4.4" fill="#ffd98a"/>
      <rect x="8" y="6" width="3.4" height="4.4" fill="#ffc46a"/>
    </pattern>
    <pattern id="pWinLitDense" width="10" height="8" patternUnits="userSpaceOnUse">
      <rect x="1.5" y="1.5" width="2.6" height="3" fill="#ffe2a0"/>
      <rect x="6" y="4.5" width="2.6" height="3" fill="#ffbe6e"/>
    </pattern>
    <pattern id="pWinDay" width="14" height="11" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="3.4" height="4.4" fill="#9db3c6"/>
      <rect x="8" y="6" width="3.4" height="4.4" fill="#aebfcd"/>
    </pattern>
    <pattern id="pArch" width="15.5" height="130" patternUnits="userSpaceOnUse">
      <path d="M 4,60 L 4,74 M 11.5,60 L 11.5,74 M 4,67 L 11.5,67" stroke="#5a6f82" stroke-width="1.4"/>
      <path d="M 3.5,78 L 3.5,124 L 12,124 L 12,78 A 4.2,6 0 0 0 3.5,78 Z" fill="#4d637a"/>
      <ellipse cx="7.7" cy="78" rx="4.2" ry="5" fill="#5d7488"/>
    </pattern>
    <clipPath id="cPearlUp"><circle cx="118" cy="150" r="38"/></clipPath>
    <clipPath id="cPearlLow"><circle cx="118" cy="600" r="52"/></clipPath>
    <clipPath id="cDomeL"><circle cx="140" cy="712" r="66"/></clipPath>
    <clipPath id="cDomeR"><circle cx="422" cy="694" r="62"/></clipPath>
  </defs>

  <!-- ===================== SKY ===================== -->
  <rect x="0" y="0" width="720" height="784" fill="url(#gSkyNight)"/>

  <!-- stars -->
  <g class="stars cyc" fill="#fff">
    <g class="tw1">
      <circle cx="40" cy="40" r="1.4"/><circle cx="200" cy="30" r="1.1"/><circle cx="330" cy="55" r="1.6"/>
      <circle cx="470" cy="80" r="1.2"/><circle cx="610" cy="95" r="1.5"/><circle cx="70" cy="140" r="1"/>
      <circle cx="300" cy="130" r="1.3"/><circle cx="520" cy="120" r="1.1"/><circle cx="240" cy="210" r="1.4"/>
      <circle cx="30" cy="260" r="1"/><circle cx="270" cy="280" r="1.2"/><circle cx="620" cy="330" r="1.4"/>
      <circle cx="200" cy="360" r="1"/><circle cx="660" cy="420" r="1.3"/><circle cx="260" cy="430" r="1.1"/>
      <circle cx="70" cy="500" r="1.4"/><circle cx="640" cy="500" r="1"/>
    </g>
    <g class="tw2">
      <circle cx="120" cy="70" r="1.2"/><circle cx="260" cy="90" r="1.5"/><circle cx="400" cy="25" r="1"/>
      <circle cx="540" cy="40" r="1.3"/><circle cx="680" cy="30" r="1.6"/><circle cx="180" cy="160" r="1.1"/>
      <circle cx="420" cy="150" r="1.4"/><circle cx="640" cy="160" r="1"/><circle cx="100" cy="220" r="1.3"/>
      <circle cx="360" cy="190" r="1"/><circle cx="480" cy="230" r="1.5"/><circle cx="690" cy="210" r="1.1"/>
      <circle cx="150" cy="300" r="1.4"/><circle cx="500" cy="300" r="1"/><circle cx="700" cy="270" r="1.2"/>
      <circle cx="60" cy="380" r="1.5"/><circle cx="340" cy="340" r="1.1"/><circle cx="520" cy="470" r="1.3"/>
      <circle cx="380" cy="460" r="1"/>
    </g>
    <g class="tw3">
      <circle cx="540" cy="120" r="0.9"/><circle cx="360" cy="60" r="1.2"/><circle cx="620" cy="250" r="1"/>
      <circle cx="455" cy="190" r="1.3"/><circle cx="215" cy="115" r="0.9"/><circle cx="90" cy="185" r="1.2"/>
      <circle cx="585" cy="205" r="1"/><circle cx="320" cy="255" r="1.3"/><circle cx="440" cy="330" r="0.9"/>
      <circle cx="130" cy="490" r="1.2"/><circle cx="480" cy="540" r="1"/><circle cx="565" cy="380" r="1.3"/>
    </g>
  </g>

  <!-- moon : crosses the sky during night part of the cycle -->
  <g class="moonO cyc">
    <g>
      <animateMotion dur="60s" repeatCount="indefinite" calcMode="linear"
        keyPoints="0;0;1;1" keyTimes="0;0.56;0.94;1"
        path="M -70,660 C 140,60 560,60 790,660"/>
      <circle cx="0" cy="0" r="46" fill="url(#gMoonHalo)"/>
      <circle cx="0" cy="0" r="17" fill="url(#gMoon)"/>
      <circle cx="-5" cy="-4" r="3.4" fill="#c6d2e4" opacity=".8"/>
      <circle cx="4" cy="5" r="2.4" fill="#c6d2e4" opacity=".7"/>
      <circle cx="7" cy="-6" r="1.6" fill="#c6d2e4" opacity=".7"/>
    </g>
  </g>

  <!-- sun : rises left of frame, arcs over, sets behind the right skyline -->
  <g class="sunO cyc">
    <g>
      <animateMotion dur="60s" repeatCount="indefinite" calcMode="linear"
        keyPoints="0;1;1" keyTimes="0;0.55;1"
        path="M -60,650 Q 360,-230 780,650"/>
      <circle class="redSun cyc" cx="0" cy="0" r="60" fill="url(#gSunRed)"/>
      <circle cx="0" cy="0" r="48" fill="url(#gSun)"/>
      <circle cx="0" cy="0" r="19" fill="#fff6c8"/>
    </g>
  </g>

  <!-- dawn / dusk warm glow -->
  <rect class="glow cyc" x="0" y="0" width="720" height="784" fill="url(#gSkySunset)"/>
  <!-- day sky -->
  <rect class="skyDay cyc" x="0" y="0" width="720" height="784" fill="url(#gSkyDay)"/>

  <!-- clouds -->
  <g class="cloud" opacity=".9">
    <g class="drift" style="animation-duration:95s;">
      <ellipse cx="90" cy="120" rx="52" ry="13"/><ellipse cx="120" cy="110" rx="34" ry="11"/>
      <ellipse cx="60" cy="112" rx="26" ry="9"/>
    </g>
  </g>
  <g class="cloud" opacity=".75">
    <g class="drift" style="animation-duration:125s; animation-delay:-70s;">
      <ellipse cx="300" cy="210" rx="64" ry="12"/><ellipse cx="340" cy="200" rx="36" ry="10"/>
    </g>
  </g>
  <g class="cloud" opacity=".65">
    <g class="drift" style="animation-duration:110s; animation-delay:-40s;">
      <ellipse cx="540" cy="70" rx="44" ry="10"/><ellipse cx="565" cy="62" rx="26" ry="8"/>
    </g>
  </g>

  <!-- ===================== CITY ===================== -->
  <g id="city">
    <!-- far-left cream slab cluster -->
    <rect x="0" y="560" width="40" height="224" fill="#c9c2b2"/>
    <rect x="0" y="560" width="14" height="224" fill="#b3ab9a"/>
    <rect x="34" y="480" width="32" height="304" fill="#d8d2c2"/>
    <rect x="34" y="480" width="10" height="304" fill="#beb6a4"/>
    <rect x="36" y="470" width="8" height="12" fill="#a89f8c"/>
    <rect x="64" y="516" width="46" height="268" fill="#cfc8b8"/>
    <rect x="64" y="516" width="14" height="268" fill="#b7ae9c"/>
    <rect x="150" y="545" width="38" height="239" fill="#cdc6b6"/>
    <rect x="150" y="545" width="11" height="239" fill="#b5ac9a"/>
    <rect x="182" y="585" width="36" height="199" fill="#d6d0c0"/>
    <rect x="182" y="585" width="10" height="199" fill="#bcb4a2"/>
    <rect x="0" y="560" width="218" height="224" fill="url(#pWinDay)" opacity=".5"/>

    <!-- green glass slab -->
    <rect x="215" y="505" width="38" height="279" fill="#3f8a6e"/>
    <rect x="215" y="505" width="12" height="279" fill="#2f6f56"/>
    <rect x="217" y="509" width="34" height="271" fill="url(#pWinDay)" opacity=".35"/>

    <!-- curved crown tower with red M mark -->
    <path d="M 290,784 L 290,486 Q 292,458 318,454 Q 348,451 366,468 L 368,784 Z" fill="url(#gMTower)"/>
    <path d="M 290,784 L 290,486 Q 292,458 318,454 L 316,784 Z" fill="#4d779e" opacity=".55"/>
    <ellipse cx="328" cy="470" rx="30" ry="9" fill="#e8f1f8" opacity=".9"/>
    <text x="306" y="502" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#c0392b">M</text>
    <rect x="316" y="452" width="1.6" height="26" fill="#7f97ac"/>

    <!-- small twin pavilions behind convention centre -->
    <rect x="300" y="616" width="18" height="66" fill="#e3e0d2"/>
    <rect x="324" y="616" width="18" height="66" fill="#e3e0d2"/>
    <path d="M 300,616 L 309,604 L 318,616 Z" fill="#4f9a8e"/>
    <path d="M 324,616 L 333,604 L 342,616 Z" fill="#4f9a8e"/>

    <!-- small antenna mast -->
    <rect x="351" y="552" width="2" height="90" fill="#8b98a5"/>
    <circle class="beacon" cx="352" cy="550" r="2.4" fill="#ff3b30"/>

    <!-- blue glass slab tower (flat top) -->
    <rect x="405" y="382" width="47" height="402" fill="url(#gTowerBlue)"/>
    <rect x="405" y="382" width="14" height="402" fill="#41648c"/>
    <rect x="409" y="386" width="39" height="394" fill="url(#pWinDay)" opacity=".28"/>
    <rect x="424" y="366" width="7" height="16" fill="#5d87ad"/>

    <!-- white slab behind SWFC -->
    <rect x="530" y="470" width="56" height="314" fill="#cfd8de"/>
    <rect x="530" y="470" width="16" height="314" fill="#b4c0c8"/>
    <rect x="534" y="476" width="48" height="304" fill="url(#pWinDay)" opacity=".4"/>

    <!-- Shanghai World Financial Center : tapered with trapezoid aperture (sky shows through) -->
    <path fill-rule="evenodd" fill="url(#gTowerBlue)"
      d="M 452,784 L 466,262 L 512,262 L 526,784 Z
         M 476,270 L 503,270 L 497,312 L 482,312 Z"/>
    <path fill-rule="evenodd" fill="#3f6690" opacity=".5"
      d="M 452,784 L 466,262 L 476,262 L 464,784 Z"/>
    <path d="M 470,330 L 508,330 M 468,394 L 510,394 M 466,462 L 512,462 M 464,534 L 514,534 M 462,610 L 517,610 M 460,690 L 520,690"
