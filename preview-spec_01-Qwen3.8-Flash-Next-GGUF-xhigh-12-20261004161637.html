<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陸家嘴天際線 · 日夜循環 SVG — spec_01</title>
<style>
  :root { --cycle: 40s; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070f; }
  .stage { position: fixed; inset: 0; }
  svg.scene { width: 100%; height: 100%; display: block; }

  /* ============ cycle-synced layers (all share --cycle so phases stay in sync) ============ */
  .layer-day   { animation: dayFade   var(--cycle) linear infinite both; }
  .layer-dusk  { animation: duskFade  var(--cycle) linear infinite both; }
  .lights      { animation: lightsOn  var(--cycle) linear infinite both; }
  .night-shade { animation: shadeOn   var(--cycle) linear infinite both; filter: brightness(.14) saturate(.65); }
  #stars       { animation: starsFade var(--cycle) linear infinite both; }
  #clouds      { animation: dayFade   var(--cycle) linear infinite both; }
  .water-dusk  { animation: duskWater var(--cycle) linear infinite both; }
  .water-night { animation: shadeOn   var(--cycle) linear infinite both; }

  @keyframes dayFade  { 0% {opacity:1} 38% {opacity:1} 52% {opacity:0} 86% {opacity:0} 96% {opacity:1} 100% {opacity:1} }
  @keyframes duskFade { 0% {opacity:0} 36% {opacity:0} 47% {opacity:.95} 52% {opacity:.8} 60% {opacity:0} 82% {opacity:0} 90% {opacity:.7} 98% {opacity:0} 100% {opacity:0} }
  @keyframes lightsOn { 0% {opacity:0} 44% {opacity:0} 58% {opacity:1} 86% {opacity:1} 96% {opacity:0} 100% {opacity:0} }
  @keyframes shadeOn  { 0% {opacity:0} 46% {opacity:0} 60% {opacity:.92} 86% {opacity:.92} 97% {opacity:0} 100% {opacity:0} }
  @keyframes starsFade{ 0% {opacity:0} 52% {opacity:0} 62% {opacity:1} 84% {opacity:1} 93% {opacity:0} 100% {opacity:0} }
  @keyframes duskWater{ 0% {opacity:0} 36% {opacity:0} 47% {opacity:.55} 52% {opacity:.45} 60% {opacity:0} 82% {opacity:0} 90% {opacity:.4} 98% {opacity:0} 100% {opacity:0} }

  /* ============ sun / moon arcs (pivot below horizon) ============ */
  #sun-arc, #moon-arc { transform-box: view-box; transform-origin: 520px 820px; }
  #sun-arc  { animation: sunArc var(--cycle) linear infinite both; }
  #moon-arc { animation: moonArc var(--cycle) linear infinite both; }
  #sun-glow-group { animation: sunShow var(--cycle) linear infinite both; }
  #moon-glow-group{ animation: moonShow var(--cycle) linear infinite both; }
  #sun-core { animation: sunColor var(--cycle) linear infinite both; }

  /* sun keeps rotating the "long way" (through straight-down) while hidden, so it never pops across the sky */
  @keyframes sunArc   { 0% {transform:rotate(-30deg)} 14% {transform:rotate(0deg)} 38% {transform:rotate(45deg)} 47% {transform:rotate(66deg)} 51% {transform:rotate(74deg)} 54% {transform:rotate(96deg)} 94% {transform:rotate(96deg)} 99.9% {transform:rotate(330deg)} 100% {transform:rotate(330deg)} }
  @keyframes sunShow  { 0% {opacity:1} 38% {opacity:1} 45% {opacity:.15} 47% {opacity:0} 96% {opacity:0} 99% {opacity:.6} 100% {opacity:1} }
  @keyframes sunColor { 0% {fill:#ffd35e} 10% {fill:#fff3c4} 36% {fill:#fff3c4} 45% {fill:#ff7a2e} 96% {fill:#ff7a2e} 100% {fill:#ffd35e} }
  /* moon: hidden below right horizon by day, repositions unseen, then rises left and crosses the night sky */
  @keyframes moonArc  { 0% {transform:rotate(115deg)} 47% {transform:rotate(115deg)} 49% {transform:rotate(-95deg)} 71% {transform:rotate(0deg)} 92% {transform:rotate(95deg)} 94% {transform:rotate(115deg)} 100% {transform:rotate(115deg)} }
  @keyframes moonShow { 0% {opacity:0} 51% {opacity:0} 56% {opacity:1} 89% {opacity:1} 93% {opacity:0} 100% {opacity:0} }

  /* ============ free-running motion ============ */
  .star { animation: twinkle 2.6s ease-in-out infinite alternate; }
  @keyframes twinkle { from {opacity:.25} to {opacity:1} }

  .cloud-a { animation: drift 130s linear infinite both; }
  .cloud-b { animation: drift 95s  linear infinite both; animation-delay: -40s; }
  @keyframes drift { from {transform:translateX(-260px)} to {transform:translateX(1460px)} }

  #barge { animation: sail 80s linear infinite both; }
  @keyframes sail { from {transform:translateX(1350px)} to {transform:translateX(-320px)} }

  .bob    { animation: bobbing 3.4s ease-in-out infinite alternate; }
  .bob-slow { animation: bobbing 4.6s ease-in-out infinite alternate; animation-delay:-1.5s; }
  @keyframes bobbing { from {transform:translateY(0)} to {transform:translateY(3px)} }

  .shimmer { animation: shim var(--dur,7s) ease-in-out infinite alternate; }
  @keyframes shim { from {transform:translateX(-26px); opacity:.10} to {transform:translateX(26px); opacity:.28} }

  .beacon { animation: blink 1.4s steps(2, jump-none) infinite; }
  @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:.08} }

  .glitter { animation: glitterPulse 3s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 600px 702px; }
  @keyframes glitterPulse { from {transform:scaleX(.9)} to {transform:scaleX(1.12)} }

  .caption {
    position: fixed; left: 18px; bottom: 14px; z-index: 5;
    font: 500 13px/1.5 system-ui, "Noto Sans TC", sans-serif;
    color: rgba(255,255,255,.72); letter-spacing: .12em;
    text-shadow: 0 1px 6px rgba(0,0,0,.6); pointer-events: none;
  }
</style>
</head>

<script>
  // deterministic pseudo-random stars so every load looks identical
  const svgNS = "http://www.w3.org/2000/svg";
  let seed = 42;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const stars = document.getElementById("stars");
  for (let i = 0; i < 90; i++) {
    const c = document.createElementNS(svgNS, "circle");
    c.setAttribute("cx", (rnd() * 1200).toFixed(1));
    c.setAttribute("cy", (rnd() * 430 + 8).toFixed(1));
    c.setAttribute("r", (0.6 + rnd() * 1.3).toFixed(2));
    c.setAttribute("fill", "#eaf2ff");
    c.setAttribute("class", "star");
    c.style.animationDuration = (1.8 + rnd() * 2.4).toFixed(2) + "s";
    c.style.animationDelay = (-rnd() * 4).toFixed(2) + "s";
    stars.appendChild(c);
  }
</script>
