<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>preview-spec_01 — 上海陸家嘴 日夜循環 SVG</title>
<style>
  :root { --cycle: 60s; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0b0d12; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Segoe UI", "Noto Sans TC", sans-serif; }
  .stage { position: relative; width: min(96vmin, 900px); aspect-ratio: 1 / 1; border-radius: 6px; overflow: hidden; box-shadow: 0 12px 60px rgba(0,0,0,.6); }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 46%, transparent 62%, rgba(6,8,16,.34) 100%); }
  .hud { position: absolute; left: 14px; top: 12px; z-index: 5; pointer-events: none; text-shadow: 0 1px 4px rgba(0,0,0,.55); }
  .hud .t { color: #fff; font-size: clamp(15px, 2.4vmin, 22px); font-weight: 600; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  .hud .s { color: rgba(255,255,255,.78); font-size: clamp(9px, 1.5vmin, 13px); letter-spacing: .18em; margin-top: 2px; }
  .bar { position: absolute; left: 14px; right: 14px; bottom: 10px; height: 5px; border-radius: 3px; z-index: 5; pointer-events: none;
         background: linear-gradient(90deg, #1a2a55 0%, #6a4a86 4%, #ffb36b 8%, #7cb8e2 25%, #ffb36b 47%, #16264e 58%, #060d28 75%, #16264e 92%, #6a4a86 97%, #1a2a55 100%);
         box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .bar i { position: absolute; top: -3px; width: 2px; height: 11px; background: #fff; border-radius: 1px; box-shadow: 0 0 6px #fff; }

  /* ---------- layer cross-fades (one shared --cycle timeline) ---------- */
  .a-night  { animation: a-night  var(--cycle) linear infinite; }
  .a-dawn   { animation: a-dawn   var(--cycle) linear infinite; }
  .a-day    { animation: a-day    var(--cycle) linear infinite; }
  .a-dusk   { animation: a-dusk   var(--cycle) linear infinite; }
  .a-dark   { animation: a-dark   var(--cycle) linear infinite; }
  .a-gold   { animation: a-gold   var(--cycle) linear infinite; }
  .a-lights { animation: a-lights var(--cycle) linear infinite; }
  .a-stars  { animation: a-stars  var(--cycle) linear infinite; }
  .a-clouds { animation: a-clouds var(--cycle) linear infinite; }
  .a-haze   { animation: a-haze   var(--cycle) linear infinite; }

  @keyframes a-dawn  { 0% {opacity:1}   7% {opacity:0}  90% {opacity:0} 97% {opacity:1} 100%{opacity:1} }
  @keyframes a-day   { 0% {opacity:0}   9% {opacity:1}  40% {opacity:1} 50% {opacity:0} 100%{opacity:0} }
  @keyframes a-dusk  { 0% {opacity:0}  40% {opacity:0}  47% {opacity:1} 56% {opacity:0} 100%{opacity:0} }
  @keyframes a-night { 0% {opacity:0}  54% {opacity:0}  60% {opacity:1} 88% {opacity:1} 96% {opacity:0} 100%{opacity:0} }
  @keyframes a-dark  { 0% {opacity:.38} 9% {opacity:0}  42% {opacity:0} 55% {opacity:.6} 62% {opacity:.66} 88% {opacity:.66} 95% {opacity:.32} 100%{opacity:.38} }
  @keyframes a-gold  { 0% {opacity:.55} 9% {opacity:0}  40% {opacity:0} 46% {opacity:.8} 53% {opacity:0} 100%{opacity:.55} }
  @keyframes a-lights{ 0% {opacity:.45} 9% {opacity:0}  48% {opacity:0} 56% {opacity:1} 90% {opacity:1} 96% {opacity:.45} 100%{opacity:.45} }
  @keyframes a-stars { 0% {opacity:.25} 7% {opacity:0}  55% {opacity:0} 62% {opacity:1} 90% {opacity:1} 96% {opacity:0} 100%{opacity:.25} }
  @keyframes a-clouds{ 0% {opacity:.45} 12%{opacity:.85} 40%{opacity:.85} 50%{opacity:.6} 60%{opacity:.16} 90%{opacity:.16} 97%{opacity:.45} 100%{opacity:.45} }
  @keyframes a-haze  { 0% {opacity:.08} 12%{opacity:.3}  40%{opacity:.3}  50%{opacity:.4} 62%{opacity:.1} 90%{opacity:.1} 100%{opacity:.08} }

  .tw { animation: tw var(--d, 3s) ease-in-out var(--dl, 0s) infinite; }
  @keyframes tw { 0% {opacity:.15} 50% {opacity:1} 100%{opacity:.15} }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 720 720" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <title>上海陸家嘴天際線 — 日夜循環</title>
  <desc>Recreation of .spec/spec_01.png (Shanghai Pudong skyline from the Huangpu River) as an infinitely looping SVG day/night animation.</desc>

  <defs>
    <!-- ======= sky / water gradients ======= -->
    <linearGradient id="gDaySky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1858ad"/><stop offset=".35" stop-color="#2f7cc6"/>
      <stop offset=".66" stop-color="#7cb8e2"/><stop offset=".88" stop-color="#c6e2f2"/>
      <stop offset="1" stop-color="#e2f0f6"/>
    </linearGradient>
    <linearGradient id="gDawnSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2d5e"/><stop offset=".35" stop-color="#5a4a86"/>
      <stop offset=".6" stop-color="#b56a86"/><stop offset=".78" stop-color="#f09a5e"/>
      <stop offset=".92" stop-color="#ffc98a"/><stop offset="1" stop-color="#ffe3b8"/>
    </linearGradient>
    <linearGradient id="gDuskSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101c46"/><stop offset=".35" stop-color="#3f3168"/>
      <stop offset=".6" stop-color="#8e4468"/><stop offset=".78" stop-color="#e06a42"/>
      <stop offset=".9" stop-color="#ff9c55"/><stop offset="1" stop-color="#ffc27a"/>
    </linearGradient>
    <linearGradient id="gNightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02040f"/><stop offset=".4" stop-color="#060d28"/>
      <stop offset=".72" stop-color="#0c1a40"/><stop offset="1" stop-color="#173059"/>
    </linearGradient>
    <linearGradient id="gDayWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74b0d8"/><stop offset=".3" stop-color="#4a8ab8"/>
      <stop offset="1" stop-color="#2c6391"/>
    </linearGradient>
    <linearGradient id="gWaterNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a34"/><stop offset=".5" stop-color="#071022"/>
      <stop offset="1" stop-color="#040a16"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity="0"/>
      <stop offset=".42" stop-color="#ff9a3c" stop-opacity="0"/>
      <stop offset=".78" stop-color="#ff9c45" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffb45e" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="gHaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcebf5" stop-opacity="0"/><stop offset="1" stop-color="#dcebf5"/>
    </linearGradient>
    <linearGradient id="gGlowUp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb35e" stop-opacity="0"/><stop offset="1" stop-color="#ffb35e" stop-opacity=".75"/>
    </linearGradient>

    <!-- ======= facade gradients ======= -->
    <linearGradient id="gST" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fa2c4"/><stop offset=".35" stop-color="#c9dbeb"/>
      <stop offset=".62" stop-color="#8fb0cc"/><stop offset="1" stop-color="#5f86ac"/>
    </linearGradient>
    <linearGradient id="gSwfc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d7ba8"/><stop offset=".5" stop-color="#35608f"/><stop offset="1" stop-color="#2b517c"/>
    </linearGradient>
    <linearGradient id="gGlassB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#82aecb"/><stop offset=".5" stop-color="#4d7ba0"/><stop offset="1" stop-color="#37618a"/>
    </linearGradient>
    <linearGradient id="gT2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4f9"/><stop offset=".55" stop-color="#c3d4e2"/><stop offset="1" stop-color="#a7bdd0"/>
    </linearGradient>
    <linearGradient id="gJM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe4cd"/><stop offset=".5" stop-color="#dcc9a6"/><stop offset="1" stop-color="#c6ad83"/>
    </linearGradient>
    <linearGradient id="gGreen1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63c99a"/><stop offset=".55" stop-color="#2e9a6c"/><stop offset="1" stop-color="#1f7a55"/>
    </linearGradient>
    <linearGradient id="gGreen2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fae7e"/><stop offset="1" stop-color="#1a6b4c"/>
    </linearGradient>
    <linearGradient id="gBeige" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe3c8"/><stop offset="1" stop-color="#cdbd9a"/>
    </linearGradient>
    <linearGradient id="gPearlShaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfc4b6"/><stop offset=".5" stop-color="#efe8dd"/><stop offset="1" stop-color="#b3a799"/>
    </linearGradient>
    <radialGradient id="gSphere" cx=".38" cy=".34" r=".85">
      <stop offset="0" stop-color="#ffd9b0"/><stop offset=".3" stop-color="#e8826a"/>
      <stop offset=".55" stop-color="#c94a62"/><stop offset=".8" stop-color="#a23a58"/>
      <stop offset="1" stop-color="#7c3050"/>
    </radialGradient>
    <radialGradient id="gSphereSm" cx=".38" cy=".34" r=".85">
      <stop offset="0" stop-color="#ffcfa8"/><stop offset=".45" stop-color="#d95f6a"/><stop offset="1" stop-color="#93384f"/>
    </radialGradient>
    <radialGradient id="gDome" cx=".4" cy=".32" r=".9">
      <stop offset="0" stop-color="#a8d8e8"/><stop offset=".45" stop-color="#5a9ab8"/>
      <stop offset=".8" stop-color="#2d6d92"/><stop offset="1" stop-color="#1d5478"/>
    </radialGradient>
    <radialGradient id="gDomeSm" cx=".4" cy=".32" r=".9">
      <stop offset="0" stop-color="#9cc8dc"/><stop offset=".55" stop-color="#4c88a8"/><stop offset="1" stop-color="#245a7e"/>
    </radialGradient>
    <linearGradient id="gRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fae9c"/><stop offset="1" stop-color="#6a8c7a"/>
    </linearGradient>

    <!-- ======= celestial ======= -->
    <radialGradient id="gSun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fffdf0"/><stop offset=".55" stop-color="#ffe9a0"/><stop offset="1" stop-color="#ffc25e"/>
    </radialGradient>
    <radialGradient id="gSunHalo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffdf9a" stop-opacity=".9"/><stop offset=".45" stop-color="#ffcf7d" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ffcf7d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gMoonHalo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#cfe0ff" stop-opacity=".6"/><stop offset=".5" stop-color="#bcd2ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#bcd2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gPinkGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff9ad8" stop-opacity=".95"/><stop offset=".45" stop-color="#ff5fae" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ff5fae" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gWarmGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity=".9"/><stop offset=".5" stop-color="#ffbf60" stop-opacity=".4"/>
      <stop offset="1" stop-color="#ffbf60" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gCoolGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#9adcff" stop-opacity=".85"/><stop offset=".5" stop-color="#6fc4ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#6fc4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gReflWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf8a" stop-opacity=".75"/><stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gReflPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6fb8" stop-opacity=".7"/><stop offset="1" stop-color="#ff6fb8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gReflBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd4ff" stop-opacity=".7"/><stop offset="1" stop-color="#8fd4ff" stop-opacity="0"/>
    </linearGradient>

    <!-- ======= facade patterns ======= -->
    <pattern id="pSTripe" width="7" height="12" patternUnits="userSpaceOnUse">
      <rect width="1.2" height="12" fill="#eef5fb" opacity=".55"/>
    </pattern>
    <pattern id="pGridD" width="9" height="11" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="5" height="7" fill="#5b6b77" opacity=".45"/>
    </pattern>
    <pattern id="pGridW" width="10" height="12" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="6" height="8" fill="#6d7d89" opacity=".5"/>
    </pattern>
    <pattern id="pVertJM" width="5" height="10" patternUnits="userSpaceOnUse">
      <rect width="1" height="10" fill="#a58a5e" opacity=".4"/>
    </pattern>
    <pattern id="pWin" width="12" height="16" patternUnits="userSpaceOnUse">
      <rect x="1.5" y="2" width="4" height="6" fill="#ffd98a" opacity=".9"/>
      <rect x="7.5" y="9" width="3" height="5" fill="#ffe9b5" opacity=".75"/>
    </pattern>
    <pattern id="pWin2" width="14" height="18" patternUnits="userSpaceOnUse">
      <rect x="2" y="3" width="4" height="6" fill="#ffd98a" opacity=".8"/>
      <rect x="9" y="4" width="3" height="5" fill="#cfeaff" opacity=".8"/>
      <rect x="4" y="12" width="5" height="4" fill="#ffcf7a" opacity=".7"/>
    </pattern>
    <pattern id="pArchWin" width="18" height="50" patternUnits="userSpaceOnUse">
      <rect x="5" y="8" width="7" height="42" fill="#ffdf9d" opacity=".9"/>
    </pattern>
    <pattern id="pLatA" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="1.7" height="11" fill="#ffffff" opacity=".34"/>
    </pattern>
    <pattern id="pLatB" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="1.7" height="11" fill="#7c3050" opacity=".38"/>
    </pattern>
    <pattern id="pLatDome" width="15" height="15" patternUnits="userSpaceOnUse">
      <rect width="15" height="1.1" fill="#d8ecf4" opacity=".3"/>
      <rect width="1.1" height="15" fill="#d8ecf4" opacity=".3"/>
    </pattern>

    <filter id="fB3"  x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="fB6"  x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="fB10" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>

    <!-- ======= tower silhouettes (re-used: day fill + night lit fill) ======= -->
    <path id="sL3"     d="M0,372 L14,356 L46,356 L46,556 L0,556 Z"/>
    <path id="sL2"     d="M8,346 L22,332 L64,332 L78,346 L78,552 L8,552 Z"/>
    <path id="sL4"     d="M56,340 L94,334 L94,500 L56,500 Z"/>
    <path id="sL5"     d="M128,404 L144,390 L205,394 L205,548 L128,548 Z"/>
    <path id="sCurve"  d="M212,478 L212,370 C212,348 226,340 238,340 C252,340 262,349 262,370 L262,478 Z"/>
    <path id="sSail"   d="M222,478 L238,428 L250,404 L262,432 L268,478 Z"/>
    <path id="sT1"     d="M394,485 L394,292 L414,264 L452,274 L452,485 Z"/>
    <path id="sSwfc"   fill-rule="evenodd" d="M450,485 L457,198 L470,186 L508,186 L521,198 L527,485 Z M468,196 L510,196 L503,242 L475,242 Z"/>
    <path id="sJM"     d="M465,490 L465,392 L470,392 L470,340 L474,340 L474,300 L478,300 L478,276 L482,276 L483,258 L487,248 L491,258 L492,276 L496,276 L496,300 L500,300 L500,340 L504,340 L504,392 L509,392 L509,490 Z"/>
    <path id="sT2"     d="M512,480 L512,300 L530,262 L560,258 L582,282 L582,480 Z"/>
    <path id="sST"     d="M618,58 Q612,45 623,41 L661,39 Q670,43 668,56 C675,160 664,300 688,500 L610,500 C617,320 610,170 618,58 Z"/>
    <path id="sG1"     d="M650,362 L662,344 L692,344 L692,540 L650,540 Z"/>
    <path id="sG2"     d="M692,384 L720,372 L720,540 L692,540 Z"/>
    <path id="sBlock1" d="M548,430 L560,414 L644,414 L652,428 L652,505 L548,505 Z"/>
    <path id="sHall"   d="M203,470 L213,460 L403,460 L411,470 L411,556 L203,556 Z"/>

    <g id="cloud">
      <path d="M-26,0 a10,8 0 0 1 10,-8 a13,10 0 0 1 24,-4 a11,9 0 0 1 19,3 a8,7 0 0 1 7,9 z" fill="#ffffff"/>
      <ellipse cx="-8" cy="-2" rx="20" ry="7" fill="#ffffff"/>
      <ellipse cx="14" cy="-4" rx="16" ry="7" fill="#ffffff"/>
    </g>

    <g id="barge">
      <polygon points="0,18 128,15 124,30 7,32" fill="#33383f"/>
      <rect x="2" y="27" width="124" height="3" fill="#7a2c22" opacity=".85"/>
      <ellipse cx="22" cy="15" rx="14" ry="7" fill="#4a423a"/>
      <ellipse cx="48" cy="14" rx="15" ry="8" fill="#453d35"/>
      <ellipse cx="74" cy="15" rx="14" ry="7" fill="#4a423a"/>
      <rect x="95" y="1" width="25" height="16" rx="2" fill="#2e77c9"/>
      <rect x="95" y="1" width="25" height="3" fill="#4d92dd"/>
      <rect x="90" y="17" width="32" height="4" fill="#262a30"/>
    </g>

    <g id="ferry">
      <polygon points="0,10 36,10 32,18 4,18" fill="#e9e9e6"/>
      <rect x="8" y="2" width="18" height="8" rx="2" fill="#f6f6f4"/>
      <polygon points="36,10 30,10 33,4" fill="#d8d8d4"/>
    </g>
  </defs>

  <!-- ================= SKY ================= -->
  <g id="sky">
    <rect class="a-night"  x="0" y="0" width="720" height="592" fill="url(#gNightSky)"/>
    <rect class="a-day"    x="0" y="0" width="720" height="592" fill="url(#gDaySky)"/>
    <rect class="a-dawn"   x="0" y="0" width="720" height="592" fill="url(#gDawnSky)"/>
    <rect class="a-dusk"   x="0" y="0" width="720" height="592" fill="url(#gDuskSky)"/>
  </g>

  <!-- ================= STARS (generated by script) ================= -->
  <g id="stars" class="a-stars"></g>

  <!-- ================= SUN / MOON: 360deg orbit per cycle ================= -->
  <g id="celest">
    <animateTransform attributeName="transform" attributeType="XML" type="rotate"
                      from="-90 360 640" to="270 360 640" dur="60s" repeatCount="indefinite"/>
    <g>
      <circle cx="360" cy="302" r="34" fill="url(#gSunHalo)"/>
      <circle cx="360" cy="302" r="12" fill="url(#gSun)">
        <animate attributeName="fill" values="#ff8a3d;#fff3c4;#fff3c4;#ff7a33;#ff8a3d"
                 keyTimes="0;0.14;0.38;0.5;1" dur="60s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle cx="360" cy="974" r="26" fill="url(#gMoonHalo)"/>
      <circle cx="360" cy="974" r="11" fill="#f2f4e6"/>
      <circle cx="356" cy="971" r="2.4" fill="#d8dccb" opacity=".7"/>
      <circle cx="364" cy="977" r="1.8" fill="#d8dccb" opacity=".6"/>
      <circle cx="361" cy="968" r="1.3" fill="#d8dccb" opacity=".5"/>
    </g>
  </g>

  <!-- ================= CLOUDS (drifting) ================= -->
  <g id="clouds" class="a-clouds">
    <g opacity=".85">
      <animateTransform attributeName="transform" type="translate" values="-140 0; 800 0" dur="150s" repeatCount="indefinite"/>
      <use href="#cloud" xlink:href="#cloud" transform="translate(60 84) scale(1.5)" opacity=".8"/>
      <use href="#cloud" xlink:href="#cloud" transform="translate(180 140) scale(1.1)" opacity=".6"/>
    </g>
    <g opacity=".7">
      <animateTransform attributeName="transform" type="translate" values="-320 0; 620 0" dur="200s" repeatCount="indefinite"/>
      <use href="#cloud" xlink:href="#cloud" transform="translate(400 62) scale(1.9)" opacity=".7"/>
      <use href="#cloud" xlink:href="#cloud" transform="translate(540 118) scale(1.2)" opacity=".55"/>
    </g>
    <g opacity=".6">
      <animateTransform attributeName="transform" type="translate" values="120 0; 840 0; -40 0; 120 0" keyTimes="0;0.4;0.41;1" dur="260s" repeatCount="indefinite"/>
      <use href="#cloud" xlink:href="#cloud" transform="translate(140 190) scale(1)" opacity=".5"/>
    </g>
  </g>

  <!-- ================= CITY (daytime shapes) ================= -->
  <g id="city">
    <!-- far left block -->
    <use href="#sL3" xlink:href="#sL3" fill="url(#gBeige)"/>
    <use href="#sL3" xlink:href="#sL3" fill="url(#pGridW)"/>
    <!-- pale tower with red crown -->
    <use href="#sL2" xlink:href="#sL2" fill="url(#gBeige)"/>

<div class="hud">
  <div class="t" id="clock">--:--</div>
  <div class="s" id="phase">上海 · 陸家嘴 — SVG 日夜循環 (60s / loop)</div>
</div>
<div class="bar"><i id="cyc"></i></div>
</div>

<script>
(function () {
  var CYCLE = 60000;

  // ---- starfield ----
  var NS = "http://www.w3.org/2000/svg";
  var stars = document.getElementById("stars");
  for (var i = 0; i < 130; i++) {
    var c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", (Math.random() * 720).toFixed(1));
    c.setAttribute("cy", (Math.random() * 420).toFixed(1));
    c.setAttribute("r", (0.5 + Math.random() * 1.1).toFixed(2));
    c.setAttribute("fill", Math.random() < 0.85 ? "#ffffff" : "#cfe0ff");
    c.setAttribute("opacity", (0.4 + Math.random() * 0.6).toFixed(2));
    if (Math.random() < 0.55) {
      c.setAttribute("class", "tw");
      c.style.setProperty("--d", (1.8 + Math.random() * 2.6).toFixed(2) + "s");
      c.style.setProperty("--dl", (Math.random() * 4).toFixed(2) + "s");
    }
    stars.appendChild(c);
  }

  // ---- clock synced to the CSS/SMIL cycle ----
  var clock = document.getElementById("clock");
  var cyc = document.getElementById("cyc");
  var phase = document.getElementById("phase");
  function tick() {
    var t = (performance.now() % CYCLE) / CYCLE;
    var h = (6 + t * 24) % 24;
    var hh = String(Math.floor(h)).padStart(2, "0");
    var mm = String(Math.floor((h % 1) * 60)).padStart(2, "0");
    clock.textContent = hh + ":" + mm;
    cyc.style.left = (t * 100).toFixed(2) + "%";
    var p = "夜晚";
    if (t < 0.07) p = "日出";
    else if (t < 0.42) p = "白晝";
    else if (t < 0.58) p = "黃昏";
    else if (t < 0.62) p = "入夜";
    phase.textContent = "上海 · 陸家嘴 — " + p + " (60s / loop)";
  }
  tick();
  setInterval(tick, 150);
})();
</script>
</body>
