<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shanghai Pudong · SVG Day-Night Loop</title>
<style>
:root{--T:48s;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#04060c}
body{display:grid;place-items:center;overflow:hidden}
svg.stage{display:block;width:min(100vw,calc(100vh * 745 / 742));height:auto;max-height:100vh;aspect-ratio:745/742}

.cyc,.lz-L,.lz-M,.lz-R,.lz-B,.gl,.tug,.tugBody{animation-duration:var(--T);animation-timing-function:linear;animation-iteration-count:infinite}
.kSkySunset{animation-name:kSkySunset}.kSkyDawn{animation-name:kSkyDawn}.kSkyNight{animation-name:kSkyNight}.kTintSunset{animation-name:kTintSunset}.kTintNight{animation-name:kTintNight}.kTintDawn{animation-name:kTintDawn}.kGlowSunset{animation-name:kGlowSunset}.kGlowDawn{animation-name:kGlowDawn}.kStars{animation-name:kStars}.kSun{animation-name:kSun}.kMoon{animation-name:kMoon}.kCloudFill{animation-name:kCloudFill}

/* sky layers */
@keyframes kSkySunset{0%,24%{opacity:0}34%,54%{opacity:1}60%,100%{opacity:0}}
@keyframes kSkyDawn{0%,72%{opacity:0}80%,93%{opacity:1}100%{opacity:0}}
@keyframes kSkyNight{0%,40%{opacity:0}52%,80%{opacity:1}90%,100%{opacity:0}}
@keyframes kStars{0%,42%{opacity:0}54%,80%{opacity:1}90%,100%{opacity:0}}

/* colour grading on the scene (masked multiply / screen layers) */
@keyframes kTintSunset{0%,24%{opacity:0}34%,44%{opacity:1}52%,100%{opacity:0}}
@keyframes kTintNight{0%,40%{opacity:0}52%,78%{opacity:1}90%,100%{opacity:0}}
@keyframes kTintDawn{0%,76%{opacity:0}86%,92%{opacity:1}100%{opacity:0}}
@keyframes kGlowSunset{0%,26%{opacity:0}35%{opacity:1}47%,100%{opacity:0}}
@keyframes kGlowDawn{0%,82%{opacity:0}88%,93%{opacity:1}100%{opacity:0}}

/* sun: enters top-right, sets behind the lime tower; rises at left and leaves through the top */
@keyframes kSun{
  0%,25%{transform:translate(800px,-120px);opacity:0}
  26%{transform:translate(792px,-70px);opacity:1}
  30%{transform:translate(766px,95px)}
  34%{transform:translate(745px,250px)}
  37%{transform:translate(737px,345px)}
  39.5%{transform:translate(733px,428px);opacity:1}
  40%{transform:translate(733px,445px);opacity:0}
  83%{transform:translate(30px,545px);opacity:0}
  84%{transform:translate(30px,520px);opacity:1}
  88%{transform:translate(30px,400px)}
  91%{transform:translate(16px,255px)}
  94%{transform:translate(-8px,125px)}
  97%{transform:translate(-46px,10px);opacity:1}
  98%,100%{transform:translate(-80px,-60px);opacity:0}
}
.sunStop:nth-child(1){animation:kSunS1 var(--T) linear infinite}
.sunStop:nth-child(2){animation:kSunS2 var(--T) linear infinite}
.sunStop:nth-child(3){animation:kSunS3 var(--T) linear infinite}
@keyframes kSunS1{0%,26%{stop-color:#fffbe2}36%,40%{stop-color:#ffd9a0}84%{stop-color:#ffcf96}97%,100%{stop-color:#fffbe2}}
@keyframes kSunS2{0%,26%{stop-color:#ffe08a}36%,40%{stop-color:#ff9a4a}84%{stop-color:#ffa860}97%,100%{stop-color:#ffe08a}}
@keyframes kSunS3{0%,26%{stop-color:#ffc24a}36%,40%{stop-color:#ff6a30}84%{stop-color:#ff7a3a}97%,100%{stop-color:#ffc24a}}

/* moon rises from behind the Bund roof, arcs over the open sky and fades at dawn */
@keyframes kMoon{
  0%,47%{transform:translate(396px,512px);opacity:0}
  49%{transform:translate(392px,490px);opacity:1}
  55%{transform:translate(338px,350px)}
  62%{transform:translate(296px,240px)}
  70%{transform:translate(300px,145px)}
  77%{transform:translate(352px,82px)}
  84%{transform:translate(432px,42px);opacity:1}
  90%{transform:translate(498px,12px);opacity:.5}
  92%,100%{transform:translate(520px,-14px);opacity:0}
}

/* clouds only show while the sky is coloured */
@keyframes kCloudFill{
  0%,24%{fill:#fff;opacity:0}
  32%{fill:#ff9c80;opacity:.55}
  40%{fill:#c06a90;opacity:.55}
  50%{fill:#2b3a78;opacity:.22}
  76%{fill:#26376f;opacity:.18}
  84%{fill:#ffa890;opacity:.5}
  92%{fill:#ffd0b0;opacity:.45}
  98%,100%{fill:#fff;opacity:0}
}
.cloudA{animation:kDriftA var(--T) ease-in-out infinite}
.cloudB{animation:kDriftB var(--T) ease-in-out infinite}
.cloudC{animation:kDriftA var(--T) ease-in-out infinite;animation-delay:calc(var(--T) / -3)}
.cloudD{animation:kDriftB var(--T) ease-in-out infinite;animation-delay:calc(var(--T) / -2)}
.cloudE{animation:kDriftA var(--T) ease-in-out infinite;animation-delay:calc(var(--T) / -5)}
@keyframes kDriftA{0%,100%{transform:translateX(-14px)}50%{transform:translateX(26px)}}
@keyframes kDriftB{0%,100%{transform:translateX(20px)}50%{transform:translateX(-28px)}}

/* stars */
.tw1{animation:kTw 3.1s ease-in-out infinite alternate}
.tw2{animation:kTw 4.3s ease-in-out -1.7s infinite alternate}
.tw3{animation:kTw 2.2s ease-in-out -0.6s infinite alternate}
@keyframes kTw{from{opacity:.3}to{opacity:1}}

/* lights switch on staggered by zone */
.lz-L,.lz-M,.lz-R,.lz-B{opacity:0}
.lz-L{animation-name:kLzL}.lz-M{animation-name:kLzM}.lz-R{animation-name:kLzR}.lz-B{animation-name:kLzB}
@keyframes kLzL{0%,38%{opacity:0}46%,80%{opacity:1}86%,100%{opacity:0}}
@keyframes kLzM{0%,40%{opacity:0}48%,82%{opacity:1}88%,100%{opacity:0}}
@keyframes kLzR{0%,42%{opacity:0}50%,78%{opacity:1}84%,100%{opacity:0}}
@keyframes kLzB{0%,36%{opacity:0}44%,84%{opacity:1}90%,100%{opacity:0}}
.tk{animation:kTk 2.6s steps(1) infinite}
@keyframes kTk{0%{opacity:1}30%{opacity:.15}55%{opacity:1}78%{opacity:.05}}
.blink{animation:kBlink 1.6s steps(1) infinite}
.blinkB{animation-delay:-.8s}
@keyframes kBlink{0%{opacity:1}45%{opacity:.08}}

/* Pearl Tower + dome LEDs */
.ledStop{animation:kLedStop 12s linear infinite}
.ledFill{animation:kLedFill 12s linear infinite}
.ledStroke{animation:kLedStroke 12s linear infinite}
@keyframes kLedStop{0%,100%{stop-color:#ff4f9a}25%{stop-color:#a35cff}50%{stop-color:#38b6ff}75%{stop-color:#ffb038}}
@keyframes kLedFill{0%,100%{fill:#ff6aa8}25%{fill:#b985ff}50%{fill:#5cc6ff}75%{fill:#ffc860}}
@keyframes kLedStroke{0%,100%{stroke:#ff6aa8}25%{stroke:#b985ff}50%{stroke:#5cc6ff}75%{stroke:#ffc860}}
.ledStopA{animation:kLedStopA 9s linear infinite}
.ledStrokeA{animation:kLedStrokeA 9s linear infinite}
@keyframes kLedStopA{0%,100%{stop-color:#35ffd0}33%{stop-color:#4a8bff}66%{stop-color:#b46bff}}
@keyframes kLedStrokeA{0%,100%{stroke:#7dffe0}33%{stroke:#8fb8ff}66%{stroke:#d3a4ff}}
.ledStopB{animation:kLedStopB 10s linear infinite}
.ledStrokeB{animation:kLedStrokeB 10s linear infinite}
@keyframes kLedStopB{0%,100%{stop-color:#ff7a3a}33%{stop-color:#ff3fa0}66%{stop-color:#35d8ff}}
@keyframes kLedStrokeB{0%,100%{stroke:#ffb070}33%{stroke:#ff8cc8}66%{stroke:#7be8ff}}
.pearlScan{animation:kPearlScan 3.4s linear infinite,kLedFill 12s linear infinite}
@keyframes kPearlScan{0%{transform:translateY(-4px);opacity:0}12%,88%{opacity:.75}100%{transform:translateY(212px);opacity:0}}
.stScan{animation:kStScan 5.5s linear infinite}
@keyframes kStScan{0%{transform:translateY(0);opacity:0}8%,92%{opacity:.8}100%{transform:translateY(372px);opacity:0}}

/* river */
.rip1{animation:kRip 7s ease-in-out infinite alternate}
.rip2{animation:kRip 11s ease-in-out -4s infinite alternate}
.rip3{animation:kRipR 9s ease-in-out infinite alternate,kRipFade 3.6s ease-in-out infinite alternate}
.rip4{animation:kRipR 13s ease-in-out -6s infinite alternate,kRipFade 4.8s ease-in-out -2s infinite alternate}
@keyframes kRip{from{transform:translateX(-9px)}to{transform:translateX(9px)}}
@keyframes kRipR{from{transform:translateX(8px)}to{transform:translateX(-8px)}}
@keyframes kRipFade{from{opacity:.45}to{opacity:1}}
.pearlGlint{animation:kRip 11s ease-in-out -4s infinite alternate,kDayOnly var(--T) linear infinite}
@keyframes kDayOnly{0%,34%{opacity:1}44%,86%{opacity:0}96%,100%{opacity:1}}
.gl{opacity:0}
.gl1,.gl2{animation-name:kLzL}.gl3,.gl4{animation-name:kLzM}.gl5,.gl6{animation-name:kLzR}.gl7,.gl8{animation-name:kLzB}
.glit{animation:kShimmer 2.6s ease-in-out infinite alternate}
.gl2 .glit,.gl4 .glit,.gl6 .glit,.gl8 .glit{animation-duration:3.3s;animation-delay:-1.1s}
.gl3 .glit,.gl7 .glit{animation-duration:2.1s;animation-delay:-.7s}
@keyframes kShimmer{from{opacity:.45;transform:translateX(-1.8px)}to{opacity:1;transform:translateX(1.8px)}}

/* tug boat: crosses the river once per cycle, wraps while off-screen */
.tug{animation-name:kTug}
@keyframes kTug{0%{transform:translateX(0)}82.5%{transform:translateX(-840px)}82.51%{transform:translateX(178px)}100%{transform:translateX(0)}}
.bob{animation:kBob 3.2s ease-in-out infinite alternate}
@keyframes kBob{from{transform:translateY(-.5px)}to{transform:translateY(.7px)}}
.tugBody{animation-name:kBoatTone}
@keyframes kBoatTone{
  0%,24%{filter:brightness(1) sepia(0) saturate(1) hue-rotate(0deg)}
  34%,44%{filter:brightness(.86) sepia(.4) saturate(1.3) hue-rotate(-14deg)}
  52%,78%{filter:brightness(.26) sepia(0) saturate(.8) hue-rotate(0deg)}
  88%,92%{filter:brightness(.9) sepia(.25) saturate(1.1) hue-rotate(-8deg)}
  100%{filter:brightness(1) sepia(0) saturate(1) hue-rotate(0deg)}
}

@media (prefers-reduced-motion:reduce){:root{--T:96s}}
</style>
</head>
