<style>
html,body{margin:0;height:100%;background:#050a1c;display:flex;align-items:center;justify-content:center;overflow:hidden}
svg{height:100vh;width:auto;max-width:100vw;aspect-ratio:745/742;display:block}
*{animation-iteration-count:infinite;animation-timing-function:linear}
:root{--T:36s}
.nite{animation:nite var(--T) infinite}
.skyDusk{animation:dusk var(--T) infinite}
.skyNight{animation:nite var(--T) infinite}
.stars{animation:nite var(--T) infinite}
.dim{animation:dim var(--T) infinite}
.sun{animation:sun var(--T) infinite}
.moon{animation:moon var(--T) infinite}
.glare{animation:glare var(--T) infinite}
.clouds{animation:cloud 70s linear infinite}
.tw{animation:tw 3.1s ease-in-out infinite}.t1{animation-duration:4.3s;animation-delay:-1s}.t2{animation-duration:2.6s;animation-delay:-2s}.t3{animation-duration:5.2s;animation-delay:-3s}
.st{animation:tw 2.4s ease-in-out infinite}.s1{animation-duration:3.3s;animation-delay:-1s}.s2{animation-duration:2.1s;animation-delay:-.5s}.s3{animation-duration:4s;animation-delay:-2s}.s4{animation-duration:2.8s;animation-delay:-1.7s}
.blink{animation:blink 1.6s steps(2,end) infinite}
.hue{animation:hue 6s ease-in-out infinite}
.rip{animation:rip 6s ease-in-out infinite alternate}.r1{animation-duration:7.5s;animation-delay:-2s}.r2{animation-duration:5s;animation-delay:-3s}.r3{animation-duration:9s;animation-delay:-5s}
.sh{animation:sh 2.6s ease-in-out infinite alternate}.sh.s1{animation-duration:3.4s}.sh.s2{animation-duration:2.1s}.sh.s3{animation-duration:4s}
.boat{animation:boat 28s ease-in-out infinite alternate}

@keyframes dusk{0%,14%{opacity:0}28%{opacity:1}40%{opacity:0}74%{opacity:0}83%{opacity:1}94%,100%{opacity:0}}
@keyframes dim{
0%,12%{filter:brightness(1) sepia(0) saturate(1)}
28%{filter:brightness(.82) sepia(.5) saturate(1.3)}
40%{filter:brightness(.42) sepia(.1) saturate(.8)}
44%,72%{filter:brightness(.36) sepia(0) saturate(.75)}
83%{filter:brightness(.7) sepia(.45) saturate(1.2)}
94%,100%{filter:brightness(1) sepia(0) saturate(1)}}
@keyframes sun{
0%{transform:translate(540px,70px);opacity:1}
10%{transform:translate(480px,100px)}
20%{transform:translate(410px,230px)}
28%{transform:translate(352px,430px);opacity:1}
31%{transform:translate(345px,470px);opacity:0}
79%{transform:translate(335px,470px);opacity:0}
82%{transform:translate(335px,440px);opacity:1}
92%{transform:translate(430px,200px)}
100%{transform:translate(540px,70px);opacity:1}}
@keyframes moon{
0%,32%{transform:translate(330px,470px);opacity:0}
38%{transform:translate(322px,350px);opacity:1}
56%{transform:translate(280px,130px)}
70%{transform:translate(380px,110px)}
78%{transform:translate(440px,300px);opacity:.9}
84%,100%{transform:translate(450px,420px);opacity:0}}
@keyframes glare{0%,20%{opacity:.8}30%,80%{opacity:0}92%,100%{opacity:.8}}
@keyframes cloud{from{transform:translateX(-260px)}to{transform:translateX(860px)}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes hue{0%,100%{fill:#ff3d7f}33%{fill:#a85bff}66%{fill:#35c8ff}}
@keyframes rip{from{transform:translateX(-10px)}to{transform:translateX(12px)}}
@keyframes sh{from{transform:translateX(-3px);opacity:.5}to{transform:translateX(3px);opacity:1}}
@keyframes boat{from{transform:translateX(-26px)}to{transform:translateX(20px)}}
</style></head>
