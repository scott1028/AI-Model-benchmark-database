<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>Lujiazui Day &amp; Night</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; }
  body { display: grid; place-items: center; }
  #stage { display: block; width: min(100vw, calc(100vh * 745 / 742)); height: auto; }

  /* perpetual micro animations (independent of the day cycle) */
  .tw { animation: twinkle 3.2s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .blink { animation: blink 1.6s steps(1, end) infinite; }
  @keyframes blink { 0% { opacity: 1; } 35% { opacity: .08; } }
  .shimmer { animation: shimmer 2.4s ease-in-out infinite alternate; }
  @keyframes shimmer { from { transform: translateX(-1.6px); opacity: .75; } to { transform: translateX(1.6px); opacity: 1; } }
  .sparkle { animation: sparkle 1.3s ease-in-out infinite; }
  @keyframes sparkle { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
  .led-run { animation: ledRun 2.2s linear infinite; }
  @keyframes ledRun { to { stroke-dashoffset: -24; } }
</style>
</head>

      el('path', { d: path }, g);

  const cache = new Map();
  const setAttr = (node, name, value) => {
    const entry = cache.get(node) || {};
    if (entry[name] === value) return;
    entry[name] = value;
    cache.set(node, entry);
    node.setAttribute(name, value);
  };

  const hsl = (h, s, l) => `hsl(${h.toFixed(1)},${s}%,${l}%)`;
  // tug group spans [x - wake, x + body]; wrap only when fully off-screen
  const TUG_X0 = 567, TUG_W = 182, TUG_WAKE = 106, TUG_TRIP = 745 + TUG_W + TUG_WAKE;

  const render = (h, loopT, ms) => {
    const k = sampleKeys(h);

    // sky
    k.sky.forEach((c, i) => setAttr(skyStops[i], 'stop-color', rgbStr(c)));

    // city tint
    const matrix = getTintMatrix(k.tint, k.sat);
    setAttr(tintMatrix, 'values', matrix);
    setAttr(tintMatrixBoats, 'values', matrix);

    // sun on an arc: rises right (06:00), sets left (18:40)
    const sunS = (h - 6) / 12.65;
    const sunAlt = Math.sin(Math.PI * clamp01(sunS));
    const sx = 372 + 345 * Math.cos(Math.PI * sunS);
    const sy = 575 - 900 * Math.sin(Math.PI * sunS);
    setAttr(sun, 'transform', `translate(${sx.toFixed(1)} ${sy.toFixed(1)})`);
    setAttr(sun, 'opacity', clamp01((sunS + .03) * 12) * clamp01((1.03 - sunS) * 12));
    const low = 1 - clamp01(sunAlt * 2.2);
    const disc = mixRgb([255, 246, 214], [255, 120, 50], low);
    const glow = mixRgb([255, 248, 220], [255, 140, 70], low);
    setAttr(sunStops[0], 'stop-color', rgbStr(glow));
    setAttr(sunStops[1], 'stop-color', rgbStr(glow));
    setAttr(sunStops[2], 'stop-color', rgbStr(glow));
    setAttr(sunStops[3], 'stop-color', rgbStr(disc));
    setAttr(sunGlow, 'r', (130 + low * 110).toFixed(1));

    // moon on a lower arc: rises ~19:00, sets ~05:30
    const moonS = (((h - 19 + 24) % 24)) / 10.5;
    const mx = 372 + 330 * Math.cos(Math.PI * moonS);
    const my = 560 - 420 * Math.sin(Math.PI * clamp01(moonS));
    const moonVis = moonS <= 1 ? clamp01(moonS * 10) * clamp01((1 - moonS) * 10) : 0;
    setAttr(moon, 'transform', `translate(${mx.toFixed(1)} ${my.toFixed(1)})`);
    setAttr(moon, 'opacity', (moonVis * clamp01(k.night * 1.2)).toFixed(3));

    // stars + city light pollution
    setAttr(stars, 'opacity', Math.pow(clamp01((k.night - .35) / .65), 1.5).toFixed(3));
    setAttr(cityGlow, 'opacity', (k.night * .9).toFixed(3));

    // night lights: windows switch on in 5 waves, landmarks fade in
    setAttr(nightGroup, 'opacity', k.night > .001 ? 1 : 0);
    winGroups.forEach((g, i) => setAttr(g, 'opacity', clamp01((k.night - (.12 + i * .14)) / .12).toFixed(3)));
    setAttr(landmark, 'opacity', clamp01((k.night - .25) / .35).toFixed(3));
    setAttr(reflect, 'opacity', clamp01((k.night - .35) / .4).toFixed(3));
    setAttr(aviation, 'opacity', clamp01(k.night / .3).toFixed(3));
    setAttr(boatLights, 'opacity', clamp01((k.night - .2) / .4).toFixed(3));

    // Pearl Tower color show: pink -> violet -> blue -> pink every 12s
    const hue = (320 - 110 * (0.5 - 0.5 * Math.cos((ms / 12000) * Math.PI * 2)) + 360) % 360;
    setAttr(pearlStops[0], 'stop-color', hsl(hue, 100, 90));
    setAttr(pearlStops[1], 'stop-color', hsl(hue, 100, 62));
    setAttr(pearlStops[2], 'stop-color', hsl((hue - 40 + 360) % 360, 80, 45));
    setAttr(pearlHalo[0], 'stop-color', hsl(hue, 100, 62));
    setAttr(pearlHalo[1], 'stop-color', hsl(hue, 100, 62));

    // daytime effects
    const afternoon = clamp01(1 - Math.abs(h - 15) / 2.5);
    setAttr(glint, 'opacity', afternoon.toFixed(3));
    setAttr(sunGlitter, 'transform', `translate(${sx.toFixed(1)} 0)`);
    setAttr(sunGlitter, 'opacity', (sunS > 0 && sunS < 1 ? low * .9 + .15 * sunAlt : 0).toFixed(3));
    setAttr(moonGlitter, 'transform', `translate(${mx.toFixed(1)} 0)`);
    setAttr(moonGlitter, 'opacity', (moonVis * clamp01((k.night - .5) * 2) * .8).toFixed(3));

    // tug crosses the river once per loop (wraps off-screen)
    const tugX = ((TUG_X0 + TUG_W + TUG_TRIP * loopT) % TUG_TRIP) - TUG_W;
    const tugTransform = `translate(${(tugX - TUG_X0).toFixed(1)} 0)`;
    setAttr(tug, 'transform', tugTransform);
    setAttr(tugLights, 'transform', tugTransform);
  };

  const t0 = performance.now();
  const tick = (now) => {
    const ms = now - t0;
    const loopT = (ms % CYCLE_MS) / CYCLE_MS;
    const h = (START_HOUR + 24 * loopT) % 24;
    render(h, loopT, ms);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
