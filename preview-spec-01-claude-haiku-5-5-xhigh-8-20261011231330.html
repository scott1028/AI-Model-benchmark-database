<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上海陸家嘴 日夜循環</title>
<style>

:root { --cycle: 20s; --bg: #070d1c; --muted: #7d8aa3; }
html, body { margin: 0; background: var(--bg); }
body {
  min-height: 100vh; box-sizing: border-box; padding: 16px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  color: var(--muted); font: 14px/1.4 system-ui, sans-serif;
}
.stage { width: 100%; max-width: 745px; }
.stage svg { display: block; width: 100%; height: auto; border-radius: 8px; }
.caption { margin: 0; text-align: center; }

/* One loop = one day. 0% is noon: the sun starts at the top of its arc. */
.sky-day   { animation: sky-day var(--cycle) ease-in-out infinite; }
.sky-dusk  { animation: sky-dusk var(--cycle) ease-in-out infinite; }
.celestial { transform-box: view-box; transform-origin: 372px 489px; animation: orbit var(--cycle) linear infinite; }
.dark      { animation: night-tint var(--cycle) ease-in-out infinite; }
.lit       { animation: lights-on var(--cycle) ease-in-out infinite; }
.ripple    { animation: drift 3.6s ease-in-out infinite alternate; }
.tw        { animation: twinkle 3.2s ease-in-out infinite; animation-delay: var(--d, 0s); }

@keyframes sky-day { 0%, 6% { opacity: 1 } 18%, 74% { opacity: 0 } 86%, 100% { opacity: 1 } }
@keyframes sky-dusk { 0%, 8% { opacity: 0 } 18% { opacity: 1 } 27%, 74% { opacity: 0 } 82% { opacity: 1 } 90%, 100% { opacity: 0 } }
@keyframes night-tint { 0%, 12% { opacity: 0 } 22% { opacity: .45 } 30%, 68% { opacity: .62 } 76% { opacity: .4 } 86%, 100% { opacity: 0 } }
@keyframes lights-on { 0%, 16%, 82%, 100% { opacity: 0 } 28%, 70% { opacity: 1 } }
@keyframes orbit { to { transform: rotate(360deg) } }
@keyframes drift { to { transform: translateX(10px) } }
@keyframes twinkle { 0%, 100% { opacity: .3 } 50% { opacity: 1 } }

</style>
</head>
