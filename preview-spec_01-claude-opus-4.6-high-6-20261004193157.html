<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shanghai Pudong Skyline - Day/Night Cycle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
svg{width:100vw;height:100vh}
@keyframes twinkle1{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes twinkle2{0%,100%{opacity:.8}50%{opacity:.15}}
@keyframes twinkle3{0%,100%{opacity:.5}50%{opacity:1}}
.t1{animation:twinkle1 2.1s ease-in-out infinite}
.t2{animation:twinkle2 3.3s ease-in-out infinite}
.t3{animation:twinkle3 2.7s ease-in-out infinite}
@keyframes boatDrift{0%{transform:translateX(0)}50%{transform:translateX(30px)}100%{transform:translateX(0)}}
.boat{animation:boatDrift 18s ease-in-out infinite}
@keyframes waveShift{0%{transform:translateX(0)}50%{transform:translateX(6px)}100%{transform:translateX(0)}}
.wave{animation:waveShift 4s ease-in-out infinite}
@keyframes cloudDrift{0%{transform:translateX(0)}100%{transform:translateX(120px)}}
.cloud{animation:cloudDrift 90s linear infinite}
</style>
</head>
<body>
<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
<defs>
  <!-- Sky gradient (animated day→sunset→night→dawn) -->
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%">
      <animate attributeName="stop-color" dur="30s" repeatCount="indefinite"
        values="#1565C0;#1976D2;#BF360C;#060A12;#060A12;#1A237E;#1565C0"
        keyTimes="0;0.30;0.42;0.50;0.80;0.92;1"/>
    </stop>
    <stop offset="50%">
      <animate attributeName="stop-color" dur="30s" repeatCount="indefinite"
        values="#42A5F5;#64B5F6;#FF6F00;#0C1422;#0C1422;#4527A0;#42A5F5"
        keyTimes="0;0.30;0.42;0.50;0.80;0.92;1"/>
    </stop>
    <stop offset="100%">
      <animate attributeName="stop-color" dur="30s" repeatCount="indefinite"
        values="#87CEEB;#90CAF9;#FF8A65;#152030;#152030;#7E57C2;#87CEEB"
        keyTimes="0;0.30;0.42;0.50;0.80;0.92;1"/>
    </stop>
  </linearGradient>

  <!-- Water gradient -->
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%">
      <animate attributeName="stop-color" dur="30s" repeatCount="indefinite"
        values="#1976D2;#1976D2;#BF360C;#0A1525;#0A1525;#311B92;#1976D2"
        keyTimes="0;0.30;0.42;0.50;0.80;0.92;1"/>
    </stop>
    <stop offset="100%">
      <animate attributeName="stop-color" dur="30s" repeatCount="indefinite"
        values="#0D47A1;#0D47A1;#880E4F;#060E1A;#060E1A;#1A0040;#0D47A1"
        keyTimes="0;0.30;0.42;0.50;0.80;0.92;1"/>
    </stop>
  </linearGradient>

  <!-- Pearl Tower sphere gradient -->
  <radialGradient id="pearlSphere" cx="0.35" cy="0.3" r="0.65">
    <stop offset="0%" stop-color="#FF8A80"/>
    <stop offset="25%" stop-color="#E53935"/>
    <stop offset="50%" stop-color="#FFCDD2"/>
    <stop offset="75%" stop-color="#C62828"/>
    <stop offset="100%" stop-color="#B71C1C"/>

  <!-- Glass dome gradient -->

    <stop offset="0%" stop-color="#80CBC4"/>
    <stop offset="50%" stop-color="#4DB6AC"/>
    <stop offset="100%" stop-color="#00695C"/>
  </radialGradient>

  <!-- Building gradients -->

    <stop offset="0%" stop-color="#9E9E9E"/>
    <stop offset="50%" stop-color="#BDBDBD"/>
    <stop offset="100%" stop-color="#757575"/>
  </linearGradient>
  <linearGradient id="gSWFC" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#37474F"/>
    <stop offset="50%" stop-color="#546E7A"/>
    <stop offset="100%" stop-color="#263238"/>
  </linearGradient>
  <linearGradient id="gSHT" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#90A4AE"/>
    <stop offset="25%" stop-color="#CFD8DC"/>
    <stop offset="75%" stop-color="#ECEFF1"/>
    <stop offset="100%" stop-color="#78909C"/>

  <linearGradient id="gConv" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F5F0E8"/>
    <stop offset="100%" stop-color="#D7CFC0"/>
  </linearGradient>
  <linearGradient id="gPearlBody" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#D5CCC0"/>
    <stop offset="50%" stop-color="#EDE8E0"/>
    <stop offset="100%" stop-color="#C0B8AC"/>
  </linearGradient>

  <!-- Sun glow -->
  <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#FFF9C4"/>
    <stop offset="30%" stop-color="#FFEE58"/>
    <stop offset="60%" stop-color="#FFB300" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#FF8F00" stop-opacity="0"/>
  </radialGradient>

  <!-- Moon glow -->
  <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#ECEFF1" stop-opacity="0.6"/>
    <stop offset="60%" stop-color="#B0BEC5" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#455A64" stop-opacity="0"/>
  </radialGradient>

  <!-- Sunset horizon glow -->
  <radialGradient id="sunsetGlow" cx="0.5" cy="1" r="0.8">
    <stop offset="0%" stop-color="#FF6F00" stop-opacity="0.8"/>
    <stop offset="50%" stop-color="#FF8F00" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#FF8F00" stop-opacity="0"/>
  </radialGradient>

  <!-- Night city glow -->
  <linearGradient id="cityGlow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FF8F00" stop-opacity="0"/>
    <stop offset="100%" stop-color="#FF6F00" stop-opacity="0.5"/>
  </linearGradient>

  <!-- Green glass building gradient -->
  <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2E7D32"/>
    <stop offset="50%" stop-color="#43A047"/>
    <stop offset="100%" stop-color="#1B5E20"/>
  </linearGradient>

  <!-- Night glow filter -->
  <filter id="fGlow">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Water clip -->
  <clipPath id="waterClip"><rect x="0" y="575" width="1200" height="225"/></clipPath>

  <!-- Reflection blur -->
  <filter id="fReflect">
    <feGaussianBlur stdDeviation="3 1"/>
  </filter>
</defs>
