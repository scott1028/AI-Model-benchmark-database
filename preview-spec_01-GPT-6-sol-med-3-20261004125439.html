<!doctype html>

  <style>
    html, body { margin: 0; min-height: 100%; background: #101e3b; }
    body { display: grid; place-items: center; overflow: hidden; }
    svg { display: block; width: min(100vw, 100vh * 745 / 742); height: auto; max-height: 100vh; }
    .night { animation: night 24s ease-in-out infinite; }
    .twilight { animation: twilight 24s ease-in-out infinite; }
    .lamps { animation: lamps 24s ease-in-out infinite; }
    .star { animation: stars 24s ease-in-out infinite; }
    .sun { animation: sun 24s ease-in-out infinite; }
    .moon { animation: moon 24s ease-in-out infinite; }
    .water-shimmer { animation: drift 7s ease-in-out infinite alternate; }
    @keyframes night { 0%, 23%, 100% { opacity: 0 } 43%, 75% { opacity: 1 } 91% { opacity: 0 } }
    @keyframes twilight { 0%, 18%, 52%, 72%, 100% { opacity: 0 } 30%, 83% { opacity: .68 } }
    @keyframes lamps { 0%, 29%, 96%, 100% { opacity: 0 } 45%, 81% { opacity: 1 } }
    @keyframes stars { 0%, 37%, 89%, 100% { opacity: 0 } 50%, 78% { opacity: 1 } }
    @keyframes sun { 0%, 20%, 100% { opacity: .72; transform: translateY(0) } 43%, 84% { opacity: 0; transform: translateY(85px) } }
    @keyframes moon { 0%, 36%, 91%, 100% { opacity: 0; transform: translateY(35px) } 53%, 77% { opacity: .92; transform: translateY(0) } }
    @keyframes drift { from { transform: translateX(-8px) } to { transform: translateX(10px) } }
    @media (prefers-reduced-motion: reduce) { svg * { animation-duration: 1ms !important; animation-iteration-count: 1 !important; } }
