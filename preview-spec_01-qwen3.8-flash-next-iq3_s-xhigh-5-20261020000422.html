<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>spec_01 — 上海浦江天際線 日夜循環 SVG</title>
<style>
  :root { --cycle: 60s; }
  html, body { margin: 0; padding: 0; background: #0d1117; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .stage { width: min(96vw, 96vh); aspect-ratio: 745 / 742; box-shadow: 0 8px 40px rgba(0,0,0,.55); border-radius: 6px; overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; }

  /* ============ 天空三層交叉淡入淡出 ============
     時間軸(週期 60s): 0% 拂曉 → 8% 白天 → 46% 白晝尾聲 → 54% 黃昏峰
     → 62% 深夜 → 90% 拂曉前 → 100% 回到拂曉 */
  #skyDay  { animation: opDay var(--cycle) linear infinite; }
  #skyGold { animation: opGold var(--cycle) linear infinite; }
  @keyframes opDay {
     0% {opacity:0} 7% {opacity:1} 46% {opacity:1} 56% {opacity:0}
     92% {opacity:0} 100% {opacity:0}
  }
  @keyframes opGold {
     0% {opacity:.9} 11% {opacity:0} 44% {opacity:0} 54% {opacity:.95}
     65% {opacity:0} 89% {opacity:0} 100% {opacity:.9}
  }
  /* ============ 水面同節奏 ============ */
  #waterDay  { animation: opDay var(--cycle) linear infinite; }
  #waterGold { animation: opGold var(--cycle) linear infinite; }
  /* ============ 城市夜暗化罩 ============ */
  #nightDim { animation: opDim var(--cycle) linear infinite; }
  @keyframes opDim {
     0% {opacity:.45} 8% {opacity:0} 48% {opacity:0} 60% {opacity:.52}
     88% {opacity:.52} 96% {opacity:.45} 100% {opacity:.45}
  }
  /* ============ 城市燈光 / 窗燈 ============ */
  #cityWin, #domeGlow, #pearlGlow, #moonGlit, #towerRefl, #cityHalo {
     animation: opWin var(--cycle) linear infinite;
  }
  @keyframes opWin {
     0% {opacity:.55} 9% {opacity:0} 50% {opacity:0} 62% {opacity:1}
     88% {opacity:1} 95% {opacity:.55} 100% {opacity:.55}
  }
  /* ============ 太陽 ============ */
  #sun { animation: opSun var(--cycle) linear infinite; }
  @keyframes opSun {
     0% {opacity:0} 5% {opacity:0} 8% {opacity:1} 50% {opacity:1}
     55% {opacity:0} 100% {opacity:0}
  }
  #sunGlit { animation: opSunGlit var(--cycle) linear infinite; }
  @keyframes opSunGlit {
     0% {opacity:0} 8% {opacity:.4} 46% {opacity:.4} 54% {opacity:0}
     100% {opacity:0}
  }
  /* ============ 月亮 ============ */
  #moon { animation: opMoon var(--cycle) linear infinite; }
  @keyframes opMoon {
     0% {opacity:.75} 9% {opacity:0} 55% {opacity:0} 60% {opacity:1}
     91% {opacity:1} 96% {opacity:0} 100% {opacity:.75}
  }
  /* ============ 星星 ============ */
  #stars { animation: opStars var(--cycle) linear infinite; }
  @keyframes opStars {
     0% {opacity:.5} 9% {opacity:0} 54% {opacity:0} 63% {opacity:1}
     88% {opacity:1} 95% {opacity:.5} 100% {opacity:.5}
  }
  .tw1 { animation: twinkle 2.6s ease-in-out infinite alternate; }
  .tw2 { animation: twinkle 3.4s ease-in-out infinite alternate; }
  .tw3 { animation: twinkle 4.1s ease-in-out infinite alternate; }
  @keyframes twinkle { from {opacity:.35} to {opacity:1} }
  /* ============ 雲 ============ */
  #clouds { animation: cloudFade var(--cycle) linear infinite; }
  @keyframes cloudFade {
     0% {opacity:.35} 10% {opacity:.85} 46% {opacity:.85}
     54% {opacity:.75} 64% {opacity:.14} 90% {opacity:.14} 100% {opacity:.35}
  }
  .drift1 { animation: drift 70s ease-in-out infinite alternate; }
  .drift2 { animation: drift 95s ease-in-out infinite alternate-reverse; }
  @keyframes drift { from {transform:translateX(-26px)} to {transform:translateX(30px)} }
  /* ============ 船 ============ */
  #barge { animation: bargeMove var(--cycle) linear infinite; }
  @keyframes bargeMove {
     0%   {transform:translateX(150px)}
     100% {transform:translateX(-660px)}
  }
  #ferry  { animation: bob 4.2s ease-in-out infinite alternate; }
  #buoyS  { animation: bobS 5.1s ease-in-out infinite alternate; }
  @keyframes bob  { from {transform:translateY(0)} to {transform:translateY(2px)} }
  @keyframes bobS { from {transform:translateY(0)} to {transform:translateY(-1.5px)} }
  /* ============ 水面漣漪 ============ */
  .shimA { animation: shim 7s ease-in-out infinite alternate; }
  .shimB { animation: shim 9s ease-in-out infinite alternate-reverse; }
  .shimC { animation: shim 11s ease-in-out infinite alternate; }
  @keyframes shim { from {transform:translateX(-7px)} to {transform:translateX(7px)} }
  /* ============ 航空障礙燈 ============ */
  .beacon { animation: beacon 1.8s ease-in-out infinite; }
  @keyframes beacon { 0%,100% {opacity:.15} 45%,55% {opacity:1} }
  /* ============ 候鳥(白天) ============ */
  #birds { animation: opBirds var(--cycle) linear infinite; }
  @keyframes opBirds { 0% {opacity:0} 12% {opacity:0} 16% {opacity:1} 44% {opacity:1} 50% {opacity:0} 100% {opacity:0} }
  #birds g { animation: fly 26s linear infinite; }
  @keyframes fly { from {transform:translate(-80px,10px)} to {transform:translate(560px,-40px)} }
  /* ============ 時段標籤 ============ */
  .lbl { font: 600 15px/1 "Noto Sans TC", "Microsoft JhengHei", sans-serif; letter-spacing: 2px; }
  #lDawn { animation: phDawn var(--cycle) linear infinite; }
  #lDay  { animation: phDay  var(--cycle) linear infinite; }
  #lDusk { animation: phDusk var(--cycle) linear infinite; }
  #lNight{ animation: phNight var(--cycle) linear infinite; }
  @keyframes phDawn  { 0%{opacity:1} 7%{opacity:1} 11%{opacity:0} 88%{opacity:0} 93%{opacity:1} 100%{opacity:1} }
  @keyframes phDay   { 0%{opacity:0} 12%{opacity:1} 45%{opacity:1} 49%{opacity:0} 100%{opacity:0} }
  @keyframes phDusk  { 0%{opacity:0} 47%{opacity:0} 51%{opacity:1} 61%{opacity:1} 65%{opacity:0} 100%{opacity:0} }
  @keyframes phNight { 0%{opacity:0} 63%{opacity:0} 67%{opacity:1} 88%{opacity:1} 92%{opacity:0} 100%{opacity:0} }
</style>
</head>

<script>
/* 除錯/回看: 加 ?t=秒數 可直接跳到循環中任意時刻 (CSS 用負延遲, SMIL 用 setCurrentTime) */
(function () {
  var t = parseFloat(new URLSearchParams(location.search).get('t'));
  if (isNaN(t)) return;
  document.querySelector('svg').setCurrentTime(t);
  var d = -t + 's';
  document.querySelectorAll(
    '#skyDay,#skyGold,#waterDay,#waterGold,#nightDim,#cityWin,#domeGlow,#pearlGlow,#moonGlit,' +
    '#towerRefl,#cityHalo,#sun,#sunGlit,#moon,#stars,#clouds,#birds,#birds g,' +
    '#lDawn,#lDay,#lDusk,#lNight,#barge,#ferry,#buoyS,' +
    '.tw1,.tw2,.tw3,.drift1,.drift2,.shimA,.shimB,.shimC,.beacon'
  ).forEach(function (el) { el.style.animationDelay = d; });
})();
</script>
