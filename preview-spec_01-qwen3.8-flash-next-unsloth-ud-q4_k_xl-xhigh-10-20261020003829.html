<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上海陸家嘴 · 日夜循環 — spec_01</title>
<style>
  :root { --cycle: 36s; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #06080f; overflow: hidden;
    font-family: "Segoe UI", "Noto Sans TC", system-ui, sans-serif; }
  #stage { height: 100%; display: grid; place-items: center; }
  svg#scene { width: min(100vw, 100vh); height: min(100vw, 100vh); display: block;
    border-radius: 6px; box-shadow: 0 12px 60px #000a; }

  /* ===== master timeline: 0% sunrise · 25% noon · 50% sunset · 75% midnight ===== */
  .skyTop { animation: skyTop var(--cycle) linear infinite; }
  .skyMid { animation: skyMid var(--cycle) linear infinite; }
  .skyLow { animation: skyLow var(--cycle) linear infinite; }
  @keyframes skyTop {
     0%  { stop-color:#1c2a68; } 12% { stop-color:#1e62c8; } 25% { stop-color:#2176e8; }
    42%  { stop-color:#2a5cb0; } 48% { stop-color:#33418c; } 55% { stop-color:#0d1740; }
    65%  { stop-color:#04081e; } 86% { stop-color:#04081c; } 93% { stop-color:#12194a; }
   100%  { stop-color:#1c2a68; } }
  @keyframes skyMid {
     0%  { stop-color:#7a4a80; } 12% { stop-color:#4f96e0; } 25% { stop-color:#4a9cef; }
    42%  { stop-color:#8a94cc; } 48% { stop-color:#e07a55; } 55% { stop-color:#38255e; }
    65%  { stop-color:#0a1234; } 86% { stop-color:#081030; } 93% { stop-color:#6a3f70; }
   100%  { stop-color:#7a4a80; } }
  @keyframes skyLow {
     0%  { stop-color:#ffb27a; } 12% { stop-color:#cfe8fa; } 25% { stop-color:#b5daf5; }
    42%  { stop-color:#f5c98e; } 48% { stop-color:#ffc061; } 55% { stop-color:#8a4a4a; }
    65%  { stop-color:#16224e; } 86% { stop-color:#121c44; } 93% { stop-color:#e08a5a; }
   100%  { stop-color:#ffb27a; } }

  .wTop { animation: wTop var(--cycle) linear infinite; }
  .wLow { animation: wLow var(--cycle) linear infinite; }
  @keyframes wTop {
     0%  { stop-color:#c98a6a; } 12%  { stop-color:#8fb2d4; } 25% { stop-color:#7fa3c8; }
    48%  { stop-color:#d08a5a; } 60% { stop-color:#1a2c55; } 88% { stop-color:#152647; }
    96%  { stop-color:#7a5570; } 100%{ stop-color:#c98a6a; } }
  @keyframes wLow {
     0%  { stop-color:#3a4a80; } 12%  { stop-color:#4a7ab8; } 25% { stop-color:#3f6aa2; }
    48%  { stop-color:#7a4a5e; } 60% { stop-color:#0a142e; } 88% { stop-color:#08122a; }
    96%  { stop-color:#2a2a58; } 100%{ stop-color:#3a4a80; } }

  /* tints: skyTint below stars/moon, groundTint above city+water */
  .tSky { animation: tSky var(--cycle) linear infinite; }
  .tGrd { animation: tGrd var(--cycle) linear infinite; }
  @keyframes tSky {
     0%  { opacity:.30; } 12% { opacity:0; } 42% { opacity:0; }
    52%  { opacity:.28; } 62% { opacity:.46; } 88% { opacity:.46; }
    96%  { opacity:.20; } 100%{ opacity:.30; } }
  @keyframes tGrd {
     0%  { opacity:.22; } 12% { opacity:0; } 42% { opacity:0; }
    52%  { opacity:.28; } 62% { opacity:.55; } 88% { opacity:.55; }
    95%  { opacity:.22; } 100%{ opacity:.22; } }

  /* night lights gate */
  .lts { animation: lts var(--cycle) linear infinite; }
  @keyframes lts {
     0%  { opacity:.35; } 9%  { opacity:0; } 44% { opacity:0; }
    52%  { opacity:.5; } 60% { opacity:1; } 88% { opacity:1; }
    94%  { opacity:.55; } 100%{ opacity:.35; } }

  /* late-night only (water reflections, moon glitter) */
  .lts2 { animation: lts2 var(--cycle) linear infinite; }
  @keyframes lts2 {
     0%  { opacity:.15; } 10% { opacity:0; } 52% { opacity:0; }
    60%  { opacity:.6; } 66% { opacity:1; } 88% { opacity:1; }
    94%  { opacity:.3; } 100%{ opacity:.15; } }

  .hz { animation: hz var(--cycle) linear infinite; }
  @keyframes hz {
     0%  { opacity:.6; } 12% { opacity:0; } 38% { opacity:0; }
    46% { opacity:.5; } 50%{ opacity:.95; } 56%{ opacity:.35; }
    62% { opacity:0; } 90%{ opacity:0; } 100%{ opacity:.6; } }

  .stars { animation: starsGate var(--cycle) linear infinite; }
  @keyframes starsGate {
     0%  { opacity:.2; } 10% { opacity:0; } 44% { opacity:0; }
    54% { opacity:.3; } 62%{ opacity:1; } 88%{ opacity:1; }
    96% { opacity:.3; } 100%{ opacity:.2; } }

  /* sun & moon orbit around a pivot hidden behind the skyline */
  .sunOrbit { transform-origin: 372px 560px; transform-box: view-box;
    animation: sunOrbit var(--cycle) linear infinite; }
  @keyframes sunOrbit { from { transform: rotate(90deg); } to { transform: rotate(-270deg); } }
  .moonOrbit { transform-origin: 372px 560px; transform-box: view-box;
    animation: moonOrbit var(--cycle) linear infinite; }
  @keyframes moonOrbit { from { transform: rotate(-90deg); } to { transform: rotate(-450deg); } }
  .sunDisc { animation: sunAlt var(--cycle) linear infinite, sunBig var(--cycle) linear infinite;
    transform-box: fill-box; transform-origin: center; }
  @keyframes sunBig {
     0%  { transform: scale(1.25); } 10% { transform: scale(1); } 40% { transform: scale(1); }
    50%  { transform: scale(1.5); }  99% { transform: scale(1.5); } 100%{ transform: scale(1.25); } }
  .duskGlow { animation: duskGlow var(--cycle) linear infinite; }
  @keyframes duskGlow {
     0%  { opacity:.15; } 36% { opacity:0; } 46% { opacity:.4; }
    50%  { opacity:.65; } 56% { opacity:.2; } 61% { opacity:0; } 100%{ opacity:.15; } }
  .dawnGlow { animation: dawnGlow var(--cycle) linear infinite; }
  @keyframes dawnGlow {
     0%  { opacity:.5; } 8% { opacity:.3; } 14% { opacity:0; }
    92% { opacity:0; } 100%{ opacity:.5; } }
  @keyframes sunAlt {
     0% { opacity:.9; } 14% { opacity:1; } 40% { opacity:1; }
    50% { opacity:1; } 54% { opacity:0; } 97% { opacity:0; } 100%{ opacity:.9; } }
  .moonDisc { animation: moonAlt var(--cycle) linear infinite; }
  @keyframes moonAlt {
     0%  { opacity:.25; } 6%  { opacity:0; } 46% { opacity:0; }
    54% { opacity:.55; } 62% { opacity:.95; } 88% { opacity:.95; }
    96% { opacity:.35; } 100%{ opacity:.25; } }
  .sunWarm { animation: sunWarm var(--cycle) linear infinite; }
  @keyframes sunWarm {
     0% { opacity:.7; } 12% { opacity:0; } 40% { opacity:0; }
    46% { opacity:.4; } 50% { opacity:.8; } 54% { opacity:0; }
    97% { opacity:0; } 100%{ opacity:.7; } }

  .clouds { animation: cloudGate var(--cycle) linear infinite; }
  @keyframes cloudGate {
     0% { opacity:.4; } 14% { opacity:.75; } 44% { opacity:.75; } 58% { opacity:.08; }
    88% { opacity:.08; } 96% { opacity:.4; } 100% { opacity:.4; } }
  .cloud { animation: cloudDrift 90s linear infinite; }
  .cloud.c2 { animation-duration: 130s; } .cloud.c3 { animation-duration: 110s; }
  @keyframes cloudDrift { from { transform: translateX(-60px); } to { transform: translateX(805px); } }

  /* small loops */
  .tw { animation: twinkle 3s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity:.15; } to { opacity:1; } }
  .pulse { animation: pulse 2.6s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity:.55; } to { opacity:1; } }
  .pulse2 { animation: pulse 4s ease-in-out infinite alternate-reverse; }
  .beacon { animation: beacon 1.2s steps(1,end) infinite; }
  @keyframes beacon { 0%,55% { opacity:1; } 56%,100% { opacity:.1; } }
  .ripple { animation: ripple 7s linear infinite; }
  @keyframes ripple { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -160; } }
  .refl { animation: refl 5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: top; }
  @keyframes refl { from { transform: scaleY(.96) skewX(-1deg); } to { transform: scaleY(1.05) skewX(1.2deg); } }
  .boat { animation: boat 110s linear infinite; }
  @keyframes boat { from { transform: translate(80px,0); } to { transform: translate(-920px,0); } }
  .bob { animation: bob 3.4s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(2.5px); } }
  .spark { animation: spark 2.8s ease-in-out infinite alternate; }
  @keyframes spark { from { opacity:.05; } 50% { opacity:.5; } to { opacity:.08; } }
  .glowPulse { animation: glowPulse 3.2s ease-in-out infinite alternate; }
  @keyframes glowPulse { from { transform: scale(.92); opacity:.5; } to { transform: scale(1.06); opacity:.9; } }
  .glowPulse { transform-box: fill-box; transform-origin: center; }
  .flick { animation: flick 6s steps(1,end) infinite; }
  @keyframes flick { 0%,92% { opacity:1; } 93%,94% { opacity:.25; } 95%,100% { opacity:1; } }

  /* HUD */
  #hud { position: fixed; left: 14px; bottom: 12px; color: #e8eefc; z-index: 5;
    background: #0b1226cc; border: 1px solid #ffffff22; border-radius: 10px;
    padding: 8px 12px; font-size: 13px; display: flex; gap: 10px; align-items: center;
    backdrop-filter: blur(4px); user-select: none; }
  #clock { font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 600; min-width: 56px; }
  #phase { opacity: .85; min-width: 44px; }
  #hud button { background: #ffffff14; color: #dfe7ff; border: 1px solid #ffffff33;
    border-radius: 6px; padding: 3px 8px; cursor: pointer; font-size: 12px; }
  #hud button.on { background: #3a6ae0; border-color: #7da2ff; }
  #hud .sp { width: 1px; height: 18px; background: #ffffff33; }
</style>

<div id="hud">
  <span id="clock">06:00</span><span id="phase">🌅 日出</span>
  <span class="sp"></span>
  <button id="btnPause" title="暫停/播放">⏸</button>
  <span class="sp"></span>
  <button data-s="0.5">0.5×</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button>
</div>
<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];

  // ---- stars ----
  const stars = document.getElementById('stars2');
  for (let i = 0; i < 150; i++) {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', rnd(0, 745).toFixed(1));
    c.setAttribute('cy', rnd(0, 470).toFixed(1));
    c.setAttribute('r', rnd(.4, 1.5).toFixed(2));
    c.setAttribute('opacity', rnd(.3, 1).toFixed(2));
    if (Math.random() < .45) { c.setAttribute('class', 'tw'); c.style.animationDelay = (-rnd(0, 3)) + 's'; c.style.animationDuration = rnd(1.6, 3.4).toFixed(1) + 's'; }
    stars.appendChild(c);
  }

  // ---- water sparkles ----
  const sp = document.getElementById('sparkles');
  for (let i = 0; i < 34; i++) {
    const e = document.createElementNS(NS, 'ellipse');
    e.setAttribute('cx', rnd(0, 745).toFixed(0));
    e.setAttribute('cy', rnd(606, 736).toFixed(0));
    e.setAttribute('rx', rnd(5, 16).toFixed(1));
    e.setAttribute('ry', rnd(.7, 1.4).toFixed(1));
    e.setAttribute('class', 'spark');
    e.style.animationDelay = (-rnd(0, 2.8)) + 's';
    sp.appendChild(e);
  }

  // ---- lit windows ----
  const addWins = (g, x, y, w, h, cw, ch, gx, gy, ratio, colors, flick) => {
    if (!g) return;
    for (let yy = y; yy + ch <= y + h; yy += gy)
      for (let xx = x; xx + cw <= x + w; xx += gx) {
        if (Math.random() > ratio) continue;
        const r = document.createElementNS(NS, 'rect');
        r.setAttribute('x', xx.toFixed(1)); r.setAttribute('y', yy.toFixed(1));
        r.setAttribute('width', cw); r.setAttribute('height', ch);
        r.setAttribute('fill', pick([].concat(colors)));
        r.setAttribute('opacity', rnd(.4, 1).toFixed(2));
        if (flick && Math.random() < .1) { r.setAttribute('class', 'flick'); r.style.animationDelay = (-rnd(0, 6)) + 's'; }
        g.appendChild(r);
      }
  };
  const G = id => document.getElementById(id);
  addWins(G('wins-whitegrid'), 150, 340, 50, 214, 2.6, 3.2, 7, 11, .5, '#ffe9b8');
  addWins(G('wins-smallblk'), 537, 478, 38, 82, 2.8, 3.6, 7.5, 10, .5, '#ffdf9a', 1);
  addWins(G('wins-shade'), 579, 448, 41, 112, 2.8, 3.4, 6, 10, .42, ['#bfe0ff', '#ffe9b8']);
  addWins(G('wins-sunface'), 627, 442, 30, 118, 2.4, 3.2, 7.5, 10, .35, '#ffd98a');
  addWins(G('wins-cyl'), 215, 352, 41, 146, 2.4, 2.6, 6, 9, .35, '#9fd0ff', 1);
  addWins(G('wins-grn'), 416, 312, 66, 186, 2.6, 2.2, 6, 8, .35, ['#a8f0e0', '#dffcf0'], 1);
  addWins(G('wins-crown'), 509, 468, 20, 50, 2.8, 2.4, 5, 10, .5, '#ffdf9a');
  addWins(G('wins-midblock'), 95, 312, 44, 246, 2.6, 2.8, 7, 11, .3, '#ffe9b8');
  addWins(G('wins-whiteslant'), 580, 306, 15, 150, 2.4, 2.2, 4, 9, .3, '#dfe9f4', 1);
  addWins(G('wins-whiteslant'), 604, 302, 17, 152, 2.4, 2.2, 4, 9, .25, ['#f4ecc8', '#dfe9f4']);
  addWins(G('wins-greenedge'), 704, 388, 33, 190, 3, 2.2, 7, 8, .3, '#e8ffc0', 1);
  addWins(G('wins-greenedge'), 675, 378, 29, 200, 2, 2.4, 5, 9, .35, '#a8f0c0', 1);

  // SWFC trapezoid body: per-row x span follows the taper
  (() => {
    const g = G('wins-wfc'); if (!g) return;
    for (let y = 236; y < 458; y += 8) {
      const t = (y - 196) / (470 - 196);
      const L = 514 - 12 * t, R = 556 + 22 * t;
      for (let x = L + 5; x + 2 < R - 4; x += 5.5) {
        if (Math.random() > .3) continue;
        const r = document.createElementNS(NS, 'rect');
        r.setAttribute('x', x.toFixed(1)); r.setAttribute('y', y);
        r.setAttribute('width', 2); r.setAttribute('height', 2.6);
        r.setAttribute('fill', pick(['#cfe4ff', '#9fd0ff', '#fff']));
        r.setAttribute('opacity', rnd(.4, 1).toFixed(2));
        if (Math.random() < .1) { r.setAttribute('class', 'flick'); r.style.animationDelay = (-rnd(0, 6)) + 's'; }
        g.appendChild(r);
      }
    }
  })();

  // Shanghai Tower: rows following the taper
  (() => {
    const g = G('wins-st'); if (!g) return;
    for (let y = 74; y < 588; y += 9) {
      const k = Math.pow((y - 44) / 556, .85);
      const half = 12 + 25 * k;
      const cx = 657 + 6 * ((y - 44) / 556);
      for (let x = cx - half + 3; x + 2.2 < cx + half - 2; x += 5) {
        if (Math.random() > .34) continue;
        const r = document.createElementNS(NS, 'rect');
        r.setAttribute('x', x.toFixed(1)); r.setAttribute('y', y);
        r.setAttribute('width', 2.2); r.setAttribute('height', 2);
        r.setAttribute('fill', pick(['#cfe8ff', '#ffe9b8', '#fff']));
        r.setAttribute('opacity', rnd(.4, 1).toFixed(2));
        if (Math.random() < .08) { r.setAttribute('class', 'flick'); r.style.animationDelay = (-rnd(0, 6)) + 's'; }
        g.appendChild(r);
      }
    }
  })();

  // ---- clock / controls ----
  const driver = document.querySelector('.tGrd');
  const clockEl = document.getElementById('clock');
  const phaseEl = document.getElementById('phase');
  const tick = () => {
    const a = driver.getAnimations()[0];
    if (a) {
      const d = a.effect.getTiming().duration || 36000;
      const t = ((a.currentTime || 0) % d) / d;
      const h = (t * 24 + 6) % 24;
      const hh = Math.floor(h), mm = Math.floor((h - hh) * 60);
      clockEl.textContent = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
      phaseEl.textContent = (h >= 5.2 && h < 7.2) ? '🌅 日出'
        : (h >= 7.2 && h < 16.5) ? '☀️ 白晝'
        : (h >= 16.5 && h < 19.2) ? '🌇 日落' : '🌙 夜晚';
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);

  let paused = false;
  document.getElementById('btnPause').addEventListener('click', e => {
    paused = !paused;
    document.getAnimations().forEach(a => paused ? a.pause() : a.play());
    e.target.textContent = paused ? '▶' : '⏸';
  });
  document.querySelectorAll('#hud button[data-s]').forEach(b => b.addEventListener('click', () => {
    document.documentElement.style.setProperty('--cycle', (36 / parseFloat(b.dataset.s)) + 's');
    document.querySelectorAll('#hud button[data-s]').forEach(x => x.classList.toggle('on', x === b));
  }));

  // debug seek: ?t=0..1 (0=sunrise .25 noon .5 sunset .75 midnight), pauses
  const q = new URLSearchParams(location.search).get('t');
  if (q != null) {
    const t = Math.min(Math.max(parseFloat(q) || 0, 0), 1);
    requestAnimationFrame(() => {
      document.getAnimations().forEach(a => {
        const d = a.effect && a.effect.getTiming().duration;
        if (d && isFinite(d)) a.currentTime = t * d;
        a.pause();
      });
      paused = true;
    });
  }
})();
</script>
