<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shanghai Lujiazui · Day/Night SVG Stage · spec_01</title>
<style>
  :root { --cyc: 40s; }
  html, body { margin: 0; padding: 0; background: #0a0d14; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  svg#stage { width: min(96vw, calc(96vh * 720 / 764)); height: auto; display: block;
              box-shadow: 0 12px 60px rgba(0,0,0,.6); }

  /* ============ master cross-fades (one shared 40s cycle) ============ */
  .f-dusk    { animation: opDusk   var(--cyc) linear infinite; }
  .f-night   { animation: opNight  var(--cyc) linear infinite; }
  .f-dawn    { animation: opDawn   var(--cyc) linear infinite; }
  .f-lights  { animation: opLights var(--cyc) linear infinite; }
  .f-nwash   { animation: opNwash  var(--cyc) linear infinite; }
  .f-dwash   { animation: opDwash  var(--cyc) linear infinite; }
  .f-stars   { animation: opStars  var(--cyc) linear infinite; }
  .f-clouds  { animation: cloudDim var(--cyc) linear infinite; }
  .f-birds   { animation: opBirds  var(--cyc) linear infinite; }
  .f-sunref  { animation: sunRef   var(--cyc) linear infinite; }

  .f-sun     { animation: opSun    var(--cyc) linear infinite; }
  .sun-move  { animation: sunMove  var(--cyc) linear infinite; }
  .f-moon    { animation: opMoon   var(--cyc) linear infinite; }
  .moon-move { animation: moonMove var(--cyc) linear infinite; }
  .moon-track{ animation: moonTrack var(--cyc) linear infinite; }

  @keyframes opNight  { 0%,44% {opacity:0}   58%,80% {opacity:1}  88%,100% {opacity:0} }
  @keyframes opDusk   { 0%,28% {opacity:0}   40%,56% {opacity:1}  66%,100% {opacity:0} }
  @keyframes opDawn   { 0%,78% {opacity:0}   87%,92% {opacity:1}  99%,100% {opacity:0} }
  @keyframes opLights { 0%,32% {opacity:0}   44%,82% {opacity:1}  92%,100% {opacity:0} }
  @keyframes opNwash  { 0%,34% {opacity:0}   52% {opacity:.92} 80% {opacity:.92} 90%,100% {opacity:0} }
  @keyframes opDwash  { 0%,26% {opacity:0}   36%,48% {opacity:.5} 62%,100% {opacity:0} }
  @keyframes opStars  { 0%,36% {opacity:0}   48%,80% {opacity:1} 88%,100% {opacity:0} }
  @keyframes opSun    { 0%,32% {opacity:1}   42%,74% {opacity:0} 90%,100% {opacity:1} }
  @keyframes opMoon   { 0%,42% {opacity:0}   52%,80% {opacity:1} 90%,100% {opacity:0} }
  @keyframes sunRef   { 0%,26% {opacity:0}   36%,42% {opacity:.55} 48%,100% {opacity:0} }
  @keyframes cloudDim { 0%,30% {opacity:1}   46%,80% {opacity:.22} 92%,100% {opacity:1} }
  @keyframes opBirds  { 0%,24% {opacity:1}   34%,94% {opacity:0}  100% {opacity:1} }

  /* sun path: ellipse over the city, sets right, parks off-left, rises at dawn */
  @keyframes sunMove {
     0%    { transform: translate(149px,167px) }
     10%   { transform: translate(323px,81px) }
     20%   { transform: translate(505px,119px) }
     30%   { transform: translate(653px,267px) }
     38%   { transform: translate(716px,430px) }
     44%   { transform: translate(740px,600px) }
     44.5% { transform: translate(-40px,600px) }
     78%   { transform: translate(-40px,600px) }
     86%   { transform: translate(-2px,366px) }
     93%   { transform: translate(56px,287px) }
     100%  { transform: translate(149px,167px) }
  }
  /* moon path: rises left at dusk, peaks at midnight, sets right before dawn */
  @keyframes moonMove {
     0%,44%    { transform: translate(758px,600px) }
     44.5%     { transform: translate(-40px,600px) }
     50%       { transform: translate(7px,401px) }
     56%       { transform: translate(86px,252px) }
     62%       { transform: translate(212px,121px) }
     68%       { transform: translate(373px,80px) }
     74%       { transform: translate(532px,138px) }
     80%       { transform: translate(660px,280px) }
     86%       { transform: translate(730px,484px) }
     92%,100%  { transform: translate(758px,600px) }
  }
  /* moon glitter trail on the river follows the moon's x */
  @keyframes moonTrack {
     0%,44%    { transform: translateX(758px) }
     44.5%     { transform: translateX(-40px) }
     50%       { transform: translateX(7px) }
     56%       { transform: translateX(86px) }
     62%       { transform: translateX(212px) }
     68%       { transform: translateX(373px) }
     74%       { transform: translateX(532px) }
     80%       { transform: translateX(660px) }
     86%       { transform: translateX(730px) }
     92%,100%  { transform: translateX(758px) }
  }

  .drift1 { animation: driftL 90s  linear infinite; }
  .drift2 { animation: driftL 140s linear infinite; }
  .drift3 { animation: driftR 110s linear infinite; }
  @keyframes driftL { from { transform: translateX(-160px) } to { transform: translateX(860px) } }
  @keyframes driftR { from { transform: translateX(800px) }  to { transform: translateX(-200px) } }

  .birds-move { animation: birdFly 22s linear infinite; }
  @keyframes birdFly {
     from { transform: translate(-90px, 20px) }
     50%  { transform: translate(360px, -18px) }
     to   { transform: translate(820px, 14px) }
  }

  .star { animation: tw var(--tw,3s) var(--td,0s) ease-in-out infinite; }
  @keyframes tw { 0%,100% {opacity:1} 50% {opacity:.15} }

  .shoot { animation: shoot var(--cyc) linear infinite; opacity: 0; }
  @keyframes shoot {
     0%,58% { opacity:0; transform: translate(650px,50px) }
     60%    { opacity:1 }
     66%    { opacity:0; transform: translate(330px,250px) }
     100%   { opacity:0; transform: translate(330px,250px) }
  }

  .beam  { transform-box: view-box; }
  .b1 { transform-origin: 105px 92px;  animation: sweep1 15s ease-in-out infinite alternate; }
  .b2 { transform-origin: 648px 46px;  animation: sweep2 19s ease-in-out infinite alternate; }
  @keyframes sweep1 { from { transform: rotate(-17deg) } to { transform: rotate(13deg) } }
  @keyframes sweep2 { from { transform: rotate(12deg) }  to { transform: rotate(-15deg) } }

  .blink { animation: blink 2.3s steps(1) infinite; }
  .blink2 { animation: blink 2.3s 1.15s steps(1) infinite; }
  @keyframes blink { 0%,45% {opacity:1} 50%,100% {opacity:.08} }

  .pulse { animation: pulse 3.2s ease-in-out infinite; }
  .pulse2 { animation: pulse 4.1s 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% {opacity:.9} 50% {opacity:.55} }

  .bob  { animation: bob 3.4s ease-in-out infinite; }
  .bob2 { animation: bob2 2.9s .4s ease-in-out infinite; }
  @keyframes bob  { 0%,100% { transform: translateY(0) }   50% { transform: translateY(2.2px) } }
  @keyframes bob2 { 0%,100% { transform: translateY(0) }   50% { transform: translateY(-2px) } }

  .shim  { animation: shim var(--sd,7s) ease-in-out infinite; }
  .shim2 { animation: shim2 var(--sd,9s) ease-in-out infinite; }
  @keyframes shim  { 0%,100% { transform: translateX(0) } 50% { transform: translateX(8px) } }
  @keyframes shim2 { 0%,100% { transform: translateX(0) } 50% { transform: translateX(-10px) } }

  .refwob { animation: refwob var(--rd,5s) ease-in-out infinite; }
  @keyframes refwob { 0%,100% { transform: translateX(0) } 50% { transform: translateX(5px) } }

  .win { animation: winfl var(--wf,7s) var(--wd,0s) linear infinite; }
  @keyframes winfl { 0%,89% {opacity:1} 92%,95% {opacity:.25} 97%,100% {opacity:1} }
</style>
</head>

      cx: rnd(4, 716).toFixed(1), cy: rnd(4, 470).toFixed(1),
      r: rnd(0.4, 1.7).toFixed(2), fill: "#eef4ff", "class": "star"
    }, starLayer);
    s.style.setProperty("--tw", rnd(1.8, 5).toFixed(2) + "s");
    s.style.setProperty("--td", rnd(0, 4).toFixed(2) + "s");
    s.setAttribute("opacity", rnd(0.4, 1).toFixed(2));
  }

  /* ---- lit windows: one layer of day glass + one of warm night lights ---- */
  var zones = [
    { x: 8,   y: 380, w: 32,  h: 218, cw: 3, ch: 5, gx: 2, gy: 6, skip: .35, day: "#8a7d6c", night: "#ffd98c" },
    { x: 34,  y: 400, w: 50,  h: 200, cw: 3, ch: 5, gx: 3, gy: 7, skip: .3,  day: "#8d7f6d", night: "#ffcf7e" },
    { x: 88,  y: 422, w: 40,  h: 178, cw: 4, ch: 4, gx: 2, gy: 6, skip: .3,  day: "#857863", night: "#ffc96e" },
    { x: 124, y: 458, w: 46,  h: 140, cw: 4, ch: 5, gx: 2, gy: 6, skip: .35, day: "#90836f", night: "#ffd98c" },
    { x: 164, y: 492, w: 52,  h: 106, cw: 3, ch: 5, gx: 3, gy: 7, skip: .3,  day: "#8b7e6b", night: "#ffcf7e" },
    { x: 214, y: 348, w: 58,  h: 250, cw: 6, ch: 2, gx: 2, gy: 5, skip: .4,  day: "rgba(20,60,90,.3)",  night: "rgba(210,235,255,.9)",  clip: "cpB" },
    { x: 404, y: 286, w: 56,  h: 270, cw: 5, ch: 2, gx: 1, gy: 4, skip: .45, day: "rgba(30,70,95,.3)",  night: "#d9f0ff", clip: "cpT1" },
    { x: 454, y: 278, w: 62,  h: 246, cw: 5, ch: 2, gx: 1, gy: 4, skip: .45, day: "rgba(90,120,150,.25)", night: "#e8f6ff", clip: "cpT2" },
    { x: 454, y: 260, w: 74,  h: 310, cw: 3, ch: 2, gx: 3, gy: 4, skip: .4,  day: "rgba(90,110,125,.35)", night: "#ffe9b8", clip: "cpJM" },
    { x: 470, y: 200, w: 70,  h: 340, cw: 3, ch: 2, gx: 3, gy: 5, skip: .45, day: "rgba(30,55,85,.3)",  night: "#cfe2ff", clip: "cpWFC" },
    { x: 518, y: 276, w: 70,  h: 250, cw: 20, ch: 1, gx: 2, gy: 8, skip: .5, day: "rgba(70,100,130,.3)", night: "#ffe6b0", clip: "cpSL" },
    { x: 548, y: 432, w: 106, h: 100, cw: 5, ch: 4, gx: 2, gy: 3, skip: .25, day: "#64788c", night: "#ffd98c", clip: "cpWG" },
    { x: 666, y: 358, w: 52,  h: 206, cw: 6, ch: 2, gx: 2, gy: 5, skip: .4,  day: "rgba(10,60,35,.35)", night: "rgba(200,255,215,.85)", clip: "cpGR" },
    { x: 640, y: 520, w: 76,  h: 78,  cw: 5, ch: 4, gx: 2, gy: 3, skip: .3,  day: "#7c8b9b", night: "#ffd98c", clip: "cpWB" },
    { x: 472, y: 426, w: 32,  h: 142, cw: 3, ch: 2, gx: 2, gy: 4, skip: .35, day: "rgba(90,110,125,.3)", night: "#ffe9b8", clip: "cpGC" },
    { x: 622, y: 60,  w: 64,  h: 510, cw: 4, ch: 3, gx: 3, gy: 6, skip: .55, day: "rgba(110,140,175,.25)", night: "#cfe6ff", clip: "cpST" }
  ];
  var winDay = el("g", {}, document.getElementById("city").querySelector("#winNight").parentNode);
  winDay.setAttribute("id", "winDay");
  document.getElementById("city").insertBefore(winDay, document.querySelector("#city .f-nwash"));
  var winNight = document.getElementById("winNight");

  zones.forEach(function (z) {
    var dayP = el("g", z.clip ? { "clip-path": "url(#" + z.clip + ")" } : {}, winDay);
    var nightP = el("g", z.clip ? { "clip-path": "url(#" + z.clip + ")" } : {}, winNight);
    for (var yy = z.y; yy + z.ch <= z.y + z.h; yy += z.ch + z.gy) {
      for (var xx = z.x; xx + z.cw <= z.x + z.w; xx += z.cw + z.gx) {
        if (Math.random() < z.skip) continue;
        el("rect", { x: xx, y: yy, width: z.cw, height: z.ch, fill: z.day }, dayP);
        var n = el("rect", { x: xx, y: yy, width: z.cw, height: z.ch, fill: z.night, "class": "win" }, nightP);
        n.style.setProperty("--wd", rnd(0, 7).toFixed(2) + "s");
        n.style.setProperty("--wf", rnd(5, 11).toFixed(2) + "s");
        if (Math.random() < 0.5) n.setAttribute("opacity", rnd(0.55, 1).toFixed(2));
      }
    }
  });

  /* ---- pearl tower shaft windows + sphere lattices ---- */
  var shaft = document.getElementById("pearlShaft");
  el("rect", { x: 99, y: 172, width: 3, height: 238, fill: "rgba(120,95,70,.55)" }, shaft);
  el("rect", { x: 110, y: 172, width: 3, height: 238, fill: "rgba(120,95,70,.55)" }, shaft);
  for (var y = 178; y < 408; y += 9) {
    el("rect", { x: 98.5, y: y, width: 4, height: 4, fill: "rgba(70,90,110,.35)" }, shaft);
    el("rect", { x: 109.5, y: y, width: 4, height: 4, fill: "rgba(70,90,110,.35)" }, shaft);
  }
  var shaftNight = el("g", { fill: "#ffd9a0", filter: "url(#glowSm)", "class": "f-lights" },
    document.querySelector("#city .f-lights"));
  for (var y2 = 178; y2 < 408; y2 += 9) {
    if (Math.random() < 0.35) continue;
    el("rect", { x: 98.5, y: y2, width: 4, height: 4 }, shaftNight);
    if (Math.random() < 0.7) el("rect", { x: 109.5, y: y2, width: 4, height: 4 }, shaftNight);
  }
  function lattice(id, cx, cy, r, gap) {
    var g = document.getElementById(id);
    for (var d = -2 * r; d <= 2 * r; d += gap) {
      el("path", { d: "M" + (cx - 2 * r) + " " + (cy + d) + " L" + (cx + 2 * r) + " " + (cy + d - 2 * r) }, g);
      el("path", { d: "M" + (cx - 2 * r) + " " + (cy + d - 2 * r) + " L" + (cx + 2 * r) + " " + (cy + d) }, g);
    }
  }
  lattice("pearlLatL", 105, 460, 47, 8.5);
  lattice("pearlLatU", 105, 132, 38, 7.5);
  lattice("pearlLatT", 105, 31, 13, 5);

  /* ---- colonnade arcade (day arches + night glow) ---- */
  var arcade = document.getElementById("colArcade");
  var arcadeNight = document.getElementById("arcadeNight");
  var pil = "";
  for (var i2 = 0; i2 < 12; i2++) {
    var ax = 188 + i2 * 21.5;
    var dpath = "M" + ax + " 556 v-22 a7.5 7.5 0 0 1 15 0 v22 Z";
    el("path", { d: dpath, fill: "#6b5638" }, arcade);
    el("path", { d: dpath, fill: "#ffcf8e" }, arcadeNight);
    pil += "M" + ax + " 508 V600 ";
  }
  el("path", { d: pil, stroke: "#cdb98f", "stroke-width": 2, fill: "none" }, arcade);

  /* ---- dome glass grids + colourful patches on the right dome ---- */
  function domeGrid(id, cx, cy, rx, ry) {
    var g = document.getElementById(id);
    [0.28, 0.55, 0.8].forEach(function (f) {
      el("ellipse", { cx: cx, cy: cy, rx: rx * f, ry: ry }, g);
    });
    el("ellipse", { cx: cx, cy: cy, rx: rx, ry: ry }, g);
    [-0.55, -0.25, 0.25, 0.55].forEach(function (f) {
      var half = rx * Math.sqrt(1 - f * f);
      el("path", { d: "M" + (cx - half) + " " + (cy + ry * f) + " H" + (cx + half) }, g);
    });
  }
  domeGrid("domeGridL", 146, 556, 52, 48);
  domeGrid("domeGridR", 420, 542, 64, 58);
  var patches = document.getElementById("domePatches");
  var patchColors = ["#e2703a", "#57a24a", "#c8425a", "#e8b23c", "#d4693a", "#6bbf59"];
  for (var p = 0; p < 18; p++) {
    var px = 420 + rnd(-52, 46), py = 542 + rnd(-50, 8);
    el("rect", { x: px.toFixed(1), y: py.toFixed(1), width: rnd(7, 13).toFixed(1),
      height: rnd(5, 9).toFixed(1), fill: pick(patchColors), opacity: rnd(0.5, 0.85).toFixed(2) }, patches);
  }

  /* ---- promenade lamps (posts by day, warm dots by night) ---- */
  var posts = document.getElementById("lampPosts");
  var lamps = document.getElementById("lamps");
  for (var lx = 14; lx < 720; lx += 46) {
    el("path", { d: "M" + lx + " 600 V591" }, posts);
    el("circle", { cx: lx, cy: 589.5, r: 2.2 }, lamps);
  }

  /* ---- water shimmer streaks ---- */
  var shim = document.getElementById("shimmer");
  for (var w = 0; w < 80; w++) {
    var line = el("rect", {
      x: rnd(0, 700).toFixed(1), y: rnd(620, 758).toFixed(1),
      width: rnd(6, 34).toFixed(1), height: 1.2, fill: "#dbeaf5",
      "class": Math.random() < 0.5 ? "shim" : "shim2",
      opacity: rnd(0.08, 0.3).toFixed(2)
    }, shim);
    line.style.setProperty("--sd", rnd(4, 11).toFixed(2) + "s");
  }
})();
</script>
</body>
</html>
