<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spec_01 · 上海陸家嘴日夜輪播 · glm-5.3-flash</title>
<style>
/* ============================================================
   spec_01 stage: Shanghai Lujiazui skyline, SVG day-night loop
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:radial-gradient(120% 120% at 50% 18%, #10131c 0%, #070a10 72%);
  display:flex;align-items:center;justify-content:center;
  font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color:#aeb9c9;
}
.wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px}
.stage{
  position:relative;
  width:min(92vw, calc(94vh * 0.949));
  aspect-ratio:729/768;
  border-radius:14px;overflow:hidden;cursor:pointer;user-select:none;
  box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);
}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.bar{display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap;justify-content:center}
.dot{width:10px;height:10px;border-radius:50%;background:#ffb457;box-shadow:0 0 8px #ffb457;transition:background .4s,box-shadow .4s}
.sep{width:1px;height:14px;background:#3a4454}
.hint{color:#5f6b7d}
svg.paused *{animation-play-state:paused !important}

/* ---------- 40s day-night cycle (all keyframes share one timeline) ---------- */
:root{--cycle:40s}
.sky-day    {animation:skyDay var(--cycle) linear infinite}
.sky-warm   {animation:skyWarm var(--cycle) linear infinite}
.sky-night  {animation:skyNight var(--cycle) linear infinite}
.stars      {animation:stars var(--cycle) linear infinite}
.city-dim   {animation:cityDim var(--cycle) linear infinite}
.lights     {animation:lights var(--cycle) linear infinite}
.sun-move   {animation:sunMove var(--cycle) linear infinite}
.sun-vis    {animation:sunVis var(--cycle) linear infinite}
.glow-warm  {animation:glowWarm var(--cycle) linear infinite}
.moon-move  {animation:moonMove var(--cycle) linear infinite}
.moon-vis   {animation:moonVis var(--cycle) linear infinite}
.moon-ref-move{animation:moonRefMove var(--cycle) linear infinite}
.glitter-move{animation:glitterMove var(--cycle) linear infinite}
.glitter-op {animation:glitterOp var(--cycle) linear infinite}
.cloud-op   {animation:cloudOp var(--cycle) linear infinite}

/* sky overlays: dawn(0-6) day(6-30) dusk(30-47) night(47-83) dawn(83-100) */
@keyframes skyDay{
  0%,97%,100%{opacity:.8} 6%{opacity:1} 30%{opacity:1} 38%{opacity:.7}
  44%{opacity:.15} 48%{opacity:0} 80%{opacity:0} 90%{opacity:.2} 95%{opacity:.55}
}
@keyframes skyWarm{
  0%,100%{opacity:.9} 5%{opacity:.5} 10%{opacity:.12} 22%{opacity:0} 32%{opacity:.12}
  38%{opacity:.5} 42%{opacity:.9} 47%{opacity:.5} 52%{opacity:0} 80%{opacity:0}
  84%{opacity:.3} 88%{opacity:.8} 92%{opacity:.9} 96%{opacity:.6}
}
@keyframes skyNight{
  0%,100%{opacity:.4} 6%{opacity:.12} 12%{opacity:0} 36%{opacity:0} 44%{opacity:.4}
  50%{opacity:.85} 56%{opacity:1} 82%{opacity:1} 89%{opacity:.55} 95%{opacity:.2}
}
/* whole city+river dims to near-black at night; lights group stays bright */
@keyframes cityDim{
  0%,100%{filter:brightness(.45) saturate(.9)}
  6%{filter:brightness(.85) saturate(.97)}
  12%{filter:brightness(1) saturate(1)}
  34%{filter:brightness(1) saturate(1)}
  40%{filter:brightness(.8) saturate(.95)}
  46%{filter:brightness(.4) saturate(.88)}
  54%{filter:brightness(.27) saturate(.85)}
  82%{filter:brightness(.27) saturate(.85)}
  89%{filter:brightness(.5) saturate(.9)}
  96%{filter:brightness(.85) saturate(.97)}
}
@keyframes lights{
  0%,100%{opacity:.65} 6%{opacity:.3} 14%{opacity:0} 36%{opacity:0}
  42%{opacity:.6} 48%{opacity:.95} 54%{opacity:1} 80%{opacity:1}
  86%{opacity:.7} 92%{opacity:.25} 97%{opacity:.5}
}
@keyframes stars{
  0%,100%{opacity:.45} 6%{opacity:.08} 12%{opacity:0} 38%{opacity:0}
  46%{opacity:.45} 52%{opacity:.9} 56%{opacity:1} 80%{opacity:1}
  88%{opacity:.4} 95%{opacity:.08}
}
/* sun: rise left(0%) -> noon(16-32%) -> set into skyline gap(44-46%) -> hidden -> rise again(97%) */
@keyframes sunMove{
  0%,97%,100%{transform:translate(75px,585px)}
  6%{transform:translate(140px,300px)}
  16%{transform:translate(215px,140px)}
  32%{transform:translate(330px,125px)}
  44%{transform:translate(572px,585px)}
  46%{transform:translate(576px,665px)}
  47%{transform:translate(75px,790px)}
  92%{transform:translate(75px,790px)}
}
@keyframes sunVis{
  0%,100%{opacity:1} 45%{opacity:1} 47%{opacity:0} 92%{opacity:0} 95%{opacity:.9} 97%{opacity:1}
}
@keyframes glowWarm{
  0%,100%{opacity:1} 5%{opacity:.55} 15%{opacity:.15} 32%{opacity:.12}
  40%{opacity:.6} 44%{opacity:1} 46%{opacity:.5} 60%{opacity:0} 88%{opacity:0}
  93%{opacity:.9} 97%{opacity:1}
}
/* moon: hidden below horizon -> rise right past Shanghai Tower -> arc left -> set before dawn */
@keyframes moonMove{
  0%,84%,100%{transform:translate(95px,730px)}
  48%{transform:translate(640px,730px)}
  54%{transform:translate(640px,585px)}
  60%{transform:translate(630px,300px)}
  66%{transform:translate(405px,125px)}
  78%{transform:translate(150px,480px)}
}
/* moon reflection column tracks the moon's x on the water */
@keyframes moonRefMove{
  0%,84%,100%{transform:translate(95px,0)}
  48%{transform:translate(640px,0)}
  54%{transform:translate(640px,0)}
  60%{transform:translate(630px,0)}
  66%{transform:translate(405px,0)}
  78%{transform:translate(150px,0)}
}
@keyframes moonVis{
  0%,100%{opacity:0} 50%{opacity:0} 56%{opacity:.9} 60%{opacity:1} 80%{opacity:1} 83%{opacity:0}
}
/* sun glitter on river follows the sun's x */
@keyframes glitterMove{
  0%,97%,100%{transform:translate(75px,0)}
  6%{transform:translate(140px,0)}
  16%{transform:translate(215px,0)}
  32%{transform:translate(330px,0)}
  44%{transform:translate(572px,0)}
  46%{transform:translate(576px,0)}
  47%{transform:translate(75px,0)}
  92%{transform:translate(75px,0)}
}
@keyframes glitterOp{
  0%,100%{opacity:.55} 6%{opacity:.4} 16%{opacity:.32} 32%{opacity:.3}
  40%{opacity:.5} 44%{opacity:.65} 47%{opacity:0} 92%{opacity:0} 96%{opacity:.5}
}
@keyframes cloudOp{
  0%,100%{opacity:.3} 6%{opacity:.85} 12%{opacity:.85} 34%{opacity:.85}
  44%{opacity:.35} 50%{opacity:.08} 80%{opacity:.08} 90%{opacity:.2} 97%{opacity:.3}
}

/* ---------- ambient (independent short loops) ---------- */
.tw     {animation:twinkle var(--d,3s) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1} 50%{opacity:.2}}
.blink  {animation:blink 2.2s linear infinite}
@keyframes blink{0%,100%{opacity:.95} 50%{opacity:.1}}
.bob    {animation:bob var(--d,4.6s) ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-1.5px)} to{transform:translateY(2.5px)}}
.sh     {animation:shimmer var(--d,6s) ease-in-out infinite alternate}
@keyframes shimmer{0%,100%{opacity:.4;transform:translateX(-6px)} 50%{opacity:.9;transform:translateX(6px)}}
.flicker{animation:flicker 9s linear infinite}
@keyframes flicker{0%,100%{opacity:1} 6%{opacity:.3} 10%{opacity:1} 42%{opacity:.85} 47%{opacity:.25} 52%{opacity:1}}
.drift  {animation:drift var(--d,60s) ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateX(-16px)} 50%{transform:translateX(16px)}}
</style>

<script>
(function(){
  var svg = document.getElementById('scene-svg');
  var stage = document.getElementById('stage');
  var label = document.getElementById('phase-label');
  var dot = document.getElementById('phase-dot');
  var CYCLE = 40000;
  var phases = [
    [0.06, '日出', '#ffb457'],
    [0.30, '白天', '#8fd0ff'],
    [0.47, '日落', '#ff7a4a'],
    [0.83, '夜晚', '#7a86ff'],
    [1.001, '黎明', '#ff9dc0']
  ];
  var paused = false;
  stage.addEventListener('click', function(){
    paused = !paused;
    svg.classList.toggle('paused', paused);
  });
  function nowMs(){
    if (document.timeline && document.timeline.currentTime) return document.timeline.currentTime;
    return performance.now();
  }
  setInterval(function(){
    if (paused) return;
    var p = (nowMs() % CYCLE) / CYCLE;
    for (var i = 0; i < phases.length; i++){
      if (p < phases[i][0]){
        label.textContent = phases[i][1];
        dot.style.background = phases[i][2];
        dot.style.boxShadow = '0 0 8px ' + phases[i][2];
        break;
      }
    }
  }, 250);
})();
</script>
