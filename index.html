<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Coin Run — 入口</title>
</head>
<body style="font: 16px/1.6 system-ui, sans-serif; margin: 2rem">
<h1>Coin Run</h1>
<p id="go">正在進入 <a id="golink" href="preview-spec_04-swift-1.5-iq3_s-max-80-20261028000156/web/index.html">WebGL 版</a>…</p>
<p id="hint" hidden></p>
<ul id="cands"></ul>

<script>
// 這頁在仓库根 = http server 的根。目標是交付目錄裡的 web/index.html。
// 網址要從 pathname 自己算並 fetch 探測（認 Godot 殼層的 index.js 特徵），因為伺服器不保證補尾端斜線，
// 而交付目錄名這輪被改過（加了 -80-）→ 找不到時把候選列成連結讓人手動點。
(function () {
  var DIR = "preview-spec_04-swift-1.5-iq3_s-max-80-20261028000156";
  var go = document.getElementById("go");
  var hint = document.getElementById("hint");
  var list = document.getElementById("cands");

  function show(msg, urls) {
    go.hidden = true;
    hint.hidden = false;
    hint.textContent = msg;
    urls.forEach(function (u) {
      var a = document.createElement("a");
      a.href = u;
      a.textContent = u;
      var li = document.createElement("li");
      li.appendChild(a);
      list.appendChild(li);
    });
  }

  if (location.protocol === "file:") {
    show("這頁要用 HTTP 開（Godot Web 版的 wasm 不能用 file:// 載入）。在仓库根跑 python3 -m http.server 8000，再開 http://localhost:8000/", []);
    return;
  }

  var base = /\/$/.test(location.pathname) ? location.pathname : location.pathname.replace(/[^/]*$/, "");
  var cands = [base + DIR + "/web/index.html", base.replace(/[^/]*$/, "") + DIR + "/web/index.html"];
  var i = 0;
  (function next() {
    if (i >= cands.length) {
      show("找不到 WebGL 版。可能是交付目錄被改名（請用下列連結），或 web/ 还没匯出：cd 交付目錄 && make web。", cands);
      return;
    }
    var url = cands[i++];
    var link = document.getElementById("golink");
    link.href = url;
    link.textContent = url;
    fetch(url, { cache: "no-store" })
      .then(function (r) { return r.ok ? r.text() : ""; })
      .then(function (t) { if (t.indexOf("index.js") >= 0) location.replace(url); else next(); })
      .catch(next);
  })();
})();
</script>
</body>
</html>
