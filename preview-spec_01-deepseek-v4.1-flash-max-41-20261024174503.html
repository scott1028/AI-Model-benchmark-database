<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lujiazui · Day &amp; Night</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: radial-gradient(120% 90% at 50% 20%, #0c1622 0%, #04070c 70%);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .stage {
    position: relative;
    width: min(94vw, calc(92vh * 760 / 782), 980px);
    aspect-ratio: 760 / 782;
    border-radius: 4px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(160, 200, 235, .12),
      0 26px 80px rgba(0, 0, 0, .7),
      0 4px 18px rgba(0, 0, 0, .45);
  }
  svg { display: block; width: 100%; height: 100%; }
  .twinkle { animation: twinkle var(--dur, 3.4s) ease-in-out var(--delay, 0s) infinite alternate; }
  @keyframes twinkle { from { opacity: .12; } to { opacity: 1; } }
  .cloud { animation: cloudDrift 140s ease-in-out infinite alternate; }
  .cloud.b { animation-duration: 180s; animation-direction: alternate-reverse; }
  @keyframes cloudDrift { from { transform: translateX(-26px); } to { transform: translateX(54px); } }
  .rippleA { animation: rippleA 16s ease-in-out infinite alternate; }
  .rippleB { animation: rippleB 23s ease-in-out infinite alternate-reverse; }
  @keyframes rippleA { from { transform: translateX(-16px); } to { transform: translateX(18px); } }
  @keyframes rippleB { from { transform: translateX(12px); } to { transform: translateX(-14px); } }
  .sparkle { animation: sparkle var(--dur, 3s) ease-in-out var(--delay, 0s) infinite alternate; }
  @keyframes sparkle { from { opacity: .04; } to { opacity: var(--max, .5); } }
  .bob { animation: bob 4.6s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(-1.2px); } to { transform: translateY(1.4px); } }
  .boat-left { animation: boatLeft 46s ease-in-out infinite alternate; }
  @keyframes boatLeft { from { transform: translateX(0); } to { transform: translateX(30px); } }
  .boat-right { animation: boatRight 52s ease-in-out infinite alternate; }
  @keyframes boatRight { from { transform: translateX(0); } to { transform: translateX(-34px); } }
  .bird { animation: birdFlight 52s linear infinite; }
  .bird.b2 { animation-duration: 61s; animation-delay: -21s; }
  .bird.b3 { animation-duration: 47s; animation-delay: -33s; }
  .bird.b4 { animation-duration: 68s; animation-delay: -9s; }
  @keyframes birdFlight {
    0%   { transform: translate(-90px, 208px) scale(.62); }
    38%  { transform: translate(310px, 148px) scale(.86); }
    72%  { transform: translate(590px, 198px) scale(.72); }
    100% { transform: translate(830px, 138px) scale(.6); }
  }
  .bird .wing { animation: flap 0.72s ease-in-out infinite alternate; transform-origin: center; }
  .bird.b2 .wing { animation-duration: .9s; }
  .bird.b3 .wing { animation-duration: .62s; }
  @keyframes flap { from { transform: scaleY(.45); } to { transform: scaleY(1.15); } }
  .beacon { animation: beacon 2.4s steps(2, end) infinite; }
  .beacon.b { animation-duration: 1.7s; animation-delay: -.6s; }
  .beacon.c { animation-duration: 3.1s; animation-delay: -1.2s; }
  @keyframes beacon { 0%, 42% { opacity: 1; } 43%, 100% { opacity: .08; } }
  .flag { transform-origin: 0 0; animation: flagWave 2.8s ease-in-out infinite alternate; }
  @keyframes flagWave { from { transform: skewY(-2deg) scaleX(.94); } to { transform: skewY(2deg) scaleX(1.02); } }
  .hidden { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .cloud, .rippleA, .rippleB, .boat-left, .boat-right, .bird, .bird .wing, .flag { animation-duration: 0.001s; }
  }
</style>
</head>

<script>
(() => {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (id) => document.getElementById(id);
  const svg = $('scene');
  const el = (tag, attrs, parent) => {
    const node = document.createElementNS(NS, tag);
    if (attrs) for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    if (parent) parent.appendChild(node);
    return node;
  };
  let seed = 20261024;
  const rnd = () => {
    seed |= 0;
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  /* --- stars --- */
  const stars = $('stars');
  for (let i = 0; i < 138; i += 1) {
    const x = rnd() * 760;
    const y = Math.pow(rnd(), 1.25) * 450;
    const r = 0.35 + rnd() * 1.25;
    const star = el('circle', {
      cx: x.toFixed(1), cy: y.toFixed(1), r: r.toFixed(2),
      fill: rnd() < 0.2 ? '#d8e8ff' : '#f2f7ff',
      opacity: (0.28 + rnd() * 0.62).toFixed(2)
    }, stars);
    star.classList.add('twinkle');
    star.style.setProperty('--dur', (2.2 + rnd() * 4.6).toFixed(2) + 's');
    star.style.setProperty('--delay', (-rnd() * 7).toFixed(2) + 's');
  }

  /* --- arcade details --- */
  const balustrade = $('balustrade');
  el('rect', { x: 184, y: 468, width: 240, height: 2.4, fill: '#e9d8bb' }, balustrade);
  for (let i = 0; i < 31; i += 1) {
    el('rect', {
      x: (186 + i * 7.85).toFixed(1), y: 471, width: 1.5, height: 7,
      fill: '#c9b191', opacity: (0.55 + rnd() * 0.25).toFixed(2)
    }, balustrade);
  }
  const arches = $('arches');
  const archLights = $('archLights');
  for (let i = 0; i < 30; i += 1) {
    el('rect', {
      x: (190 + i * 7.6).toFixed(1), y: 488.5, width: 3, height: 2.6,
      fill: '#d6c2a3', opacity: 0.45
    }, arches);
  }
  for (let i = 0; i < 11; i += 1) {
    const x = 197 + i * 19.6;
    const d = `M${x} 566 L${x} 520 Q${x} 505 ${x + 7} 505 Q${x + 14} 505 ${x + 14} 520 L${x + 14} 566 Z`;
    el('path', { d, fill: '#173b4e', opacity: 0.94 }, arches);
    el('path', {
      d: `M${x + 1.8} 563.5 L${x + 1.8} 521 Q${x + 1.8} 508.5 ${x + 7} 508.5 Q${x + 12.2} 508.5 ${x + 12.2} 521 L${x + 12.2} 563.5 Z`,
      fill: '#ffd08b', opacity: (0.5 + rnd() * 0.32).toFixed(2)
    }, archLights);
    el('path', { d, fill: 'none', stroke: '#e4d3b7', 'stroke-width': 1.3, opacity: 0.6 }, arches);
    el('path', {
      d: `M${x + 7} 508 V565 M${x + 2.4} 532 H${x + 11.6}`,
      stroke: '#a7cbd7', 'stroke-width': 0.6, opacity: 0.33
    }, arches);
    el('rect', { x: x - 1, y: 564, width: 16, height: 2.6, fill: '#b09a7c', opacity: 0.65 }, arches);
    el('rect', { x: x + 14, y: 499, width: 4.2, height: 67, fill: '#d8c5a6', opacity: 0.35 }, arches);
    el('rect', { x: x + 13, y: 496, width: 6.2, height: 4, fill: '#e1cfb2', opacity: 0.55 }, arches);
    el('path', {
      d: `M${x + 5.2} 506 L${x + 7} 499.5 L${x + 8.8} 506Z`,
      fill: '#e8d6b9', opacity: 0.75
    }, arches);
    el('rect', { x: x + 3.6, y: 515, width: 6.8, height: 1.2, fill: '#d6c8b4', opacity: 0.45 }, arches);
  }

  /* --- lit windows --- */
  const windowSpecs = [
    { x: 4, y: 456, w: 66, h: 108, cols: 7, rows: 13, density: 0.5, cool: 0.35 },
    { x: 84, y: 481, w: 104, h: 82, cols: 13, rows: 7, density: 0.66, wide: true, cool: 0.5 },
    { x: 196, y: 402, w: 21, h: 160, cols: 3, rows: 18, density: 0.45, cool: 0.3 },
    { x: 242, y: 384, w: 28, h: 178, cols: 3, rows: 20, density: 0.42, clip: 'clipCylinder', cool: 0.4 },
    { x: 277, y: 496, w: 17, h: 72, cols: 2, rows: 10, density: 0.5, cool: 0.35 },
    { x: 298, y: 448, w: 18, h: 115, cols: 2, rows: 16, density: 0.42, cool: 0.3 },
    { x: 320, y: 468, w: 18, h: 100, cols: 2, rows: 14, density: 0.48, cool: 0.4 },
    { x: 344, y: 436, w: 11, h: 128, cols: 2, rows: 17, density: 0.35, cool: 0.35 },
    { x: 362, y: 460, w: 20, h: 104, cols: 3, rows: 13, density: 0.45, cool: 0.35 },
    { x: 403, y: 394, w: 26, h: 168, cols: 3, rows: 19, density: 0.5, cool: 0.45 },
    { x: 435, y: 458, w: 27, h: 106, cols: 4, rows: 12, density: 0.48, cool: 0.4 },
    { x: 478, y: 258, w: 64, h: 302, cols: 6, rows: 32, density: 0.34, clip: 'clipSWFC', cool: 0.55 },
    { x: 546, y: 258, w: 54, h: 304, cols: 5, rows: 26, density: 0.45, clip: 'clipJinMao', cool: 0.2 },
    { x: 604, y: 352, w: 38, h: 210, cols: 4, rows: 19, density: 0.42, cool: 0.35 },
    { x: 641, y: 70, w: 78, h: 492, cols: 5, rows: 32, density: 0.2, clip: 'clipShanghai', cool: 0.7 },
    { x: 600, y: 471, w: 118, h: 92, cols: 12, rows: 8, density: 0.52, wide: true, cool: 0.55 },
    { x: 720, y: 456, w: 36, h: 108, cols: 5, rows: 12, density: 0.42, cool: 0.4 }
  ];
  const windowGroups = [];
  for (const spec of windowSpecs) {
    const group = el('g', null, $('windowLights'));
    if (spec.clip) group.setAttribute('clip-path', `url(#${spec.clip})`);
    const cw = spec.w / spec.cols;
    const ch = spec.h / spec.rows;
    for (let row = 0; row < spec.rows; row += 1) {
      for (let col = 0; col < spec.cols; col += 1) {
        if (rnd() > spec.density) continue;
        const ww = cw * (spec.wide ? 0.64 : 0.42);
        const hh = ch * (spec.wide ? 0.3 : 0.5);
        const x = spec.x + col * cw + (cw - ww) / 2;
        const y = spec.y + row * ch + (ch - hh) / 2;
        const warm = rnd() > (spec.cool || 0.35);
        el('rect', {
          x: x.toFixed(1), y: y.toFixed(1), width: ww.toFixed(1), height: hh.toFixed(1),
          rx: 0.35, fill: warm ? (rnd() < 0.18 ? '#fff2d1' : '#ffd296') : '#cfeaff',
          'fill-opacity': (0.32 + rnd() * 0.68).toFixed(2)
        }, group);
      }
    }
    group.dataset.max = (0.72 + rnd() * 0.28).toFixed(2);
    windowGroups.push(group);
  }

  /* --- lamps, beacons --- */
  const lampGlows = $('lampGlows');
  [174, 306, 438, 552, 686, 754].forEach((x) => {
    el('circle', { cx: x, cy: 533, r: 17, fill: 'url(#gWarmGlow)' }, lampGlows);
  });
  const promenadeDetails = $('promenadeDetails');
  for (let i = 0; i < 25; i += 1) {
    const x = 8 + i * 31;
    el('rect', { x, y: 578, width: 2.2, height: 4, rx: 0.8, fill: '#525c5b', opacity: 0.6 }, promenadeDetails);
    el('circle', { cx: x + 1.1, cy: 577.4, r: 1.4, fill: '#6f7774', opacity: 0.55 }, promenadeDetails);
  }
  for (const x of [126, 372, 512, 668]) {
    el('rect', { x, y: 569, width: 18, height: 5.5, rx: 1, fill: '#8b8a7c', opacity: 0.55 }, promenadeDetails);
    el('rect', { x: x + 2, y: 560, width: 14, height: 9, rx: 1, fill: '#4a6a46', opacity: 0.65 }, promenadeDetails);
  }
  /* --- Shanghai Tower fins --- */
  const fins = $('shanghaiFins');
  for (let i = 0; i < 11; i += 1) {
    const t = i / 10;
    const bx = 636 + t * 88;
    const tx = 661 + t * 42;
    el('path', {
      d: `M${bx.toFixed(1)} 572 C${(bx + 6).toFixed(1)} 420 ${(tx - 4).toFixed(1)} 180 ${tx.toFixed(1)} 32`,
      fill: 'none', stroke: '#eaffff',
      'stroke-width': (0.6 + rnd() * 1.1).toFixed(2),
      'stroke-opacity': (0.1 + rnd() * 0.16).toFixed(2)
    }, fins);
  }

  const beaconGroup = el('g', null, $('cityscape'));
  [
    [494, 196, 0], [526, 196, 0.6], [570, 243, 1.2], [680, 27, 0.3],
    [256, 314, 0.9], [349, 394, 0.4], [609, 360, 1.4]
  ].forEach(([x, y, delay]) => {
    const b = el('circle', {
      cx: x, cy: y, r: 1.9, fill: '#ff6457', opacity: 0.95,
      class: delay > 0.8 ? 'beacon c' : delay > 0.4 ? 'beacon b' : 'beacon'
    }, beaconGroup);
    b.style.animationDelay = (-delay) + 's';
  });

  /* --- water texture --- */
  const ripples = $('ripples');
  for (let i = 0; i < 62; i += 1) {
    const y = 600 + rnd() * 172;
    const x = rnd() * 740 - 30;
    const len = 26 + rnd() * 120;
    const cls = i % 4 === 0 ? 'rippleA' : i % 4 === 1 ? 'rippleB' : '';
    const g = el('g', { class: cls, opacity: (0.25 + rnd() * 0.6).toFixed(2) }, ripples);
    const light = rnd() < 0.62;
    el('path', {
      d: `M${x.toFixed(1)} ${y.toFixed(1)} q ${(len / 4).toFixed(1)} -1.8 ${(len / 2).toFixed(1)} 0 t ${(len / 2).toFixed(1)} 0`,
      fill: 'none',
      stroke: light ? '#e1f7fc' : '#062b3d',
      'stroke-width': light ? (0.5 + rnd() * 0.9).toFixed(2) : (0.8 + rnd() * 1.6).toFixed(2),
      'stroke-opacity': light ? 0.32 : 0.3
    }, g);
    if (rnd() < 0.35) {
      el('path', {
        d: `M${(x + 14).toFixed(1)} ${(y + 4).toFixed(1)} q ${(len / 3).toFixed(1)} 1.2 ${(len / 1.8).toFixed(1)} 0`,
        fill: 'none', stroke: '#bfe8f2', 'stroke-width': 0.6, 'stroke-opacity': 0.22
      }, g);
    }
  }
  const streakClusters = [
    { x: 70, w: 92, colors: ['#f2a1ab', '#e9c0bd', '#c7e6ef', '#a9d5e4'] },
    { x: 96, w: 90, colors: ['#88cdb9', '#b7e5d4', '#d7f0e8'] },
    { x: 408, w: 86, colors: ['#82c9b8', '#c4eadb', '#e0f3ec'] },
    { x: 456, w: 108, colors: ['#8dc3df', '#b4dfef', '#6ca7c8'] },
    { x: 518, w: 104, colors: ['#b96b49', '#d68a58', '#8cb5bd'] },
    { x: 588, w: 140, colors: ['#d8d6c6', '#9cb7bd', '#c7ded8'] },
    { x: 640, w: 92, colors: ['#79b9b6', '#a9d8d0', '#d9eeea'] }
  ];
  const waterStreaks = $('waterStreaks');
  for (const cluster of streakClusters) {
    const group = el('g', { class: rnd() < 0.5 ? 'rippleA' : 'rippleB' }, waterStreaks);
    for (let i = 0; i < 26; i += 1) {
      const y = 592 + Math.pow(rnd(), 1.2) * 138;
      const x = cluster.x + rnd() * cluster.w;
      const len = 8 + rnd() * 40;
      el('path', {
        d: `M${x.toFixed(1)} ${y.toFixed(1)} q ${(len / 4).toFixed(1)} ${(rnd() * 3 - 1.5).toFixed(1)} ${(len / 2).toFixed(1)} 0 t ${(len / 2).toFixed(1)} 0`,
        fill: 'none',
        stroke: cluster.colors[Math.floor(rnd() * cluster.colors.length)],
        'stroke-width': (0.5 + rnd() * 1.9).toFixed(2),
        'stroke-opacity': (0.12 + rnd() * 0.32).toFixed(2),
        'stroke-linecap': 'round'
      }, group);
    }
  }
  const warmStreaks = $('warmStreaks');
  for (let i = 0; i < 60; i += 1) {
    const y = 594 + Math.pow(rnd(), 1.5) * 128;
    const x = 20 + rnd() * 720;
    const len = 4 + rnd() * 24;
    el('path', {
      d: `M${x.toFixed(1)} ${y.toFixed(1)} q ${(len / 3).toFixed(1)} 0 ${(len * 0.66).toFixed(1)} -0.8`,
      fill: 'none', stroke: rnd() < 0.5 ? '#ffd59b' : '#ffe9c2',
      'stroke-width': (0.6 + rnd() * 1.3).toFixed(2),
      'stroke-opacity': (0.18 + rnd() * 0.4).toFixed(2),
      'stroke-linecap': 'round'
    }, warmStreaks);
  }

  const coolSparkles = el('g', null, $('sparkles'));
  const warmSparkles = el('g', { id: 'warmSparkles' }, $('sparkles'));
  for (let i = 0; i < 110; i += 1) {
    const warm = rnd() < 0.38;
    const s = el('rect', {
      x: (rnd() * 760).toFixed(1), y: (594 + rnd() * 178).toFixed(1),
      width: (0.7 + rnd() * 2.8).toFixed(1), height: (0.35 + rnd() * 0.6).toFixed(2),
      rx: 0.4, fill: warm ? '#ffd89d' : '#dcf6ff'
    }, warm ? warmSparkles : coolSparkles);
    s.classList.add('sparkle');
    s.style.setProperty('--dur', (1.8 + rnd() * 3.8).toFixed(2) + 's');
    s.style.setProperty('--delay', (-rnd() * 5).toFixed(2) + 's');
    s.style.setProperty('--max', (0.18 + rnd() * 0.48).toFixed(2));
  }

  /* --- colour helpers --- */
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const smoothstep = (a, b, x) => {
    const t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  };
  const hexToRgb = (hex) => [
    parseInt(hex.slice(1, 3), 16),
    parseInt(hex.slice(3, 5), 16),
    parseInt(hex.slice(5, 7), 16)
  ];
  const mixRgb = (a, b, t) => [
    a[0] + (b[0] - a[0]) * t,
    a[1] + (b[1] - a[1]) * t,
    a[2] + (b[2] - a[2]) * t
  ];
  const toHex = (rgb) => '#' + rgb.map((v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
  const mixHex = (a, b, t) => toHex(mixRgb(hexToRgb(a), hexToRgb(b), t));

  const stopEls = {};
  svg.querySelectorAll('[data-c]').forEach((stop) => {
    const key = stop.dataset.c;
    (stopEls[key] || (stopEls[key] = [])).push(stop);
  });
  const lastPaint = {};
  const paint = (key, color) => {
    if (!stopEls[key] || lastPaint[key] === color) return;
    lastPaint[key] = color;
    for (const stop of stopEls[key]) stop.setAttribute('stop-color', color);
  };

  /* --- sky --- */
  const skyKeys = [
    [0, ['#020817', '#06162b', '#0a2a43', '#143952', '#1b4057']],
    [4.6, ['#041026', '#0d233d', '#20415d', '#4a5568', '#6c6a70']],
    [5.9, ['#15284f', '#4b5275', '#b87c70', '#eaa67d', '#f4c39a']],
    [7.3, ['#0b4b9c', '#347fc2', '#8bbfe1', '#d6e9f5', '#e8f4fa']],
    [10, ['#0456b8', '#1877d4', '#63afe3', '#aed8f2', '#cbe7f7']],
    [14, ['#085cc0', '#2483d7', '#74bbe8', '#b7def4', '#d2ebf8']],
    [17, ['#1d559f', '#4f8ac0', '#b5c4c9', '#f0d2a5', '#ffdca8']],
    [18.45, ['#263e70', '#7b7291', '#d79378', '#f3b07f', '#ffd59b']],
    [19.65, ['#111c3b', '#3d4060', '#8c5763', '#c87d6b', '#e6a477']],
    [21, ['#050e20', '#0a1c33', '#102c46', '#1a3a53', '#294a5d']],
    [24, ['#020817', '#06162b', '#0a2a43', '#143952', '#1b4057']]
  ].map(([h, colors]) => [h, colors.map(hexToRgb)]);

  const sampleSky = (hour) => {
    let i = 0;
    while (i < skyKeys.length - 2 && hour >= skyKeys[i + 1][0]) i += 1;
    const [h0, c0] = skyKeys[i];
    const [h1, c1] = skyKeys[i + 1];
    const t = h1 === h0 ? 0 : smoothstep(0, 1, (hour - h0) / (h1 - h0));
    return c0.map((c, j) => toHex(mixRgb(c, c1[j], t)));
  };

  /* --- materials --- */
  const dayMat = {
    swfc0: '#b5daec', swfc1: '#3a6e90', swfc2: '#0a2b41',
    glassL0: '#c9ebf8', glassL1: '#71afd3', glassL2: '#235777',
    glassM0: '#a3cde4', glassM1: '#4b84a8', glassM2: '#153e5b',
    glassD0: '#6d9cb6', glassD1: '#2c5a75', glassD2: '#0a2a3f',
    teal0: '#b2e1d3', teal1: '#5aa096', teal2: '#225d55',
    shang0: '#a9cdd7', shang1: '#467e8b', shang2: '#0d3544',
    white0: '#f8f5ec', white1: '#d8d7ce', white2: '#9ba4a6',
    stone0: '#eddfc7', stone1: '#cdb798', stone2: '#9b8368',
    concrete0: '#e9e3d6', concrete1: '#c6c1b2', concrete2: '#9d9b90',
    dome0: '#b5e8d7', dome1: '#5da89a', dome2: '#205e57',
    distant0: '#b8d2e2', distant1: '#7ca5be',
    water0: '#6caac7', water1: '#347d9d', water2: '#175570', water3: '#0a3a51'
  };
  const nightMat = {
    swfc0: '#24465b', swfc1: '#0b2435', swfc2: '#010a12',
    glassL0: '#57788e', glassL1: '#1d3d53', glassL2: '#071624',
    glassM0: '#37576c', glassM1: '#112f43', glassM2: '#04101b',
    glassD0: '#203f51', glassD1: '#0a2331', glassD2: '#020a11',
    teal0: '#4b7f77', teal1: '#16423c', teal2: '#041817',
    shang0: '#2b4e5a', shang1: '#0e2b37', shang2: '#03131b',
    white0: '#8e969c', white1: '#4d545b', white2: '#2a3137',
    stone0: '#8f8473', stone1: '#5d5549', stone2: '#352f28',
    concrete0: '#969a97', concrete1: '#565d5e', concrete2: '#31393d',
    dome0: '#4b8c82', dome1: '#1b534d', dome2: '#041e1b',
    distant0: '#345168', distant1: '#1a3547',
    water0: '#1c4055', water1: '#0b2b3b', water2: '#051c28', water3: '#020f17'
  };
  const matKeys = Object.keys(dayMat);
  const warmKeys = new Set(['swfc0', 'glassL0', 'glassM0', 'glassD0', 'teal0', 'shang0', 'white0', 'stone0', 'concrete0', 'dome0', 'water0', 'distant0']);
  const warmTint = hexToRgb('#efb080');
  const shadowTint = hexToRgb('#403051');
  const nightRgb = {};
  matKeys.forEach((k) => { nightRgb[k] = [hexToRgb(dayMat[k]), hexToRgb(nightMat[k])]; });

  const paintMaterials = (night, golden) => {
    for (const key of matKeys) {
      const [d, n] = nightRgb[key];
      let c = mixRgb(d, n, night);
      if (golden > 0.01) {
        c = mixRgb(c, warmKeys.has(key) ? warmTint : shadowTint, golden * (warmKeys.has(key) ? 0.23 : 0.11));
      }
      paint(key, toHex(c));
    }
  };

  /* --- timeline --- */
  const sunGroup = $('sunGroup');
  const moonGroup = $('moonGroup');
  const starsGroup = $('stars');
  const cityGlow = $('cityGlowEllipse');
  const reflection = $('reflectionGroup');
  const birdsGroup = $('birds');
  const nightWaterTint = $('nightWaterTint');
  const waterGlow = $('waterGlow');
  const warmStreakLayer = $('warmStreaks');
  const boatNightLights = $('boatNightLights');
  const moonReflection = $('moonReflection');
  const treeLine = $('tree-line');
  const redTreeLine = $('red-tree-line');
  const boatLeft = document.querySelector('.boat-left');
  const boatRight = document.querySelector('.boat-right');
  const dockGroup = $('dock');
  const pearlLights = $('pearlLights');
  const swfcLights = $('swfcLights');
  const jinmaoLights = $('jinmaoLights');
  const shanghaiLights = $('shanghaiLights');
  const globeGlowA = $('globeGlowA');
  const globeGlowB = $('globeGlowB');

  const nightAt = (hour) => hour >= 12
    ? smoothstep(17.85, 19.55, hour)
    : 1 - smoothstep(4.7, 6.65, hour);

  const goldenAt = (hour) => Math.max(
    Math.exp(-Math.pow((hour - 18.28) / 0.92, 2) / 2),
    Math.exp(-Math.pow((hour - 5.98) / 0.82, 2) / 2)
  );

  const update = (hour) => {
    const night = nightAt(hour);
    const golden = goldenAt(hour);
    const glow = smoothstep(0.12, 0.72, night);

    const sky = sampleSky(hour);
    sky.forEach((color, i) => paint('sky' + i, color));
    paint('haze0', mixHex(sky[2], night > 0.5 ? '#c99c74' : '#ffffff', 0.3));
    paint('haze1', mixHex(sky[3], night > 0.5 ? '#d7a16d' : '#ffffff', 0.3));
    paint('haze2', mixHex(sky[4], night > 0.5 ? '#e4ae70' : '#ffffff', 0.42));
    paintMaterials(night, golden);

    const sunProgress = (hour - 6.1) / 12.9;
    const sunAltitude = (hour >= 6.1 && hour <= 19.0) ? Math.sin(Math.PI * clamp(sunProgress, 0, 1)) : -1;
    const sunX = 30 + 700 * clamp(sunProgress, 0, 1);
    const sunY = 588 - 480 * Math.max(0, Math.sin(Math.PI * clamp(sunProgress, 0, 1)));
    const sunScale = 1 + (1 - clamp(sunAltitude, 0, 1)) * 0.42;
    sunGroup.setAttribute('transform', `translate(${sunX.toFixed(1)} ${sunY.toFixed(1)}) scale(${sunScale.toFixed(3)})`);
    sunGroup.setAttribute('opacity', sunAltitude > 0 ? (0.55 + 0.45 * Math.min(1, sunAltitude * 2.4)).toFixed(2) : '0');

    let moonProgress = -1;
    if (hour >= 18.6) moonProgress = (hour - 18.6) / 11.6;
    else if (hour < 6.4) moonProgress = (hour + 5.4) / 11.6;
    const moonX = 60 + 640 * clamp(moonProgress, 0, 1);
    const moonY = 588 - 430 * Math.sin(Math.PI * clamp(moonProgress, 0, 1));
    moonGroup.setAttribute('transform', `translate(${moonX.toFixed(1)} ${moonY.toFixed(1)})`);
    moonGroup.setAttribute('opacity', moonProgress >= 0 && moonProgress <= 1
      ? (Math.min(1, Math.sin(Math.PI * moonProgress) * 2.6) * clamp(night * 1.5, 0, 1)).toFixed(2)
      : '0');

    moonReflection.setAttribute('transform', `translate(${moonX.toFixed(1)} 0)`);
    moonReflection.setAttribute('opacity', moonProgress >= 0 && moonProgress <= 1
      ? (clamp(night, 0, 1) * 0.55 * Math.min(1, Math.sin(Math.PI * moonProgress) * 2)).toFixed(2)
      : '0');

    starsGroup.setAttribute('opacity', (Math.pow(night, 1.5) * 0.95).toFixed(2));
    birdsGroup.setAttribute('opacity', (clamp(1 - night, 0, 1) * 0.8).toFixed(2));

    cityGlow.setAttribute('opacity', (golden * 0.13 + glow * 0.55).toFixed(2));
    reflection.setAttribute('opacity', (0.31 + night * 0.16 + golden * 0.03).toFixed(2));
    warmStreakLayer.setAttribute('opacity', (glow * 0.85).toFixed(2));
    nightWaterTint.setAttribute('opacity', (night * 0.18).toFixed(2));
    warmSparkles.setAttribute('opacity', (glow * 0.95).toFixed(2));
    waterGlow.setAttribute('opacity', (0.3 + glow * 0.7).toFixed(2));

    for (const group of windowGroups) group.style.opacity = (glow * parseFloat(group.dataset.max)).toFixed(2);
    archLights.style.opacity = glow.toFixed(2);
    pearlLights.style.opacity = (glow * 0.95).toFixed(2);
    swfcLights.style.opacity = (glow * 0.9).toFixed(2);
    jinmaoLights.style.opacity = (glow * 0.9).toFixed(2);
    shanghaiLights.style.opacity = (glow * 0.85).toFixed(2);
    lampGlows.style.opacity = (glow * 0.9).toFixed(2);
    globeGlowA.style.opacity = (glow * 0.55).toFixed(2);
    globeGlowB.style.opacity = (glow * 0.55).toFixed(2);
    boatNightLights.style.opacity = glow.toFixed(2);
    treeLine.style.filter = `brightness(${(1 - night * 0.48).toFixed(2)}) saturate(${(1 - night * 0.2).toFixed(2)})`;
    redTreeLine.style.filter = `brightness(${(1 - night * 0.5).toFixed(2)}) saturate(${(1 - night * 0.15).toFixed(2)})`;
    boatLeft.style.filter = `brightness(${(1 - night * 0.24).toFixed(2)})`;
    boatRight.style.filter = `brightness(${(1 - night * 0.3).toFixed(2)})`;
    dockGroup.style.filter = `brightness(${(1 - night * 0.5).toFixed(2)})`;
  };

  const params = new URLSearchParams(location.search);
  const startHour = params.has('hour') ? clamp(parseFloat(params.get('hour')) || 0, 0, 24) : 10.2;
  const paused = params.get('pause') === '1';
  const cycleSeconds = 84;
  const started = performance.now();
  update(startHour);
  if (!paused) {
    let lastSceneUpdate = 0;
    const tick = (now) => {
      if (now - lastSceneUpdate > 32) {
        const hour = (startHour + ((now - started) / 1000 / cycleSeconds) * 24) % 24;
        update(hour);
        lastSceneUpdate = now;
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
