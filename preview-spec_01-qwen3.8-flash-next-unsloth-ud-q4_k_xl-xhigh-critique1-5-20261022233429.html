<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shanghai Lujiazui — Day &amp; Night (spec_01)</title>
<style>
  :root { --t: 24s; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #0d1117 radial-gradient(circle at 50% 30%, #16202e 0%, #0d1117 70%);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #8b98a9;
    padding: 24px;
  }
  .stage {
    width: min(92vmin, 760px);
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06);
  }
  .stage svg { display: block; width: 100%; height: 100%; }
  .caption { font-size: 13px; letter-spacing: 0.04em; }
  .caption b { color: #c8d3e0; font-weight: 600; }

  /* ---------- one shared day-night timeline (24s loop) ----------
     0%–26%  day | 28%–52% dusk | 50%–84% night | 84%–100% dawn */
  .day    { animation: dayS var(--t) linear infinite; }
  .dusk   { animation: duskS var(--t) linear infinite; }
  .night  { animation: nightS var(--t) linear infinite; }
  .lights { animation: lightsS var(--t) linear infinite; }
  .stars  { animation: starsS var(--t) linear infinite; }
  .dim    { animation: nightDim var(--t) linear infinite; }
  @keyframes dayS   { 0%, 26% { opacity: 1; } 40%, 84% { opacity: 0; } 97%, 100% { opacity: 1; } }
  @keyframes duskS  { 0%, 28% { opacity: 0; } 36%, 44% { opacity: 1; } 52%, 82% { opacity: 0; }
                      88%, 92% { opacity: 1; } 99%, 100% { opacity: 0; } }
  @keyframes nightS { 0%, 36% { opacity: 0; } 50%, 80% { opacity: 1; } 90%, 100% { opacity: 0; } }
  @keyframes lightsS { 0%, 42% { opacity: 0; } 54%, 78% { opacity: 1; } 88%, 100% { opacity: 0; } }
  @keyframes starsS { 0%, 44% { opacity: 0; } 56%, 78% { opacity: 1; } 86%, 100% { opacity: 0; } }
  @keyframes nightDim { 0%, 38% { opacity: 0; } 52%, 78% { opacity: 0.62; } 90%, 100% { opacity: 0; } }

  /* sun arcs left→right across day, sets behind the skyline */
  .sun { animation: sunS var(--t) linear infinite; }
  @keyframes sunS {
    0%   { transform: translate(215px, 235px); opacity: 1; }
    13%  { transform: translate(430px, 140px); opacity: 1; }
    26%  { transform: translate(655px, 205px); opacity: 1; }
    37%  { transform: translate(795px, 505px); opacity: 0.95; }
    41%  { transform: translate(830px, 620px); opacity: 0; }
    85%  { transform: translate(120px, 700px); opacity: 0; }
    89%  { transform: translate(155px, 560px); opacity: 0.9; }
    95%  { transform: translate(185px, 400px); opacity: 1; }
    100% { transform: translate(215px, 235px); opacity: 1; }
  }
  /* moon rises after dusk, sets before dawn */
  .moon { animation: moonS var(--t) linear infinite; }
  @keyframes moonS {
    0%, 44% { transform: translate(880px, 760px); opacity: 0; }
    52% { transform: translate(300px, 430px); opacity: 1; }
    66% { transform: translate(520px, 165px); opacity: 1; }
    78% { transform: translate(720px, 330px); opacity: 1; }
    86%, 100% { transform: translate(905px, 700px); opacity: 0; }
  }
  .tw-a { animation: twinkle 3.1s ease-in-out infinite alternate; }
  .tw-b { animation: twinkle 2.3s ease-in-out infinite alternate; animation-delay: -1.1s; }
  .tw-c { animation: twinkle 3.9s ease-in-out infinite alternate; animation-delay: -2.4s; }
  @keyframes twinkle { from { opacity: 0.25; } to { opacity: 1; } }

  .drift-a { animation: drift 90s linear infinite; }
  .drift-b { animation: drift 130s linear infinite; animation-delay: -60s; }
  @keyframes drift { from { transform: translateX(-140px); } to { transform: translateX(1140px); } }

  .ripple  { animation: ripple 5.5s ease-in-out infinite alternate; }
  .ripple2 { animation: ripple 7.5s ease-in-out infinite alternate; animation-delay: -3s; }
  @keyframes ripple { from { transform: translateX(-7px); } to { transform: translateX(7px); } }

  .shimmer { animation: shimmer 3.6s ease-in-out infinite alternate; }
  @keyframes shimmer { from { opacity: 0.18; } to { opacity: 0.62; } }

  .boat-a { animation: sail 95s linear infinite; }
  @keyframes sail { from { transform: translate(690px, 0); } to { transform: translate(-330px, 0); } }
  .boat-b { animation: sail2 150s linear infinite; }
  @keyframes sail2 { from { transform: translate(-260px, 0); } to { transform: translate(1160px, 0); } }

  .buoy-flash { animation: blink 1.4s steps(2, jump-none) infinite; }
  @keyframes blink { from { opacity: 0.15; } to { opacity: 1; } }

  .beacon { animation: beacon 2.8s ease-in-out infinite; }
  @keyframes beacon { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }
</style>
</head>
