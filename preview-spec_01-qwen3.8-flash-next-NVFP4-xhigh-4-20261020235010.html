<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shanghai Lujiazui — Day/Night Cycle (spec_01)</title>
<style>
  :root { --cyc: 40s; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 120% at 50% 10%, #10182b 0%, #05070f 70%);
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
    overflow: hidden;
  }
  .stage { position: relative; height: 100vh; aspect-ratio: 720 / 753; max-width: 100vw; }
  svg { width: 100%; height: 100%; display: block; }
  .hud {
    position: absolute; left: 14px; bottom: 12px; color: #e8eef8;
    background: rgba(6,10,24,.55); border: 1px solid rgba(255,255,255,.14);
    border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(4px);
    font-size: 13px; line-height: 1.5; pointer-events: none;
  }
  .hud b { font-size: 14px; }
  .hud span.phase { color: #ffd98a; }
  .hud2 {
    position: absolute; right: 14px; top: 12px; color: #aab8d4;
    background: rgba(6,10,24,.45); border-radius: 8px; padding: 5px 10px;
    font-size: 11.5px; pointer-events: none;
  }

  /* ---------- synced animation groups (40s master cycle) ---------- */
  /* phase map: 0% noon | 25% afternoon | 35% golden | 42% sunset | 46% dusk
     | 52% night | 76% deep night | 84% pre-dawn | 90% sunrise | 96% morning */
  .skyTop  { animation: skyTop var(--cyc) linear infinite; }
  .skyMid  { animation: skyMid var(--cyc) linear infinite; }
  .skyLow  { animation: skyLow var(--cyc) linear infinite; }
  .waterTop{ animation: waterTop var(--cyc) linear infinite; }
  .waterBot{ animation: waterBot var(--cyc) linear infinite; }

  #city      { animation: cityDim var(--cyc) linear infinite; }
  #waterArt  { animation: waterDim var(--cyc) linear infinite; }
  .lights    { animation: lightsOn var(--cyc) linear infinite; }
  .stars     { animation: starsOn var(--cyc) linear infinite; }
  .haze      { animation: hazeOn var(--cyc) linear infinite; }
  .cloud     { animation: cloudTint var(--cyc) linear infinite; }
  #sunG      { animation: sunMove var(--cyc) linear infinite, sunVis var(--cyc) linear infinite; }
  #moonG     { animation: moonMove var(--cyc) linear infinite, moonVis var(--cyc) linear infinite; }
  .beacon    { animation: blink 1.4s ease-in-out infinite; }

  @keyframes skyTop {
    0%,25% { stop-color: #1f6ed6; } 35% { stop-color: #3e5fae; }
    42% { stop-color: #3e3d84; } 46% { stop-color: #16204e; }
    52% { stop-color: #05091f; } 76% { stop-color: #03071a; }
    84% { stop-color: #101c4a; } 90% { stop-color: #2e3f86; }
    96%,100% { stop-color: #1f6ed6; }
  }
  @keyframes skyMid {
    0%,25% { stop-color: #3f92e2; } 35% { stop-color: #a06a80; }
    42% { stop-color: #e07a4f; } 46% { stop-color: #8a3f63; }
    52% { stop-color: #0b1a40; } 76% { stop-color: #081236; }
    84% { stop-color: #33407c; } 90% { stop-color: #f0916b; }
    96%,100% { stop-color: #3f92e2; }
  }
  @keyframes skyLow {
    0%,25% { stop-color: #a8d0ec; } 35% { stop-color: #f5b271; }
    42% { stop-color: #ffd9a0; } 46% { stop-color: #f2995c; }
    52% { stop-color: #14284f; } 76% { stop-color: #0e1e42; }
    84% { stop-color: #55598a; } 90% { stop-color: #ffcf9d; }
    96%,100% { stop-color: #a8d0ec; }
  }
  @keyframes waterTop {
    0%,25% { stop-color: #bcd9ea; } 35% { stop-color: #e0aa80; }
    42% { stop-color: #f0b078; } 46% { stop-color: #9a5f74; }
    52% { stop-color: #071129; } 76% { stop-color: #050d22; }
    84% { stop-color: #1d2c55; } 90% { stop-color: #f0b58c; }
    96%,100% { stop-color: #bcd9ea; }
  }
  @keyframes waterBot {
    0%,25% { stop-color: #8fb8d6; } 35% { stop-color: #a67a86; }
    42% { stop-color: #b0748a; } 46% { stop-color: #5c4060; }
    52% { stop-color: #060e24; } 76% { stop-color: #040a1c; }
    84% { stop-color: #16224a; } 90% { stop-color: #c98a78; }
    96%,100% { stop-color: #8fb8d6; }
  }
  @keyframes cityDim {
    0%,22% { filter: brightness(1); }
    35% { filter: brightness(.93) saturate(1.12) sepia(.10); }
    42% { filter: brightness(.70) saturate(1.05) sepia(.22); }
    46% { filter: brightness(.44) saturate(.70); }
    52% { filter: brightness(.26) saturate(.55); }
    64%,72% { filter: brightness(.21) saturate(.50); }
    78% { filter: brightness(.26) saturate(.55); }
    84% { filter: brightness(.38) saturate(.62); }
    90% { filter: brightness(.64) saturate(.85) sepia(.14); }
    96%,100% { filter: brightness(1); }
  }
  @keyframes waterDim {
    0%,22% { filter: brightness(1); }
    42% { filter: brightness(.82); }
    52%,78% { filter: brightness(.62); }
    84% { filter: brightness(.66); }
    90% { filter: brightness(.85); }
    96%,100% { filter: brightness(1); }
  }
  @keyframes lightsOn {
    0%,26% { opacity: 0; } 35% { opacity: .12; } 42% { opacity: .35; }
    46% { opacity: .60; } 52%,76% { opacity: 1; } 84% { opacity: .70; }
    90% { opacity: .28; } 95%,100% { opacity: 0; }
  }
  @keyframes starsOn {
    0%,30% { opacity: 0; } 46% { opacity: .5; } 52%,76% { opacity: 1; }
    84% { opacity: .45; } 90%,100% { opacity: 0; }
  }
  @keyframes hazeOn {
    0%,25% { opacity: .30; } 42% { opacity: .35; } 46% { opacity: .14; }
    52%,84% { opacity: 0; } 90% { opacity: .22; } 96%,100% { opacity: .30; }
  }
  @keyframes cloudTint {
    0%,25% { fill: #ffffff; opacity: .85; } 35% { fill: #ffd9b0; opacity: .9; }
    42% { fill: #ff9d76; opacity: .9; } 46% { fill: #b06a8a; opacity: .8; }
    52%,76% { fill: #141f46; opacity: .35; } 84% { fill: #2c3a6e; opacity: .5; }
    90% { fill: #ffbcd0; opacity: .85; } 96%,100% { fill: #ffffff; opacity: .85; }
  }
  @keyframes sunMove {
    0%   { transform: translate(250px, 95px); }
    25%  { transform: translate(470px, 120px); }
    35%  { transform: translate(600px, 260px); }
    42%  { transform: translate(656px, 428px); }
    45%  { transform: translate(660px, 468px); }
    47%  { transform: translate(660px, 468px); }
    82%  { transform: translate(60px, 560px); }
    92%  { transform: translate(120px, 330px); }
    100% { transform: translate(250px, 95px); }
  }
  @keyframes sunVis {
    0%,35% { opacity: 1; } 42% { opacity: 1; } 44% { opacity: 1; }
    47% { opacity: 0; } 80% { opacity: 0; } 88% { opacity: .25; }
    93%,100% { opacity: 1; }
  }
  @keyframes moonMove {
    0%   { transform: translate(700px, 570px); }
    44%  { transform: translate(95px, 560px); }
    46%  { transform: translate(110px, 500px); }
    62%  { transform: translate(360px, 105px); }
    78%  { transform: translate(655px, 330px); }
    84%  { transform: translate(710px, 565px); }
    100% { transform: translate(710px, 565px); }
  }
  @keyframes moonVis {
    0%,43% { opacity: 0; } 47% { opacity: 1; } 80% { opacity: 1; }
    85%,100% { opacity: 0; }
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .08; } }

  .drift1  { animation: drift 90s linear infinite; }
  .drift2  { animation: drift 140s linear infinite; }
  .drift3  { animation: drift 110s linear infinite reverse; }
  @keyframes drift { from { transform: translateX(-160px); } to { transform: translateX(880px); } }

  .barge   { animation: sailLeft 46s linear infinite; }
  @keyframes sailLeft { from { transform: translateX(790px); } to { transform: translateX(-200px); } }
  .ferry   { animation: sailRight 92s linear infinite; }
  @keyframes sailRight { from { transform: translateX(-120px); } to { transform: translateX(820px); } }
  .bob     { animation: bobY 2.6s ease-in-out infinite alternate; }
  @keyframes bobY { from { transform: translateY(-1.5px); } to { transform: translateY(2px); } }

  .star    { animation: twinkle var(--d,3s) ease-in-out var(--dl,0s) infinite alternate; }
  @keyframes twinkle { from { opacity: .25; } to { opacity: 1; } }
  .win     { animation: winGlow var(--d,5s) ease-in-out var(--dl,0s) infinite alternate; }
  @keyframes winGlow { from { opacity: .25; } to { opacity: 1; } }
  .ripple  { animation: rip var(--d,4s) ease-in-out var(--dl,0s) infinite alternate; }
  @keyframes rip { from { opacity: .05; } to { opacity: .5; } }
  .glint   { animation: rip2 var(--d,3s) ease-in-out var(--dl,0s) infinite alternate; }
  @keyframes rip2 { from { opacity: 0; } to { opacity: .8; } }
  .spiral  { stroke-dasharray: 14 26; animation: flow 2.4s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -80; } }
  .wobble  { transform-origin: center top; animation: wob 3.2s ease-in-out infinite alternate; }
  @keyframes wob { from { transform: skewX(-3deg) scaleX(.96); } to { transform: skewX(3.5deg) scaleX(1.05); } }
  .birds   { animation: flyby 34s linear infinite; }
  @keyframes flyby { from { transform: translate(-60px,30px); } to { transform: translate(800px,-40px); } }
  .shimmer { transform-origin: center; animation: shim 6s ease-in-out infinite alternate; }
  @keyframes shim { from { transform: scaleX(.85); opacity:.16; } to { transform: scaleX(1.12); opacity:.30; } }
  .sunglint  { animation: sunGlintVis var(--cyc) linear infinite; }
  @keyframes sunGlintVis {
    0%,25% { opacity: .85; } 35% { opacity: .55; } 42% { opacity: .3; }
    47%,82% { opacity: 0; } 90% { opacity: .35; } 96%,100% { opacity: .85; }
  }
  .sunglint2 { animation: sunGlint2Vis var(--cyc) linear infinite; }
  @keyframes sunGlint2Vis {
    0%,32% { opacity: 0; } 38%,44% { opacity: .75; } 48%,100% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-play-state: paused !important; }
  }
</style>
</head>
<body>
<div class="stage">
<svg id="scene" viewBox="0 0 720 753" preserveAspectRatio="xMidYMid meet" aria-label="Shanghai day night cycle">
  <defs>

      <stop class="skyTop" offset="0"/>
      <stop class="skyMid" offset="0.55"/>
      <stop class="skyLow" offset="1"/>
    </linearGradient>
    <linearGradient id="waterG" x1="0" y1="0" x2="0" y2="1">
      <stop class="waterTop" offset="0"/>
      <stop class="waterBot" offset="1"/>
    </linearGradient>
    <radialGradient id="sunGlowG"><stop offset="0" stop-color="#fff3c4" stop-opacity=".95"/><stop offset=".35" stop-color="#ffd97a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd97a" stop-opacity="0"/></radialGradient>
    <radialGradient id="moonGlowG"><stop offset="0" stop-color="#dfeaff" stop-opacity=".8"/><stop offset="1" stop-color="#b9ccf2" stop-opacity="0"/></radialGradient>

    <radialGradient id="glowAmber"><stop offset="0" stop-color="#ffbe6e" stop-opacity=".55"/><stop offset="1" stop-color="#ff9a3d" stop-opacity="0"/></radialGradient>

      <stop offset="0" stop-color="#ff8fb8" stop-opacity=".8"/><stop offset="1" stop-color="#ff8fb8" stop-opacity="0"/>

    <linearGradient id="hazeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfeefc" stop-opacity="0"/><stop offset="1" stop-color="#eaf4fd" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="glassBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a6f97"/><stop offset=".5" stop-color="#6d93b8"/><stop offset="1" stop-color="#3c5d84"/>

    <linearGradient id="glassPale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9dcea"/><stop offset=".6" stop-color="#e8f1f7"/><stop offset="1" stop-color="#9db8cc"/>
    </linearGradient>
    <linearGradient id="towerShG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7e9cb8"/><stop offset=".45" stop-color="#c3d7e6"/><stop offset=".8" stop-color="#9db6c9"/><stop offset="1" stop-color="#6d87a2"/>
    </linearGradient>
    <linearGradient id="jinmaoG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a08b62"/><stop offset=".5" stop-color="#cdb98e"/><stop offset="1" stop-color="#8d7a55"/>
    </linearGradient>
    <radialGradient id="domeLG" cx=".38" cy=".35" r=".9"><stop offset="0" stop-color="#7fb0d4"/><stop offset=".7" stop-color="#3d6f9c"/><stop offset="1" stop-color="#274a6d"/></radialGradient>

  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="720" height="612" fill="url(#skyG)"/>
  <g class="stars" id="starsLayer"></g>
  <g id="sunG"><circle r="74" fill="url(#sunGlowG)"/><circle r="20" fill="#fff6d8"/><circle r="20" fill="#ffe488" opacity=".7"/></g>
  <g id="moonG"><circle r="52" fill="url(#moonGlowG)"/><circle r="13" fill="#e9f0ff"/><circle cx="-4.5" cy="-3" r="2.6" fill="#c9d6ef" opacity=".8"/><circle cx="3.5" cy="4" r="1.8" fill="#c9d6ef" opacity=".7"/><circle cx="5" cy="-5" r="1.3" fill="#c9d6ef" opacity=".6"/></g>
  <g class="drift1"><g class="cloud"><ellipse cx="0" cy="90" rx="52" ry="11"/><ellipse cx="30" cy="82" rx="34" ry="9"/><ellipse cx="-28" cy="84" rx="26" ry="7"/></g></g>

    <!-- left glass dome -->

<script>
(() => {
  "use strict";
  const NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  const add = (parent, tag, attrs) => {
    const el = document.createElementNS(NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    parent.appendChild(el);
    return el;
  };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const blinkStyle = (min, max) => ({ style: `--d:${rnd(min, max).toFixed(2)}s;--dl:${rnd(0, 6).toFixed(2)}s` });

  const generateStars = () => {
    const g = $("starsLayer");
    for (let i = 0; i < 150; i += 1) {
      const s = add(g, "circle", { cx: rnd(2, 718).toFixed(1), cy: rnd(2, 400).toFixed(1), r: rnd(0.5, 1.6).toFixed(2), fill: "#e8f0ff", class: "star" });
      s.setAttribute("style", `--d:${rnd(2, 6).toFixed(2)}s;--dl:${rnd(0, 5).toFixed(2)}s`);
    }
    for (let i = 0; i < 5; i += 1) {
      const x = rnd(30, 690), y = rnd(20, 300);
      const cross = add(g, "g", { class: "star", stroke: "#dfeaff", "stroke-width": 0.8 });
      cross.setAttribute("style", `--d:${rnd(3, 7).toFixed(2)}s;--dl:${rnd(0, 5).toFixed(2)}s`);
      add(cross, "line", { x1: x - 3, y1: y, x2: x + 3, y2: y });
      add(cross, "line", { x1: x, y1: y - 3, x2: x, y2: y + 3 });
    }
  };

  const generatePearlDots = () => {
    const night = $("pearlNightDots");
    const scatter = (dayGroup, cx, cy, r, n) => {
      for (let i = 0; i < n; i += 1) {
        const lon = rnd(-1.35, 1.35), lat = rnd(0.08, Math.PI - 0.08);
        const x = (cx + r * 0.93 * Math.sin(lat) * Math.cos(lon)).toFixed(1);
        const y = (cy - r * 0.93 * Math.cos(lat)).toFixed(1);
        add(dayGroup, "circle", { cx: x, cy: y, r: 1.7, fill: "#d99a86", opacity: 0.8 });
        const glow = add(night, "circle", { cx: x, cy: y, r: 2.1, fill: "#ff86c4", class: "win" });
        glow.setAttribute("style", `--d:${rnd(2.5, 6).toFixed(2)}s;--dl:${rnd(0, 5).toFixed(2)}s`);
      }
    };
    scatter($("pearlDotsTop"), 103, 148, 38, 105);
    scatter($("pearlDotsBottom"), 98, 458, 47, 150);
  };

  const generateDomePanels = () => {
    const g = $("domePanels");
    const palette = ["#3f7fb8", "#57b06a", "#c94b3f", "#d9a441", "#7fb6d9", "#4f9bb0", "#356a94"];
    const cx = 420, cy = 520, r = 52, rowH = 13;
    for (let y = cy - r + 2; y < cy + r - 2; y += rowH) {
      const mid = y + rowH / 2, dy = mid - cy;
      const half = Math.sqrt(Math.max(0, r * r - dy * dy));
      const cols = Math.max(1, Math.round(half / 6.5));
      for (let c = 0; c < cols; c += 1) {
        const x = cx - half + (c + 0.5) * ((half * 2) / cols);
        add(g, "rect", { x: (x - 3).toFixed(1), y: y.toFixed(1), width: 5.6, height: rowH - 1, fill: palette[Math.floor(Math.random() * palette.length)], opacity: 0.85 });
      }
    }
  };

  const generateArcadeArches = () => {
    const dark = $("arcadeArches"), glow = $("windowsLayer");
    for (let i = 0; i < 9; i += 1) {
      const x = 183 + i * 20.6;
      const d = `M${x} 566 V532 A6.4 6.4 0 0 1 ${x + 12.8} 532 V566 Z`;
      add(dark, "path", { d, fill: "#6f6353" });
      add(glow, "path", { d, fill: "#ffcf8a", class: "win", opacity: 0.9 }).setAttribute("style", `--d:${rnd(4, 9).toFixed(2)}s;--dl:${rnd(0, 6).toFixed(2)}s`);
      add(dark, "rect", { x, y: 505, width: 12.8, height: 9, fill: "#b8ab92" });
    }
  };

  const generateWindows = () => {
    const g = $("windowsLayer");
    const fill = (coolBias) => (Math.random() < coolBias ? "#cfe9ff" : "#ffd98a");
    const fillInWindows = (spec) => {
      const { cx, wt, wb, yt, yb, cols, rows, coolBias = 0.15, parent = g } = spec;
      for (let r = 0; r < rows; r += 1) {
        const t = rows === 1 ? 0 : r / (rows - 1);
        const w = wt + (wb - wt) * t;
        const y = yt + (yb - yt) * t;
        for (let c = 0; c < cols; c += 1) {
          if (Math.random() < 0.14) continue;
          const x = cx - w / 2 + (c + 0.5) * (w / cols);
          const win = add(parent, "rect", { x: (x - 1.3).toFixed(1), y: y.toFixed(1), width: 2.6, height: 4, fill: fill(coolBias), class: "win" });
          win.setAttribute("style", `--d:${rnd(3, 9).toFixed(2)}s;--dl:${rnd(0, 7).toFixed(2)}s`);
        }
      }
    };
    fillInWindows({ cx: 242, wt: 36, wb: 44, yt: 362, yb: 500, cols: 5, rows: 15 });
    fillInWindows({ cx: 429, wt: 42, wb: 56, yt: 292, yb: 500, cols: 7, rows: 20 });
    fillInWindows({ cx: 490, wt: 44, wb: 64, yt: 262, yb: 500, cols: 8, rows: 22, coolBias: 0.35 });
    fillInWindows({ cx: 479, wt: 14, wb: 46, yt: 294, yb: 500, cols: 4, rows: 21 });
    fillInWindows({ cx: 546, wt: 54, wb: 74, yt: 292, yb: 500, cols: 9, rows: 20, coolBias: 0.6 });
    fillInWindows({ cx: 645, wt: 40, wb: 38, yt: 24, yb: 500, cols: 6, rows: 28, coolBias: 0.5 });
    fillInWindows({ cx: 690, wt: 34, wb: 48, yt: 374, yb: 500, cols: 5, rows: 14, coolBias: 0.75 });
    fillInWindows({ cx: 52, wt: 40, wb: 40, yt: 352, yb: 532, cols: 6, rows: 18, coolBias: 0.6 });
    fillInWindows({ cx: 102, wt: 26, wb: 26, yt: 358, yb: 532, cols: 4, rows: 17 });
    fillInWindows({ cx: 30, wt: 50, wb: 50, yt: 460, yb: 532, cols: 7, rows: 9 });
    fillInWindows({ cx: 151, wt: 54, wb: 54, yt: 440, yb: 532, cols: 8, rows: 11 });
    fillInWindows({ cx: 601, wt: 90, wb: 90, yt: 440, yb: 512, cols: 12, rows: 8, coolBias: 0.4 });
    // white grid block needs dark windows by day too (drawn into city)
    const dark = add($("city"), "g", { opacity: 0.85 });
    for (let r = 0; r < 9; r += 1) for (let c = 0; c < 13; c += 1) {
      if (Math.random() < 0.1) continue;
      add(dark, "rect", { x: (555 + c * 7.5).toFixed(1), y: (440 + r * 8.4).toFixed(1), width: 4.6, height: 5.2, fill: "#42566b" });
    }
    const lamps = $("streetLamps");
    for (let x = 100; x <= 652; x += 34) {
      add(lamps, "circle", { cx: x, cy: 592, r: 1.4, fill: "#ffe0a8" });
      add(lamps, "circle", { cx: x, cy: 592, r: 4.6, fill: "url(#glowWhite)", opacity: 0.5 });
    }
    const ups = $("arcadeUplights");
    for (let x = 188; x <= 360; x += 24) add(ups, "ellipse", { cx: x, cy: 566, rx: 9, ry: 16, fill: "url(#glowWhite)", opacity: 0.4 });
  };

  const generateWater = () => {
    const g = $("ripplesLayer");
    for (let i = 0; i < 130; i += 1) {
      const y = rnd(610, 748);
      const len = rnd(4, 10 + (y - 605) * 0.22);
      const rip = add(g, "rect", { x: rnd(0, 716 - len).toFixed(1), y: y.toFixed(1), width: len.toFixed(1), height: 1, rx: 0.5, fill: "#ffffff", class: "ripple" });
      rip.setAttribute("style", `--d:${rnd(2.5, 7).toFixed(2)}s;--dl:${rnd(0, 5).toFixed(2)}s`);
    }
    for (let i = 0; i < 45; i += 1) {
      const y = rnd(612, 745);
      const len = rnd(5, 14 + (y - 605) * 0.18);
      const wave = add(g, "rect", { x: rnd(0, 716 - len).toFixed(1), y: y.toFixed(1), width: len.toFixed(1), height: 1.2, rx: 0.6, fill: "#1c3a5e", opacity: 0.14, class: "ripple" });
      wave.setAttribute("style", `--d:${rnd(3, 8).toFixed(2)}s;--dl:${rnd(0, 6).toFixed(2)}s`);
    }
    const scatterGlint = (parent, cx0, n, color, spreadBase) => {
      for (let i = 0; i < n; i += 1) {
        const y = rnd(608, 716);
        const spread = spreadBase + (y - 605) * 0.42;
        const len = rnd(3, 11);
        const d = add($(parent), "rect", { x: (cx0 + rnd(-spread, spread) - len / 2).toFixed(1), y: y.toFixed(1), width: len.toFixed(1), height: 1.4, rx: 0.7, fill: color, class: "glint" });
        d.setAttribute("style", `--d:${rnd(1.6, 4.5).toFixed(2)}s;--dl:${rnd(0, 4).toFixed(2)}s`);
      }
    };
    scatterGlint("sunGlintDashes", 250, 46, "#ffe9b0", 24);
    scatterGlint("sunsetGlintDashes", 668, 40, "#ffc88a", 20);
    scatterGlint("moonGlintDashes", 360, 42, "#cfe0ff", 18);
    const refl = $("cityReflDashes");
    for (let i = 0; i < 64; i += 1) {
      const y = rnd(612, 672);
      const len = rnd(2, 7);
      const d = add(refl, "rect", { x: rnd(90, 660).toFixed(1), y: y.toFixed(1), width: len.toFixed(1), height: 1.4, rx: 0.7, fill: "#ffcf8a", class: "glint" });
      d.setAttribute("style", `--d:${rnd(2, 6).toFixed(2)}s;--dl:${rnd(0, 5).toFixed(2)}s`);
    }
  };

  const getPhaseLabel = (p) => {
    if (p < 0.30) return "白天 ☀️";
    if (p < 0.40) return "黃昏 🌤";
    if (p < 0.48) return "日落 🌇";
    if (p < 0.82) return "夜晚 🌙";
    if (p < 0.94) return "日出 🌅";
    return "白天 ☀️";
  };
  const startPhaseTicker = () => {
    const el = $("phaseLabel");
    const tick = () => {
      const t = window.__frozenT != null ? window.__frozenT : performance.now() / 1000;
      el.textContent = getPhaseLabel((t % 40) / 40);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };

  // dev hook: open with #s=<seconds> to freeze the cycle at that moment
  const hashSec = parseFloat((location.hash.match(/#s=([\d.]+)/) || [])[1]);
  if (!Number.isNaN(hashSec)) {
    window.__frozenT = hashSec;
    requestAnimationFrame(() => document.getAnimations().forEach((a) => { a.currentTime = hashSec * 1000; a.pause(); }));
  }

  generateStars();
  generatePearlDots();
  generateDomePanels();
  generateArcadeArches();
  generateWindows();
  generateWater();
  startPhaseTicker();
})();
</script>
</body>
</html>
