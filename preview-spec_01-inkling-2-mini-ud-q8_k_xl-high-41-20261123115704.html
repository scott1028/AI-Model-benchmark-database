<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>preview — spec_01 — day/night animation</title>
<style>
  :root { --loop: 40s; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #070a12; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  .stage { position: relative; line-height: 0; }
  svg { display: block; max-width: 100vw; max-height: 100vh; aspect-ratio: 745 / 742; width: min(100vw, calc(100vh * 745 / 742)); height: auto; }

  /* ------- loop timing: 0% day -> 50% deep night -> 100% day ------- */

  @keyframes skyStopA {
    0%,100% { stop-color: #1480d4; }
    28% { stop-color: #1e6fc0; }
    38% { stop-color: #4a4e95; }
    46% { stop-color: #232a63; }
    55% { stop-color: #060b24; }
    85% { stop-color: #0b1030; }
    91% { stop-color: #24356f; }
    96% { stop-color: #1770c2; }
  }
  @keyframes skyStopB {
    0%,100% { stop-color: #4aa0dc; }
    28% { stop-color: #5b9ad0; }
    38% { stop-color: #e08a4a; }
    46% { stop-color: #55476f; }
    55% { stop-color: #101638; }
    85% { stop-color: #1f2550; }
    91% { stop-color: #c76a55; }
    96% { stop-color: #77aed8; }
  }
  @keyframes skyStopC {
    0%,100% { stop-color: #c2dff2; }
    28% { stop-color: #c9cfe0; }
    38% { stop-color: #ffb35c; }
    46% { stop-color: #c96f5f; }
    55% { stop-color: #28306b; }
    85% { stop-color: #453a63; }
    91% { stop-color: #ff9a50; }
    96% { stop-color: #f0cfa8; }
  }
  .skyStopA { animation: skyStopA var(--loop) linear infinite; }
  .skyStopB { animation: skyStopB var(--loop) linear infinite; }
  .skyStopC { animation: skyStopC var(--loop) linear infinite; }

  @keyframes sunPath {
    0%   { transform: translate(-228px, 385px); opacity: 1; }
    10%  { transform: translate(-228px, 180px); opacity: 1; }
    20%  { transform: translate(0px, -10px); opacity: 1; }
    30%  { transform: translate(220px, 230px); opacity: 1; }
    38%  { transform: translate(255px, 430px); opacity: 1; }
    42%  { transform: translate(340px, 520px); opacity: 0; }
    95%  { transform: translate(340px, 520px); opacity: 0; }
    95.5% { transform: translate(-230px, 400px); opacity: 0; }
    98%  { transform: translate(-228px, 385px); opacity: 1; }
    100% { transform: translate(-228px, 385px); opacity: 1; }
  }
  @keyframes sunFill {
    0%   { fill: #fff6d4; }
    20%  { fill: #fff7dc; }
    35%  { fill: #ffc95e; }
    42%  { fill: #ff7a2a; }
    95%  { fill: #ff7a2a; }
    95.5% { fill: #ff9a3a; }
    98%  { fill: #fff6d4; }
    100% { fill: #fff6d4; }
  }
  @keyframes moonPath {
    0%   { transform: translate(-230px, 400px); opacity: 0; }
    46%  { transform: translate(-230px, 400px); opacity: 0; }
    55%  { transform: translate(20px, -40px); opacity: 1; }
    66%  { transform: translate(200px, 260px); opacity: 1; }
    76%  { transform: translate(230px, 420px); opacity: 1; }
    80%  { transform: translate(280px, 480px); opacity: 0; }
    100% { transform: translate(280px, 480px); opacity: 0; }
  }

  @keyframes starsA {
    0%,34% { opacity: 0; }
    50%,84% { opacity: 1; }
    94%,100% { opacity: 0; }
  }
  @keyframes twinkle {
    0%,100% { opacity: 0.45; }
    50% { opacity: 1; }
  }

  @keyframes overlayA {
    0%,30% { opacity: 0; }
    42% { opacity: 0.34; }
    55% { opacity: 0.66; }
    85% { opacity: 0.66; }
    94% { opacity: 0.20; }
    100% { opacity: 0; }
  }

  @keyframes nightGlow {
    0%,34% { opacity: 0; }
    50%,84% { opacity: 1; }
    94%,100% { opacity: 0; }
  }
  @keyframes beaconBlink {
    0%,55% { opacity: 1; }
    56%,100% { opacity: 0.12; }
  }
  @keyframes streakA {
    0%,44% { opacity: 0; }
    58%,84% { opacity: 0.55; }
    94%,100% { opacity: 0; }
  }
  @keyframes pinkRefl {
    0%,35% { opacity: 0.78; }
    55%,85% { opacity: 0.30; }
    100% { opacity: 0.78; }
  }
  @keyframes goldRefl {
    0%,36% { opacity: 0.72; }
    52%,96% { opacity: 0.06; }
    100% { opacity: 0.72; }
  }

  @keyframes birdFleet {
    0%,32% { opacity: 1; }
    42%,90% { opacity: 0; }
    96%,100% { opacity: 1; }
  }
  @keyframes birdDrift {
    0% { transform: translateX(0); }
    50% { transform: translateX(26px); }
    100% { transform: translateX(0); }
  }

  @keyframes bobA {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(2.6px); }
  }
  @keyframes bobB {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(3.4px); }
  }
  @keyframes rippleShift {
    to { stroke-dashoffset: -72; }
  }
  @keyframes foamDrift {
    0%,100% { opacity: 0.16; transform: translateX(0); }
    50% { opacity: 0.38; transform: translateX(10px); }
  }

  .sunG { animation: sunPath var(--loop) linear infinite; }
  .sunCore { animation: sunFill var(--loop) linear infinite; }
  .moonG { animation: moonPath var(--loop) linear infinite; }
  .starsG { animation: starsA var(--loop) linear infinite; }
  .starTwinkleA { animation: twinkle 2.6s ease-in-out infinite; }
  .starTwinkleB { animation: twinkle 3.4s ease-in-out infinite; animation-delay: -1.2s; }
  .nightOverlay { mix-blend-mode: multiply; animation: overlayA var(--loop) linear infinite; }
  .gNight { animation: nightGlow var(--loop) linear infinite; }
  .beacon { animation: beaconBlink 1.5s steps(1) infinite; }
  .moonStreakG { animation: streakA var(--loop) linear infinite; }
  .pinkReflG { animation: pinkRefl var(--loop) linear infinite; }
  .goldReflG { animation: goldRefl var(--loop) linear infinite; }
  .birdG { animation: birdFleet var(--loop) linear infinite; }
  .birdDrift { animation: birdDrift 9s ease-in-out infinite; }
  .birdDrift2 { animation: birdDrift 11s ease-in-out infinite; animation-delay: -4s; }
  .bobA { animation: bobA 3.6s ease-in-out infinite; }
  .bobB { animation: bobB 4.4s ease-in-out infinite; animation-delay: -1.6s; }
  .rippleLine { stroke-dasharray: 26 48; animation: rippleShift 7s linear infinite; }
  .foam { animation: foamDrift 5s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-play-state: paused !important; }
  }
</style>
