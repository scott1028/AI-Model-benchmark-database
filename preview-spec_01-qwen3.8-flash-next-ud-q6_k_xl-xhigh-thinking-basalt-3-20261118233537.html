<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shanghai Lujiazui · Day &amp; Night — SVG Loop (spec_01)</title>
<style>
  :root { --cycle: 60s; }
  html, body {
    margin: 0; height: 100%;
    background: #0b0e17;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  svg.stage {
    height: min(100vh, 100vw);
    width: min(100vh, 100vw);
    display: block;
    box-shadow: 0 20px 80px rgba(0,0,0,.6);
  }
  /* ============ shared helpers ============ */
  .sky-l, .water-l, .dim, .lights, .glow, .stars, .dawnwash, .cityglow,
  .sun, .sun-glint, .moon, .moon-glint { will-change: opacity, transform; }

  /* ============ sky gradient layers (0% = midnight) ============ */
  .daySky   { animation: daySky   var(--cycle) linear infinite; }
  .dawnSky  { animation: dawnSky  var(--cycle) linear infinite; }
  .nightSky { animation: nightSky var(--cycle) linear infinite; }
  @keyframes daySky {
    0%,24% { opacity: 0; } 32% { opacity: 1; } 66% { opacity: 1; } 76% { opacity: 0; } 100% { opacity: 0; }
  }
  @keyframes dawnSky {
    0%,16% { opacity: 0; } 24% { opacity: 1; } 29% { opacity: 1; } 36% { opacity: 0; }
    62% { opacity: 0; } 71% { opacity: 1; } 77% { opacity: 1; } 86% { opacity: 0; } 100% { opacity: 0; }
  }
  @keyframes nightSky {
    0%,17% { opacity: 1; } 25% { opacity: 0; } 78% { opacity: 0; } 87% { opacity: 1; } 100% { opacity: 1; }
  }

  /* ============ sun / moon ============ */
  .sun { animation: sunArc var(--cycle) linear infinite; }
  @keyframes sunArc {
    0%   { transform: translate(975px, 940px); opacity: 0; }
    23%  { transform: translate(975px, 940px); opacity: 0; }
    28%  { transform: translate(968px, 470px); opacity: 1; }
    31%  { transform: translate(940px, 150px); opacity: 1; }
    38%  { transform: translate(800px, 105px); opacity: 1; }
    46%  { transform: translate(640px, 120px); opacity: 1; }
    52%  { transform: translate(520px, 125px); opacity: 1; }
    60%  { transform: translate(430px, 180px); opacity: 1; }
    66%  { transform: translate(330px, 300px); opacity: 1; }
    71%  { transform: translate(315px, 430px); opacity: 1; }
    75%  { transform: translate(300px, 540px); opacity: .95; }
    78%  { transform: translate(290px, 660px); opacity: 0; }
    100% { transform: translate(290px, 660px); opacity: 0; }
  }
  .sun-core { animation: sunColor var(--cycle) linear infinite; }
  @keyframes sunColor {
    0%,26% { fill: #ff8a2e; } 36% { fill: #ffd76a; } 50% { fill: #fff6c8; }
    64% { fill: #ffd76a; } 76% { fill: #ff7a2e; } 100% { fill: #ff7a2e; }
  }
  .sun-halo  { animation: sunHalo  var(--cycle) linear infinite; }
  .sun-halo2 { animation: sunHalo2 var(--cycle) linear infinite; }
  @keyframes sunHalo {
    0%,28% { opacity: .5; } 36% { opacity: .32; } 50% { opacity: .25; }
    64% { opacity: .32; } 75% { opacity: .5; } 100% { opacity: .5; }
  }
  @keyframes sunHalo2 {
    0%,29% { opacity: .9; } 36% { opacity: 0; } 68% { opacity: 0; } 75% { opacity: .9; } 100% { opacity: .9; }
  }
  .moon { animation: moonArc var(--cycle) linear infinite; }
  @keyframes moonArc {
    0%   { transform: translate(676px, 250px); opacity: 1; }
    6%   { transform: translate(560px, 158px); opacity: 1; }
    14%  { transform: translate(392px, 320px); opacity: 1; }
    20%  { transform: translate(280px, 660px); opacity: 1; }
    23%  { transform: translate(230px, 900px); opacity: 0; }
    78%  { transform: translate(905px, 940px); opacity: 0; }
    84%  { transform: translate(880px, 700px); opacity: 1; }
    92%  { transform: translate(772px, 380px); opacity: 1; }
    100% { transform: translate(676px, 250px); opacity: 1; }
  }
  /* light paths on water following sun / moon */
  .sun-glint { animation: sunGlintX var(--cycle) linear infinite; }
  @keyframes sunGlintX {
    0%,24% { transform: translateX(975px); opacity: 0; }
    29% { opacity: .5; } 50% { opacity: .38; } 73% { opacity: .55; }
    77% { transform: translateX(300px); opacity: 0; }
    100% { transform: translateX(300px); opacity: 0; }
  }
  .moon-glint { animation: moonGlintX var(--cycle) linear infinite; }
  @keyframes moonGlintX {
    0%   { transform: translateX(676px); opacity: .5; }
    14%  { transform: translateX(392px); opacity: .5; }
    20%  { transform: translateX(280px); opacity: .5; }
    23%  { opacity: 0; } 78% { opacity: 0; }
    86%  { opacity: .45; }
    100% { transform: translateX(676px); opacity: .5; }
  }

  /* ============ stars / night overlays ============ */
  .stars { animation: starsOn var(--cycle) linear infinite; }
  @keyframes starsOn {
    0%,14% { opacity: 1; } 21% { opacity: 0; } 76% { opacity: 0; } 85% { opacity: 1; } 100% { opacity: 1; }
  }
  .twinkle  { animation: twinkle 2.2s ease-in-out infinite; }
  .twinkle2 { animation: twinkle 3.1s ease-in-out infinite; animation-delay: -1.2s; }
  @keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: .15; } }
  /* night dim over city (isolated group keeps the sky untouched) */
  .isolate { isolation: isolate; }
  .dim {
    animation: dimOn var(--cycle) linear infinite;
  }
  @keyframes dimOn {
    0%,16% { opacity: .55; } 24% { opacity: 0; } 72% { opacity: 0; } 83% { opacity: .55; } 100% { opacity: .55; }
  }
  .lights { animation: lightsOn var(--cycle) linear infinite; }
  @keyframes lightsOn {
    0%,17% { opacity: 1; } 26% { opacity: 0; } 71% { opacity: 0; } 82% { opacity: 1; } 100% { opacity: 1; }
  }
  .cityglow { animation: cityGlowOn var(--cycle) linear infinite; }
  @keyframes cityGlowOn {
    0%,17% { opacity: .75; } 26% { opacity: 0; } 70% { opacity: 0; } 81% { opacity: .75; } 100% { opacity: .75; }
  }
  .sphereglow { animation: sphereGlowOn var(--cycle) linear infinite; }
  @keyframes sphereGlowOn {
    0%,17% { opacity: .95; } 26% { opacity: 0; } 69% { opacity: 0; } 80% { opacity: .95; } 100% { opacity: .95; }
  }
  /* warm wash tint on the city at golden hours */
  .dawnwash { mix-blend-mode: soft-light;
    animation: dawnwashOn var(--cycle) linear infinite; }
  @keyframes dawnwashOn {
    0%,18% { opacity: 0; } 25% { opacity: .8; } 30% { opacity: 0; }
    64% { opacity: 0; } 73% { opacity: .9; } 79% { opacity: 0; } 100% { opacity: 0; }
  }

  /* ============ water gradient layers ============ */
  .waterDay   { animation: daySky   var(--cycle) linear infinite; }
  .waterDawn  { animation: dawnSky  var(--cycle) linear infinite; }
  .waterNight { animation: nightSky var(--cycle) linear infinite; }

  /* shimmer strokes on the river (ambient, independent of cycle) */
  .shim  { animation: shim 5s ease-in-out infinite; }
  .shim2 { animation: shim 6.4s ease-in-out infinite; animation-delay: -2.1s; }
  .shim3 { animation: shim 4.2s ease-in-out infinite; animation-delay: -3.3s; }
  @keyframes shim {
    0%,100% { opacity: .18; transform: translateX(0); }
    50% { opacity: .5; transform: translateX(10px); }
  }

  /* ============ clouds ============ */
  .cloud   { animation: cloudTint var(--cycle) linear infinite; }
  @keyframes cloudTint {
    0% { fill: #232c4f; } 20% { fill: #4a4370; } 25% { fill: #ffc9a0; } 33% { fill: #ffffff; }
    66% { fill: #ffffff; } 72% { fill: #ffb58a; } 80% { fill: #4a4370; } 90% { fill: #232c4f; } 100% { fill: #232c4f; }
  }
  .drift1 { animation: drift 170s linear infinite; animation-delay: -40s; }
  .drift2 { animation: drift 215s linear infinite; animation-delay: -150s; }
  .drift3 { animation: drift 250s linear infinite; animation-delay: -200s; }
  @keyframes drift {
    from { transform: translateX(-320px); }
    to   { transform: translateX(1320px); }
  }

  /* ============ beacons / lamps / boats ============ */
  .beacon { animation: beacon 1.4s steps(1) infinite; }
  @keyframes beacon { 0% { opacity: 1; } 50% { opacity: .1; } }
  .ferry  { animation: ferryMove 150s linear infinite; animation-delay: -55s; }
  @keyframes ferryMove {
    from { transform: translateX(-180px); }
    to   { transform: translateX(1160px); }
  }
  .barge { animation: bargeMove 190s linear infinite; animation-delay: -120s; }
  @keyframes bargeMove {
    from { transform: translateX(300px); }
    to   { transform: translateX(-1180px); }
  }
  .bob { animation: bob 4.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(2.5px) rotate(.4deg); } }
</style>
</head>
<body>
<svg class="stage" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Shanghai Lujiazui skyline day and night animation">
  <defs>
    <!-- ======== sky gradients ======== -->
    <linearGradient id="gDay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#1d6ccf"/>
      <stop offset=".45" stop-color="#6fb1e6"/>
      <stop offset=".8"  stop-color="#bcdff4"/>
      <stop offset="1"   stop-color="#e3f1f8"/>
    </linearGradient>
    <linearGradient id="gDawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#2c3e78"/>
      <stop offset=".4"  stop-color="#7a6ba8"/>
      <stop offset=".68" stop-color="#e08a6d"/>
      <stop offset=".86" stop-color="#ffb36b"/>
      <stop offset="1"   stop-color="#ffd9a0"/>
    </linearGradient>
    <linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#04081c"/>
      <stop offset=".55" stop-color="#0b1738"/>
      <stop offset="1"   stop-color="#1c2c56"/>
    </linearGradient>
    <!-- ======== water gradients ======== -->
    <linearGradient id="wDay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#87c0dd"/>
      <stop offset=".3"  stop-color="#4c8cbd"/>
      <stop offset="1"   stop-color="#1e5b90"/>
    </linearGradient>
    <linearGradient id="wDawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#e0975f"/>
      <stop offset=".35" stop-color="#9c6f86"/>
      <stop offset="1"   stop-color="#33486e"/>
    </linearGradient>
    <linearGradient id="wNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#152444"/>
      <stop offset=".35" stop-color="#0a152e"/>
      <stop offset="1"   stop-color="#050b1c"/>
    </linearGradient>
    <!-- ======== objects ======== -->
    <radialGradient id="gSphere" cx=".35" cy=".3" r=".9">
      <stop offset="0"   stop-color="#f4899c"/>
      <stop offset=".5"  stop-color="#d94f6e"/>
      <stop offset="1"   stop-color="#9c2545"/>
    </radialGradient>
    <radialGradient id="gSphereGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0"   stop-color="#ff7a95" stop-opacity=".9"/>
      <stop offset=".6"  stop-color="#ff5578" stop-opacity=".35"/>
      <stop offset="1"   stop-color="#ff5578" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gShaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#c98f66"/>
      <stop offset=".35" stop-color="#f2d3ae"/>
      <stop offset=".7"  stop-color="#e3b189"/>
      <stop offset="1"   stop-color="#b57a55"/>
    </linearGradient>
    <linearGradient id="gGlassA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#7ea6c4"/>
      <stop offset=".5"  stop-color="#b9d6e8"/>
      <stop offset="1"   stop-color="#6d93b4"/>
    </linearGradient>
    <linearGradient id="gGlassB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#5b7fa6"/>
      <stop offset=".55" stop-color="#9cc0dc"/>
      <stop offset="1"   stop-color="#4d6f96"/>
    </linearGradient>
    <linearGradient id="gGlassC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#8aa9bd"/>
      <stop offset=".45" stop-color="#dcebf4"/>
      <stop offset="1"   stop-color="#7e9cb2"/>
    </linearGradient>
    <linearGradient id="gTowerS" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#8fa7b8"/>
      <stop offset=".4"  stop-color="#d5e3ec"/>
      <stop offset=".75" stop-color="#a9bfcd"/>
      <stop offset="1"   stop-color="#7c93a6"/>
    </linearGradient>
    <linearGradient id="gDome" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0"   stop-color="#9fd8cf"/>
      <stop offset=".35" stop-color="#4f9fae"/>
      <stop offset=".62" stop-color="#7fb98c"/>
      <stop offset=".82" stop-color="#c98f6a"/>
      <stop offset="1"   stop-color="#5d4a86"/>
    </linearGradient>
    <radialGradient id="gDomeGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7fe8d8" stop-opacity=".8"/>
      <stop offset="1" stop-color="#7fe8d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gMoonGlint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffe9b0" stop-opacity=".75"/>
      <stop offset="1"   stop-color="#ffe9b0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gCityGlow" cx=".5" cy="1" r=".9">
      <stop offset="0"   stop-color="#ffb45e" stop-opacity=".55"/>
      <stop offset=".6"  stop-color="#ff8c3c" stop-opacity=".18"/>
      <stop offset="1"   stop-color="#ff8c3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gWarmWash" cx=".5" cy=".5" r=".9">
      <stop offset="0" stop-color="#ffb066"/>
      <stop offset="1" stop-color="#ff7a4d"/>
    </radialGradient>
    <radialGradient id="gSunHalo" cx=".5" cy=".5" r=".5">
      <stop offset="0"   stop-color="#fff3c0" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#ffe493" stop-opacity=".4"/>
      <stop offset="1"   stop-color="#ffe493" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gSunHaloLow" cx=".5" cy=".5" r=".5">
      <stop offset="0"   stop-color="#ff9a3c" stop-opacity=".8"/>
      <stop offset=".55" stop-color="#ff7a2e" stop-opacity=".35"/>
      <stop offset="1"   stop-color="#ff7a2e" stop-opacity="0"/>
    </radialGradient>
    <!-- ======== patterns ======== -->
    <pattern id="win1" width="13" height="15" patternUnits="userSpaceOnUse">
      <rect x="2.5" y="3" width="4.5" height="6" fill="#ffd98a" fill-opacity=".7"/>
      <rect x="8.5" y="9" width="3"  height="4" fill="#ffe7b8" fill-opacity=".7"/>
    </pattern>
    <pattern id="win2" width="9" height="11" patternUnits="userSpaceOnUse">
      <rect x="2" y="2.5" width="3.2" height="4.2" fill="#ffcf7d" fill-opacity=".7"/>
      <rect x="6" y="7"   width="2"   height="2.6" fill="#ffe4a8" fill-opacity=".7"/>
    </pattern>
    <pattern id="winDense" width="7" height="8" patternUnits="userSpaceOnUse">
      <rect x="1.6" y="1.6" width="2.6" height="3.2" fill="#ffd285" fill-opacity=".6"/>
    </pattern>
    <pattern id="vstripe" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="2.2" height="9" fill="#ffffff" opacity=".22"/>
    </pattern>
    <pattern id="hgrid" width="10" height="8" patternUnits="userSpaceOnUse">
      <rect y="6.4" width="10" height="1.2" fill="#5a748c" opacity=".45"/>
      <rect x="8.4" width="1.2" height="8"  fill="#5a748c" opacity=".3"/>
    </pattern>
    <pattern id="hgridW" width="12" height="10" patternUnits="userSpaceOnUse">
      <rect y="8" width="12" height="1.6" fill="#7d8f9c" opacity=".5"/>
      <rect x="10" width="1.6" height="10" fill="#7d8f9c" opacity=".35"/>
    </pattern>
    <pattern id="greenGrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#57a03c"/>
      <rect x="1.5" y="1.5" width="9" height="9" fill="#7cc45c"/>
    </pattern>
    <pattern id="lattice" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="2" fill="#7e1c38" opacity=".55"/>
      <rect width="2"  height="16" fill="#7e1c38" opacity=".55"/>
    </pattern>
    <!-- ======== reusable shapes ======== -->
    <clipPath id="clipSphere"><circle r="60"/></clipPath>
    <g id="pearlSphere">
      <circle r="60" fill="url(#gSphere)"/>
      <g clip-path="url(#clipSphere)">
        <circle r="60" fill="url(#lattice)"/>
        <path d="M -60 -18 Q 0 4 60 -18"  stroke="#7e1c38" stroke-width="2.5" fill="none" opacity=".6"/>
        <path d="M -60 12 Q 0 36 60 12"   stroke="#7e1c38" stroke-width="2.5" fill="none" opacity=".6"/>

      <g fill="#f2d9b8">
        <circle cx="52.6" cy="19.2" r="3.6"/><circle cx="42.9" cy="36" r="3.6"/>

        <circle cx="-9.7" cy="55.1" r="3.6"/><circle cx="-28" cy="48.5" r="3.6"/>
        <circle cx="-42.9" cy="36" r="3.6"/><circle cx="-52.6" cy="19.2" r="3.6"/>
      </g>
    </g>
    <path id="towerJinMao" d="M618,850 L618,560 L624,560 L624,470 L630,470 L630,400 L636,400 L636,352 L642,352 L642,320 L648,317 L648,258 L652,258 L652,317 L658,320 L658,352 L664,352 L664,400 L670,400 L670,470 L676,470 L676,560 L682,560 L682,850 Z"/>
    <path id="towerSWFC" fill-rule="evenodd" d="M680,850 L675,336 Q710,262 751,306 L746,850 Z M696,278 L732,278 L727,308 L701,308 Z"/>
    <path id="towerShanghai" d="M838,850 L846,180 Q852,86 890,58 Q926,88 916,192 L922,850 Z"/>
    <path id="towerCitigroup" d="M285,850 L285,470 Q330,432 375,474 L375,850 Z"/>
    <path id="towerCurve" d="M755,850 L755,420 Q785,358 815,432 L815,850 Z"/>

      <path d="M0,44 L0,12 A12,12 0 0 1 24,12 L24,44 Z" fill="#8a6f4d"/>

  </defs>

  <!-- ================= SKY ================= -->
  <rect class="daySky"   x="0" y="0" width="1000" height="1000" fill="url(#gDay)"/>
  <rect class="dawnSky"  x="0" y="0" width="1000" height="1000" fill="url(#gDawn)"/>
  <rect class="nightSky" x="0" y="0" width="1000" height="1000" fill="url(#gNight)"/>

  <!-- ================= STARS ================= -->

    <g class="twinkle">
      <circle cx="60"  cy="70"  r="1.6"/><circle cx="180" cy="130" r="1.2"/>
      <circle cx="320" cy="55"  r="1.8"/><circle cx="470" cy="95"  r="1.1"/>

      <circle cx="900" cy="60"  r="1.7"/><circle cx="960" cy="180" r="1.2"/>

    <g class="twinkle2">
      <circle cx="250" cy="180" r="1.4"/><circle cx="540" cy="150" r="1.6"/>
      <circle cx="700" cy="70"  r="1.2"/><circle cx="840" cy="210" r="1.4"/>
      <circle cx="40"  cy="170" r="1.1"/><circle cx="380" cy="130" r="1.2"/>
      <circle cx="660" cy="180" r="1.5"/><circle cx="930" cy="120" r="1.1"/>
      <circle cx="150" cy="40"  r="1.3"/><circle cx="500" cy="35"  r="1.4"/>

    <g opacity=".8">
      <circle cx="215" cy="90" r="1"/><circle cx="290" cy="300" r="1"/>
      <circle cx="75"  cy="330" r="1"/><circle cx="580" cy="255" r="1"/>
      <circle cx="815" cy="45" r="1"/><circle cx="975" cy="90" r="1"/>
      <circle cx="440" cy="160" r=".9"/><circle cx="870" cy="150" r=".9"/>

  </g>

  <!-- ================= SUN ================= -->
  <g class="sun">
    <circle class="sun-halo"  r="110" fill="url(#gSunHalo)"/>
    <circle class="sun-halo2" r="70"  fill="url(#gSunHaloLow)"/>
    <circle class="sun-core"  r="36"  fill="#fff2b8"/>
  </g>

  <!-- ================= MOON ================= -->
  <g class="moon">
    <defs>
      <mask id="moonMask">
        <circle r="26" fill="#fff"/>
        <circle cx="11" cy="-7" r="22" fill="#000"/>
      </mask>
    </defs>
    <circle r="52" fill="#cfe0ff" opacity=".14"/>
    <circle r="26" fill="#f4f7ee" mask="url(#moonMask)"/>
    <g opacity=".5" fill="#c8cdbd" mask="url(#moonMask)">
      <circle cx="-10" cy="6" r="4"/><circle cx="-3" cy="14" r="2.6"/><circle cx="-15" cy="-6" r="2.2"/>
    </g>
  </g>

  <!-- ================= CLOUDS ================= -->
  <g class="drift1" opacity=".9">
    <g class="cloud" fill="#ffffff">
      <ellipse cx="0"   cy="200" rx="70" ry="20"/>
      <ellipse cx="-45" cy="210" rx="45" ry="15"/>
      <ellipse cx="55"  cy="212" rx="50" ry="14"/>
