<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>preview-spec_01 · Shanghai Bund Skyline · Day &amp; Night SVG Loop</title>
<style>
  :root { --bg:#0c0f16; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background: radial-gradient(120% 90% at 50% 20%, #1a2233 0%, var(--bg) 60%, #07090e 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family: "Segoe UI", "Noto Sans TC", sans-serif; gap:14px; padding:18px;
  }
  .stage {
    width:min(92vmin, 900px); aspect-ratio:1/1; border-radius:10px; overflow:hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.06), inset 0 0 60px rgba(0,0,0,.25);
    position:relative;
  }
  .stage svg { display:block; width:100%; height:100%; }
  .caption { color:#8a97ad; font-size:12px; letter-spacing:.14em; text-transform:uppercase; text-align:center; }
  .caption b { color:#c9d6ea; font-weight:600; }
  .caption .dot { color:#ffb347; }

  /* ============ global day-night master cycle: 80s, infinite ============ */
  /* multiply tint layer: day=none, sunset=orange, night=deep blue, dawn=rose */
  .tint { animation: kfTint 80s linear infinite; }
  @keyframes kfTint {
    0%    { fill:#ff9a6a; opacity:.16; }
    10%   { fill:#ffe8d0; opacity:0;   }
    55%   { fill:#ffe8d0; opacity:0;   }
    63%   { fill:#ff7a3d; opacity:.30; }
    71%   { fill:#82508e; opacity:.36; }
    78%   { fill:#223070; opacity:.45; }
    94%   { fill:#16214f; opacity:.42; }
    100%  { fill:#ff9a6a; opacity:.16; }
  }
  /* everything that lights up after dark */
  .nightlights { animation: kfLights 80s linear infinite; }
  @keyframes kfLights {
    0%   { opacity:.45; }
    10%  { opacity:0;   }
    55%  { opacity:0;   }
    62%  { opacity:.25; }
    70%  { opacity:1;   }
    94%  { opacity:1;   }
    100% { opacity:.45; }
  }
  .stars { animation: kfStars 80s linear infinite; }
  @keyframes kfStars {
    0%{opacity:.5;} 10%{opacity:0;} 56%{opacity:0;} 72%{opacity:1;} 95%{opacity:1;} 100%{opacity:.5;}
  }
  .star { animation: kfTwinkle 2.6s ease-in-out infinite alternate; }
  @keyframes kfTwinkle { from{opacity:1;} to{opacity:.2;} }

  .haze { animation: kfHaze 80s linear infinite; }
  @keyframes kfHaze {
    0%{opacity:.4;} 10%{opacity:.6;} 55%{opacity:.6;} 63%{opacity:.5;} 78%{opacity:.1;} 94%{opacity:.1;} 100%{opacity:.4;}
  }
  .clouds { animation: kfCloud 80s linear infinite; }
  @keyframes kfCloud {
    0%{opacity:.4;} 10%{opacity:.5;} 55%{opacity:.5;} 63%{opacity:.55;} 78%{opacity:.1;} 94%{opacity:.1;} 100%{opacity:.4;}
  }
  /* sun: rises left at dawn, zenith at day, sinks right at sunset, hidden all night */
  .sun   { animation: kfSun  80s linear infinite; }
  .sunO  { animation: kfSunO 80s linear infinite; }
  @keyframes kfSun {
    0%   { transform:translate(120px,892px); }
    4%   { transform:translate(240px,480px); }
    10%  { transform:translate(345px,205px); }
    20%  { transform:translate(520px,90px);  }
    32%  { transform:translate(700px,150px); }
    44%  { transform:translate(855px,335px); }
    55%  { transform:translate(950px,565px); }
    62%  { transform:translate(1010px,822px); }
    65%  { transform:translate(1032px,962px); }
    100% { transform:translate(1032px,962px); }
  }
  @keyframes kfSunO {
    0%{opacity:.85;} 55%{opacity:1;} 63.5%{opacity:0;} 100%{opacity:0;}
  }
  /* moon: sets at far right at dawn, hidden by day, teleports back off-screen, rises at dusk */
  .moon  { animation: kfMoon  80s linear infinite; }
  .moonO { animation: kfMoonO 80s linear infinite; }
  @keyframes kfMoon {
    0%    { transform:translate(1040px,862px); }
    6%    { transform:translate(1102px,944px); }
    65.9% { transform:translate(1102px,944px); }
    66%   { transform:translate(-46px,944px);  }
    78%   { transform:translate(300px,290px);  }
    90%   { transform:translate(640px,105px);  }
    100%  { transform:translate(1040px,862px); }
  }
  @keyframes kfMoonO {
    0%{opacity:.8;} 6%{opacity:0;} 66%{opacity:0;} 68%{opacity:1;} 96%{opacity:1;} 100%{opacity:.8;}
  }
  /* moon glitter path on the water follows the moon horizontally */
  .moongl   { animation: kfMoonGl 80s linear infinite, kfLights 80s linear infinite; }
  @keyframes kfMoonGl {
    0%{transform:translateX(1040px);} 6%{transform:translateX(1102px);} 66%{transform:translateX(-46px);}
    78%{transform:translateX(300px);} 90%{transform:translateX(640px);} 100%{transform:translateX(1040px);}
  }
  /* daytime sun glitter band follows the sun */
  .sungl   { animation: kfSunGl 80s linear infinite, kfSunO 80s linear infinite; }
  @keyframes kfSunGl {
    0%{transform:translateX(120px);} 4%{transform:translateX(240px);} 10%{transform:translateX(345px);}
    20%{transform:translateX(520px);} 32%{transform:translateX(700px);} 44%{transform:translateX(855px);}
    55%{transform:translateX(950px);} 62%{transform:translateX(1010px);} 65%{transform:translateX(1032px);} 100%{transform:translateX(1032px);}
  }
  .glint { animation: kfGlint 2.4s ease-in-out infinite alternate; }
  @keyframes kfGlint { from{opacity:.6;} to{opacity:.06;} }
  .reflectDay { animation: kfReflDay 80s linear infinite; }
  @keyframes kfReflDay {
    0%{opacity:.5;} 10%{opacity:.65;} 55%{opacity:.65;} 70%{opacity:.15;} 78%{opacity:0;} 94%{opacity:0;} 100%{opacity:.5;}
  }
  /* boats */
  .barge      { animation: kfBarge 170s linear infinite; }
  .bargeLights{ animation: kfBarge 170s linear infinite, kfLights 80s linear infinite; }
  @keyframes kfBarge { from{transform:translate(1120px,0);} to{transform:translate(-260px,0);} }
  .tboat       { animation: kfTboat 260s linear infinite; }
  .tboatLights { animation: kfTboat 260s linear infinite, kfLights 80s linear infinite; }
  @keyframes kfTboat { from{transform:translate(-150px,0);} to{transform:translate(520px,0);} }
</style>
</head>
<body>
<div class="stage">
<svg id="scene" viewBox="0 0 1080 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- ================= SKY : animated stops (7 keyTimes shared: 0 dawn / .1 day / .55 day / .63 sunset / .71 dusk / .78 night / 1 dawn) ================= -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b63c6">
        <animate attributeName="stop-color" dur="80s" repeatCount="indefinite"
          keyTimes="0;0.1;0.55;0.63;0.71;0.78;1"
          values="#274b8f;#1b63c6;#1b63c6;#25498c;#131c4e;#04081f;#274b8f"/>
      </stop>
      <stop offset="0.42" stop-color="#4b93e0">
        <animate attributeName="stop-color" dur="80s" repeatCount="indefinite"
          keyTimes="0;0.1;0.55;0.63;0.71;0.78;1"
          values="#7f86c4;#4b93e0;#4b93e0;#cf6884;#3a3172;#0a123a;#7f86c4"/>
      </stop>
      <stop offset="0.66" stop-color="#8fc0ea">
        <animate attributeName="stop-color" dur="80s" repeatCount="indefinite"
          keyTimes="0;0.1;0.55;0.63;0.71;0.78;1"
          values="#efa07a;#8fc0ea;#8fc0ea;#ff9a5e;#7c4a72;#141f52;#efa07a"/>
      </stop>
      <stop offset="0.86" stop-color="#dbeef8">
        <animate attributeName="stop-color" dur="80s" repeatCount="indefinite"
          keyTimes="0;0.1;0.55;0.63;0.71;0.78;1"
          values="#ffd9a4;#dbeef8;#dbeef8;#ffcd85;#a86a78;#1c2b5e;#ffd9a4"/>
      </stop>
      <stop offset="1" stop-color="#eef7fb">
        <animate attributeName="stop-color" dur="80s" repeatCount="indefinite"
          keyTimes="0;0.1;0.55;0.63;0.71;0.78;1"
          values="#ffe9c2;#eef7fb;#eef7fb;#ffdca0;#c07a78;#243568;#ffe9c2"/>
      </stop>
    </linearGradient>

    <!-- ================= WATER : animated stops ================= -->
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb2da">
        <animate attributeName="stop-color" dur="80s" repeatCount="indefinite"
          keyTimes="0;0.1;0.55;0.63;0.71;0.78;1"
          values="#e0b298;#7fb2da;#7fb2da;#f2a878;#4a4478;#101c46;#e0b298"/>
      </stop>
      <stop offset="0.4" stop-color="#4b86bc">
        <animate attributeName="stop-color" dur="80s" repeatCount="indefinite"
          keyTimes="0;0.1;0.55;0.63;0.71;0.78;1"
          values="#9a94b0;#4b86bc;#4b86bc;#c07a6a;#252c5c;#0a1234;#9a94b0"/>
      </stop>
      <stop offset="1" stop-color="#2f6396">
        <animate attributeName="stop-color" dur="80s" repeatCount="indefinite"
          keyTimes="0;0.1;0.55;0.63;0.71;0.78;1"
          values="#5a6e96;#2f6396;#2f6396;#7a5570;#141b46;#060a24;#5a6e96"/>
      </stop>
    </linearGradient>

    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4c8" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffd67e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunsetGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb066" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dce8ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#8fa8e0" stop-opacity="0"/>
    </radialGradient>

    <!-- materials -->
    <linearGradient id="pearl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a96f68"/><stop offset="0.35" stop-color="#e0b3a9"/>
      <stop offset="0.6" stop-color="#cc948b"/><stop offset="1" stop-color="#8d5a56"/>
    </linearGradient>
    <linearGradient id="pearlBall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8b0a4"/><stop offset="0.45" stop-color="#cf7f72"/>
      <stop offset="1" stop-color="#95514c"/>
    </linearGradient>
    <linearGradient id="glassBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9dc2e2"/><stop offset="0.55" stop-color="#5f87ad"/><stop offset="1" stop-color="#3c5f84"/>
    </linearGradient>
    <linearGradient id="paleGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f7fa"/><stop offset="0.6" stop-color="#c9dbea"/><stop offset="1" stop-color="#9dbccd"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8eef3"/><stop offset="0.55" stop-color="#b4c1cb"/><stop offset="1" stop-color="#8b99a6"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9c9d6"/><stop offset="0.55" stop-color="#7e93a6"/><stop offset="1" stop-color="#57697e"/>
    </linearGradient>
    <linearGradient id="creamB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe5cd"/><stop offset="1" stop-color="#c9b995"/>
    </linearGradient>
    <linearGradient id="towerBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9cbe8"/><stop offset="0.45" stop-color="#6b93bd"/>
      <stop offset="0.8" stop-color="#48709c"/><stop offset="1" stop-color="#33587f"/>
    </linearGradient>
    <linearGradient id="glassGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9e2c4"/><stop offset="0.5" stop-color="#4f9e73"/><stop offset="1" stop-color="#2c6b4f"/>
    </linearGradient>
    <linearGradient id="domeGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe4e0"/><stop offset="0.5" stop-color="#67a896"/><stop offset="1" stop-color="#3c6f63"/>
    </linearGradient>
    <linearGradient id="domeGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe8d8"/><stop offset="0.5" stop-color="#5f9e7e"/><stop offset="1" stop-color="#37665a"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdc5b2"/><stop offset="1" stop-color="#a29a88"/>
    </linearGradient>
    <linearGradient id="hazeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="pinkRef" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0968c" stop-opacity="0.75"/><stop offset="1" stop-color="#e0968c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="warmRef" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf8e" stop-opacity="0.85"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pinkSphereGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8fa0" stop-opacity="0.95"/><stop offset="0.5" stop-color="#ff6f8e" stop-opacity="0.45"/><stop offset="1" stop-color="#ff5f88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floodGlow" cx="0.5" cy="0.9" r="0.9">
      <stop offset="0" stop-color="#ffe2a8" stop-opacity="0.5"/><stop offset="1" stop-color="#ffcf78" stop-opacity="0"/>
    </radialGradient>

    <!-- sphere triangulated mesh (Oriental Pearl balls) -->
    <pattern id="mesh" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <path d="M0 0 L12 12 M12 0 L0 12" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
    <!-- dark facade windows (day) -->
    <pattern id="winDark" width="7" height="10" patternUnits="userSpaceOnUse">
      <rect x="1.6" y="2.2" width="3" height="4.6" fill="#26405c" opacity="0.5"/>
    </pattern>
    <pattern id="winDarkBig" width="11" height="15" patternUnits="userSpaceOnUse">
      <rect x="2" y="3" width="6" height="8" fill="#2c4763" opacity="0.32"/>
    </pattern>
    <!-- lit windows (night) -->
    <pattern id="litA" width="9" height="13" patternUnits="userSpaceOnUse">
      <rect x="1.6" y="2.6" width="3.4" height="5.2" fill="#ffe6ae"/>
    </pattern>
    <pattern id="litB" width="13" height="17" patternUnits="userSpaceOnUse">
      <rect x="4" y="5" width="3.6" height="5.4" fill="#ffd27e"/>
    </pattern>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>

    <clipPath id="waterClip"><rect x="0" y="893" width="1080" height="187"/></clipPath>
    <clipPath id="rightDomeClip"><path d="M534,802 a80,80 0 0 1 160,0 z"/></clipPath>
    <clipPath id="leftDomeClip"><path d="M181,740 a70,70 0 0 1 140,0 z"/></clipPath>
    <clipPath id="diamondClip"><rect x="786" y="404" width="52" height="482"/></clipPath>

    <!-- ================= SKYLINE : built once, reused for body / window overlays / night-light clip / water reflection ================= -->
    <g id="bld">
      <!-- far-left cluster -->
      <rect x="0" y="560" width="70" height="326" fill="#dcd2c0"/>
      <rect x="42" y="476" width="66" height="410" fill="url(#glassBlue)"/>
      <rect x="96" y="520" width="58" height="366" fill="#cfd8de"/>

      <rect x="132" y="606" width="96" height="280" fill="#e2d5c2"/>
      <polygon points="126,606 234,606 214,580 146,580" fill="#a34f45"/>
      <!-- Oriental Pearl tower -->
      <g>
        <polygon points="126,676 142,676 96,886 68,886" fill="url(#pearl)"/>
        <polygon points="172,676 188,676 246,886 220,886" fill="url(#pearl)"/>
        <rect x="146" y="690" width="22" height="196" fill="#b3766f"/>
        <circle cx="112" cy="806" r="11" fill="url(#pearlBall)"/><circle cx="112" cy="806" r="11" fill="url(#mesh)"/>
        <rect x="137" y="242" width="13" height="398" fill="url(#pearl)"/>
        <rect x="166" y="242" width="13" height="398" fill="url(#pearl)"/>
        <rect x="154" y="242" width="8"  height="398" fill="#8d5a56"/>
        <ellipse cx="158" cy="338" rx="27" ry="7" fill="#c97a6a" stroke="#f0c0a8" stroke-width="1.4"/>
        <ellipse cx="158" cy="378" rx="27" ry="7" fill="#c97a6a" stroke="#f0c0a8" stroke-width="1.4"/>
        <ellipse cx="158" cy="418" rx="27" ry="7" fill="#c97a6a" stroke="#f0c0a8" stroke-width="1.4"/>
        <ellipse cx="158" cy="458" rx="27" ry="7" fill="#c97a6a" stroke="#f0c0a8" stroke-width="1.4"/>
        <rect x="150" y="248" width="16" height="14" fill="#b3766f"/>
        <circle cx="158" cy="264" r="13" fill="url(#pearlBall)"/>
        <circle cx="157" cy="640" r="60" fill="url(#pearlBall)"/>
        <circle cx="157" cy="640" r="60" fill="url(#mesh)"/>
        <path d="M97,640 a60,60 0 0 1 120,0 z" fill="#c05a52" opacity="0.45"/>
        <ellipse cx="157" cy="664" rx="54" ry="12" fill="#eccdc0" opacity="0.55"/>
        <circle cx="158" cy="200" r="50" fill="url(#pearlBall)"/>
        <circle cx="158" cy="200" r="50" fill="url(#mesh)"/>
        <path d="M108,200 a50,50 0 0 1 100,0 z" fill="#c05a52" opacity="0.5"/>
        <ellipse cx="158" cy="221" rx="45" ry="10" fill="#eccdc0" opacity="0.5"/>
        <rect x="150" y="150" width="16" height="12" fill="#b3766f"/>
        <circle cx="158" cy="96" r="13" fill="url(#pearlBall)"/><circle cx="158" cy="96" r="13" fill="url(#mesh)"/>
        <ellipse cx="158" cy="116" rx="16" ry="6" fill="#c97a6a" stroke="#f0c0a8" stroke-width="1.2"/>
        <line x1="158" y1="58" x2="158" y2="146" stroke="#b3766f" stroke-width="5"/>
        <line x1="158" y1="2"  x2="158" y2="60"  stroke="#a06a62" stroke-width="2.5"/>

      </g>
      <!-- sail-crown tower -->
      <rect x="326" y="664" width="62" height="222" fill="url(#creamB)"/>
      <polygon points="326,664 358,586 388,664" fill="url(#glassBlue)"/>
      <line x1="358" y1="586" x2="358" y2="558" stroke="#7e93a6" stroke-width="2.5"/>
      <!-- small distant towers mid-frame -->
      <rect x="438" y="656" width="30" height="130" fill="#d9dee2"/>
      <rect x="470" y="672" width="26" height="114" fill="#cfd6dc"/>
      <rect x="520" y="600" width="14" height="200" fill="#c4ccd4"/>

      <!-- Lujiazui core -->
      <rect x="556" y="398" width="54" height="488" fill="url(#glassBlue)"/>
      <rect x="564" y="560" width="62" height="326" fill="url(#silver)"/>
      <rect x="569" y="468" width="52" height="92"  fill="url(#silver)"/>
      <rect x="574" y="414" width="42" height="54"  fill="url(#silver)"/>
      <rect x="579" y="378" width="32" height="36"  fill="url(#silver)"/>
      <rect x="584" y="358" width="22" height="20"  fill="url(#silver)"/>
      <polygon points="586,358 604,358 600,344 590,344" fill="#dfe6eb"/>
      <line x1="595" y1="344" x2="595" y2="332" stroke="#cfd6dc" stroke-width="2.5"/>
      <rect x="632" y="432" width="56" height="454" fill="url(#paleGlass)"/>
      <polygon points="632,432 660,366 688,432" fill="url(#paleGlass)"/>
      <!-- SWFC with trapezoid aperture -->
      <path fill-rule="evenodd" fill="url(#steel)"
        d="M706,886 L782,886 L772,306 L716,306 Z M726,318 L762,318 L757,360 L731,360 Z"/>
      <path d="M712,306 L716,278 L772,278 L776,306 Z" fill="#93a7ba"/>
      <!-- diamond-lattice sloped tower -->
      <rect x="786" y="404" width="52" height="482" fill="url(#paleGlass)"/>
      <g clip-path="url(#diamondClip)" stroke="#8fb0c8" stroke-opacity="0.55" stroke-width="1">

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var seed = 42;
  function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
  function el(name, attrs, parent) {
    var n = document.createElementNS(NS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function gid(id) { return document.getElementById(id); }

  /* stars: keep them off the tower silhouettes (drawn above the tint layer) */
  var stars = gid("starsG");
  var made = 0;
  while (made < 90) {
    var x = rnd() * 1080, y = rnd() * 640;
    var overLeft   = x < 320 && y > 480;                    // Oriental Pearl + far-left towers
    var overCenter = x >= 320 && x < 556 && y > 555;        // sail crown / domes
    var overCore   = x >= 556 && y < 640;                   // Lujiazui cluster
    if (overLeft || overCenter || overCore) continue;
    var s = el("circle", { "class": "star", cx: x.toFixed(1), cy: y.toFixed(1), r: (0.6 + rnd() * 1.5).toFixed(2) }, stars);
    s.style.animationDuration = (1.4 + rnd() * 2.6).toFixed(2) + "s";
    s.style.animationDelay = (-rnd() * 4).toFixed(2) + "s";
    made++;
  }

  /* facade arches on the convention center: two tiers of arcade bays */
  var emb = gid("embank");
  var arches = el("g", { fill: "#3f5a72" }, null);
  for (var ax = 298; ax <= 632; ax += 24) {
    el("path", { d: "M" + ax + ",762 v44 a9,9 0 0 0 18,0 v-44 a9,9 0 0 0 -18,0 z" }, arches);
    el("rect", { x: ax + 3, y: 730, width: 12, height: 14, rx: 1 }, arches);
  }
  emb.insertBefore(arches, emb.firstChild);

  /* riverside trees: green under the convention center, autumn-red at the right */
  var trees = gid("treesG");
  var greens = ["#4a7d43", "#5f9152", "#3c6b3a", "#6ca05c"];
  var cx = 210;
  while (cx < 700) {
    var r = 13 + rnd() * 12;
    el("circle", { cx: cx.toFixed(0), cy: (846 - rnd() * 12).toFixed(0), r: r.toFixed(0), fill: greens[Math.floor(rnd() * 4)] }, trees);
    cx += 14 + rnd() * 10;
  }
  var reds = ["#b4472f", "#c96a3a", "#9c3b2c", "#d08048"];
  cx = 700;
  while (cx < 1010) {
    var r2 = 11 + rnd() * 10;
    el("circle", { cx: cx.toFixed(0), cy: (846 - rnd() * 12).toFixed(0), r: r2.toFixed(0), fill: reds[Math.floor(rnd() * 4)] }, trees);
    cx += 13 + rnd() * 9;
  }

  /* embankment wall grooves */
  var gr = gid("groovesG");
  for (var gx = 30; gx < 1080; gx += 42) el("line", { x1: gx, y1: 862, x2: gx, y2: 894 }, gr);

  /* streetlights along the promenade */
  var poles = gid("polesG"), lampGlows = gid("lampGlowG");
  var lampXs = [235, 330, 425, 520, 615, 710, 805, 900, 995];
  lampXs.forEach(function (lx) {
    el("rect", { x: lx, y: 818, width: 2.6, height: 36, fill: "#6f6a5e" }, poles);
    el("path", { d: "M" + lx + ",820 h9 a6,6 0 0 1 6,6", stroke: "#6f6a5e", "stroke-width": 2.4, fill: "none" }, poles);
    el("circle", { cx: lx + 15, cy: 827, r: 3.4, fill: "#f2ead2" }, poles);
    el("circle", { cx: lx + 15, cy: 827, r: 9, fill: "url(#floodGlow)" }, lampGlows);
  });

  /* tiny far-window dots inside the skyline for the night (clipped) */
  var dots = gid("dotsG");
  for (var d = 0; d < 130; d++) {
    var dx = 300 + rnd() * 770, dy = 380 + rnd() * 460;
    el("rect", { x: dx.toFixed(0), y: dy.toFixed(0), width: 2.6, height: 3.4, opacity: (0.5 + rnd() * 0.5).toFixed(2) }, dots);
  }

  /* daytime water shimmer */
  var glint = gid("glintG");
  for (var g = 0; g < 36; g++) {
    var gw = 8 + rnd() * 30;
    var rect = el("rect", {
      "class": "glint",
      x: (rnd() * (1080 - gw)).toFixed(0),
      y: (912 + rnd() * 158).toFixed(0),
      width: gw.toFixed(0), height: 1.8, rx: 0.9,
      opacity: (0.15 + rnd() * 0.4).toFixed(2)
    }, glint);
    rect.style.animationDuration = (1.5 + rnd() * 2.2).toFixed(2) + "s";
    rect.style.animationDelay = (-rnd() * 4).toFixed(2) + "s";
  }
})();
</script>
